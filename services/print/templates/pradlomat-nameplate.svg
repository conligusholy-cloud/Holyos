<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="640" viewBox="0 0 800 640" shape-rendering="crispEdges">
  <style>
    text {
      font-family: Arial, "Liberation Sans", "DejaVu Sans", sans-serif;
      dominant-baseline: alphabetic;
    }
    .frame      { fill: none; stroke: black; stroke-width: 3; }
    .frame-thin { fill: none; stroke: black; stroke-width: 2; }
    .cell       { fill: none; stroke: black; stroke-width: 4; }
    .label      { font-family: "Arial Black", Arial, sans-serif; font-size: 22px; font-weight: 900; fill: black; stroke: black; stroke-width: 0.8; paint-order: stroke; letter-spacing: 0.3px; }
    .sublabel   { font-family: "Arial Black", Arial, sans-serif; font-size: 16px; font-weight: 900; fill: black; stroke: black; stroke-width: 0.5; paint-order: stroke; }
    .value      { font-size: 26px; font-weight: 700; fill: black; }
    .product    { font-size: 58px; font-weight: 700; fill: black; letter-spacing: 2px; }
    .company    { font-size: 26px; font-weight: 700; fill: black; }
    .address    { font-size: 18px; font-weight: 700; fill: black; }
    .ce         { font-size: 38px; font-weight: 700; fill: black; }
    .colon      { font-size: 28px; font-weight: 700; fill: black; }
  </style>

  <!-- ============ HEADER ============ -->
  <!-- Logo (BarTender originál, 255×142 px → škálováno na 270×150, plně včetně S.R.O.) -->
  <image x="20" y="15" width="280" height="135" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/>

  <!-- Company text (vpravo od loga — posunuto, ať „s.r.o." v logu zůstane vidět) -->
  <text x="320" y="52" class="company">BEST SERIES s.r.o.</text>
  <text x="320" y="80" class="address">Zámostní 1155/27</text>
  <text x="320" y="105" class="address">710 00 Ostrava</text>
  <text x="320" y="130" class="address">Czech Republic</text>

  <!-- CE — oficiální Conformité Européenne logo (Wikimedia SVG, EU norma) -->
  <!-- Originál 280×200, scale 0.32 → 90×64, pozice 640,30 (více od pravého okraje) -->
  <g transform="translate(640, 30) scale(0.32)" fill="black">
    <path d="M110,199.498744A100,100 0 0 1 100,200A100,100 0 0 1 100,0A100,100 0 0 1 110,0.501256L110,30.501256A70,70 0 0 0 100,30A70,70 0 0 0 100,170A70,70 0 0 0 110,169.498744Z"/>
    <path d="M280,199.498744A100,100 0 0 1 270,200A100,100 0 0 1 270,0A100,100 0 0 1 280,0.501256L280,30.501256A70,70 0 0 0 270,30A70,70 0 0 0 201.620283,85L260,85L260,115L201.620283,115A70,70 0 0 0 270,170A70,70 0 0 0 280,169.498744Z"/>
  </g>

  <!-- ============ PRODUCT NAME ROW ============ -->
  <rect x="10" y="170" width="780" height="105" rx="14" ry="14" class="cell"/>
  <text x="25" y="200" class="label">Název</text>
  <text x="25" y="225" class="sublabel">Product Name</text>
  <text x="160" y="225" class="colon">:</text>
  <text x="200" y="232" class="product">{{product_name}}</text>

  <!-- ============ ROW 1 ============ -->
  <rect x="10" y="285" width="385" height="110" rx="14" ry="14" class="cell"/>
  <rect x="405" y="285" width="385" height="110" rx="14" ry="14" class="cell"/>
  <text x="25" y="335" class="label">Typ</text>
  <text x="25" y="360" class="sublabel">Type</text>
  <text x="185" y="357" class="colon">:</text>
  <text x="203" y="363" class="value">{{type}}</text>

  <text x="420" y="335" class="label">Datum výroby</text>
  <text x="420" y="360" class="sublabel">Production Date</text>
  <text x="600" y="357" class="colon">:</text>
  <text x="618" y="363" class="value">{{date}}</text>

  <!-- ============ ROW 2 ============ -->
  <rect x="10" y="405" width="385" height="110" rx="14" ry="14" class="cell"/>
  <rect x="405" y="405" width="385" height="110" rx="14" ry="14" class="cell"/>
  <text x="25" y="455" class="label">Číslo</text>
  <text x="25" y="480" class="sublabel">S/N</text>
  <text x="185" y="477" class="colon">:</text>
  <text x="203" y="483" class="value">{{serial}}</text>

  <text x="420" y="455" class="label">Příkon</text>
  <text x="420" y="480" class="sublabel">Input Power</text>
  <text x="600" y="477" class="colon">:</text>
  <text x="618" y="483" class="value">{{power}}</text>

  <!-- ============ ROW 3 ============ -->
  <rect x="10" y="525" width="385" height="110" rx="14" ry="14" class="cell"/>
  <rect x="405" y="525" width="385" height="110" rx="14" ry="14" class="cell"/>
  <text x="25" y="575" class="label">Jmen. napětí</text>
  <text x="25" y="600" class="sublabel">Rated Voltage</text>
  <text x="185" y="597" class="colon">:</text>
  <text x="203" y="603" class="value">{{voltage}}</text>

  <text x="420" y="575" class="label">Hmotnost</text>
  <text x="420" y="600" class="sublabel">Weight</text>
  <text x="600" y="597" class="colon">:</text>
  <text x="618" y="603" class="value">{{weight}}</text>
</svg>

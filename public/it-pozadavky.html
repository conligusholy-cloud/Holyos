<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>IT požadavky k objednávce</title>
<style>
  /* Design BS 2.0 — tmavé navy pozadí, cyan → modrá → fialová */
  :root{--bg:#050a14;--card:rgba(10,18,32,.72);--border:rgba(120,160,220,.16);--border2:rgba(120,160,220,.28);--text:#eaf1ff;--text2:#9db0cf;--text3:#6b7fa3;--accent:#4fd1ff;--accent2:#7c8cff;--ok:#2fe3a0;--err:#ff5d73;--warn:#f59e0b;--grad:linear-gradient(90deg,#4fd1ff,#3a6cf5 55%,#7c5cff)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(900px 500px at 15% -10%,rgba(79,209,255,.12),transparent),radial-gradient(800px 500px at 100% 0%,rgba(124,92,255,.14),transparent),var(--bg);color:var(--text);min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:22px 16px 70px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .logo{width:36px;height:36px;border-radius:10px;border:1px solid var(--border2);display:grid;place-items:center;font-weight:800;color:var(--accent);background:rgba(79,209,255,.06)}
  .top b{font-size:17px}.top b span{color:var(--accent2);margin-left:4px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:14px;backdrop-filter:blur(8px)}
  h1{font-size:1.4rem;margin:0 0 6px;font-weight:800}
  h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--text2);font-size:.92rem;margin-bottom:4px;line-height:1.5}
  .due{display:inline-block;margin-top:10px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);color:#fbbf24;border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:700}
  .q{margin-bottom:20px}
  .q label.l{display:block;font-weight:600;margin-bottom:7px;font-size:.93rem;color:var(--text)}
  .req{color:var(--err)}
  .help{color:var(--text3);font-size:.8rem;margin-top:4px}
  input[type=text],textarea,select{width:100%;padding:12px 13px;border:1px solid var(--border2);border-radius:10px;font:inherit;font-size:15px;background:rgba(5,10,20,.7);color:var(--text)}
  input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,209,255,.12)}
  textarea{min-height:84px;resize:vertical}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{display:flex;align-items:center;gap:8px;border:1px solid var(--border2);border-radius:10px;padding:10px 16px;cursor:pointer;background:rgba(5,10,20,.7);color:var(--text2);transition:.15s}
  .opt:hover{border-color:var(--accent)}
  .opt input{margin:0;accent-color:#4fd1ff}
  .opt.on{border-color:var(--accent);background:rgba(79,209,255,.1);color:var(--text)}
  .invalid{border-color:var(--err)!important}
  button{background:var(--grad);color:#04101f;border:0;border-radius:12px;padding:14px 26px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;width:100%;transition:.15s}
  button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08)}
  button:disabled{opacity:.6}
  .err{background:rgba(255,93,115,.12);border:1px solid rgba(255,93,115,.4);color:#ffb3bf;border-radius:10px;padding:11px 13px;margin-bottom:14px;font-size:.9rem}
  .ok{background:rgba(47,227,160,.1);border:1px solid rgba(47,227,160,.4);color:var(--ok);border-radius:12px;padding:18px;font-weight:700;text-align:center}
  .foot{color:var(--text3);font-size:11px;text-align:center;margin-top:22px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card">Načítám…</div></div>
<script>
(function () {
  var token = location.pathname.split('/').filter(Boolean).pop();
  var app = document.getElementById('app');
  var data = null;

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function fmt(d) { try { return new Date(d).toLocaleDateString('cs-CZ'); } catch (e) { return ''; } }

  function qHtml(q, val) {
    var h = '<div class="q" data-id="' + esc(q.id) + '"><label class="l">' + esc(q.label) + (q.required ? ' <span class="req">*</span>' : '') + '</label>';
    if (q.type === 'textarea') h += '<textarea name="' + esc(q.id) + '">' + esc(val) + '</textarea>';
    else if (q.type === 'yesno' || q.type === 'choice') {
      var opts = q.type === 'yesno' ? ['Ano', 'Ne'] : (q.options || []);
      h += '<div class="opts">' + opts.map(function (o) {
        return '<label class="opt' + (val === o ? ' on' : '') + '"><input type="radio" name="' + esc(q.id) + '" value="' + esc(o) + '"' + (val === o ? ' checked' : '') + '> ' + esc(o) + '</label>';
      }).join('') + '</div>';
    } else h += '<input type="text" name="' + esc(q.id) + '" value="' + esc(val) + '">';
    if (q.help) h += '<div class="help">' + esc(q.help) + '</div>';
    return h + '</div>';
  }

  function render() {
    var d = data;
    var head = '<div class="top"><div class="logo">B</div><b>Best Series<span>2.0</span></b></div>' +
      '<div class="card"><h1>IT požadavky k objednávce <em>' + esc(d.order_number || '') + '</em></h1>' +
      '<div class="sub">' + esc(d.customer || '') + '</div>';
    if (d.status === 'filled') {
      app.innerHTML = head + '</div><div class="card"><div class="ok">✓ Děkujeme, dotazník byl vyplněn' + (d.filled_at ? ' (' + fmt(d.filled_at) + ')' : '') + '.</div></div>';
      return;
    }
    head += '<div class="sub">Prosíme o vyplnění krátkého formuláře k místu instalace.</div><span class="due">Vyplnit do ' + fmt(d.due_at) + '</span></div>';
    var form = '<div class="card"><div id="err"></div>' +
      d.items.map(function (q) { return qHtml(q, (d.answers || {})[q.id] || ''); }).join('') +
      '<div class="q"><label class="l">Vaše jméno</label><input type="text" id="who" placeholder="Kdo formulář vyplňuje"></div>' +
      '<button id="send">Odeslat</button></div>';
    app.innerHTML = head + form + '<div class="foot">Best Series s.r.o.</div>';
    app.querySelectorAll('.opt input').forEach(function (i) {
      i.addEventListener('change', function () {
        var grp = app.querySelectorAll('input[name="' + i.name + '"]');
        grp.forEach(function (g) { g.parentNode.classList.toggle('on', g.checked); });
      });
    });
    document.getElementById('send').addEventListener('click', submit);
  }

  function collect() {
    var a = {};
    data.items.forEach(function (q) {
      var v = '';
      if (q.type === 'yesno' || q.type === 'choice') {
        var c = app.querySelector('input[name="' + q.id + '"]:checked'); v = c ? c.value : '';
      } else {
        var el = app.querySelector('[name="' + q.id + '"]'); v = el ? el.value.trim() : '';
      }
      a[q.id] = v;
    });
    return a;
  }

  function submit() {
    var btn = document.getElementById('send'), err = document.getElementById('err');
    var a = collect(), missing = [];
    app.querySelectorAll('.q').forEach(function (n) { n.querySelectorAll('input[type=text],textarea').forEach(function (x) { x.classList.remove('invalid'); }); });
    data.items.forEach(function (q) {
      if (q.required && !a[q.id]) {
        missing.push(q.label);
        var el = app.querySelector('.q[data-id="' + q.id + '"] input[type=text],.q[data-id="' + q.id + '"] textarea');
        if (el) el.classList.add('invalid');
      }
    });
    if (missing.length) { err.innerHTML = '<div class="err">Vyplňte prosím povinné otázky (označené *).</div>'; window.scrollTo(0, 0); return; }
    btn.disabled = true; btn.textContent = 'Odesílám…';
    fetch('/api/public/it-requests/' + encodeURIComponent(token), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers: a, name: document.getElementById('who').value })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (r) {
        if (!r.ok) { err.innerHTML = '<div class="err">' + esc(r.j.error || 'Odeslání se nezdařilo') + '</div>'; btn.disabled = false; btn.textContent = 'Odeslat'; return; }
        data.status = 'filled'; data.filled_at = new Date().toISOString(); render();
      })
      .catch(function () { err.innerHTML = '<div class="err">Chyba spojení, zkuste to prosím znovu.</div>'; btn.disabled = false; btn.textContent = 'Odeslat'; });
  }

  fetch('/api/public/it-requests/' + encodeURIComponent(token))
    .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
    .then(function (d) { data = d; render(); })
    .catch(function () { app.innerHTML = '<div class="card"><h1>Odkaz není platný</h1><div class="sub">Zkontrolujte prosím odkaz z e-mailu.</div></div>'; });
})();
</script>
</body>
</html>

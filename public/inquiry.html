<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Poptávkový list</title>
  <!-- HolyOS — Veřejný poptávkový list pro dodavatele (odkaz z e-mailu, bez přihlášení) -->
  <style>
    :root { --bg:#f4f6fa; --card:#fff; --text:#1e2433; --muted:#6b7280; --border:#e3e7ef; --accent:#2563eb; --ok:#16a34a; --warn:#d97706; --err:#dc2626; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); font-size:14px; }
    .wrap { max-width: 1060px; margin: 0 auto; padding: 28px 18px 60px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:22px 24px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
    .kicker { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:700; }
    h1 { margin:4px 0 6px; font-size:24px; }
    .muted { color:var(--muted); }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap:12px; margin-top:14px; }
    .grid div b { display:block; font-size:15px; margin-top:2px; }
    table { width:100%; border-collapse:collapse; }
    th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:8px 6px; border-bottom:1px solid var(--border); }
    td { padding:10px 6px; border-bottom:1px solid var(--border); vertical-align:top; }
    td.r, th.r { text-align:right; }
    input, textarea { font:inherit; border:1px solid var(--border); border-radius:8px; padding:7px 9px; width:100%; background:#fff; color:var(--text); }
    input:focus, textarea:focus { outline:2px solid rgba(37,99,235,.25); border-color:var(--accent); }
    input.num { text-align:right; }
    input.bad { border-color:var(--err); background:#fef2f2; }
    .name { font-weight:600; } .code { font-size:12px; color:var(--muted); }
    .need { font-size:12px; color:var(--muted); margin-top:3px; }
    .late { color:var(--err); font-weight:600; }
    .actions { display:flex; gap:10px; justify-content:flex-end; align-items:center; flex-wrap:wrap; }
    button { font:inherit; border:0; border-radius:9px; padding:11px 18px; cursor:pointer; font-weight:700; }
    .btn-sec { background:#eef2f9; color:var(--text); }
    .btn-pri { background:var(--accent); color:#fff; }
    button:disabled { opacity:.55; cursor:default; }
    .msg { padding:12px 14px; border-radius:10px; margin-bottom:14px; }
    .msg.ok { background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
    .msg.err { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
    .msg.info { background:#eff6ff; color:#1e3a8a; border:1px solid #bfdbfe; }
    .total { font-size:20px; font-weight:800; }
    @media (max-width: 760px) {
      thead { display:none; } tr { display:block; border-bottom:1px solid var(--border); padding:8px 0; } td { display:block; border:0; padding:4px 0; }
      td[data-l]::before { content: attr(data-l); display:block; font-size:11px; color:var(--muted); text-transform:uppercase; margin-bottom:2px; }
      td.r { text-align:left; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="app"><div class="card">Načítám poptávku…</div></div>
  <script>
    (function () {
      var token = location.pathname.split('/').filter(Boolean).pop();
      var API = '/api/public/inquiry/' + encodeURIComponent(token);
      var D = null;
      var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
      var fd = function (v) { if (!v) return '—'; var p = String(v).slice(0, 10).split('-'); return (+p[2]) + '. ' + (+p[1]) + '. ' + p[0]; };
      var money = function (v) { return (Number(v) || 0).toLocaleString('cs-CZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ' + (D ? D.currency : ''); };
      var addDays = function (days) { var d = new Date(); d.setHours(12); d.setDate(d.getDate() + days); return d.toISOString().slice(0, 10); };

      function load() {
        fetch(API).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); }).then(function (x) {
          if (!x.ok) { document.getElementById('app').innerHTML = '<div class="card"><h1>Poptávka není dostupná</h1><p class="muted">' + esc(x.j.error || 'Odkaz je neplatný.') + '</p></div>'; return; }
          D = x.j; render();
        }).catch(function () { document.getElementById('app').innerHTML = '<div class="card">Nepodařilo se načíst poptávku. Zkuste to prosím znovu.</div>'; });
      }

      function render(msg) {
        var L = D.locked;
        var rows = D.items.map(function (it, i) {
          var dis = L ? ' disabled' : '';
          return '<tr data-id="' + it.id + '">' +
            '<td data-l="Položka"><div class="name">' + esc(it.name) + '</div>' + (it.code ? '<div class="code">' + esc(it.code) + '</div>' : '') + (it.needed_by ? '<div class="need">Potřebujeme dodat do <b>' + fd(it.needed_by) + '</b></div>' : '') + '</td>' +
            '<td data-l="Množství" class="r" style="white-space:nowrap"><b>' + Number(it.quantity).toLocaleString('cs-CZ') + '</b> ' + esc(it.unit) + '</td>' +
            '<td data-l="Cena / ' + esc(it.unit) + ' bez DPH (' + esc(D.currency) + ')" style="width:130px"><input class="num" data-f="offered_price" type="number" step="0.01" min="0" placeholder="0,00" value="' + (it.offered_price == null ? '' : it.offered_price) + '"' + dis + '></td>' +
            '<td data-l="Dodací lhůta (pracovních dní od objednání)" style="width:110px"><input class="num" data-f="lead_time_days" type="number" step="1" min="0" placeholder="dní" value="' + (it.lead_time_days == null ? '' : it.lead_time_days) + '"' + dis + '></td>' +
            '<td data-l="Nejbližší možný termín dodání" style="width:150px"><input data-f="offered_delivery" type="date" value="' + esc(it.offered_delivery || '') + '"' + dis + '><div class="need" data-late></div></td>' +
            '<td data-l="Min. odběr" style="width:100px"><input class="num" data-f="min_order_qty" type="number" step="0.01" min="0" placeholder="—" value="' + (it.min_order_qty == null ? '' : it.min_order_qty) + '"' + dis + '></td>' +
            '<td data-l="Poznámka" style="min-width:150px"><input data-f="supplier_note" placeholder="např. alternativa, balení…" value="' + esc(it.supplier_note || '') + '"' + dis + '></td>' +
            '<td data-l="Celkem" class="r" style="white-space:nowrap" data-sum></td></tr>';
        }).join('');
        var status = D.status === 'answered' || D.status === 'converted'
          ? '<div class="msg ok">✅ Nabídka byla odeslána ' + (D.answered_at ? new Date(D.answered_at).toLocaleString('cs-CZ') : '') + '. Děkujeme! Pro změnu nás prosím kontaktujte.</div>'
          : (D.saved_at ? '<div class="msg info">💾 Rozpracováno — naposledy uloženo ' + new Date(D.saved_at).toLocaleString('cs-CZ') + '. Až budete mít vše, klikněte na „Odeslat nabídku“.</div>' : '');
        document.getElementById('app').innerHTML =
          '<div class="card"><div class="kicker">Poptávkový list</div><h1>Poptávka ' + esc(D.number) + '</h1>' +
          '<div class="muted">' + esc(D.buyer) + ' Vás žádá o cenovou nabídku. Vyplňte prosím ceny, dodací lhůtu (kolik dní předem musíme objednat) a nejbližší termín, kdy zboží dodáte.</div>' +
          '<div class="grid"><div class="muted">Odběratel<b>' + esc(D.buyer) + '</b></div><div class="muted">Dodavatel<b>' + esc(D.supplier || '') + '</b></div><div class="muted">Požadované dodání<b>' + fd(D.required_delivery) + '</b></div><div class="muted">Měna<b>' + esc(D.currency) + '</b></div></div>' +
          (D.note ? '<div class="msg info" style="margin-top:14px;white-space:pre-wrap">' + esc(D.note) + '</div>' : '') + '</div>' +
          '<div id="msg">' + (msg || '') + '</div>' + status +
          '<div class="card"><table><thead><tr><th>Položka</th><th class="r">Množství</th><th>Cena/jedn. bez DPH</th><th>Lhůta (dní)</th><th>Termín dodání</th><th>Min. odběr</th><th>Poznámka</th><th class="r">Celkem</th></tr></thead><tbody>' + rows + '</tbody></table>' +
          '<div class="actions" style="margin-top:14px"><span class="muted">Celkem bez DPH</span> <span class="total" id="tot"></span></div></div>' +
          '<div class="card"><div class="grid" style="margin-top:0;grid-template-columns:1fr 2fr"><label class="muted">Vyplnil(a)<input id="sname" value="' + esc(D.supplier_name || '') + '"' + (L ? ' disabled' : '') + ' placeholder="Jméno"></label>' +
          '<label class="muted">Poznámka k nabídce (doprava, platnost nabídky, podmínky…)<textarea id="snote" rows="2"' + (L ? ' disabled' : '') + '>' + esc(D.supplier_note || '') + '</textarea></label></div>' +
          (L ? '' : '<div class="actions" style="margin-top:16px"><button class="btn-sec" id="b-save">💾 Uložit rozpracované</button><button class="btn-pri" id="b-send">Odeslat nabídku →</button></div>') + '</div>' +
          '<div class="muted" style="text-align:center;font-size:12px">Poptávka ' + esc(D.number) + ' · ' + esc(D.buyer) + '</div>';
        recalc();
        if (!L) {
          document.getElementById('b-save').onclick = function () { save(false); };
          document.getElementById('b-send').onclick = function () { save(true); };
        }
      }

      function recalc() {
        var tot = 0;
        document.querySelectorAll('tr[data-id]').forEach(function (tr) {
          var it = D.items.find(function (x) { return String(x.id) === tr.dataset.id; });
          var p = parseFloat(tr.querySelector('[data-f=offered_price]').value.replace(',', '.'));
          var s = Number.isFinite(p) ? p * Number(it.quantity) : 0; tot += s;
          tr.querySelector('[data-sum]').textContent = Number.isFinite(p) ? money(s) : '—';
          // Lhůta → navrhnout termín; termín po požadovaném → upozornit
          var leadEl = tr.querySelector('[data-f=lead_time_days]'), delEl = tr.querySelector('[data-f=offered_delivery]');
          var lead = parseInt(leadEl.value, 10);
          if (document.activeElement === leadEl && Number.isFinite(lead) && !delEl.dataset.touched) delEl.value = addDays(Math.round(lead * 7 / 5));
          var lateEl = tr.querySelector('[data-late]');
          lateEl.innerHTML = (it.needed_by && delEl.value && delEl.value > it.needed_by) ? '<span class="late">později než požadujeme (' + fd(it.needed_by) + ')</span>' : '';
        });
        var t = document.getElementById('tot'); if (t) t.textContent = money(tot);
      }
      function showMsg(h) { var m = document.getElementById('msg'); if (m) { m.innerHTML = h; m.scrollIntoView({ behavior: 'smooth', block: 'center' }); } }
      document.addEventListener('input', function (e) { if (D && e.target && e.target.closest && e.target.closest('tr[data-id]')) recalc(); });
      document.addEventListener('change', function (e) { if (e.target && e.target.dataset && e.target.dataset.f === 'offered_delivery') e.target.dataset.touched = '1'; });

      function collect() {
        return Array.prototype.map.call(document.querySelectorAll('tr[data-id]'), function (tr) {
          var o = { id: parseInt(tr.dataset.id, 10) };
          tr.querySelectorAll('[data-f]').forEach(function (el) { o[el.dataset.f] = el.value; });
          return o;
        });
      }

      function save(submit) {
        var items = collect();
        if (submit) {
          var bad = 0;
          document.querySelectorAll('[data-f=offered_price]').forEach(function (el) { var ok = el.value !== '' && Number(el.value) >= 0; el.classList.toggle('bad', !ok); if (!ok) bad++; });
          if (bad) { showMsg('<div class="msg err">Doplňte prosím cenu u všech položek (' + bad + ' chybí). Pokud položku nedodáváte, uveďte 0 a napište to do poznámky.</div>'); return; }
          if (!confirm('Odeslat nabídku? Po odeslání už ji nepůjde upravit.')) return;
        }
        var b1 = document.getElementById('b-save'), b2 = document.getElementById('b-send'); if (b1) b1.disabled = true; if (b2) b2.disabled = true;
        fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: items, supplier_name: document.getElementById('sname').value, supplier_note: document.getElementById('snote').value, submit: !!submit }) })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (x) {
            if (!x.ok) { if (b1) b1.disabled = false; if (b2) b2.disabled = false; showMsg('<div class="msg err">' + esc(x.j.error || 'Uložení se nepodařilo.') + '</div>'); return; }
            fetch(API).then(function (r) { return r.json(); }).then(function (j) { D = j; render(submit ? '' : '<div class="msg ok">💾 Uloženo. Můžete se k poptávce kdykoli vrátit přes stejný odkaz.</div>'); window.scrollTo(0, 0); });
          })
          .catch(function () { if (b1) b1.disabled = false; if (b2) b2.disabled = false; alert('Spojení selhalo, zkuste to prosím znovu.'); });
      }
      load();
    })();
  </script>
</body>
</html>

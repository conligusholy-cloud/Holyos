<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>AI specialista · Compounder</title>
<style>
  :root { --bg:#0b0e13; --panel:#0e1116; --line:#2a2a2e; --gold:#eab308; --muted:#7a7a85; --text:#e8e8ea; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; overflow:hidden; }
  /* Celá stránka na výšku okna (dvh kvůli mobilním lištám prohlížeče) → spodní lišta ukotvená. */
  .wrap { max-width:720px; margin:0 auto; height:100dvh; display:flex; flex-direction:column;
          padding:12px 12px 0; }
  .head { flex:0 0 auto; padding:6px 2px 10px; }
  .brand { font-weight:800; letter-spacing:3px; font-size:13px; color:#fff; }
  .brand span { color:var(--gold); }
  h1 { font-size:19px; margin:8px 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0; line-height:1.4; }
  #chat { flex:1; min-height:0; display:flex; flex-direction:column; }
  #msgs { position:relative; flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
          border:1px solid var(--line); border-radius:14px; padding:14px; background:var(--panel);
          display:flex; flex-direction:column; gap:10px; }
  .m { max-width:88%; padding:9px 12px; border-radius:12px; font-size:15px; line-height:1.5; white-space:pre-wrap; }
  .m.user { align-self:flex-end; background:#26303c; color:#fff; }
  .m.ai { align-self:flex-start; background:#171b22; color:var(--text); border:1px solid var(--line); }
  /* Ukotvená spodní lišta s odsazením pro home indicator na iPhonu. */
  .bar { flex:0 0 auto; display:flex; gap:8px; align-items:flex-end;
         padding:10px 0 calc(10px + env(safe-area-inset-bottom)); background:var(--bg); }
  #input { flex:1; resize:none; max-height:120px; background:var(--panel); border:1px solid var(--line);
           border-radius:12px; padding:12px; color:#fff; font-size:16px; font-family:inherit; line-height:1.4; }
  button { flex:0 0 auto; border:none; border-radius:12px; cursor:pointer; }
  #send { background:linear-gradient(180deg,#37b6ee,#2ba6dd); color:#06131e; padding:0 20px; height:48px; font-weight:800; font-size:15px; }
  #gate { text-align:center; color:var(--muted); padding:60px 16px; }
  /* Leták — vzhled jako tištěný leták (tmavě modrý, modrý akcent). Nahoře, rozbalovací. */
  #intro { --blue:#2ba6dd; --blue2:#1b7fb0; flex:0 0 auto; border:1px solid #1e3a52;
           border-radius:16px; background:linear-gradient(160deg,#0d2033 0%,#0a1826 60%,#081420 100%);
           margin-bottom:10px; overflow:hidden; box-shadow:0 6px 24px rgba(0,0,0,.35); }
  #intro .ihead { display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer;
                  background:linear-gradient(180deg,rgba(43,166,221,.14),transparent); border-bottom:1px solid rgba(43,166,221,.18); }
  #intro .ihead .logo { font-weight:900; letter-spacing:1px; font-size:14px; color:#fff; display:flex; align-items:center; gap:7px; }
  #intro .ihead .logo .drop { color:var(--blue); font-size:17px; }
  #intro .ihead .t { flex:1; min-width:0; }
  #intro .ihead .ts { font-size:11.5px; color:#9fb6c9; margin-top:1px; }
  #intro .ichev { color:var(--blue); font-size:13px; transition:transform .2s; }
  #intro.collapsed .ichev { transform:rotate(-90deg); }
  #intro .ibody { padding:14px; max-height:52vh; overflow-y:auto; }
  #intro.collapsed .ibody { display:none; }
  #intro .hero { font-size:20px; line-height:1.15; font-weight:900; color:#fff; letter-spacing:.5px; margin:0 0 6px; }
  #intro .hero b { color:var(--blue); }
  #intro .lead { font-size:12.5px; color:#b9cbd9; margin:0 0 12px; line-height:1.5; }
  #intro .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:8px; margin:0 0 6px; }
  #intro .stat { background:rgba(43,166,221,.07); border:1px solid rgba(43,166,221,.25); border-radius:10px; padding:9px 8px; text-align:center; }
  #intro .stat .n { font-size:17px; font-weight:900; color:var(--blue); }
  #intro .stat .l { font-size:10px; color:#9fb6c9; text-transform:uppercase; letter-spacing:.03em; margin-top:2px; line-height:1.2; }
  #intro .sec { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--blue); margin:16px 0 7px; font-weight:800; text-align:center; }
  #intro .steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; }
  #intro .step { background:#0e2233; border:1px solid #1e3a52; border-radius:10px; padding:9px 10px; }
  #intro .step .num { color:var(--blue); font-weight:900; font-size:15px; }
  #intro .step .tx { font-size:11.5px; color:#c3d2de; line-height:1.35; margin-top:2px; }
  #intro .scen { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; }
  #intro .card { background:#0e2233; border:1px solid #1e3a52; border-radius:12px; padding:11px; text-align:center; }
  #intro .card.hot { border-color:var(--blue); background:linear-gradient(180deg,rgba(43,166,221,.16),#0e2233); box-shadow:0 0 0 1px rgba(43,166,221,.35) inset; }
  #intro .card .who { font-size:12px; color:#c3d2de; font-weight:700; }
  #intro .card .ret { font-size:11px; color:#8ea6b8; margin:4px 0 1px; }
  #intro .card .val { font-size:18px; font-weight:900; color:#fff; }
  #intro .card.hot .val { color:var(--blue); }
  #intro .solve { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
  #intro .solve span { font-size:11.5px; color:#c3d2de; background:#0e2233; border:1px solid #1e3a52; border-radius:999px; padding:4px 10px; }
  #intro .letak { width:100%; height:auto; display:block; border-radius:12px; border:1px solid #1e3a52; margin:2px 0 4px; }
  #intro .qs { display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
  #intro .q { font-size:12.5px; color:#fff; background:linear-gradient(180deg,var(--blue),var(--blue2)); border:none;
              border-radius:999px; padding:8px 13px; cursor:pointer; text-align:left; font-weight:600; box-shadow:0 2px 8px rgba(43,166,221,.25); }
  #intro .q:hover { filter:brightness(1.08); }
  #intro .cta { display:block; width:100%; margin-top:10px; text-align:center; font-weight:800; font-size:13.5px; color:#06131e;
                background:linear-gradient(180deg,#37b6ee,var(--blue)); border:none; border-radius:12px; padding:12px; cursor:pointer; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="brand">COMPO<span>U</span>NDER</div>
      <h1>Specialista na prádlomaty</h1>
      <p class="sub">Zeptejte se na cokoli — jak to funguje, ekonomika, návratnost, lokality.</p>
    </div>
    <div id="gate">Načítám…</div>
    <div id="chat" style="display:none;">
      <div id="intro">
        <div class="ihead" id="introHead">
          <div class="t">
            <div class="logo"><span class="drop">💧</span> PRÁDLOMAT NA PRODEJ</div>
            <div class="ts">Rozklikni leták a zeptej se AI specialisty na cokoli.</div>
          </div>
          <div class="ichev">▼</div>
        </div>
        <div class="ibody">
          <img class="letak" src="/ai/letak.png" alt="Prádlomat na prodej — leták" loading="lazy"
               onerror="this.onerror=null;this.src='/compounder/ai/letak.png';">
          <div class="sec">Zeptejte se AI specialisty</div>
          <div class="qs" id="introQs">
            <button class="q" data-q="Kolik může prádelna vydělávat?">💰 Kolik může prádelna vydělávat?</button>
            <button class="q" data-q="Spočítej mi návratnost investice do prádlomatu.">📈 Spočítej návratnost investice</button>
            <button class="q" data-q="Jak vybrat a zjistit vhodnou lokalitu?">📍 Jak vybrat lokalitu?</button>
            <button class="q" data-q="Co zahrnuje servis a podpora?">🔧 Servis a podpora</button>
            <button class="q" data-q="Jak probíhá financování prádlomatu?">🏦 Jak probíhá financování?</button>
            <button class="q" data-q="Jaké jsou náklady na provoz prádlomatu?">📊 Náklady na provoz</button>
          </div>
          <button class="cta" data-q="Chci nezávaznou konzultaci — spočítejte mi finanční důchod na míru.">🤖 Spočítat můj finanční důchod s AI</button>
        </div>
      </div>
      <div id="msgs"></div>
      <div class="bar">
        <textarea id="input" rows="1" placeholder="Napište dotaz…"></textarea>
        <button id="send">Odeslat</button>
      </div>
    </div>
  </div>
<script>
(function(){
  var token = new URLSearchParams(location.search).get('t') || '';
  var busy = false;
  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  // Lehké vykreslení: **tučně** → <strong>, odrážky "- "/"* " → •, zbytek zůstává (pre-wrap zachová řádky).
  function mdLite(t){
    var s = esc(t);
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|\n)\s*[-*]\s+/g, '$1• ');
    s = s.replace(/(^|\n)#{1,6}\s*/g, '$1');
    return s;
  }
  function addMsg(role, text){
    var d = document.createElement('div'); d.className = 'm ' + (role==='user'?'user':'ai');
    if(role==='user') d.textContent = text; else d.innerHTML = mdLite(text);
    el('msgs').appendChild(d); el('msgs').scrollTop = el('msgs').scrollHeight; return d;
  }
  function autoGrow(){
    var t = el('input'); t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,120)+'px';
  }
  // Po odpovědi nascrolluj tak, aby MOJE otázka byla nahoře → dlouhou odpověď čteš odshora dolů.
  function snapToQuestion(uEl){
    if(!uEl) return;
    requestAnimationFrame(function(){ try{ el('msgs').scrollTop = Math.max(0, uEl.offsetTop - 8); }catch(e){} });
  }
  async function send(){
    var msg = (el('input').value||'').trim(); if(!msg || busy) return;
    el('input').value=''; autoGrow(); busy=true;
    var _in = el('intro'); if(_in) _in.classList.add('collapsed'); // jakmile začne chat, leták se sbalí
    var uEl = addMsg('user', msg);
    var ph = addMsg('ai','…');
    try{
      var r = await fetch('/api/compounder/portal/ai-specialist', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ t: token, message: msg }) });
      var j = await r.json().catch(function(){ return {}; });
      if(ph && ph.parentNode) ph.parentNode.removeChild(ph);
      if(r.ok && j.ok){ addMsg('ai', j.reply||'…'); }
      else addMsg('ai', 'Omlouvám se, '+(j.error||'nepodařilo se odpovědět')+'.');
      snapToQuestion(uEl);
    }catch(e){ if(ph && ph.parentNode) ph.parentNode.removeChild(ph); addMsg('ai','Chyba spojení.'); snapToQuestion(uEl); }
    busy=false;
  }
  async function boot(){
    if(!token){ el('gate').textContent='Neplatný odkaz.'; return; }
    try{
      var r = await fetch('/api/compounder/portal/ai-specialist/info?t='+encodeURIComponent(token));
      var j = await r.json().catch(function(){ return {}; });
      if(!r.ok || !j.ok){ el('gate').textContent = (j && j.error) ? j.error : 'Odkaz je neplatný nebo nedostupný.'; return; }
      el('gate').style.display='none'; el('chat').style.display='flex';
      (j.messages||[]).forEach(function(m){ addMsg(m.role==='user'?'user':'ai', m.text); });
      if(!(j.messages||[]).length && j.greeting) addMsg('ai', j.greeting);
      el('send').addEventListener('click', send);
      el('input').addEventListener('input', autoGrow);
      el('input').addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
      // Leták: rozbalování + rychlé dotazy (kliknutí položí dotaz chatu).
      var ih = el('introHead'); if(ih) ih.addEventListener('click', function(){ el('intro').classList.toggle('collapsed'); });
      var ib = el('intro');
      if(ib) ib.addEventListener('click', function(e){
        var b = e.target.closest('[data-q]'); if(!b) return;
        var q = b.getAttribute('data-q'); if(!q) return;
        el('input').value = q; autoGrow(); send();
        ib.classList.add('collapsed'); // po dotazu leták sbal, ať je vidět odpověď
      });
    }catch(e){ el('gate').textContent='Chyba načtení.'; }
  }
  boot();
})();
</script>
</body>
</html>

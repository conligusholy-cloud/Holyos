<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>COMPOUNDER</title>
<meta name="description" content="Compounder — Freedom." />
<meta name="theme-color" content="#0a0a0b" />
<meta name="robots" content="noindex,nofollow" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0a0a0b; --surface:#141417; --line:rgba(255,255,255,.10);
    --text:#f4f4f2; --muted:#9b9ba3; --gold:#c9a24b; --gold-soft:#d8bd78;
    --gold-grad:linear-gradient(135deg,#f6e6ad 0%,#cda454 42%,#9a7a34 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:24px;position:relative}
  body::before{content:"";position:fixed;inset:0;
    background:radial-gradient(120% 90% at 50% -10%, rgba(201,162,75,.18), transparent 55%);pointer-events:none}
  .wrap{position:relative;width:100%;max-width:440px;text-align:center;animation:fade .8s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .mark{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:.28em;
    font-size:clamp(30px,7vw,46px);margin-left:.28em}
  .mark .g{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .taglines{margin:26px 0 8px}
  .taglines p{color:var(--muted);font-size:16px;line-height:1.5;font-weight:300}
  .taglines .free{margin-top:14px;font-size:26px;font-weight:700;color:var(--text)}
  .taglines .free span{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .invite{margin-top:22px;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted)}
  .card{margin-top:30px;background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:24px 22px;text-align:left;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .card h1{font-size:17px;font-weight:600;margin-bottom:4px}
  .card .sub{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.45}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
  label:first-of-type{margin-top:0}
  input,textarea{width:100%;background:#0e0e10;border:1px solid var(--line);border-radius:10px;
    padding:13px 14px;color:var(--text);font-size:15px;font-family:inherit;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--gold)}
  input[readonly]{opacity:.7}
  .btn{width:100%;margin-top:16px;border:none;border-radius:999px;padding:14px;
    font-size:15px;font-weight:700;cursor:pointer;background:var(--gold-grad);color:#241c05}
  .btn:disabled{opacity:.6;cursor:default}
  .msg{min-height:20px;margin-top:14px;font-size:13.5px;color:var(--gold-soft);text-align:center;line-height:1.4}
  .foot{margin-top:26px;font-size:11px;color:#54545c}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">COMP<span class="g">OU</span>NDER</div>
    <div class="taglines">
      <p>Kde hodnota roste sama.</p>
      <p>Výsledek je jen jeden.</p>
      <p class="free"><span>Freedom.</span></p>
    </div>
    <div class="invite">Přístup pouze pro zvané</div>

    <div class="card">
      <div id="loginBox">
        <h1>Přihlášení</h1>
        <p class="sub">Přihlaste se e-mailem a heslem. Poprvé použijte odkaz z pozvánky a heslo si nastavíte v portálu.</p>
        <form id="loginForm" novalidate>
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="vas@email.cz" required />
          <label for="password">Heslo</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" />
          <button type="submit" class="btn" id="loginBtn">Přihlásit</button>
          <button type="button" id="sendLinkBtn" style="width:100%;margin-top:10px;background:transparent;border:none;color:var(--gold-soft);font-size:13px;cursor:pointer;text-decoration:underline;">Poprvé tu jste nebo jste zapomněli heslo? Poslat přihlašovací odkaz</button>
          <div class="msg" id="msg" role="status"></div>
        </form>
      </div>

    </div>

    <div class="foot">COMPOUNDER © <span id="yr"></span></div>
  </div>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  var loginForm = document.getElementById('loginForm');
  var msg = document.getElementById('msg');
  var loginBtn = document.getElementById('loginBtn');
  var loginBox = document.getElementById('loginBox');

  // Magic-link (první přihlášení / zapomenuté heslo). Když e-mail není mezi
  // pozvanými, ukáže formulář žádosti o přístup.
  function sendMagicLink(email, btn) {
    var old = btn.textContent; btn.disabled = true; btn.textContent = 'Ověřuji…'; msg.style.color = ''; msg.textContent = '';
    fetch('/api/compounder/portal/login-check', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
      body: JSON.stringify({ email: email })
    })
    .then(function (r) { return r.json().catch(function(){ return {}; }); })
    .then(function (d) {
      if (d && d.exists) {
        msg.style.color = 'var(--gold-soft)';
        msg.textContent = 'Poslali jsme vám na e-mail přihlašovací odkaz. Po přihlášení si v portálu nastavte heslo.';
        btn.textContent = 'Odesláno ✓';
      } else {
        msg.style.color = '#e0b96b';
        msg.textContent = 'Přístup je jen na pozvání. Tato adresa není mezi pozvanými — o přístup požádejte svého obchodníka.';
        btn.disabled = false; btn.textContent = old;
      }
    })
    .catch(function () {
      msg.style.color = '#ef4444'; msg.textContent = 'Nepodařilo se ověřit. Zkuste to prosím znovu.';
      btn.disabled = false; btn.textContent = old;
    });
  }

  // Přihlášení e-mailem + heslem.
  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = (document.getElementById('email').value || '').trim();
    var password = (document.getElementById('password').value || '');
    if (!email || email.indexOf('@') === -1) { msg.style.color = '#ef4444'; msg.textContent = 'Zadejte platný e-mail.'; return; }
    if (!password) { msg.style.color = '#ef4444'; msg.textContent = 'Zadejte heslo — nebo použijte odkaz níže.'; return; }
    loginBtn.disabled = true; loginBtn.textContent = 'Přihlašuji…'; msg.style.color = ''; msg.textContent = '';
    fetch('/api/compounder/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
      body: JSON.stringify({ email: email, password: password })
    })
    .then(function (r) { return r.json().then(function(j){ return { ok:r.ok, j:j }; }).catch(function(){ return { ok:false, j:{} }; }); })
    .then(function (res) {
      if (res.ok && res.j && res.j.ok && res.j.token) { location.href = '/portal?t=' + encodeURIComponent(res.j.token); return; }
      msg.style.color = '#ef4444'; msg.textContent = (res.j && res.j.error) || 'Neplatný e-mail nebo heslo.';
      loginBtn.disabled = false; loginBtn.textContent = 'Přihlásit';
    })
    .catch(function () {
      msg.style.color = '#ef4444'; msg.textContent = 'Přihlášení selhalo. Zkuste to prosím znovu.';
      loginBtn.disabled = false; loginBtn.textContent = 'Přihlásit';
    });
  });

  document.getElementById('sendLinkBtn').addEventListener('click', function () {
    var email = (document.getElementById('email').value || '').trim();
    if (!email || email.indexOf('@') === -1) { msg.style.color = '#ef4444'; msg.textContent = 'Zadejte platný e-mail.'; return; }
    sendMagicLink(email, this);
  });
</script>
</body>
</html>

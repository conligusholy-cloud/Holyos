<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Předjednaná místa pro prádlomat</title>
<meta name="description" content="Přehled předjednaných míst pro prádlomat. Vybrané lokality, které máme domluvené a nabízíme provozovatelům — mapa, plocha, nájem a dostupnost." />
<meta name="theme-color" content="#0c1826" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z' fill='%231e86e0'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  :root{
    --bg:#0c1826; --card:#13233a; --card2:#102a45; --line:rgba(46,140,224,.3);
    --blue:#1e86e0; --blue-soft:#4aa3ea; --text:#e9f0f7; --muted:#9db6cd; --muted2:#7fa6c8;
    --green:#22c55e; --amber:#eab308;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Inter',system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased;
    background:radial-gradient(120% 70% at 50% -10%, rgba(30,134,224,.14), transparent 55%), var(--bg)}
  a{color:inherit;text-decoration:none}
  .wrap{width:100%;max-width:1120px;margin:0 auto;padding:24px 20px 70px}

  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:26px}
  .brand{display:inline-flex;align-items:center;gap:10px}
  .brand .drop{width:34px;height:34px;border-radius:9px;background:var(--blue);display:flex;align-items:center;justify-content:center}
  .brand .drop svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.8}
  .brand .name{font-weight:600;letter-spacing:.14em;font-size:16px}
  .badge{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#a9cdec;background:rgba(30,134,224,.14);
    border:.5px solid rgba(46,140,224,.4);padding:6px 13px;border-radius:999px}

  .hero{margin-bottom:24px}
  .eyebrow{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-soft);margin-bottom:10px}
  h1{font-weight:700;font-size:clamp(28px,5.5vw,42px);line-height:1.12;letter-spacing:-.01em}
  h1 .g{color:var(--blue-soft)}
  .intro{font-size:15.5px;line-height:1.65;color:var(--muted);max-width:640px;margin-top:14px}

  .layout{display:grid;grid-template-columns:1fr;gap:20px}
  #map{width:100%;height:360px;border-radius:16px;border:.5px solid var(--line);background:#0e1e33;z-index:0}
  .leaflet-container{font-family:inherit}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 6px}
  .toolbar .count{font-size:13px;color:var(--muted2)}
  .search{flex:1;min-width:180px;background:#0e1e33;border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--text);font-size:14px;font-family:inherit}
  .search:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,134,224,.15)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:16px}
  .spot{background:var(--card);border:.5px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;
    display:flex;flex-direction:column;transition:transform .15s,border-color .15s,box-shadow .2s}
  .spot:hover{transform:translateY(-3px);border-color:var(--blue);box-shadow:0 12px 30px -12px rgba(30,134,224,.4)}
  .spot .ph{height:158px;background:#0e1e33 center/cover no-repeat;position:relative;display:flex;align-items:center;justify-content:center}
  .spot .ph .noimg{color:var(--muted2);font-size:13px}
  .spot .hl{position:absolute;top:10px;left:10px;background:rgba(12,24,38,.86);color:#a9cdec;font-size:11.5px;font-weight:600;
    padding:5px 10px;border-radius:999px;border:.5px solid rgba(46,140,224,.5)}
  .stt{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;line-height:1;white-space:nowrap}
  .spot .stt{position:absolute;top:10px;right:10px}
  .stt::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px}
  .stt.published{background:rgba(34,197,94,.14);color:#8ef0b4;border:1px solid rgba(34,197,94,.45)}
  .stt.published::before{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.22);animation:sttpulse 2s ease-in-out infinite}
  .stt.reserved{background:rgba(234,179,8,.14);color:#f2d675;border:1px solid rgba(234,179,8,.45)}
  .stt.reserved::before{background:#eab308}
  @keyframes sttpulse{0%,100%{box-shadow:0 0 0 2px rgba(34,197,94,.28)}50%{box-shadow:0 0 0 6px rgba(34,197,94,0)}}
  .thumb-pin{flex-direction:column;gap:6px}
  .thumb-pin::after{content:'Připravená lokalita';font-size:10.5px;letter-spacing:.03em;color:var(--muted2)}
  .spot .body{padding:15px 16px 17px;flex:1;display:flex;flex-direction:column;gap:8px}
  .spot h3{font-size:16.5px;font-weight:700;line-height:1.25}
  .spot .loc{font-size:13px;color:var(--blue-soft);display:flex;align-items:center;gap:6px}
  .spot .desc{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .spot .facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
  .fact{font-size:12px;color:#c3d6e8;background:var(--card2);border:.5px solid rgba(46,140,224,.28);border-radius:8px;padding:5px 9px}

  .empty{grid-column:1/-1;text-align:center;color:var(--muted2);padding:50px 10px;font-size:15px}

  /* Řádkový layout */
  .rows{display:flex;flex-direction:column;gap:12px;margin-top:16px}
  .rowspot{display:flex;gap:0;align-items:stretch;background:var(--card);border:.5px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .2s}
  .rowspot:hover{border-color:var(--blue);box-shadow:0 10px 26px -16px rgba(30,134,224,.55)}
  .rowspot .thumb{width:150px;flex:0 0 150px;background:#0e1e33 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted2);font-size:12px}
  .rowspot .main{flex:1;min-width:0;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
  .rowspot .rline1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .rowspot h3{font-size:17px;font-weight:700;line-height:1.25}
  .rowspot .loc{font-size:12px;color:var(--blue-soft)}
  .rowspot .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto}
  .chip{font-size:12px;color:#c3d6e8;background:var(--card2);border:.5px solid rgba(46,140,224,.28);border-radius:8px;padding:5px 9px;white-space:nowrap}
  .chip.g{background:rgba(34,197,94,.14);color:#7ee2a4;border-color:rgba(34,197,94,.4)}
  .chip.w{background:rgba(234,179,8,.13);color:#f2d675;border-color:rgba(234,179,8,.4)}
  .rowspot .cta{flex:0 0 auto;align-self:center;padding:0 16px;display:flex;flex-direction:column;align-items:center;gap:9px}
  .rowspot .cta .btn2{background:var(--blue);color:#fff;border:none;border-radius:9px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
  .rowspot .cta .btn2:hover{filter:brightness(1.08)}
  @media(max-width:640px){.rowspot{flex-direction:column}.rowspot .thumb{width:100%;height:120px;flex:none}.rowspot .cta{align-self:stretch;padding:0 16px 14px}.rowspot .cta .btn2{width:100%}}

  /* Detail modal */
  .ov{position:fixed;inset:0;background:rgba(4,10,18,.72);backdrop-filter:blur(3px);z-index:1000;display:none;
    align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
  .ov.open{display:flex}
  .modal{width:100%;max-width:720px;background:var(--card);border:.5px solid var(--line);border-radius:18px;overflow:hidden}
  .modal .cover{height:240px;background:#0e1e33 center/cover no-repeat;position:relative}
  .modal .cover .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(12,24,38,.8);
    border:.5px solid var(--line);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .modal .inner{padding:22px 24px 26px}
  .modal h2{font-size:23px;font-weight:700;line-height:1.2}
  .modal .mloc{font-size:14px;color:var(--blue-soft);margin-top:6px;display:flex;align-items:center;gap:6px}
  .modal .mhl{display:inline-block;margin-top:12px;background:rgba(30,134,224,.14);color:#a9cdec;font-size:12.5px;font-weight:600;
    padding:6px 12px;border-radius:999px;border:.5px solid rgba(46,140,224,.4)}
  .modal .mdesc{font-size:15px;color:#c3d6e8;margin-top:16px;white-space:pre-wrap;line-height:1.65}
  .mfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:18px}
  .mfact{background:var(--card2);border:.5px solid rgba(46,140,224,.28);border-radius:12px;padding:12px 14px}
  .mfact .k{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.04em}
  .mfact .v{font-size:16px;font-weight:700;margin-top:3px}
  .gallery{display:flex;gap:8px;overflow-x:auto;margin-top:16px;padding-bottom:4px}
  .gallery img{height:92px;width:auto;border-radius:10px;border:.5px solid var(--line);object-fit:cover;flex:0 0 auto}
  #mmap{height:220px;border-radius:12px;border:.5px solid var(--line);margin-top:18px;background:#0e1e33}

  form{margin-top:22px;background:var(--card2);border:.5px solid var(--line);border-radius:14px;padding:18px}
  form h3{font-size:17px;font-weight:600;margin-bottom:4px}
  form .sub{font-size:13px;color:var(--muted);margin-bottom:14px}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .field label{font-size:12.5px;color:var(--muted)}
  .field input,.field textarea{background:#0e1e33;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;font-family:inherit}
  .field textarea{resize:vertical;min-height:74px}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,134,224,.15)}
  .btn{width:100%;border:none;border-radius:10px;padding:15px;font-size:16px;font-weight:600;color:#fff;
    background:var(--blue);cursor:pointer;font-family:inherit;transition:filter .2s,transform .15s}
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn:disabled{opacity:.6;cursor:default}
  .fstatus{min-height:20px;margin-top:10px;font-size:14px;text-align:center}
  .fstatus.ok{color:#7ee2a4}.fstatus.err{color:#f7a1a1}

  .searchbtn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
  .searchbtn:hover{filter:brightness(1.08)}
  .searchbtn:disabled{opacity:.6;cursor:default}

  /* Analýza spádové oblasti (pod mapou) */
  .an{background:var(--card);border:.5px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:16px}
  .an .anh{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .an .anh h2{font-size:19px;font-weight:700}
  .an .anh .sub{font-size:12.5px;color:var(--muted2);margin-top:3px}
  .an .big{text-align:right}
  .an .big .n{font-size:26px;font-weight:800;color:var(--blue-soft);line-height:1}
  .an .big .l{font-size:11.5px;color:var(--muted2);margin-top:3px}
  .an .legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px;align-items:center}
  .an .legend .t{font-size:11.5px;color:var(--muted2)}
  .an .li{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
  .an .li .d{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.35)}
  .an .towns{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  .an .town{font-size:12px;color:#c3d6e8;background:var(--card2);border:.5px solid rgba(46,140,224,.28);border-radius:8px;padding:5px 9px;display:inline-flex;align-items:center;gap:6px}
  .an .town .d{width:9px;height:9px;border-radius:50%}
  .an .note{font-size:12.5px;color:#f2d675;margin-top:10px}

  .foot{margin-top:44px;text-align:center;font-size:12.5px;color:var(--muted2)}
  @media (max-width:540px){ .frow{grid-template-columns:1fr} #map{height:280px} .searchbtn{width:100%} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <span class="brand">
        <span class="drop"><svg viewBox="0 0 24 24"><path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/></svg></span>
        <span class="name">PRÁDLOMAT</span>
      </span>
      <span class="badge">📍 Předjednaná místa</span>
    </div>

    <div class="hero">
      <div class="eyebrow">Vybrané lokality</div>
      <h1>Místa <span class="g">připravená</span> pro váš prádlomat</h1>
    </div>

    <div class="layout">
      <div id="map"></div>
    </div>

    <div class="toolbar">
      <input type="text" class="search" id="search" placeholder="Zadejte své město — ukážeme spádovou oblast i připravená místa…" />
      <button type="button" class="searchbtn" id="searchbtn">🔎 Vyhledat</button>
      <span class="count" id="count"></span>
    </div>

    <div id="analysis"></div>

    <div class="grid" id="grid">
      <div class="empty">Načítám místa…</div>
    </div>

    <div class="foot">© Best Series s.r.o. · <a href="/" style="color:var(--blue-soft)">pradlomaty.info</a></div>
  </div>

  <!-- Detail modal -->
  <div class="ov" id="ov" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modal"></div>
  </div>

<script>
(function(){
  var API = '/api/pradlomat-spots/public';
  var all = [];
  var map, markers = [], mmap;
  var CZ = [49.82, 15.47];

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmtMoney(v, cur){ if(v==null) return null; return Math.round(v).toLocaleString('cs-CZ')+' '+(cur||'CZK'); }
  function fmtArea(v){ if(v==null) return null; return (Math.round(v*10)/10).toLocaleString('cs-CZ')+' m²'; }
  function locLine(s){ return [s.city, s.region].filter(Boolean).join(', ') || s.country || ''; }

  function initMap(){
    map = L.map('map', { scrollWheelZoom:false }).setView(CZ, 7);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution:'Tiles &copy; Esri', maxZoom:19
    }).addTo(map);
    var lg = L.control({ position:'bottomleft' });
    lg.onAdd = function(){
      var d = L.DomUtil.create('div','maplegend');
      d.style.cssText = 'background:rgba(12,24,38,.82);padding:7px 10px;border-radius:8px;font-size:11.5px;color:#cfe0f0;display:flex;flex-direction:column;gap:3px;border:1px solid rgba(255,255,255,.14);line-height:1.5';
      function row(c,t){ return '<span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:'+c+';border:1px solid rgba(255,255,255,.5)"></span>'+t+'</span>'; }
      d.innerHTML = row('#00e676','připravené místo') + row('#eab308','rezervováno') + row('#1e86e0','už pereme');
      return d;
    };
    lg.addTo(map);
  }

  function renderMarkers(list){
    markers.forEach(function(m){ map.removeLayer(m); }); markers = [];
    var pts = [];
    list.forEach(function(s){
      if(s.latitude==null||s.longitude==null) return;
      var color = s.status==='reserved' ? '#eab308' : '#00e676';
      // Přibližná poloha — kroužek místo přesného bodu.
      var c = L.circle([s.latitude, s.longitude], { radius:1200, color:color, weight:1.5, fillColor:color, fillOpacity:.18 }).addTo(map);
      c.bindTooltip(esc(s.name), { direction:'top' });
      c.on('click', function(){ openModal(s.code); });
      markers.push(c); pts.push([s.latitude, s.longitude]);
    });
    if(pts.length){ try{ map.fitBounds(pts, { padding:[40,40], maxZoom:11 }); }catch(e){} }
  }

  // Provozované prádlomaty (kdepereme.cz) — červené body, jako kontext k připraveným místům.
  var existingLayers = [];
  function renderExisting(list){
    existingLayers.forEach(function(m){ try{ map.removeLayer(m); }catch(e){} }); existingLayers=[];
    (list||[]).forEach(function(w){
      if(w.lat==null||w.lon==null) return;
      var m = L.circleMarker([w.lat, w.lon], { radius:5, color:'#fff', weight:1.4, fillColor:'#1e86e0', fillOpacity:.95 }).addTo(map);
      m.bindTooltip('🧺 '+esc(w.name)+(w.note?('<br><span style="opacity:.75">'+esc(w.note)+'</span>'):''), { direction:'top' });
      existingLayers.push(m);
    });
  }

  function infoChips(s){
    var c = [];
    if(s.has_parking) c.push('<span class="chip g">🅿️ parkoviště'+(s.parking_distance_m!=null?' '+s.parking_distance_m+' m':'')+'</span>');
    if(s.nearest_laundromat_km!=null){
      var far = s.nearest_laundromat_km >= 8;
      c.push('<span class="chip '+(far?'g':'')+'">🧺 nejbližší prádlomat '+s.nearest_laundromat_km.toLocaleString('cs-CZ')+' km'+(s.nearest_laundromat_name?(' · '+esc(cap(s.nearest_laundromat_name))):'')+'</span>');
    }
    if(s.competition_count!=null){
      c.push('<span class="chip '+(s.competition_count===0?'g':'w')+'">⚔️ konkurence v okolí: '+(s.competition_count===0?'žádná':s.competition_count)+'</span>');
    }
    if(s.population!=null && s.population>0) c.push('<span class="chip">👥 spádovost ~'+Number(s.population).toLocaleString('cs-CZ')+'</span>');
    if(s.anchor_count!=null && s.anchor_count>0) c.push('<span class="chip">🏪 obchody v okolí '+s.anchor_count+'</span>');
    if(s.area_m2!=null) c.push('<span class="chip">📐 '+esc(fmtArea(s.area_m2))+'</span>');
    if(s.rent_monthly!=null) c.push('<span class="chip">💰 '+esc(fmtMoney(s.rent_monthly,s.rent_currency))+' /měs</span>');
    if(s.availability_note) c.push('<span class="chip">🗓️ '+esc(s.availability_note)+'</span>');
    return c;
  }
  // Hezčí zápis názvu pobočky z KML (AŠ - Tesco → Aš – Tesco).
  function cap(t){ t=String(t||''); if(t.length>28) t=t.slice(0,27)+'…'; return t.charAt(0)+t.slice(1).toLowerCase().replace(/ - /g,' – '); }

  function card(s){
    var pinIcon = '<svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="#4aa3ea" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>';
    var thumb = s.cover_image_url
      ? '<div class="thumb" style="background-image:url(\''+esc(s.cover_image_url)+'\')"></div>'
      : '<div class="thumb thumb-pin">'+pinIcon+'</div>';
    var stt = s.status==='reserved' ? '<span class="stt reserved">Rezervováno</span>' : '<span class="stt published">Volné</span>';
    return '<div class="rowspot" onclick="__openSpot(\''+esc(s.code)+'\')">'
      + thumb
      + '<div class="main">'
      +   '<div class="rline1"><div><div class="loc">📍 '+esc(locLine(s))+' · přibližná poloha</div><h3>'+esc(s.name)+'</h3></div></div>'
      +   (s.highlight ? '<div style="font-size:13px;color:#a9cdec">'+esc(s.highlight)+'</div>' : '')
      +   '<div class="chips">'+infoChips(s).join('')+'</div>'
      + '</div>'
      + '<div class="cta">'+stt+'<button class="btn2" onclick="event.stopPropagation();__openSpot(\''+esc(s.code)+'\')">Mám zájem</button></div>'
      + '</div>';
  }

  function render(list){
    var grid = document.getElementById('grid');
    grid.className = 'rows';
    document.getElementById('count').textContent = list.length ? (list.length+' '+plural(list.length)) : '';
    if(!list.length){ grid.innerHTML = '<div class="empty">Zatím tu nejsou žádná místa. Ozvěte se nám a najdeme ho společně.</div>'; return; }
    grid.innerHTML = list.map(card).join('');
  }
  function plural(n){ return n===1?'místo':(n>=2&&n<=4?'místa':'míst'); }

  function applyFilter(){
    var q = document.getElementById('search').value.trim().toLowerCase();
    var list = !q ? all : all.filter(function(s){
      return [s.name,s.city,s.region].filter(Boolean).join(' ').toLowerCase().indexOf(q)>=0;
    });
    render(list); renderMarkers(list);
  }

  function mfact(k,v){ return v==null?'':'<div class="mfact"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>'; }

  function openModal(code){
    var s = all.filter(function(x){return x.code===code;})[0];
    if(!s) return;
    var cover = s.cover_image_url
      ? '<div class="cover" style="background-image:url(\''+esc(s.cover_image_url)+'\')"><div class="x" onclick="__closeModal()">×</div></div>'
      : '<div class="cover" style="display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="60" height="60" fill="none" stroke="#4aa3ea" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg><div class="x" onclick="__closeModal()">×</div></div>';
    var gallery = (s.gallery&&s.gallery.length)
      ? '<div class="gallery">'+s.gallery.map(function(u){return '<img src="'+esc(u)+'" alt="">';}).join('')+'</div>' : '';
    var facts = ''
      + mfact('Parkoviště', s.has_parking ? ('ano'+(s.parking_distance_m!=null?' · '+s.parking_distance_m+' m':'')) : null)
      + mfact('Nejbližší prádlomat', s.nearest_laundromat_km!=null ? (s.nearest_laundromat_km.toLocaleString('cs-CZ')+' km'+(s.nearest_laundromat_name?(' ('+cap(s.nearest_laundromat_name)+')'):'')) : null)
      + mfact('Konkurence v okolí', s.competition_count!=null ? (s.competition_count===0?'žádná':String(s.competition_count)) : null)
      + mfact('Spádovost', (s.population!=null && s.population>0) ? ('~'+Number(s.population).toLocaleString('cs-CZ')+' lidí') : s.footfall_note)
      + mfact('Obchody v okolí', (s.anchor_count!=null && s.anchor_count>0) ? String(s.anchor_count) : null)
      + mfact('Plocha', fmtArea(s.area_m2))
      + mfact('Nájem', fmtMoney(s.rent_monthly, s.rent_currency) ? fmtMoney(s.rent_monthly, s.rent_currency)+' /měs' : null)
      + mfact('Dostupné', s.availability_note);
    var hasMap = s.latitude!=null && s.longitude!=null;

    document.getElementById('modal').innerHTML =
      cover
      + '<div class="inner">'
      +   '<h2>'+esc(s.name)+'</h2>'
      +   '<div class="mloc">📍 '+esc(locLine(s))+' · přibližná poloha</div>'
      +   (s.highlight ? '<span class="mhl">'+esc(s.highlight)+'</span>' : '')
      +   (s.public_description ? '<div class="mdesc">'+esc(s.public_description)+'</div>' : '')
      +   (facts ? '<div class="mfacts">'+facts+'</div>' : '')
      +   gallery
      +   (hasMap ? '<div id="mmap"></div>' : '')
      +   inquiryForm(s.code)
      + '</div>';
    document.getElementById('ov').classList.add('open');
    document.body.style.overflow = 'hidden';

    if(hasMap){
      setTimeout(function(){
        try{
          mmap = L.map('mmap', { scrollWheelZoom:false, dragging:true }).setView([s.latitude,s.longitude], 12);
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, attribution:'Tiles &copy; Esri' }).addTo(mmap);
          var col = s.status==='reserved' ? '#eab308' : '#00e676';
          L.circle([s.latitude,s.longitude], { radius:1200, color:col, weight:1.5, fillColor:col, fillOpacity:.18 }).addTo(mmap);
        }catch(e){}
      }, 60);
    }
  }

  function inquiryForm(code){
    return '<form onsubmit="return __submitInquiry(event,\''+esc(code)+'\')">'
      + '<h3>Mám zájem o toto místo</h3>'
      + '<div class="sub">Nechte nám kontakt a my se vám ozveme s detaily.</div>'
      + '<div class="field"><label>Jméno</label><input name="name" type="text" autocomplete="name"></div>'
      + '<div class="frow">'
      +   '<div class="field"><label>Telefon</label><input name="phone" type="tel" autocomplete="tel" placeholder="+420…"></div>'
      +   '<div class="field"><label>E-mail</label><input name="email" type="email" autocomplete="email"></div>'
      + '</div>'
      + '<div class="field"><label>Zpráva (nepovinné)</label><textarea name="message" placeholder="Např. kdy byste chtěli začít…"></textarea></div>'
      + '<button class="btn" type="submit">Odeslat zájem</button>'
      + '<div class="fstatus" data-fstatus></div>'
      + '</form>';
  }

  window.__submitInquiry = function(ev, code){
    ev.preventDefault();
    var f = ev.target;
    var st = f.querySelector('[data-fstatus]');
    var body = {
      name: f.name.value.trim(), phone: f.phone.value.trim(),
      email: f.email.value.trim(), message: f.message.value.trim()
    };
    if(!body.phone && !body.email){ st.className='fstatus err'; st.textContent='Zadejte prosím telefon nebo e-mail.'; return false; }
    var btn = f.querySelector('button'); btn.disabled = true; st.className='fstatus'; st.textContent='Odesílám…';
    fetch(API+'/'+encodeURIComponent(code)+'/inquiry', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        if(res.ok){ st.className='fstatus ok'; st.textContent='Děkujeme! Ozveme se vám co nejdřív.'; f.reset(); }
        else { st.className='fstatus err'; st.textContent=(res.j&&res.j.error)||'Nepodařilo se odeslat.'; btn.disabled=false; }
      }).catch(function(){ st.className='fstatus err'; st.textContent='Chyba spojení, zkuste to prosím znovu.'; btn.disabled=false; });
    return false;
  };

  window.__openSpot = openModal;
  window.__closeModal = closeModal;
  function closeModal(){ document.getElementById('ov').classList.remove('open'); document.body.style.overflow=''; if(mmap){ try{mmap.remove();}catch(e){} mmap=null; } }
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

  // ── Veřejná analýza spádové oblasti ──
  var areaLayers = [];
  function popColor(p){ return p>=50000?'#7f0000':p>=20000?'#b30000':p>=10000?'#d7301f':p>=5000?'#ef6548':p>=2000?'#fc8d59':p>=1000?'#fdbb84':p>=500?'#fdd49e':'#fee8c8'; }
  function popRadius(p){ return Math.max(4, Math.min(30, Math.sqrt(p)/3)); }
  function clearArea(){ areaLayers.forEach(function(l){ try{ map.removeLayer(l); }catch(e){} }); areaLayers=[]; }

  function runPublicArea(){
    var q = document.getElementById('search').value.trim();
    applyFilter(); // vždy taky filtruj karty
    if(q.length<2){ clearArea(); document.getElementById('analysis').innerHTML=''; return; }
    var btn = document.getElementById('searchbtn'); var old = btn.textContent; btn.disabled=true; btn.textContent='Hledám…';
    var an = document.getElementById('analysis');
    an.innerHTML = '<div class="an" style="color:var(--muted)">Analyzuji spádovou oblast '+esc(q)+' (15 km)…</div>';
    fetch(API+'/area-analysis?area='+encodeURIComponent(q)+'&radius_km=15')
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){ btn.disabled=false; btn.textContent=old;
        if(!res.ok){ an.innerHTML='<div class="an" style="color:#f7a1a1">'+esc((res.j&&res.j.error)||'Analýzu se nepodařilo spustit.')+'</div>'; return; }
        renderPublicArea(res.j, q);
      })
      .catch(function(){ btn.disabled=false; btn.textContent=old; an.innerHTML='<div class="an" style="color:#f7a1a1">Chyba spojení, zkuste to prosím znovu.</div>'; });
  }

  function renderPublicArea(r, q){
    clearArea();
    if(r.center){
      var rk = r.radius_km || 15;
      var ring = L.circle([r.center.lat,r.center.lon], { radius:rk*1000, color:'#1e86e0', weight:2, fill:true, fillColor:'#1e86e0', fillOpacity:.05, dashArray:'6 6' }).addTo(map);
      areaLayers.push(ring);
      areaLayers.push(L.circleMarker([r.center.lat,r.center.lon], { radius:5, color:'#fff', weight:2, fillColor:'#1e86e0', fillOpacity:1 }).addTo(map).bindTooltip('Střed', {direction:'top'}));
      (r.places||[]).forEach(function(p){
        var cm = L.circleMarker([p.lat,p.lon], { radius:popRadius(p.population), color:'rgba(0,0,0,.35)', weight:.5, fillColor:popColor(p.population), fillOpacity:.8 }).addTo(map);
        cm.bindTooltip(esc(p.name)+': '+p.population.toLocaleString('cs-CZ'), {direction:'top'});
        areaLayers.push(cm);
      });
      try{ map.fitBounds(ring.getBounds(), {padding:[20,20]}); }catch(e){}
    }
    var title = (r.center && r.center.display_name) ? r.center.display_name.split(',')[0] : q;
    var rk2 = r.radius_km || 15;
    var tot = r.total_population!=null ? r.total_population.toLocaleString('cs-CZ') : '—';
    var dens = r.density_per_km2!=null ? r.density_per_km2.toLocaleString('cs-CZ') : '—';
    var bands=[['<500','#fee8c8'],['500+','#fdd49e'],['1k+','#fdbb84'],['2k+','#fc8d59'],['5k+','#ef6548'],['10k+','#d7301f'],['20k+','#b30000'],['50k+','#7f0000']];
    var legend='<div class="legend"><span class="t">Velikost obce:</span>'+bands.map(function(x){return '<span class="li"><span class="d" style="background:'+x[1]+'"></span>'+x[0]+'</span>';}).join('')+'</div>';
    var towns=(r.places||[]).slice(0,10).map(function(p){return '<span class="town"><span class="d" style="background:'+popColor(p.population)+'"></span>'+esc(p.name)+' — '+p.population.toLocaleString('cs-CZ')+(p.dist_km!=null?' · '+p.dist_km+' km':'')+'</span>';}).join('');
    var note=(!r.places||!r.places.length)?'<div class="note">Podrobná data o populaci v této oblasti zatím nejsou dostupná.</div>':'';
    document.getElementById('analysis').innerHTML='<div class="an">'
      +'<div class="anh"><div><h2>🎯 Spádová oblast '+rk2+' km — '+esc(title)+'</h2><div class="sub">Počet obyvatel v okruhu '+rk2+' km od středu města · zdroj: '+esc(r.source||'')+'</div></div>'
      +'<div class="big"><div class="n">'+tot+'</div><div class="l">obyvatel · '+dens+' /km²</div></div></div>'
      + note + legend
      + (towns?('<div class="towns">'+towns+'</div>'):'')
      +'</div>';
  }

  document.getElementById('search').addEventListener('input', applyFilter);
  document.getElementById('searchbtn').addEventListener('click', runPublicArea);
  document.getElementById('search').addEventListener('keydown', function(e){ if(e.key==='Enter') runPublicArea(); });

  initMap();
  fetch(API).then(function(r){ return r.json(); }).then(function(data){
    all = Array.isArray(data)?data:[];
    render(all); renderMarkers(all);
  }).catch(function(){
    document.getElementById('grid').innerHTML = '<div class="empty">Nepodařilo se načíst místa. Zkuste to prosím později.</div>';
  });
  fetch(API+'/existing-laundromats').then(function(r){ return r.json(); })
    .then(function(list){ renderExisting(Array.isArray(list)?list:[]); }).catch(function(){});
})();
</script>
</body>
</html>

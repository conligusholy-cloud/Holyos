<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf1cf"/>
      <stop offset="0.35" stop-color="#e6c877"/>
      <stop offset="0.62" stop-color="#c9a24b"/>
      <stop offset="1" stop-color="#8f6f2e"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.32" cy="0.22" r="0.95">
      <stop offset="0" stop-color="#232329"/>
      <stop offset="0.55" stop-color="#0f0f12"/>
      <stop offset="1" stop-color="#070708"/>
    </radialGradient>
    <radialGradient id="gloss" cx="0.5" cy="0.02" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- luxusní podklad -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#gloss)"/>
  <!-- jemný zlatý rám -->
  <rect x="26" y="26" width="460" height="460" rx="94" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.55"/>

  <!-- compounding „C" — rostoucí zlatý oblouk -->
  <path d="M356 170a134 134 0 1 0 0 172" fill="none" stroke="url(#gold)" stroke-width="38" stroke-linecap="round"/>
  <!-- stupňující se tečky 1 → 2 → 4 (skládání hodnoty) -->
  <circle cx="256" cy="256" r="23" fill="url(#gold)" opacity="0.92"/>
  <circle cx="366" cy="150" r="12" fill="url(#gold)"/>
  <circle cx="398" cy="360" r="19" fill="url(#gold)"/>
</svg>

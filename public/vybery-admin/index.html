<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Výběry — správa</title>
<style>
  :root{ --bg:#0b0b0d; --surface:#15151a; --surface2:#1c1c22; --line:#2a2a31; --text:#f2f2f4; --muted:#a8a8b3; --muted2:#77777f; --gold:#c9a24b; --gold2:#e6cf92; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
  .wrap{max-width:1150px;margin:0 auto;padding:22px 18px 60px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241c05;display:flex;align-items:center;justify-content:center;font-weight:900}
  .brand h1{font-size:16px;margin:0;font-weight:800}
  .brand small{display:block;color:var(--muted2);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
  input,select{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--text);font-size:14px;font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--gold)}
  .btn{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#241c05;border:none;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:800;cursor:pointer}
  .btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted2);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:hover td{background:rgba(255,255,255,.02)}
  .amt{font-weight:800}
  .muted{color:var(--muted2)}
  .pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5;border-radius:9px;padding:10px 12px;font-size:13px;margin-top:10px}
  .empty{color:var(--muted2);text-align:center;padding:26px}
  .login{max-width:380px;margin:8vh auto 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo">B</div><div><h1>Výběry — správa</h1><small>Best Series · admin</small></div></div>

  <div id="login-view" class="login">
    <div class="card">
      <h2 style="margin:0 0 6px;font-size:18px">Přihlášení</h2>
      <p class="muted" style="font-size:13px;margin:0 0 14px">Zadejte administrátorské heslo.</p>
      <input id="pw" type="password" placeholder="Heslo" style="width:100%" onkeydown="if(event.key==='Enter')doLogin()">
      <div style="margin-top:14px"><button class="btn" style="width:100%" id="login-btn" onclick="doLogin()">Přihlásit se</button></div>
      <div id="login-err" class="err" style="display:none"></div>
    </div>
  </div>

  <div id="admin-view" style="display:none">
    <div class="toolbar">
      <input id="f-search" placeholder="Hledat e-mail / číslo výběru…" style="flex:1;min-width:200px" oninput="debounced()">
      <select id="f-status" onchange="loadList()"><option value="">Všechny stavy</option></select>
      <button class="btn ghost" onclick="loadList()">↻ Obnovit</button>
      <button class="btn ghost" onclick="logout()">Odhlásit</button>
    </div>
    <div class="card" style="padding:0;overflow:auto">
      <table>
        <thead><tr><th>#</th><th>E-mail</th><th>Částka</th><th>Číslo výběru</th><th>Poznámka</th><th>Zadáno</th><th style="min-width:210px">Stav</th></tr></thead>
        <tbody id="rows"><tr><td colspan="7" class="empty">Načítám…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  var API='/api/vybery'; var TKEY='vybery_admin_token';
  var STATUS_LABELS={}, STATUS_ORDER=[];
  function tok(){ try{ return localStorage.getItem(TKEY)||''; }catch(e){ return ''; } }
  function setTok(t){ try{ if(t) localStorage.setItem(TKEY,t); else localStorage.removeItem(TKEY); }catch(e){} }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function money(n){ if(n==null||n==='') return '—'; try{ return Number(n).toLocaleString('cs-CZ')+' Kč'; }catch(e){ return n+''; } }
  function fmtDate(s){ try{ return new Date(s).toLocaleString('cs-CZ'); }catch(e){ return s; } }
  function pillColor(st){ if(st==='vyplaceno') return 'background:rgba(34,197,94,.16);color:#8ff0b5'; if(st==='zamitnuto') return 'background:rgba(239,68,68,.16);color:#fca5a5'; if(st==='novy') return 'background:rgba(255,255,255,.08);color:#c9c9d2'; return 'background:rgba(201,162,75,.16);color:#e6cf92'; }

  async function doLogin(){
    var pw=(document.getElementById('pw').value||''); var err=document.getElementById('login-err'); var btn=document.getElementById('login-btn');
    err.style.display='none'; if(!pw){ err.style.display=''; err.textContent='Zadejte heslo.'; return; }
    btn.disabled=true; btn.textContent='Přihlašuji…';
    try{
      var r=await fetch(API+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
      var j=await r.json().catch(function(){return{};});
      if(!r.ok||!j.token){ err.style.display=''; err.textContent=j.error||'Přihlášení selhalo.'; return; }
      setTok(j.token); showAdmin();
    }catch(e){ err.style.display=''; err.textContent='Spojení selhalo.'; }
    finally{ btn.disabled=false; btn.textContent='Přihlásit se'; }
  }
  function logout(){ setTok(''); document.getElementById('admin-view').style.display='none'; document.getElementById('login-view').style.display=''; }

  function fillStatusFilter(){
    var sel=document.getElementById('f-status');
    var cur=sel.value;
    sel.innerHTML='<option value="">Všechny stavy</option>'+STATUS_ORDER.map(function(s){return '<option value="'+s+'">'+esc(STATUS_LABELS[s]||s)+'</option>';}).join('');
    sel.value=cur;
  }
  function statusSelect(id,cur){
    return '<select onchange="setStatus('+id+',this.value)" style="width:100%">'+STATUS_ORDER.map(function(s){return '<option value="'+s+'"'+(s===cur?' selected':'')+'>'+esc(STATUS_LABELS[s]||s)+'</option>';}).join('')+'</select>';
  }

  async function loadList(){
    var tb=document.getElementById('rows');
    var qs='token='+encodeURIComponent(tok());
    var st=(document.getElementById('f-status')||{}).value||''; if(st) qs+='&status='+encodeURIComponent(st);
    var s=(document.getElementById('f-search')||{}).value||''; if(s) qs+='&search='+encodeURIComponent(s.trim());
    try{
      var r=await fetch(API+'/admin/list?'+qs);
      if(r.status===401){ logout(); return; }
      var j=await r.json().catch(function(){return{};});
      if(!r.ok){ tb.innerHTML='<tr><td colspan="7" class="empty">'+esc(j.error||'Chyba')+'</td></tr>'; return; }
      STATUS_LABELS=j.statuses||{}; STATUS_ORDER=j.statusOrder||[]; fillStatusFilter();
      var rq=j.requests||[];
      if(!rq.length){ tb.innerHTML='<tr><td colspan="7" class="empty">Žádné požadavky.</td></tr>'; return; }
      tb.innerHTML=rq.map(function(x){
        return '<tr><td class="muted">'+x.id+'</td><td>'+esc(x.email)+'</td><td class="amt">'+money(x.amount)+'</td>'+
          '<td>'+esc(x.withdrawal_number||'—')+'</td><td class="muted" style="max-width:220px">'+esc(x.note||'—')+'</td>'+
          '<td class="muted" style="white-space:nowrap">'+fmtDate(x.created_at)+'</td>'+
          '<td><span class="pill" style="'+pillColor(x.status)+';display:inline-block;margin-bottom:6px">'+esc(STATUS_LABELS[x.status]||x.status)+'</span>'+statusSelect(x.id,x.status)+'</td></tr>';
      }).join('');
    }catch(e){ tb.innerHTML='<tr><td colspan="7" class="empty">Spojení selhalo.</td></tr>'; }
  }

  async function setStatus(id,status){
    try{
      var r=await fetch(API+'/admin/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok(),status:status})});
      if(r.status===401){ logout(); return; }
      var j=await r.json().catch(function(){return{};});
      if(!r.ok){ alert(j.error||'Změna selhala.'); return; }
      loadList();
    }catch(e){ alert('Spojení selhalo.'); }
  }

  var _t=null; function debounced(){ clearTimeout(_t); _t=setTimeout(loadList,350); }
  function showAdmin(){ document.getElementById('login-view').style.display='none'; document.getElementById('admin-view').style.display=''; loadList(); }
  if(tok()) showAdmin();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ekonomika prádlomatu | HolyOS</title>
  <link rel="icon" type="image/svg+xml" href="/logo-holyos-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f10;
      --surface: #18181b;
      --surface2: #232327;
      --border: #2a2a2e;
      --text: #f5f5f7;
      --text2: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
    }
    .share-header {
      background: linear-gradient(135deg, #6c5ce7 0%, #3b82f6 100%);
      padding: 28px 24px 22px;
      color: #fff;
    }
    .share-header-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .share-icon { font-size: 36px; }
    .share-title h1 { font-size: 22px; font-weight: 700; }
    .share-title p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
    .share-recipient { margin-left: auto; text-align: right; font-size: 12px; opacity: 0.9; }
    .share-recipient strong { display: block; font-size: 14px; font-weight: 600; }

    .share-toolbar {
      max-width: 1100px;
      margin: 18px auto 0;
      padding: 12px 24px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .share-toolbar .left-info { font-size: 12px; color: var(--text2); flex: 1; min-width: 240px; }
    .share-toolbar .left-info strong { color: #eab308; }

    /* Language switcher (flag buttons) — v hlavičce vpravo */
    .lang-switcher { display: inline-flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .lang-switcher .lang-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      color: #fff;
      transition: all 0.12s;
      font-family: inherit;
    }
    .lang-switcher .lang-btn:hover { background: rgba(255,255,255,0.18); }
    .lang-switcher .lang-btn.active { background: rgba(255,255,255,0.30); border-color: rgba(255,255,255,0.55); box-shadow: 0 0 0 1px rgba(255,255,255,0.2); }
    .lang-switcher .lang-btn .lang-code { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; opacity: 0.85; text-transform: uppercase; }
    @media (max-width: 640px) {
      .lang-switcher { width: 100%; justify-content: flex-start; margin-top: 4px; }
    }
    @media print {
      .lang-switcher { display: none !important; }
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: var(--surface);
      color: var(--text);
      transition: all 0.15s;
      font-family: inherit;
    }
    .btn:hover { background: var(--surface2); }
    .btn-primary { background: #6c5ce7; border-color: #6c5ce7; color: #fff; }
    .btn-primary:hover { background: #5a4bdb; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    .share-content { max-width: 1100px; margin: 0 auto; padding: 14px 24px 60px; }

    .loading, .error-box {
      max-width: 480px;
      margin: 60px auto;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }
    .loading .spinner {
      width: 32px; height: 32px; margin: 0 auto 12px;
      border: 3px solid var(--border);
      border-top-color: #6c5ce7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box { border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.08); }
    .error-box h2 { color: #ef4444; margin-bottom: 8px; }
    .error-box p { color: var(--text2); font-size: 13px; line-height: 1.5; }

    .models-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 10px;
      margin-bottom: 10px;
    }
    .model-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      transition: all 0.12s;
    }
    .model-chip:hover { border-color: #6c5ce7; }
    .model-chip strong { display: block; font-size: 13px; margin-bottom: 2px; }
    .model-chip span { color: var(--text2); font-size: 11px; }

    .save-modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .save-modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 420px;
      max-width: 95vw;
    }
    .save-modal h3 { font-size: 16px; margin-bottom: 14px; }
    .save-modal input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
    }
    .save-modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      z-index: 10000;
      animation: slidein 0.2s ease-out;
    }
    .toast.ok { border-color: #10b981; color: #10b981; }
    .toast.err { border-color: #ef4444; color: #ef4444; }
    @keyframes slidein { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* ─── Mobile responsive ─────────────────────────────────────── */
    @media (max-width: 640px) {
      .share-header { padding: 20px 16px 16px; }
      .share-header-inner { flex-direction: column; align-items: flex-start; gap: 8px; }
      .share-icon { font-size: 30px; }
      .share-title h1 { font-size: 18px; }
      .share-title p { font-size: 12px; }
      .share-recipient { margin-left: 0; text-align: left; }
      .share-recipient strong { font-size: 13px; }

      .share-toolbar { margin: 12px 12px 0; padding: 10px 12px; flex-direction: column; align-items: stretch; gap: 8px; }
      .share-toolbar .left-info { font-size: 11px; line-height: 1.4; min-width: 0; }
      .share-toolbar .btn { width: 100%; justify-content: center; }

      .share-content { padding: 12px 12px 60px; }

      /* Force tool root grid to single column on narrow screens */
      .pe-toolbar { flex-wrap: wrap; gap: 8px !important; padding: 10px 12px !important; }
      .pe-toolbar .btn { flex: 1 1 auto; }
      .pe-results { grid-template-columns: repeat(2, 1fr) !important; gap: 8px !important; padding: 12px !important; }
      .pe-result-card { padding: 10px !important; }
      .pe-result-card .pe-rc-value { font-size: 17px !important; }
      .pe-result-card .pe-rc-label { font-size: 9px !important; }
      .pe-result-card .pe-rc-sub { font-size: 10px !important; }

      .pe-section-head { padding: 10px 12px !important; }
      .pe-section-head h3 { font-size: 12px !important; }
      .pe-section-body { padding: 10px 12px !important; }

      .pe-row { grid-template-columns: 1fr 90px 50px !important; gap: 6px !important; font-size: 12px !important; }
      .pe-row.lockable { grid-template-columns: 1fr 90px 36px 30px !important; }
      .pe-input, .pe-readonly { font-size: 12px !important; padding: 5px 8px !important; }
      .pe-row .pe-unit { font-size: 10px !important; }
      .pe-lock-btn { width: 26px !important; height: 26px !important; font-size: 12px !important; }

      .pe-bar-wrap { padding: 12px !important; }
      .pe-bar-row { grid-template-columns: 100px 1fr 90px !important; font-size: 11px !important; }

      .models-strip { gap: 6px; padding-bottom: 8px; }
      .model-chip { padding: 6px 10px; font-size: 11px; }
      .model-chip strong { font-size: 12px; }
    }

    /* ─── Print → PDF ───────────────────────────────────────────── */
    @media print {
      @page { size: A4; margin: 12mm; }
      body { background: #fff !important; color: #111 !important; font-size: 11pt; }

      /* Skrýt UI chrome, který v PDF nepotřebujeme */
      .share-header { background: none !important; color: #111 !important; padding: 0 0 16px; border-bottom: 2px solid #6c5ce7; margin-bottom: 16px; }
      .share-icon { display: none; }
      .share-recipient { color: #111; }
      .share-toolbar, #models-strip-wrap, #modal-root, #toast-root, .pe-toolbar, .pe-lock-btn { display: none !important; }

      .share-content { padding: 0 !important; max-width: none; }
      #tool-root, .pe-section, .pe-section-body, .pe-bar-wrap { background: #fff !important; color: #111 !important; border-color: #bbb !important; }
      .pe-section { break-inside: avoid; box-shadow: none; margin-bottom: 8mm; }
      /* Forsně rozbal všechny sbalené sekce pro tisk */
      .pe-section.pe-collapsed .pe-section-body { display: grid !important; }
      .pe-section-head { background: #f4f4f7 !important; color: #111 !important; cursor: default; }
      .pe-section-head h3 { color: #111 !important; }
      .pe-section-head .pe-h-tag { color: #666 !important; }

      /* Inputy/readonly v tisku → jednoduchá border-bottom místo barevných pozadí */
      .pe-row { color: #111 !important; }
      .pe-row label { color: #111 !important; }
      .pe-row .pe-unit { color: #666 !important; }
      .pe-input { background: #fff8d6 !important; color: #111 !important; border-color: #d97706 !important; box-shadow: none !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .pe-readonly { background: #f4f4f7 !important; color: #111 !important; border-color: #bbb !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .pe-readonly.emp { background: #fff8d6 !important; color: #b45309 !important; border-color: #d97706 !important; }
      .pe-readonly.pe-locked-display { background: #f4f4f7 !important; color: #111 !important; border-color: #bbb !important; }

      /* Výsledkové karty — vlož jako 4-sloupcový blok hned pod hlavičkou */
      .pe-results { grid-template-columns: repeat(4, 1fr) !important; gap: 8px !important; padding: 0 !important; background: none !important; border: none !important; margin-bottom: 8mm; break-inside: avoid; }
      .pe-result-card { background: #fff !important; color: #111 !important; border: 1px solid #6c5ce7 !important; padding: 10px !important; }
      .pe-result-card .pe-rc-value { color: #6c5ce7 !important; }
      .pe-result-card.neg .pe-rc-value { color: #b91c1c !important; }
      .pe-result-card.ok .pe-rc-value { color: #047857 !important; }
      .pe-result-card .pe-rc-label, .pe-result-card .pe-rc-sub { color: #555 !important; }

      /* Cost-structure bar chart */
      .pe-bar-wrap { border: 1px solid #bbb !important; }
      .pe-bar-row .pe-bar { background: #eee !important; border: 1px solid #ddd; }
      .pe-bar-row .pe-bar > span { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .pe-info { background: #f4f4f7 !important; color: #555 !important; border-color: #bbb !important; }

      /* 10letá projekce — chart + mini cards */
      .pe-projection-chart-wrap { border: 1px solid #bbb !important; background: #fff !important; }
      .pe-svg text { fill: #111 !important; }
      .pe-svg text[fill="#9ca3af"] { fill: #555 !important; }
      .pe-svg text[fill="#e5e7eb"] { fill: #111 !important; }
      .pe-svg line[stroke="rgba(255,255,255,0.06)"] { stroke: #eee !important; }
      .pe-svg line[stroke="rgba(255,255,255,0.22)"] { stroke: #999 !important; }
      .pe-mini-card { background: #fff !important; color: #111 !important; border-color: #bbb !important; }
      .pe-mini-card .pe-mc-label { color: #555 !important; }
      .pe-mini-card .pe-mc-value { color: #6c5ce7 !important; }
      .pe-mini-card.ok .pe-mc-value { color: #047857 !important; }
      .pe-mini-card.neg .pe-mc-value { color: #b91c1c !important; }
      .pe-year-cell .pe-year-label { color: #555 !important; }
    }

    /* ─── Compounder brand mode (compounder.world) ──────────────────
       Aktivuje se přidáním třídy .compounder na <body> (JS dle hostu).
       Skryje modrou HolyOS lištu a nasadí Compounder Portal brand. */
    body.compounder { --bg: #0a0a0b; --surface: #141417; --surface2: #1b1b1f; --border: rgba(255,255,255,.08); --text: #f4f4f2; --text2: #9b9ba3; background: var(--bg); font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    body.compounder h1, body.compounder h2, body.compounder h3 { font-family: 'Space Grotesk', 'Inter', sans-serif; letter-spacing: -.01em; }
    body.compounder .share-header { display: none; }
    body.compounder .btn-primary { background: linear-gradient(135deg, #f6e6ad 0%, #cda454 42%, #9a7a34 100%); border-color: #cda454; color: #1a1408; }
    body.compounder .btn-primary:hover { filter: brightness(1.05); background: linear-gradient(135deg, #f6e6ad 0%, #cda454 42%, #9a7a34 100%); }
    body.compounder .loading .spinner { border-top-color: #c9a24b; }
    body.compounder .model-chip:hover { border-color: #c9a24b; }
    body.compounder .share-toolbar .left-info strong { color: #cda454; }

    .cmp-topbar { position: sticky; top: 0; z-index: 30; background: rgba(10,10,11,.85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,.08); }
    .cmp-topin { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 24px; max-width: 1100px; margin: 0 auto; }
    .cmp-topbrand { display: inline-flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 700; letter-spacing: .2em; font-size: 16px; color: #f4f4f2; text-decoration: none; }
    .cmp-topbrand:hover .cmp-arrow { transform: translateX(-3px); }
    .cmp-arrow { display: inline-flex; color: #9b9ba3; transition: transform .2s; font-size: 18px; }
    .cmp-wordmark b { background: linear-gradient(135deg, #f6e6ad 0%, #cda454 42%, #9a7a34 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .cmp-tag { font-size: 11px; letter-spacing: .15em; color: #9b9ba3; text-transform: uppercase; font-family: 'Inter', sans-serif; font-weight: 600; }
    .cmp-topright { display: flex; align-items: center; gap: 12px; }
    /* Skrýt vývojářské "Stáhnout model (JSON)" na zákaznické Compounder stránce */
    body.compounder .pe-btn-json { display: none !important; }
    /* Jazyky jako rozklikávací dropdown (stejně jako Compounder Portal) */
    .cmp-lang-select { background: transparent; color: #9b9ba3; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-family: inherit; cursor: pointer; max-width: 200px; }
    .cmp-lang-select:hover { color: #f4f4f2; border-color: rgba(201,162,75,.4); }
    .cmp-lang-select:focus { outline: none; border-color: #cda454; }
    .cmp-lang-select option { background: #141417; color: #f4f4f2; }
    .cmp-pagetitle { font-size: 24px; font-weight: 700; margin: 6px 0 16px; }
    body.compounder .lang-switcher .lang-btn { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); color: #f4f4f2; }
    body.compounder .lang-switcher .lang-btn:hover { background: rgba(255,255,255,.12); }
    body.compounder .lang-switcher .lang-btn.active { background: rgba(201,162,75,.18); border-color: rgba(201,162,75,.55); box-shadow: 0 0 0 1px rgba(201,162,75,.25); }
    @media (max-width: 640px) {
      .cmp-topin { padding: 12px 16px; }
      .cmp-topbrand { font-size: 14px; }
      .cmp-pagetitle { font-size: 19px; }
    }
    @media print { .cmp-topbar { display: none !important; } }
  </style>
  <script src="/modules/prodejni-objednavky/pradlomat-i18n.js"></script>
  <script src="/modules/prodejni-objednavky/pradlomat-economy.js"></script>
  <script src="/modules/prodejni-objednavky/pradlomat-balicek.js"></script>
</head>
<body>
  <!-- Compounder Portal brand bar — zobrazí se jen na compounder.world (JS). -->
  <header class="cmp-topbar" id="cmp-topbar" style="display:none;">
    <div class="cmp-topin">
      <a href="/portal" class="cmp-topbrand" id="cmp-topbrand" title="Compounder Portal">
        <span class="cmp-arrow">←</span>
        <span class="cmp-wordmark">COMP<b>OU</b>NDER</span>
        <span class="cmp-tag">Portal</span>
      </a>
      <div class="cmp-topright" id="cmp-topright"></div>
    </div>
  </header>

  <header class="share-header">
    <div class="share-header-inner">
      <div class="share-icon">📊</div>
      <div class="share-title">
        <h1 id="share-title">Ekonomika prádlomatu</h1>
        <p id="share-subtitle">Interaktivní model návratnosti</p>
      </div>
      <div class="share-recipient" id="share-recipient" style="display:none;">
        <strong id="share-recipient-name"></strong>
        <span id="share-recipient-company"></span>
      </div>
      <!-- Vlajkový language switcher — naplňuje se v JS podle data.languages -->
      <div class="lang-switcher" id="lang-switcher" style="display:none;"></div>
    </div>
  </header>

  <div class="share-toolbar" id="share-toolbar" style="display:none;">
    <div class="left-info" id="share-toolbar-info">
      💡 Žlutá pole můžete <strong>libovolně měnit</strong> a zkoušet různé scénáře. Ostatní hodnoty se přepočítají automaticky.
    </div>
    <span class="sh-cur" id="sh-cur" style="display:none;align-items:center;gap:5px;margin-right:6px;"></span>
    <button class="btn btn-sm" id="btn-reset" onclick="resetToDefaults()">↺ Výchozí</button>
    <button class="btn btn-sm" id="btn-pdf" onclick="downloadPdf()">📄 Stáhnout PDF</button>
    <button class="btn btn-primary btn-sm" id="btn-save" onclick="openSaveModal()">💾 Uložit můj model</button>
  </div>

  <main class="share-content">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <div style="font-size:13px;color:var(--text2);" id="loading-text">Načítám pomůcku…</div>
    </div>

    <div id="error" class="error-box" style="display:none;">
      <h2 id="error-title">Odkaz nelze otevřít</h2>
      <p id="error-msg">Zkuste obnovit stránku nebo kontaktujte odesílatele.</p>
    </div>

    <div id="content" style="display:none;">
      <h1 class="cmp-pagetitle" id="cmp-pagetitle" style="display:none;"></h1>
      <div id="models-strip-wrap" style="display:none;">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--text2);margin-bottom:6px;" id="models-strip-title">Vaše uložené modely</div>
        <div class="models-strip" id="models-strip"></div>
      </div>
      <div id="tool-root"></div>
    </div>
  </main>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script>
    (function () {
      'use strict';
      var pathParts = window.location.pathname.split('/').filter(Boolean);
      // expected: ['share', 'tools', '<tool-slug>', '<token>']
      var TOOL = pathParts[2] || '';
      var TOKEN = pathParts[3] || '';
      var SHARE_DATA = null;
      var EDIT_DEBOUNCE = null;

      // Vrátí API objekt správné pomůcky podle slugu (každá má vlastní global).
      function toolApi() {
        if (TOOL === 'pradlomat-economy') return window.PradlomatTool || null;
        if (TOOL === 'pradlomat-balicek') return window.PradlomatBalicekTool || null;
        return null;
      }

      // Compounder brand mode — když je share stránka otevřená na compounder.world,
      // skryjeme modrou HolyOS lištu a nasadíme Compounder Portal brand + tlačítko zpět.
      var COMPOUNDER_HOSTS = ['compounder.world', 'www.compounder.world'];
      var IS_COMPOUNDER = COMPOUNDER_HOSTS.indexOf((location.hostname || '').toLowerCase()) >= 0;

      function setupCompounderBrand() {
        if (!IS_COMPOUNDER) return;
        document.body.classList.add('compounder');
        var bar = document.getElementById('cmp-topbar');
        if (bar) bar.style.display = '';
        // Přesuň jazykový přepínač do brand lišty (renderuje se podle data.languages).
        var sw = document.getElementById('lang-switcher');
        var right = document.getElementById('cmp-topright');
        if (sw && right) right.appendChild(sw);
      }

      // ─── i18n helpers ─────────────────────────────────────────────
      // Vlajka pro každý jazyk + lokalizovaný název (pro tooltip)
      var LANG_META = {
        cs: { flag: '🇨🇿', label: 'Čeština' },
        en: { flag: '🇬🇧', label: 'English' },
        de: { flag: '🇩🇪', label: 'Deutsch' },
        fr: { flag: '🇫🇷', label: 'Français' },
        bg: { flag: '🇧🇬', label: 'Български' },
        da: { flag: '🇩🇰', label: 'Dansk' },
        el: { flag: '🇬🇷', label: 'Ελληνικά' },
        es: { flag: '🇪🇸', label: 'Español' },
        et: { flag: '🇪🇪', label: 'Eesti' },
        fi: { flag: '🇫🇮', label: 'Suomi' },
        ga: { flag: '🇮🇪', label: 'Gaeilge' },
        hr: { flag: '🇭🇷', label: 'Hrvatski' },
        hu: { flag: '🇭🇺', label: 'Magyar' },
        it: { flag: '🇮🇹', label: 'Italiano' },
        lt: { flag: '🇱🇹', label: 'Lietuvių' },
        lv: { flag: '🇱🇻', label: 'Latviešu' },
        mt: { flag: '🇲🇹', label: 'Malti' },
        nl: { flag: '🇳🇱', label: 'Nederlands' },
        pl: { flag: '🇵🇱', label: 'Polski' },
        pt: { flag: '🇵🇹', label: 'Português' },
        ro: { flag: '🇷🇴', label: 'Română' },
        sk: { flag: '🇸🇰', label: 'Slovenčina' },
        sl: { flag: '🇸🇮', label: 'Slovenščina' },
        sv: { flag: '🇸🇪', label: 'Svenska' }
      };

      function tt(s) {
        return (window.PradlomatI18n && typeof window.PradlomatI18n.t === 'function')
          ? window.PradlomatI18n.t(s) : s;
      }

      // Aplikuje překlady na statické texty mimo PradlomatTool (header, toolbar, modal-y).
      // Volá se po setLang().
      function applyChromeTranslations() {
        var data = SHARE_DATA || {};
        var title = (data.tool && data.tool.title) || 'Obchodní pomůcka';
        var translatedTitle = tt(title);
        document.getElementById('share-title').textContent = translatedTitle;
        document.title = IS_COMPOUNDER ? (translatedTitle + ' | Compounder') : (translatedTitle + ' | HolyOS');
        // V Compounder módu ukážeme název jako nadpis stránky (modrá lišta je skrytá).
        if (IS_COMPOUNDER) {
          var pt = document.getElementById('cmp-pagetitle');
          if (pt) { pt.textContent = translatedTitle; pt.style.display = ''; }
        }
        if (data.tool && data.tool.description) {
          document.getElementById('share-subtitle').textContent = tt(data.tool.description);
        } else {
          document.getElementById('share-subtitle').textContent = tt('Interaktivní model návratnosti');
        }

        var loadingTxt = document.getElementById('loading-text');
        if (loadingTxt) loadingTxt.textContent = tt('Načítám pomůcku…');

        var errTitle = document.getElementById('error-title');
        if (errTitle) errTitle.textContent = tt('Odkaz nelze otevřít');

        var info = document.getElementById('share-toolbar-info');
        if (info) {
          // Plný překlad celé věty (klíč obsahuje <strong>) — držíme HTML v DOMu.
          info.innerHTML = '💡 ' + tt('Žlutá pole můžete libovolně měnit a zkoušet různé scénáře. Ostatní hodnoty se přepočítají automaticky.')
            .replace(tt('libovolně měnit'), '<strong>' + tt('libovolně měnit') + '</strong>');
        }
        setText('btn-reset', tt('↺ Výchozí'));
        setText('btn-pdf', tt('📄 Stáhnout PDF'));
        setText('btn-save', tt('💾 Uložit můj model'));
        setText('models-strip-title', tt('Vaše uložené modely'));
      }

      function setText(id, text) {
        var el = document.getElementById(id);
        if (el) el.textContent = text;
      }

      // Vykreslí language switcher na základě data.languages a aktivního jazyka.
      function renderLanguageSwitcher(languages, active) {
        var wrap = document.getElementById('lang-switcher');
        if (!wrap) return;
        var codes = (Array.isArray(languages) && languages.length) ? languages : ['cs'];
        if (codes.length < 2) { wrap.style.display = 'none'; return; }  // jen jeden jazyk → switcher nepotřebujeme
        wrap.style.display = '';

        // Compounder mód: rozklikávací dropdown jako v Portalu (24 jazyků = moc dlaždic).
        if (IS_COMPOUNDER) {
          var opts = '';
          for (var k = 0; k < codes.length; k++) {
            var ck = codes[k];
            var mk = LANG_META[ck] || { flag: '🏳️', label: ck };
            opts += '<option value="' + ck + '"' + (ck === active ? ' selected' : '') + '>' +
              mk.flag + '  ' + mk.label + '</option>';
          }
          wrap.innerHTML = '<select class="cmp-lang-select" id="cmp-lang-select" aria-label="Language">' + opts + '</select>';
          var sel = document.getElementById('cmp-lang-select');
          if (sel) sel.addEventListener('change', function () { switchLanguage(this.value); });
          return;
        }

        var html = '';
        for (var i = 0; i < codes.length; i++) {
          var c = codes[i];
          var meta = LANG_META[c] || { flag: '🏳️', label: c };
          var isActive = c === active;
          html += '<button type="button" class="lang-btn' + (isActive ? ' active' : '') +
            '" data-code="' + c + '" title="' + meta.label + '" aria-label="' + meta.label + '">' +
            '<span>' + meta.flag + '</span>' +
            '<span class="lang-code">' + c.toUpperCase() + '</span>' +
            '</button>';
        }
        wrap.innerHTML = html;
        var btns = wrap.querySelectorAll('.lang-btn');
        for (var j = 0; j < btns.length; j++) {
          btns[j].addEventListener('click', function (e) {
            var code = this.getAttribute('data-code');
            switchLanguage(code);
          });
        }
      }

      // Přepne aktivní jazyk: setLang v helperu, re-mount tool, re-render chrome.
      function switchLanguage(code) {
        if (!window.PradlomatI18n) return;
        window.PradlomatI18n.setLang(code);
        try { localStorage.setItem('pradlomat_lang_' + TOKEN, code); } catch (e) { /* private mode */ }
        if (SHARE_DATA && SHARE_DATA.languages) {
          renderLanguageSwitcher(SHARE_DATA.languages, code);
        }
        applyChromeTranslations();
        // Re-render uložených modelů (formátování data podle locale)
        if (SHARE_DATA && SHARE_DATA.models) renderModelsStrip(SHARE_DATA.models);
        // Re-mount tool — vyrenderuje sekce s novými stringy (měna se resetuje na €)
        if (SHARE_DATA && toolApi()) mountTool(SHARE_DATA);
        SH_CUR = 'EUR';
        shRenderCur();
        logEvent('viewed', { language: code });
      }

      // Zvolí výchozí jazyk: localStorage > první v languages > 'cs'.
      function pickInitialLanguage(languages) {
        var saved = null;
        try { saved = localStorage.getItem('pradlomat_lang_' + TOKEN); } catch (e) { /* noop */ }
        if (saved && languages && languages.indexOf(saved) >= 0) return saved;
        if (languages && languages.length) return languages[0];
        return 'cs';
      }

      function showError(msg) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'none';
        document.getElementById('error').style.display = '';
        document.getElementById('error-msg').textContent = msg || tt('Zkuste obnovit stránku nebo kontaktujte odesílatele.');
      }

      function toast(msg, cls) {
        var t = document.createElement('div');
        t.className = 'toast ' + (cls || '');
        t.textContent = msg;
        document.getElementById('toast-root').appendChild(t);
        setTimeout(function () { t.remove(); }, 3000);
      }

      function logEvent(type, payload) {
        // beacon-style: nečeká na response, neblokuje UI
        fetch('/api/tools/share/' + encodeURIComponent(TOKEN) + '/event', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ event_type: type, payload: payload || null }),
          keepalive: true,
        }).catch(function () { /* noop */ });
      }

      // ─── Compounder analytika (napojení na leada) ─────────────────────
      // Zapisuje do „cesty uživatele" leada (server tag na lead_id přes recipient).
      var ECO_START = Date.now();
      var ECO_ENDED = false;
      var ECO_TIMERS = {};
      function ecoTrack(event, props) {
        try {
          var body = JSON.stringify({ event: event, props: props || {} });
          var url = '/api/tools/share/' + encodeURIComponent(TOKEN) + '/track';
          if (navigator.sendBeacon) navigator.sendBeacon(url, new Blob([body], { type: 'application/json' }));
          else fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true }).catch(function () {});
        } catch (e) { /* noop */ }
      }
      function ecoSnapshot() {
        try { var API = toolApi(); return (API && API.getState) ? API.getState() : null; } catch (e) { return null; }
      }
      function ecoEndVisit() {
        if (ECO_ENDED) return; ECO_ENDED = true;
        ecoTrack('eco_visit_end', { ms: Date.now() - ECO_START, values: ecoSnapshot() });
      }
      function ecoInit() {
        // Každá změna žlutého pole → eco_edit (co, na jakou hodnotu), debounce per pole.
        document.addEventListener('input', function (e) {
          var el = e.target;
          if (!el || !el.classList || !el.classList.contains('pe-input')) return;
          var key = el.getAttribute('data-key') || '';
          var row = el.closest ? el.closest('.pe-row') : null;
          var lab = row ? row.querySelector('label') : null;
          var label = lab ? (lab.textContent || '').trim() : key;
          var value = el.value;
          clearTimeout(ECO_TIMERS[key]);
          ECO_TIMERS[key] = setTimeout(function () { ecoTrack('eco_edit', { key: key, label: label, value: value }); }, 1000);
        }, true);
        window.addEventListener('pagehide', ecoEndVisit);
        document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') ecoEndVisit(); });
      }

      // ─── Přepínač měny (Kč/€/$/£) — přepočítá celý model kurzem ČNB ──────────
      var SH_CUR = 'EUR';
      var SH_RATES = { CZK: 1, EUR: 25, USD: 23, GBP: 29 }; // CZK za 1 jednotku
      var SH_SYM = { CZK: 'Kč', EUR: '€', USD: '$', GBP: '£' };
      function shRenderCur() {
        var wrap = document.getElementById('sh-cur'); if (!wrap) return;
        var API = toolApi();
        if (!API || typeof API.setCurrency !== 'function') { wrap.style.display = 'none'; return; }
        wrap.style.display = 'inline-flex';
        var html = '<span style="font-size:12px;color:var(--text2);margin-right:2px">' + tt('Měna') + ':</span>';
        ['CZK', 'EUR', 'USD', 'GBP'].forEach(function (c) {
          var on = c === SH_CUR;
          html += '<button type="button" class="btn btn-sm" onclick="shSetCur(\'' + c + '\')" style="padding:6px 11px;' + (on ? 'background:#c9a24b;border-color:#c9a24b;color:#241c05;font-weight:700;' : '') + '">' + SH_SYM[c] + '</button>';
        });
        wrap.innerHTML = html;
      }
      window.shSetCur = function (c) {
        if (!SH_SYM[c] || c === SH_CUR) return;
        var API = toolApi(); if (!API || typeof API.setCurrency !== 'function') return;
        var ratio = (SH_RATES[SH_CUR] || 1) / (SH_RATES[c] || 1);
        API.setCurrency(c, SH_SYM[c], ratio);
        SH_CUR = c;
        shRenderCur();
      };
      function shLoadRates() {
        fetch('/api/compounder/fx-rates').then(function (r) { return r.json(); }).then(function (j) {
          if (j && j.rates) SH_RATES = Object.assign({ CZK: 1 }, j.rates);
        }).catch(function () {});
      }

      function load() {
        if (!TOKEN || TOKEN.length < 16) {
          showError(tt('Odkaz je neplatný. Zkontrolujte, prosím, URL.'));
          return;
        }
        fetch('/api/tools/share/' + encodeURIComponent(TOKEN), { headers: { 'Accept': 'application/json' } })
          .then(function (r) {
            if (!r.ok) {
              return r.json().then(function (j) { throw new Error(j.error || 'Chyba ' + r.status); });
            }
            return r.json();
          })
          .then(function (data) {
            SHARE_DATA = data;
            ecoTrack('eco_open', {});

            // i18n bootstrap — pick initial language, nastav v helperu, vyrendruj switcher.
            var langs = (Array.isArray(data.languages) && data.languages.length) ? data.languages : ['cs'];
            var initialLang = pickInitialLanguage(langs);
            if (window.PradlomatI18n) window.PradlomatI18n.setLang(initialLang);
            renderLanguageSwitcher(langs, initialLang);

            renderRecipientInfo(data);
            applyChromeTranslations();
            renderModelsStrip(data.models);
            mountTool(data);
            shLoadRates();
            shRenderCur();
          })
          .catch(function (e) {
            showError(e.message || tt('Odkaz nelze otevřít'));
          });
      }

      // Údaje o příjemci (nebudou se překládat — jméno/firma je vlastní jméno)
      function renderRecipientInfo(data) {
        if (data.recipient) {
          document.getElementById('share-recipient').style.display = '';
          document.getElementById('share-recipient-name').textContent = data.recipient.name || '';
          document.getElementById('share-recipient-company').textContent = data.recipient.company || data.recipient.email || '';
        }
      }

      function renderModelsStrip(models) {
        if (!models || !models.length) return;
        var wrap = document.getElementById('models-strip-wrap');
        var strip = document.getElementById('models-strip');
        wrap.style.display = '';
        var locale = (window.PradlomatI18n && window.PradlomatI18n.locale) ? window.PradlomatI18n.locale() : 'cs-CZ';
        var html = '';
        for (var i = 0; i < models.length; i++) {
          var m = models[i];
          var dt = new Date(m.created_at).toLocaleString(locale, { dateStyle: 'short', timeStyle: 'short' });
          html += '<div class="model-chip" data-idx="' + i + '" onclick="window._shareLoadModel(' + i + ')"><strong>' +
            escapeHtml(m.name) + '</strong><span>' + dt + '</span></div>';
        }
        strip.innerHTML = html;
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function mountTool(data) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = '';

        var API = toolApi();
        if (!API) {
          showError(tt('Tato pomůcka zatím není podporována.'));
          return;
        }

        // Titulek stránky podle pomůcky (z backendu)
        if (data.tool && data.tool.title) {
          var th = document.getElementById('share-title');
          if (th) th.textContent = data.tool.title;
          try { document.title = data.tool.title; } catch (e) { /* noop */ }
        }

        // Fallback chain: poslední uložený zákazníkův model → server defaults → JS factory
        var initialState = null;
        if (data.models && data.models.length && data.models[0].data_json) {
          initialState = data.models[0].data_json;
        } else if (data.defaults_json && typeof data.defaults_json === 'object') {
          initialState = data.defaults_json;
        }
        var locks = (data.locks_json && typeof data.locks_json === 'object') ? data.locks_json : {};

        API.mount(document.getElementById('tool-root'), {
          initialState: initialState,
          locks: locks,
          enforceLocks: true,
          onChange: function (state, computed) {
            // debounced 'edited' event ať server neřveme každým stiskem klávesy
            clearTimeout(EDIT_DEBOUNCE);
            EDIT_DEBOUNCE = setTimeout(function () {
              logEvent('edited', { sample: { zakazniku_za_den: state.zakazniku_za_den, zisk: computed ? computed.zisk : null } });
            }, 1500);
          },
        });
      }

      // ─── Public actions ──────────────────────────────────────────────
      window._shareLoadModel = function (idx) {
        if (!SHARE_DATA || !SHARE_DATA.models || !SHARE_DATA.models[idx]) return;
        var m = SHARE_DATA.models[idx];
        var locks = (SHARE_DATA.locks_json && typeof SHARE_DATA.locks_json === 'object') ? SHARE_DATA.locks_json : {};
        var API = toolApi();
        if (!API) return;
        API.mount(document.getElementById('tool-root'), {
          initialState: m.data_json,
          locks: locks,
          enforceLocks: true,
          onChange: function (state, computed) {
            clearTimeout(EDIT_DEBOUNCE);
            EDIT_DEBOUNCE = setTimeout(function () { logEvent('edited'); }, 1500);
          },
        });
        toast(tt('Načten model: ') + m.name, 'ok');
      };

      window.resetToDefaults = function () {
        var API = toolApi();
        if (API) API.resetDefaults();
        toast(tt('Obnoveno výchozí nastavení'), 'ok');
      };

      window.exportJson = function () {
        var API = toolApi();
        if (API) API.exportJSON();
        logEvent('exported', { kind: 'json' });
      };

      window.downloadPdf = function () {
        // Před tiskem expanduj všechny sbalené sekce (CSS pro @media print to také forsuje,
        // ale tady to děláme explicitně aby uživatel viděl preview ve správném stavu).
        var collapsed = document.querySelectorAll('.pe-section.pe-collapsed, .peb-section.peb-collapsed');
        var toReopen = [];
        for (var i = 0; i < collapsed.length; i++) {
          var ccls = collapsed[i].classList.contains('peb-collapsed') ? 'peb-collapsed' : 'pe-collapsed';
          collapsed[i].classList.remove(ccls);
          toReopen.push({ el: collapsed[i], cls: ccls });
        }
        logEvent('exported', { kind: 'pdf' });
        ecoTrack('eco_pdf', {});
        // Necháme krátkou pauzu na re-render rozbalení, pak tiskneme.
        setTimeout(function () {
          window.print();
          // Po zavření print dialogu (lehce neuchopitelné — print je sync) vrátíme původní stav.
          setTimeout(function () {
            for (var j = 0; j < toReopen.length; j++) toReopen[j].el.classList.add(toReopen[j].cls);
          }, 200);
        }, 80);
      };

      window.openSaveModal = function () {
        var locale = (window.PradlomatI18n && window.PradlomatI18n.locale) ? window.PradlomatI18n.locale() : 'cs-CZ';
        var defaultName = tt('Můj model') + ' ' + new Date().toLocaleString(locale, { dateStyle: 'short', timeStyle: 'short' });
        var html =
          '<div class="save-modal-overlay" onclick="if(event.target===this)window.closeSaveModal()">' +
            '<div class="save-modal">' +
              '<h3>' + tt('💾 Uložit můj model') + '</h3>' +
              '<input id="save-model-name" type="text" placeholder="' + tt('Název modelu') + '" value="' + escapeHtml(defaultName) + '">' +
              '<div style="font-size:11px;color:var(--text2);margin-top:8px;line-height:1.5;">' + tt('Uložená varianta se objeví v záhlaví nahoře a kdykoliv se k ní můžete vrátit. Odesilatele to také uvidí.') + '</div>' +
              '<div class="save-modal-actions">' +
                '<button class="btn btn-sm" onclick="window.closeSaveModal()">' + tt('Zrušit') + '</button>' +
                '<button class="btn btn-primary btn-sm" onclick="window.doSaveModel()">' + tt('Uložit') + '</button>' +
              '</div>' +
            '</div>' +
          '</div>';
        document.getElementById('modal-root').innerHTML = html;
        setTimeout(function () {
          var i = document.getElementById('save-model-name');
          if (i) { i.focus(); i.select(); }
        }, 50);
      };

      window.closeSaveModal = function () {
        document.getElementById('modal-root').innerHTML = '';
      };

      window.doSaveModel = function () {
        var nameEl = document.getElementById('save-model-name');
        var name = nameEl ? nameEl.value.trim() : '';
        if (!name) name = tt('Pracovní model');
        var API = toolApi();
        if (!API) { toast(tt('Tato pomůcka zatím není podporována.'), 'err'); return; }
        var state = API.getState();
        var computed = API.getComputed();
        fetch('/api/tools/share/' + encodeURIComponent(TOKEN) + '/model', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, data_json: state, computed_json: computed }),
        })
          .then(function (r) {
            if (!r.ok) return r.json().then(function (j) { throw new Error(j.error || 'Chyba ' + r.status); });
            return r.json();
          })
          .then(function (m) {
            // Připoj na začátek seznamu
            if (!SHARE_DATA.models) SHARE_DATA.models = [];
            SHARE_DATA.models.unshift({ id: m.id, name: m.name, created_at: m.created_at, data_json: state });
            renderModelsStrip(SHARE_DATA.models);
            window.closeSaveModal();
            toast(tt('✓ Model uložen'), 'ok');
            ecoTrack('eco_save', { name: name });
          })
          .catch(function (e) {
            toast(tt('Nepodařilo se uložit: ') + e.message, 'err');
          });
      };

      // Zobraz toolbar, nastav brand (compounder.world) a načti
      setupCompounderBrand();
      document.getElementById('share-toolbar').style.display = '';
      ecoInit();
      load();
    })();
  </script>
</body>
</html>

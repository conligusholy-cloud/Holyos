<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Zaplatit doklad — HolyOS</title>
<style>
  :root { --bg:#0f1220; --card:#1a1f36; --bd:#2c3354; --tx:#e8ecff; --tx2:#9aa3c7; --pri:#6c8cff; --ok:#22c55e; --err:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:460px; margin:0 auto; padding:18px 14px 40px; }
  h1 { font-size:1.15rem; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:16px; margin-bottom:14px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px dashed var(--bd); }
  .row:last-child { border-bottom:0; }
  .row span:first-child { color:var(--tx2); }
  .row b { text-align:right; word-break:break-all; }
  .amount { font-size:1.6rem; font-weight:800; text-align:center; margin:4px 0 12px; }
  button { width:100%; padding:14px; font-size:1.05rem; font-weight:700; border:0; border-radius:12px; background:var(--pri); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; }
  .msg { border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:.95rem; }
  .msg.err { background:#ef444422; border:1px solid #ef444455; color:#fecaca; }
  .msg.ok { background:#22c55e1f; border:1px solid #22c55e55; color:#bbf7d0; }
  .msg.warn { background:#f59e0b22; border:1px solid #f59e0b55; color:#fde68a; }
  #qrbox { text-align:center; }
  #qrbox img { width:100%; max-width:340px; background:#fff; border-radius:12px; padding:6px; }
  small { color:var(--tx2); }
</style>
</head>
<body>
<div class="wrap">
  <h1>💳 Zaplatit doklad přes QR</h1>
  <div id="msg"></div>
  <div class="card" id="info" style="display:none"></div>
  <div class="card" id="qrbox" style="display:none"></div>
  <button id="go" style="display:none" onclick="gen()">Vygenerovat QR kód</button>
  <p><small>Po vygenerování QR kódu se doklad v HolyOS označí jako „platí se přes QR" a přestane se nabízet k platbě. Jako zaplacený se potvrdí až po nalezení platby ve výpisu z účtu.</small></p>
</div>
<script>
  var token = location.pathname.split('/').filter(Boolean).pop();
  var el = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var fmt = function (n) { return Number(n).toLocaleString('cs-CZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  function msg(kind, text) { el('msg').innerHTML = text ? '<div class="msg ' + kind + '">' + esc(text) + '</div>' : ''; }
  function rows(d) {
    return '<div class="amount">' + fmt(d.amount) + ' ' + esc(d.currency) + '</div>' +
      '<div class="row"><span>Dodavatel</span><b>' + esc(d.supplier || d.supplier_name || '—') + '</b></div>' +
      '<div class="row"><span>Doklad</span><b>' + esc(d.external_number || d.invoice_number) + '</b></div>' +
      '<div class="row"><span>Účet</span><b>' + esc(d.account || d.iban || '—') + '</b></div>' +
      '<div class="row"><span>Variabilní symbol</span><b>' + esc(d.variable_symbol || '—') + '</b></div>' +
      (d.date_due ? '<div class="row"><span>Splatnost</span><b>' + new Date(d.date_due).toLocaleDateString('cs-CZ') + '</b></div>' : '');
  }
  fetch('/api/public/invoice-qr/' + encodeURIComponent(token)).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); }).then(function (x) {
    if (!x.ok) { msg('err', x.d.error || 'Chyba'); return; }
    var d = x.d;
    el('info').style.display = ''; el('info').innerHTML = rows(d);
    if (d.blocked) { msg('err', d.blocked); return; }
    if (d.already_qr) msg('warn', 'QR kód už byl pro tento doklad vygenerován. Pokud jsi platbu už provedl, nic dalšího nedělej — zaplaceno se potvrdí po nalezení ve výpisu.');
    el('go').style.display = ''; el('go').textContent = d.already_qr ? 'Zobrazit QR kód znovu' : 'Vygenerovat QR kód';
  }).catch(function () { msg('err', 'Nepodařilo se načíst doklad.'); });
  function gen() {
    el('go').disabled = true;
    fetch('/api/public/invoice-qr/' + encodeURIComponent(token) + '/generate', { method: 'POST' }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); }).then(function (x) {
      if (!x.ok) { msg('err', x.d.error || 'Chyba'); el('go').disabled = false; return; }
      var d = x.d;
      msg('ok', 'Hotovo — naskenuj QR kód v bankovní aplikaci. Doklad je v HolyOS označen jako „platí se přes QR".');
      el('qrbox').style.display = ''; el('qrbox').innerHTML = '<img alt="QR platba" src="' + d.qr + '">';
      el('go').style.display = 'none';
    }).catch(function () { msg('err', 'Chyba spojení.'); el('go').disabled = false; });
  }
</script>
</body>
</html>

<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vyplnění údajů ke smlouvě</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #0f1115; color: #e8e8ea; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 18px 60px; }
  .card { background: #171a21; border: 1px solid #262a33; border-radius: 14px; padding: 22px; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { color: #9aa0aa; font-size: 13px; margin: 0 0 18px; }
  label { display: block; font-size: 12px; color: #9aa0aa; margin: 12px 0 4px; }
  input { width: 100%; background: #0f1115; border: 1px solid #2c313b; border-radius: 8px; padding: 10px 12px; color: #e8e8ea; font-size: 14px; }
  input:focus { outline: none; border-color: #eab308; }
  button { width: 100%; margin-top: 20px; background: #eab308; color: #1a1a1a; border: none; border-radius: 9px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 16px; font-size: 14px; }
  .ok { color: #10b981; }
  .err { color: #ef4444; }
  .done { text-align: center; padding: 20px 0; }
  .done .big { font-size: 40px; }
  .foot { text-align: center; color: #6b7280; font-size: 11px; margin-top: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <div id="loading" class="sub">Načítám…</div>
    <div id="content" style="display:none;">
      <h1 id="title">Vyplnění údajů ke smlouvě</h1>
      <p class="sub" id="subtitle"></p>
      <form id="form"></form>
      <div id="readblock" style="margin-bottom:14px">
        <button type="button" id="readpdf" onclick="readContract()" style="width:100%;background:#f4f4f6;color:#0f1115;border:1px solid #ccc;border-radius:8px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer">📄 Přečíst celou smlouvu (PDF)</button>
      </div>
      <div id="signblock">
        <label>Podpis</label>
        <div style="background:#fff;border-radius:8px;position:relative">
          <canvas id="sigpad" style="width:100%;height:180px;display:block;touch-action:none;border-radius:8px"></canvas>
          <button type="button" id="sigclear" onclick="clearSig()" style="position:absolute;top:6px;right:6px;width:auto;margin:0;padding:5px 10px;font-size:12px;background:#0f1115;color:#e8e8ea;border-radius:6px">Vymazat</button>
        </div>
        <label>Jméno podepisujícího</label>
        <input id="signer" type="text" placeholder="Jméno a příjmení">
        <label>Místo podpisu <span style="color:#eab308">*</span></label>
        <input id="place" type="text" placeholder="např. Praha" maxlength="120" required>
        <label style="display:flex;align-items:flex-start;gap:10px;color:#e8e8ea;font-size:13px;margin-top:12px;cursor:pointer"><input type="checkbox" id="consent" style="width:auto;margin-top:2px"> Prohlašuji, že jsem se seznámil(a) s obsahem smlouvy a elektronicky ji podepisuji.</label>
      </div>
      <button id="submit" type="button" onclick="signContract()">Podepsat smlouvu</button>
      <div class="msg" id="msg"></div>
    </div>
    <div id="done" class="done" style="display:none;">
      <div class="big">✅</div>
      <h1>Děkujeme!</h1>
      <p class="sub">Vaše údaje byly odeslány. Připravíme finální smlouvu a ozveme se vám.</p>
    </div>
  </div>
  <div class="foot">Best Series s.r.o. • zabezpečený formulář</div>
</div>

<script>
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  var token = parts[parts.length - 1] || '';
  var API = '/api/compounder/contracts/public/' + encodeURIComponent(token);
  var schemaFields = [];
  var REQUIRED_FIELDS = ['buyer_address', 'buyer_bank']; // povinná pole hlavičky
  // Jazyk formuláře = jazyk smlouvy (cs/en) — vrací ho API spolu se schématem.
  var IS_EN = false;
  function tt(cs, en) { return IS_EN ? en : cs; }
  var FIELD_EN = {
    buyer_name: 'Name / company',
    buyer_address: 'Registered office / address',
    buyer_ico: 'Company ID',
    buyer_dic: 'VAT ID',
    buyer_rep: 'Represented by',
    buyer_bank: 'Bank account',
  };
  function applyEnUi() {
    if (!IS_EN) return;
    var rp = document.getElementById('readpdf'); if (rp) rp.textContent = '📄 Read the full contract (PDF)';
    var labels = document.querySelectorAll('#signblock label');
    if (labels[0]) labels[0].textContent = 'Signature';
    if (labels[1]) labels[1].textContent = 'Name of the signatory';
    if (labels[2]) labels[2].innerHTML = 'Place of signing <span style="color:#eab308">*</span>';
    if (labels[3] && labels[3].lastChild) labels[3].lastChild.textContent = ' I declare that I have read the contract and I am signing it electronically.';
    var sg = document.getElementById('signer'); if (sg) sg.placeholder = 'Full name';
    var pl = document.getElementById('place'); if (pl) pl.placeholder = 'e.g. London';
    var sc = document.getElementById('sigclear'); if (sc) sc.textContent = 'Clear';
    var sb = document.getElementById('submit'); if (sb) sb.textContent = 'Sign the contract';
    var ft = document.querySelector('.foot'); if (ft) ft.textContent = 'Best Series s.r.o. • secure form';
    var dn = document.querySelector('#done h1'); if (dn) dn.textContent = 'Thank you!';
  }

  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function show(id) { document.getElementById(id).style.display = ''; }
  function hide(id) { document.getElementById(id).style.display = 'none'; }

  async function load() {
    try {
      var r = await fetch(API, { credentials: 'omit' });
      if (r.status === 410) { fail('Platnost odkazu vypršela. Požádejte o nový. / The link has expired, please request a new one.'); return; }
      if (!r.ok) { fail('Odkaz je neplatný nebo byl zrušen. / The link is invalid or has been cancelled.'); return; }
      var d = await r.json();
      IS_EN = !!(d.lang && String(d.lang).toLowerCase().indexOf('cs') !== 0);
      if (d.status === 'podepsano') {
        hide('loading');
        document.getElementById('done').querySelector('.sub').textContent = tt('Tato smlouva už byla elektronicky podepsána. Děkujeme.', 'This contract has already been signed electronically. Thank you.');
        applyEnUi();
        show('done');
        return;
      }
      schemaFields = d.fields || [];
      document.getElementById('title').textContent = d.typeLabel || tt('Smlouva', 'Contract');
      document.getElementById('subtitle').textContent = (d.kioskLabel ? (d.kioskLabel + ' — ') : '') + tt('Vyplňte prosím své identifikační údaje.', 'Please fill in your identification details.');
      var form = document.getElementById('form');
      form.innerHTML = schemaFields.map(function (f) {
        var val = (d.values && d.values[f.name] != null) ? d.values[f.name] : '';
        var req = (REQUIRED_FIELDS.indexOf(f.name) !== -1);
        var lbl = IS_EN ? (FIELD_EN[f.name] || f.label) : f.label;
        return '<label>' + esc(lbl) + (req ? ' <span style="color:#eab308">*</span>' : '') + '</label>' +
          '<input id="fld_' + esc(f.name) + '" type="text" value="' + esc(val) + '"' + (req ? ' required' : '') + '>';
      }).join('');
      applyEnUi();
      hide('loading'); show('content');
      initSigPad();
    } catch (e) { fail('Nepodařilo se načíst formulář.'); }
  }

  function fail(text) {
    hide('loading');
    document.getElementById('card').innerHTML = '<h1>Něco se nepovedlo</h1><p class="sub err">' + esc(text) + '</p>';
  }

  // ── Podpisové pole (canvas) ──
  var sigCtx = null, sigDrawing = false, sigDirty = false, sigCanvas = null;
  window.initSigPad = function () {
    sigCanvas = document.getElementById('sigpad');
    if (!sigCanvas) return;
    var ratio = window.devicePixelRatio || 1;
    var rect = sigCanvas.getBoundingClientRect();
    sigCanvas.width = Math.round(rect.width * ratio);
    sigCanvas.height = Math.round(180 * ratio);
    sigCtx = sigCanvas.getContext('2d');
    sigCtx.scale(ratio, ratio);
    sigCtx.strokeStyle = '#111'; sigCtx.lineWidth = 2.2; sigCtx.lineCap = 'round'; sigCtx.lineJoin = 'round';
    function pos(e) {
      var r = sigCanvas.getBoundingClientRect();
      var t = (e.touches && e.touches[0]) ? e.touches[0] : e;
      return { x: t.clientX - r.left, y: t.clientY - r.top };
    }
    function start(e) { e.preventDefault(); sigDrawing = true; var p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); }
    function move(e) { if (!sigDrawing) return; e.preventDefault(); var p = pos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); sigDirty = true; }
    function end() { sigDrawing = false; }
    sigCanvas.addEventListener('mousedown', start); sigCanvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
    sigCanvas.addEventListener('touchstart', start, { passive: false }); sigCanvas.addEventListener('touchmove', move, { passive: false }); sigCanvas.addEventListener('touchend', end);
  };
  window.clearSig = function () { if (sigCtx && sigCanvas) { sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height); sigDirty = false; } };

  window.readContract = function () { window.open(API + '/pdf', '_blank'); };

  window.signContract = async function () {
    var btn = document.getElementById('submit');
    var msg = document.getElementById('msg');
    msg.textContent = '';
    var signer = (document.getElementById('signer').value || '').trim();
    var place = ((document.getElementById('place') || {}).value || '').trim();
    var consent = document.getElementById('consent').checked;
    if (!sigDirty) { msg.className = 'msg err'; msg.textContent = tt('Prosím nakreslete svůj podpis.', 'Please draw your signature.'); return; }
    if (!signer) { msg.className = 'msg err'; msg.textContent = tt('Zadejte prosím jméno podepisujícího.', 'Please enter the name of the signatory.'); return; }
    if (!place) { msg.className = 'msg err'; msg.textContent = tt('Vyplňte prosím místo podpisu.', 'Please fill in the place of signing.'); return; }
    if (!consent) { msg.className = 'msg err'; msg.textContent = tt('Potvrďte prosím souhlas s podpisem.', 'Please confirm your consent to signing.'); return; }
    var fields = {};
    schemaFields.forEach(function (f) { var el = document.getElementById('fld_' + f.name); if (el) fields[f.name] = el.value; });
    // Povinná pole hlavičky (adresa, bankovní spojení)
    for (var i = 0; i < REQUIRED_FIELDS.length; i++) {
      var rf = REQUIRED_FIELDS[i];
      var rfEl = document.getElementById('fld_' + rf);
      if (rfEl && !String(rfEl.value || '').trim()) {
        var lbl = IS_EN ? (FIELD_EN[rf] || rf) : ((schemaFields.filter(function (f) { return f.name === rf; })[0] || {}).label || rf);
        msg.className = 'msg err'; msg.textContent = tt('Vyplňte prosím povinné pole: ', 'Please fill in the required field: ') + lbl + '.';
        rfEl.focus();
        return;
      }
    }
    var signature = sigCanvas.toDataURL('image/png');
    btn.disabled = true; btn.textContent = tt('Podepisuji…', 'Signing…');
    try {
      var r = await fetch(API + '/sign', {
        method: 'POST', credentials: 'omit',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: fields, signer_name: signer, signature: signature, consent: true, place_signed: place }),
      });
      if (!r.ok) { var d = await r.json().catch(function(){return{};}); throw new Error(d.error || 'http'); }
      document.getElementById('done').querySelector('.sub').textContent = tt('Váš podpis jsme přijali. Smlouvu dokončíme podpisem za Best Series a poté vám ji zašleme e-mailem.', 'We have received your signature. We will complete the contract with the Best Series signature and then send it to you by e-mail.');
      hide('content'); show('done');
    } catch (e) {
      btn.disabled = false; btn.textContent = tt('Podepsat smlouvu', 'Sign the contract');
      msg.className = 'msg err'; msg.textContent = tt('Podpis se nezdařil: ', 'Signing failed: ') + (e.message || tt('zkuste to prosím znovu.', 'please try again.'));
    }
  };

  if (!token) { fail('Chybí identifikátor odkazu.'); } else { load(); }
})();
</script>
</body>
</html>

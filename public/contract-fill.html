<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vyplnění údajů ke smlouvě</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #0f1115; color: #e8e8ea; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 18px 60px; }
  .card { background: #171a21; border: 1px solid #262a33; border-radius: 14px; padding: 22px; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { color: #9aa0aa; font-size: 13px; margin: 0 0 18px; }
  label { display: block; font-size: 12px; color: #9aa0aa; margin: 12px 0 4px; }
  input { width: 100%; background: #0f1115; border: 1px solid #2c313b; border-radius: 8px; padding: 10px 12px; color: #e8e8ea; font-size: 14px; }
  input:focus { outline: none; border-color: #eab308; }
  button { width: 100%; margin-top: 20px; background: #eab308; color: #1a1a1a; border: none; border-radius: 9px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 16px; font-size: 14px; }
  .ok { color: #10b981; }
  .err { color: #ef4444; }
  .done { text-align: center; padding: 20px 0; }
  .done .big { font-size: 40px; }
  .foot { text-align: center; color: #6b7280; font-size: 11px; margin-top: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <div id="loading" class="sub">Načítám…</div>
    <div id="content" style="display:none;">
      <h1 id="title">Vyplnění údajů ke smlouvě</h1>
      <p class="sub" id="subtitle"></p>
      <form id="form"></form>
      <div id="signblock">
        <label>Podpis</label>
        <div style="background:#fff;border-radius:8px;position:relative">
          <canvas id="sigpad" style="width:100%;height:180px;display:block;touch-action:none;border-radius:8px"></canvas>
          <button type="button" id="sigclear" onclick="clearSig()" style="position:absolute;top:6px;right:6px;width:auto;margin:0;padding:5px 10px;font-size:12px;background:#0f1115;color:#e8e8ea;border-radius:6px">Vymazat</button>
        </div>
        <label>Jméno podepisujícího</label>
        <input id="signer" type="text" placeholder="Jméno a příjmení">
        <label style="display:flex;align-items:flex-start;gap:10px;color:#e8e8ea;font-size:13px;margin-top:12px;cursor:pointer"><input type="checkbox" id="consent" style="width:auto;margin-top:2px"> Prohlašuji, že jsem se seznámil(a) s obsahem smlouvy a elektronicky ji podepisuji.</label>
      </div>
      <button id="submit" type="button" onclick="signContract()">Podepsat smlouvu</button>
      <div class="msg" id="msg"></div>
    </div>
    <div id="done" class="done" style="display:none;">
      <div class="big">✅</div>
      <h1>Děkujeme!</h1>
      <p class="sub">Vaše údaje byly odeslány. Připravíme finální smlouvu a ozveme se vám.</p>
    </div>
  </div>
  <div class="foot">Best Series s.r.o. • zabezpečený formulář</div>
</div>

<script>
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  var token = parts[parts.length - 1] || '';
  var API = '/api/compounder/contracts/public/' + encodeURIComponent(token);
  var schemaFields = [];

  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function show(id) { document.getElementById(id).style.display = ''; }
  function hide(id) { document.getElementById(id).style.display = 'none'; }

  async function load() {
    try {
      var r = await fetch(API, { credentials: 'omit' });
      if (r.status === 410) { fail('Platnost odkazu vypršela. Požádejte o nový.'); return; }
      if (!r.ok) { fail('Odkaz je neplatný nebo byl zrušen.'); return; }
      var d = await r.json();
      if (d.status === 'podepsano') {
        hide('loading');
        document.getElementById('done').querySelector('.sub').textContent = 'Tato smlouva už byla elektronicky podepsána. Děkujeme.';
        show('done');
        return;
      }
      schemaFields = d.fields || [];
      document.getElementById('title').textContent = d.typeLabel || 'Smlouva';
      document.getElementById('subtitle').textContent = (d.kioskLabel ? (d.kioskLabel + ' — ') : '') + 'Vyplňte prosím své identifikační údaje.';
      var form = document.getElementById('form');
      form.innerHTML = schemaFields.map(function (f) {
        var val = (d.values && d.values[f.name] != null) ? d.values[f.name] : '';
        return '<label>' + esc(f.label) + '</label>' +
          '<input id="fld_' + esc(f.name) + '" type="text" value="' + esc(val) + '">';
      }).join('');
      hide('loading'); show('content');
      initSigPad();
    } catch (e) { fail('Nepodařilo se načíst formulář.'); }
  }

  function fail(text) {
    hide('loading');
    document.getElementById('card').innerHTML = '<h1>Něco se nepovedlo</h1><p class="sub err">' + esc(text) + '</p>';
  }

  // ── Podpisové pole (canvas) ──
  var sigCtx = null, sigDrawing = false, sigDirty = false, sigCanvas = null;
  window.initSigPad = function () {
    sigCanvas = document.getElementById('sigpad');
    if (!sigCanvas) return;
    var ratio = window.devicePixelRatio || 1;
    var rect = sigCanvas.getBoundingClientRect();
    sigCanvas.width = Math.round(rect.width * ratio);
    sigCanvas.height = Math.round(180 * ratio);
    sigCtx = sigCanvas.getContext('2d');
    sigCtx.scale(ratio, ratio);
    sigCtx.strokeStyle = '#111'; sigCtx.lineWidth = 2.2; sigCtx.lineCap = 'round'; sigCtx.lineJoin = 'round';
    function pos(e) {
      var r = sigCanvas.getBoundingClientRect();
      var t = (e.touches && e.touches[0]) ? e.touches[0] : e;
      return { x: t.clientX - r.left, y: t.clientY - r.top };
    }
    function start(e) { e.preventDefault(); sigDrawing = true; var p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); }
    function move(e) { if (!sigDrawing) return; e.preventDefault(); var p = pos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); sigDirty = true; }
    function end() { sigDrawing = false; }
    sigCanvas.addEventListener('mousedown', start); sigCanvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
    sigCanvas.addEventListener('touchstart', start, { passive: false }); sigCanvas.addEventListener('touchmove', move, { passive: false }); sigCanvas.addEventListener('touchend', end);
  };
  window.clearSig = function () { if (sigCtx && sigCanvas) { sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height); sigDirty = false; } };

  window.signContract = async function () {
    var btn = document.getElementById('submit');
    var msg = document.getElementById('msg');
    msg.textContent = '';
    var signer = (document.getElementById('signer').value || '').trim();
    var consent = document.getElementById('consent').checked;
    if (!sigDirty) { msg.className = 'msg err'; msg.textContent = 'Prosím nakreslete svůj podpis.'; return; }
    if (!signer) { msg.className = 'msg err'; msg.textContent = 'Zadejte prosím jméno podepisujícího.'; return; }
    if (!consent) { msg.className = 'msg err'; msg.textContent = 'Potvrďte prosím souhlas s podpisem.'; return; }
    var fields = {};
    schemaFields.forEach(function (f) { var el = document.getElementById('fld_' + f.name); if (el) fields[f.name] = el.value; });
    var signature = sigCanvas.toDataURL('image/png');
    btn.disabled = true; btn.textContent = 'Podepisuji…';
    try {
      var r = await fetch(API + '/sign', {
        method: 'POST', credentials: 'omit',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: fields, signer_name: signer, signature: signature, consent: true }),
      });
      if (!r.ok) { var d = await r.json().catch(function(){return{};}); throw new Error(d.error || 'http'); }
      document.getElementById('done').querySelector('.sub').textContent = 'Smlouva byla elektronicky podepsána. Děkujeme! Kopii vám zašleme e-mailem.';
      hide('content'); show('done');
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Podepsat smlouvu';
      msg.className = 'msg err'; msg.textContent = 'Podpis se nezdařil: ' + (e.message || 'zkuste to prosím znovu.');
    }
  };

  if (!token) { fail('Chybí identifikátor odkazu.'); } else { load(); }
})();
</script>
</body>
</html>

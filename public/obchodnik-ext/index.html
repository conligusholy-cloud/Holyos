<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJnIiB4MT0iMCIgeTE9IjAiIHgyPSIxIiB5Mj0iMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjZjZlNmFkIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjY2RhNDU0Ii8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTUiIGZpbGw9IiMxNDE0MTYiLz48cmVjdCB4PSI0IiB5PSI0IiB3aWR0aD0iNTYiIGhlaWdodD0iNTYiIHJ4PSIxMiIgZmlsbD0idXJsKCNnKSIvPjxjaXJjbGUgY3g9IjMyIiBjeT0iMjQuNSIgcj0iOSIgZmlsbD0iIzI0MWMwNSIvPjxwYXRoIGQ9Ik0xNSA1MGMwLTkuNCA3LjYtMTUuNSAxNy0xNS41UzQ5IDQwLjYgNDkgNTB6IiBmaWxsPSIjMjQxYzA1Ii8+PC9zdmc+">
<title>Externí obchodník</title>
<style>
  :root{
    --bg:#0f1115; --surface:#171a21; --surface2:#1f2430; --line:rgba(255,255,255,.09);
    --text:#f2f3f5; --muted:#9aa0ad; --muted2:#6b7280; --primary:#eab308; --primary-d:#1a1408;
    --gold1:#f6e6ad; --gold2:#cda454; --green:#22c55e; --blue:#3b82f6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.45}
  body{padding-bottom:calc(60px + env(safe-area-inset-bottom,0))}
  /* Login */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 22px;width:100%;max-width:360px}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .brand .mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#241c05;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
  .brand h1{font-size:17px;margin:0}
  .brand p{font-size:12px;color:var(--muted);margin:2px 0 0}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted2);margin-bottom:5px}
  input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text);font-size:15px;font-family:inherit}
  .btn{border:none;border-radius:10px;padding:13px 14px;font-size:15px;font-weight:700;cursor:pointer;width:100%}
  .btn-p{background:var(--primary);color:var(--primary-d)}
  .err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5;padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:13px}
  /* Top */
  .top{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px calc(12px + env(safe-area-inset-top,0)) 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .top .who{display:flex;align-items:center;gap:11px;min-width:0}
  .top .who .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#241c05;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:0 0 auto}
  .top .who h1{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .who .sub{font-size:11.5px;color:var(--muted)}
  .logout{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 13px;font-size:12px;cursor:pointer;flex:0 0 auto}
  /* Screens */
  .screen{padding:14px 14px 8px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
  .kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted2)}
  .kpi .v{font-size:20px;font-weight:800;margin-top:4px}
  .kpi .s{font-size:11px;color:var(--muted);margin-top:2px}
  .kpi.gold{background:linear-gradient(135deg,rgba(246,230,173,.10),rgba(205,164,84,.06));border-color:rgba(205,164,84,.35)}
  .sec-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted2);margin:6px 2px 8px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:13px 14px}
  .card .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .card .code{font-weight:800;font-size:15px}
  .card .name{font-size:12.5px;color:var(--muted);margin-top:1px}
  .card .price{font-weight:800;font-size:15px;color:var(--primary)}
  .metrics{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
  .metric .ml{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted2)}
  .metric .mv{font-size:14px;font-weight:700;margin-top:1px}
  .prov{color:var(--green)}
  .nav-yrs{color:var(--blue)}
  .empty,.loading{padding:48px 20px;text-align:center;color:var(--muted)}
  .tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom,0));padding-bottom:env(safe-area-inset-bottom,0);background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:55}
  .tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px;background:none;border:none;cursor:pointer;font-family:inherit}
  .tabbar .tab.active{color:var(--primary)}
  .tabbar .tab .ic{font-size:20px;line-height:1}
  .info-line{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:2px 0 12px}
.pricenote{font-size:12px;color:var(--gold2);margin:0 2px 8px;font-weight:600}
  .offer{display:flex;gap:11px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:9px 12px}
  .offer-photo{flex:0 0 62px;width:62px;height:46px;border-radius:8px;overflow:hidden;background:#0c0e12}
  .offer-photo img{width:100%;height:100%;object-fit:cover;display:block}
  .offer-body{flex:1;min-width:0}
  .offer-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .offer-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .offer-name .vip{font-size:9.5px;color:#cda454;border:1px solid rgba(205,164,84,.5);border-radius:5px;padding:0 4px;margin-left:5px}
  .offer-name .sub{font-weight:400;font-size:11px;color:var(--muted)}
  .offer-price{font-weight:800;font-size:15px;color:var(--primary);white-space:nowrap}
  .offer-price .pd{font-size:9.5px;color:var(--muted2);font-weight:500}
  .offer-metrics{display:flex;gap:18px;margin-top:5px;flex-wrap:wrap;font-size:11.5px;color:var(--muted2)}
  .offer-metrics b{font-weight:800;font-size:12.5px}
  .offer-metrics b.gold{color:var(--gold2)} .offer-metrics b.green{color:var(--green)} .offer-metrics b.blue{color:var(--blue)} .offer-metrics b.def{color:var(--text)}
  .offer-metrics .ecs{font-size:9.5px}
  select{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 10px;color:var(--text);font-size:14px;font-family:inherit}
  textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);font-size:14px;font-family:inherit;resize:vertical}
  .btn-g{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
  .fab{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0));background:var(--primary);color:var(--primary-d);border:none;border-radius:999px;padding:13px 18px;font-size:14px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.4);cursor:pointer;z-index:56;width:auto}
  .ct{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:11px 13px}
  .ct-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer}
  .ct-name{font-weight:700;font-size:14.5px}
  .ct-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .ct-badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .ct-detail{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
  .ct.open .ct-detail{display:block}
  .ct .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted2);margin:8px 0 4px}
  .ct-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .ct-actions .btn{width:auto;padding:9px 12px;font-size:13px}
  .modal-ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}
  .modal-card{background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0))}
  .rev-btn{background:rgba(234,179,8,.14);color:var(--primary);border:1px solid rgba(234,179,8,.4);border-radius:8px;padding:3px 9px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .rev-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .rev-card{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  .rev-card .rev-l{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted2)}
  .rev-card .rev-v{font-size:17px;font-weight:800;margin-top:3px}
  .rev-card .rev-s{font-size:10.5px;color:var(--muted2);margin-top:2px}
  .rev-sec{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted2);margin:16px 0 8px}
  .rev-bars{display:flex;gap:5px;align-items:flex-end;height:110px}
  .rev-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
  .rev-bar .rb{width:100%;background:var(--gold2);border-radius:4px 4px 0 0;min-height:4px}
  .rev-bar .rev-bl{font-size:9px;color:var(--muted2)}
  .ct-quick{display:flex;gap:8px;flex-wrap:wrap}
  .ct-quick a{flex:1;min-width:80px;text-align:center;text-decoration:none;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:13px;font-weight:600;color:var(--text)}
  .ck{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0;cursor:pointer}
  .ck input{width:18px;height:18px;accent-color:var(--primary)}
</style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-view" class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <div class="mark">BS</div>
        <div><h1>Externí obchodník</h1><p>Přihlášení do portálu</p></div>
      </div>
      <div id="login-err" class="err" style="display:none"></div>
      <div class="field"><label>Přihlašovací jméno</label><input id="in-login" type="text" autocomplete="username" autocapitalize="none"></div>
      <div class="field"><label>Heslo</label><input id="in-pass" type="password" autocomplete="current-password"></div>
      <button class="btn btn-p" id="btn-login" onclick="doLogin()">Přihlásit se</button>
    </div>
  </div>

  <!-- PORTAL -->
  <div id="portal-view" style="display:none">
    <div class="top">
      <div class="who">
        <div class="mark" id="p-initials">?</div>
        <div style="min-width:0"><h1 id="p-name">—</h1><div class="sub" id="p-sub"></div></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex:0 0 auto">
        <a id="p-portal-link" href="#" target="_blank" rel="noopener" class="logout" style="text-decoration:none;display:none" title="Compounder portál — jak to vidí zákazník">🌐 Portál</a>
        <button class="logout" onclick="openSettings()" title="Nastavení">⚙️</button>
        <button class="logout" onclick="doLogout()">Odhlásit</button>
      </div>
    </div>

    <!-- LOKALITY -->
    <div id="screen-lok" class="screen">
      <div class="kpis">
        <div class="kpi"><div class="l">Moje lokality</div><div class="v" id="k-pocet">0</div><div class="s">přiřazeno</div></div>
        <div class="kpi"><div class="l">Odhad objemu</div><div class="v" id="k-objem">0</div><div class="s">∑ celkových cen · bez DPH</div></div>
        <div class="kpi"><div class="l">Obrat lokalit</div><div class="v" id="k-obrat">0</div><div class="s">∑ měsíční obrat · bez DPH</div></div>
        <div class="kpi gold"><div class="l">Provize celkem</div><div class="v" id="k-provize2">0</div><div class="s">možná z lokalit</div></div>
      </div>
      <div class="sec-title">Přiřazené lokality</div>
      <div id="lok-list"><div class="loading">Načítám…</div></div>
      <div class="sec-title" style="margin-top:20px">Prodat nový stroj (bez lokality)</div>
      <div id="machine-list"></div>
    </div>

    <!-- KONTAKTY -->
    <div id="screen-kontakty" class="screen" style="display:none">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
        <input type="text" id="ct-search" placeholder="Hledat jméno / e-mail…" oninput="renderContacts()" style="flex:1">
        <select id="ct-filter" onchange="renderContacts()" style="width:auto;min-width:130px">
          <option value="">Všechny stavy</option>
          <option value="new">Nový</option>
          <option value="contacted">Kontaktováno</option>
          <option value="qualified">Kvalifikováno</option>
          <option value="converted">Konvertováno</option>
          <option value="rejected">Odmítnuto</option>
        </select>
      </div>
      <div id="ct-list"><div class="loading">Načítám…</div></div>
      <button class="fab" onclick="openNewContact()">+ Nový kontakt</button>
    </div>

    <nav class="tabbar">
      <button class="tab active" id="tab-lok" onclick="showScreen('lok')"><span class="ic">🏷️</span>Na prodej</button>
      <button class="tab" id="tab-kontakty" onclick="showScreen('kontakty')"><span class="ic">👥</span>Kontakty</button>
    </nav>
  </div>

<script>
  var API = '/api/compounder';
  var TKEY = 'exr_token';
  var DATA = null;
  var CALC = { lokalita: '% z ceny lokality', celkova: '% z celkové ceny', fix: 'fixní částka / lokalitu' };
  var PAY = { podpis: 'při podpisu', provoz: 'po uvedení do provozu', mesicne: 'měsíčně z obratu', individ: 'individuálně' };

  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function money(n){ return (typeof n==='number' && isFinite(n)) ? (Math.round(n).toLocaleString('cs-CZ') + ' Kč') : '—'; }
  function getToken(){ try { return localStorage.getItem(TKEY) || ''; } catch(e){ return ''; } }
  function setToken(t){ try { if(t) localStorage.setItem(TKEY, t); else localStorage.removeItem(TKEY); } catch(e){} }

  async function doLogin(){
    var errEl = document.getElementById('login-err'); errEl.style.display = 'none';
    var login = (document.getElementById('in-login').value||'').trim();
    var pass = document.getElementById('in-pass').value||'';
    if(!login || !pass){ errEl.textContent = 'Zadejte jméno a heslo.'; errEl.style.display=''; return; }
    var btn = document.getElementById('btn-login'); btn.disabled = true; btn.textContent = 'Přihlašuji…';
    try {
      var r = await fetch(API + '/external-reps/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login: login, password: pass }) });
      var j = await r.json().catch(function(){ return {}; });
      if(!r.ok || !j.ok){ throw new Error(j.error || 'Neplatné přihlášení.'); }
      setToken(j.token);
      await loadPortal();
    } catch(e){
      errEl.textContent = e.message || 'Přihlášení selhalo.'; errEl.style.display='';
    } finally { btn.disabled = false; btn.textContent = 'Přihlásit se'; }
  }
  function doLogout(){ setToken(''); DATA = null; document.getElementById('portal-view').style.display='none'; document.getElementById('login-view').style.display='flex'; }

  async function loadPortal(){
    var token = getToken();
    if(!token){ doLogout(); return; }
    try {
      var r = await fetch(API + '/external-reps/me?t=' + encodeURIComponent(token), { headers: { 'Accept':'application/json' } });
      if(r.status === 401 || r.status === 403){ setToken(''); doLogout(); return; }
      DATA = await r.json();
      if(!DATA || !DATA.rep){ doLogout(); return; }
      renderPortal();
    } catch(e){ doLogout(); }
  }

  // Hlavní obchodník si skryje/zobrazí lokalitu z nabídky (projeví se i jeho kontaktům).
  async function toggleLoc(code){
    try{
      var r = await fetch(API + '/external-reps/me/toggle-location', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ t:getToken(), code:code }) });
      var j = await r.json().catch(function(){ return {}; });
      if(!r.ok || !j.ok){ alert((j && j.error) || 'Nepodařilo se změnit viditelnost.'); return; }
      loadPortal();
    }catch(e){ alert('Chyba: ' + (e.message||'')); }
  }
  window.toggleLoc = toggleLoc;

  function initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(function(w){ return w.charAt(0).toUpperCase(); }).join('') || '?'; }

  function renderPortal(){
    document.getElementById('login-view').style.display='none';
    document.getElementById('portal-view').style.display='';
    var rep = DATA.rep, kpi = DATA.kpi || {}, lok = DATA.lokality || [];
    document.getElementById('p-initials').textContent = initials(rep.jmeno);
    document.getElementById('p-name').textContent = rep.jmeno || '—';
    document.getElementById('p-sub').textContent = [rep.email, rep.telefon].filter(Boolean).join(' · ');
    var _pl=document.getElementById('p-portal-link'); if(_pl && DATA.self_portal_url){ _pl.href=DATA.self_portal_url; _pl.style.display=''; }
    // KPI lokality
    document.getElementById('k-pocet').textContent = kpi.pocet || 0;
    document.getElementById('k-objem').textContent = money(kpi.objem);
    var _ko=document.getElementById('k-obrat'); if(_ko) _ko.textContent = money(kpi.obrat)+' /měs';
    var _kp=document.getElementById('k-provize2'); if(_kp) _kp.textContent = money(kpi.provize);
    // Seznam lokalit
    var ll = document.getElementById('lok-list');
    if(!lok.length){ ll.innerHTML = '<div class="empty">Zatím nemáte přiřazené žádné lokality.</div>'; }
    else {
      ll.innerHTML = '<div class="pricenote">Všechny ceny jsou uvedené bez DPH.</div>' + lok.map(function(x){
        var nav = (x.navratnost != null) ? (String(x.navratnost).replace('.', ',') + ' let') : '—';
        var vipTag = x.vip ? '<span class="vip">🎯 VIP</span>' : '';
        var resTag = x.reserved ? ' <span style="font-size:10px;color:#ef4444;border:1px solid rgba(239,68,68,.5);border-radius:6px;padding:1px 6px;white-space:nowrap">🔒 Rezervováno' + (x.res_until ? (' do ' + new Date(x.res_until).toLocaleDateString('cs-CZ')) : '') + '</span>' : '';
        var photo = x.photo ? ('<div class="offer-photo" style="cursor:zoom-in" onclick="openPhoto(&#39;' + esc(x.photo) + '&#39;)"><img src="' + esc(x.photo) + '" alt="" onerror="this.parentNode.style.display=&#39;none&#39;"></div>') : '';
        var sub = esc(x.code) + (x.verze ? (' · ' + esc(x.verze)) : '');
        var hidTag = x.hidden ? ' <span style="font-size:10px;color:#eab308;border:1px solid rgba(234,179,8,.5);border-radius:6px;padding:1px 6px;white-space:nowrap">skryto z nabídky</span>' : '';
        return '<div class="offer" style="' + (x.hidden ? 'opacity:.5;' : '') + '">' + photo +
          '<div class="offer-body">' +
            '<div class="offer-top">' +
              '<div class="offer-name">' + esc(x.label) + vipTag + resTag + hidTag + ' <span class="sub">· ' + sub + '</span></div>' +
              '<div class="offer-price">' + money(x.total) + ' <span class="pd">bez DPH</span></div>' +
            '</div>' +
            '<div class="offer-metrics">' +
              '<span>Obrat bez DPH <b class="def">' + money(x.obrat_bez) + '</b>/měs</span>' +

  async function loadJourney(id){
    var box=document.getElementById('journey-'+id); if(!box) return;
    try {
      var r=await fetch(API+'/external-reps/me/leads/'+id+'/activity?t='+encodeURIComponent(getToken()));
      var a=await r.json(); if(!r.ok) throw new Error(a.error||'');
      if(!a.count){ box.textContent='Zatím žádná zaznamenaná aktivita.'; return; }
      var mins=Math.round((a.totalMs||0)/60000);
      var head=(a.portalOpened?'Otevřel portál':'Portál neotevřel')+' · '+a.count+' akcí'+(mins?' · '+mins+' min na webu':'');
      var secs=Object.keys(a.sections||{});
      if(secs.length) head+='\nSekce: '+secs.map(function(x){return x+' ('+a.sections[x]+'×)';}).join(', ');
      var tl=(a.events||[]).slice(-40).reverse().map(function(e){
        var lbl=EVENT_LABEL[e.event]||e.event; var p=e.props||{}; var extra='';
        if(e.event==='eco_edit') extra=' – '+(p.label||p.key||'')+(p.value!=null&&p.value!==''?(' → '+p.value):'');
        else if(e.event==='purchase_inquiry') extra=' – '+(p.count||'?')+'× '+(p.locations||'');
        else if(p.section||p.doc||p.page||p.label) extra=' – '+(p.section||p.doc||p.page||p.label);
        return (e.at?new Date(e.at).toLocaleString('cs-CZ'):'')+' · '+lbl+extra;
      }).join('\n');
      box.textContent=head+'\n\n'+tl;
    } catch(e){ box.textContent='Analytiku se nepodařilo načíst.'; }
  }
  function dictate(id){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    var inp=document.getElementById('act-'+id); var btn=document.getElementById('mic-'+id);
    if(!SR){ alert('Diktování v tomto prohlížeči není podporováno (funguje hlavně v Chrome a na Androidu).'); return; }
    if(_recog){ try{ _recog.stop(); }catch(e){} return; }
    _recog=new SR(); _recog.lang='cs-CZ'; _recog.interimResults=false; _recog.continuous=true;
    _recog.onresult=function(e){ var t=''; for(var i=e.resultIndex;i<e.results.length;i++){ t+=e.results[i][0].transcript; } if(inp) inp.value=(inp.value?inp.value+' ':'')+t.trim(); };
    _recog.onend=function(){ if(btn) btn.textContent='🎤 Diktovat'; _recog=null; };
    _recog.onerror=function(){ if(btn) btn.textContent='🎤 Diktovat'; _recog=null; };
    if(btn) btn.textContent='● Nahrávám… (klepni pro stop)';
    try{ _recog.start(); }catch(e){}
  }
  window.loadJourney=loadJourney; window.dictate=dictate;
  window.toggleSection=toggleSection; window.toggleTemplate=toggleTemplate; window.sendAccessEmail=sendAccessEmail; window.sendAccessWA=sendAccessWA;
  window.toggleRevStats=toggleRevStats;

  // ─── Tržby lokality (modal) ───
  var _revCode=null, _revData=null;
  function openRevenue(code){
    _revCode=String(code);
    var x=(DATA && DATA.lokality || []).find(function(l){return String(l.code)===String(code);});
    var label=x?x.label:code;
    var ov=document.createElement('div'); ov.className='modal-ovl'; ov.id='rev-modal'; ov.style.alignItems='flex-start'; ov.style.overflowY='auto'; ov.style.padding='16px';
    ov.innerHTML='<div class="modal-card" style="border-radius:16px;max-width:840px;margin:auto"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px"><h3 style="margin:0;font-size:16px">📊 Tržby — '+esc(label)+'</h3><button class="btn btn-g" style="width:auto;padding:8px 12px" onclick="closeRevenue()">Zavřít</button></div><div id="rev-body"><div class="loading">Načítám…</div></div></div>';
    document.body.appendChild(ov);
    fetch(API+'/external-reps/me/kiosk-revenue?code='+encodeURIComponent(code)+'&t='+encodeURIComponent(getToken()))
      .then(function(r){ return r.json().then(function(j){return {ok:r.ok,j:j};}); })
      .then(function(res){ if(!res.ok){ throw new Error((res.j&&res.j.error)||'Chyba'); } renderRevenue(res.j); })
      .catch(function(e){ var b=document.getElementById('rev-body'); if(b) b.innerHTML='<div class="err">'+esc(e.message||'Chyba načítání tržeb.')+'</div>'; });
  }
  function closeRevenue(){ var m=document.getElementById('rev-modal'); if(m)m.remove(); }
  function renderRevenue(d){
    var b=document.getElementById('rev-body'); if(!b) return;
    var cur=d.currency||'CZK';
    function m(n){ return (Math.round(n||0)).toLocaleString('cs-CZ')+' '+cur; }
    function net(n){ return (Math.round((n||0)/1.21)).toLocaleString('cs-CZ'); }
    _revData=d;
    function card(l,v,pk){ return '<div class="rev-card" style="cursor:pointer" onclick="openTxTable(&#39;'+pk+'&#39;,&#39;'+l+'&#39;)"><div class="rev-l">'+l+' ›</div><div class="rev-v">'+m(v)+'</div><div class="rev-s">bez DPH '+net(v)+' '+cur+'</div></div>'; }
    var cards='<div class="rev-cards">'+card('Dnes',d.day,'day')+card('Aktuální týden',d.thisWeek,'thisWeek')+card('Předchozí týden',d.prevWeek,'prevWeek')+card('Tento měsíc',d.thisMonth,'thisMonth')+card('Poslední celý měsíc',d.prevMonth,'prevMonth')+card('Poslední rok',d.year,'year')+card('Poslední 2 roky',d.year2,'year2')+'</div>';
    var mm=d.monthly24||d.monthly||[]; var mx=1; mm.forEach(function(x){ if(x.amount>mx)mx=x.amount; });
    var bars=mm.map(function(x,i){ var h=Math.round((x.amount||0)/mx*90)+4; var last=(i===mm.length-1); var st='height:'+h+'px'+(last?';background:repeating-linear-gradient(45deg,var(--gold2),var(--gold2) 3px,transparent 3px,transparent 7px);border:1px solid var(--gold2)':''); return '<div class="rev-bar"><div class="rb" style="'+st+'" title="'+esc(x.label)+': '+m(x.amount)+'"></div><div class="rev-bl">'+esc(x.label)+'</div></div>'; }).join('');
    var chart='<div class="rev-sec">Posledních 24 měsíců</div><div class="rev-bars">'+bars+'</div>';
    b.innerHTML=cards+chart+'<div style="font-size:11px;color:var(--muted);margin-top:14px">Částky jsou vč. DPH (v závorce bez DPH, sazba 21 %). Zdroj: SIS'+(d.generatedAt?(' · '+new Date(d.generatedAt).toLocaleString('cs-CZ')):'')+'</div>';
  }
  function openTxTable(period, plabel){
    var b=document.getElementById('rev-body'); if(!b) return;
    b.innerHTML='<button class="btn btn-g" style="width:auto;margin-bottom:12px" onclick="renderRevenue(_revData)">← Zpět na přehled</button><div class="loading">Načítám transakce…</div>';
    fetch(API+'/external-reps/me/kiosk-revenue/transactions?code='+encodeURIComponent(_revCode)+'&period='+encodeURIComponent(period)+'&t='+encodeURIComponent(getToken()))
      .then(function(r){ return r.json().then(function(j){return {ok:r.ok,j:j};}); })
      .then(function(res){ if(!res.ok) throw new Error((res.j&&res.j.error)||'Chyba'); renderTxTable(res.j, plabel); })
      .catch(function(e){ b.innerHTML='<button class="btn btn-g" style="width:auto;margin-bottom:12px" onclick="renderRevenue(_revData)">← Zpět</button><div class="err">'+esc(e.message||'Chyba')+'</div>'; });
  }
  function renderTxTable(d, plabel){
    var b=document.getElementById('rev-body'); if(!b) return;
    var cur=d.currency||'CZK';
    function m(n){ return (Math.round(n||0)).toLocaleString('cs-CZ')+' '+cur; }
    var txs=d.transactions||[];
    var head='<button class="btn btn-g" style="width:auto;margin-bottom:12px" onclick="renderRevenue(_revData)">← Zpět na přehled</button>'+
      '<div style="font-weight:800;margin-bottom:2px">'+esc(plabel)+' — '+txs.length+' transakcí</div>'+
      '<div class="rev-s" style="margin-bottom:10px">Součet úspěšných: '+m(d.successfulSum)+(d.truncated?(' · zobrazeno max '+txs.length):'')+'</div>';
    if(!txs.length){ b.innerHTML=head+'<div class="empty">Žádné transakce v tomto období.</div>'; return; }
    var rows=txs.map(function(t){
      var ok=String(t.status)==='Successful';
      var dt=t.datetime?new Date(t.datetime).toLocaleString('cs-CZ'):'';
      return '<tr><td style="padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap">'+esc(dt)+'</td>'+
        '<td style="padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;font-weight:700">'+m(t.amount)+'</td>'+
        '<td style="padding:6px 8px;border-bottom:1px solid var(--line);color:'+(ok?'var(--green)':'#ef4444')+'">'+esc(t.status||'')+'</td></tr>';
    }).join('');
    b.innerHTML=head+'<div style="overflow:auto;max-height:52vh"><table style="width:100%;border-collapse:collapse;font-size:12.5px"><thead><tr><th style="text-align:left;padding:6px 8px;color:var(--muted2)">Čas</th><th style="text-align:right;padding:6px 8px;color:var(--muted2)">Částka</th><th style="text-align:left;padding:6px 8px;color:var(--muted2)">Stav</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  window.openTxTable=openTxTable; window.renderTxTable=renderTxTable;
  window.openRevenue=openRevenue; window.closeRevenue=closeRevenue; window.renderRevenue=renderRevenue;

  // ─── Nastavení obchodníka (⚙️) ───
  function openSettings(){
    var ov=document.createElement('div'); ov.className='modal-ovl'; ov.id='set-modal'; ov.style.alignItems='flex-start'; ov.style.overflowY='auto'; ov.style.padding='16px';
    ov.innerHTML='<div class="modal-card" style="border-radius:16px;max-width:520px;margin:auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3 style="margin:0;font-size:17px">⚙️ Nastavení</h3><button onclick="closeSettings()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1">✕</button></div><div id="set-body"><div class="loading">Načítám…</div></div></div>';
    document.body.appendChild(ov);
    fetch(API+'/external-reps/me/profile?t='+encodeURIComponent(getToken())).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});}).then(function(res){ if(!res.ok) throw new Error(res.j&&res.j.error||''); renderSettings(res.j); }).catch(function(){ var b=document.getElementById('set-body'); if(b) b.innerHTML='<div class="err">Nepodařilo se načíst.</div>'; });
  }
  function closeSettings(){ var m=document.getElementById('set-modal'); if(m)m.remove(); }
  function renderSettings(p){
    var b=document.getElementById('set-body'); if(!b) return;
    function fld(l,inner){ return '<div class="field"><label>'+l+'</label>'+inner+'</div>'; }
    function ck(id,on,l){ return '<label class="ck"><input type="checkbox" id="'+id+'"'+(on?' checked':'')+'>'+l+'</label>'; }
    b.innerHTML=
      '<div class="lbl" style="margin-bottom:4px">Přihlašovací jméno</div><div class="ct-sub" style="margin-bottom:10px">'+esc(p.login||'—')+'</div>'+
      fld('E-mail', '<input id="set-email" type="email" value="'+esc(p.email)+'">')+
      fld('Telefon', '<input id="set-tel" value="'+esc(p.telefon)+'">')+
      fld('Adresa', '<input id="set-adr" value="'+esc(p.adresa)+'">')+
      fld('Fakturační adresa', '<input id="set-fakt" value="'+esc(p.fakturacni_adresa)+'">')+
      '<div class="lbl">Notifikace</div>'+
      fld('E-mail pro notifikace', '<input id="set-notmail" type="email" value="'+esc(p.notify_email)+'" placeholder="kam chodí notifikace">')+
      ck('set-n1', p.notify_contact_open, 'Když můj kontakt otevře portál')+
      ck('set-n2', p.notify_contact_request, 'Když kontakt požádá o telefonát')+
      ck('set-n3', p.notify_reservation, 'Nová rezervace u mého kontaktu')+
      '<div class="ct-actions" style="margin-top:12px"><button class="btn btn-p" style="width:auto" onclick="saveSettings()">💾 Uložit</button></div>'+
      '<div class="lbl" style="margin-top:16px">Změna hesla</div>'+
      fld('Nové heslo'+(p.has_password?' (nastaveno)':''), '<input id="set-pw" type="password" autocomplete="new-password" placeholder="'+(p.has_password?'nové heslo':'zadej heslo')+'">')+
      '<div class="ct-actions"><button class="btn btn-g" style="width:auto" onclick="savePassword()">🔑 Uložit heslo</button></div>';
  }
  async function saveSettings(){
    var body={ t:getToken(),
      email:(document.getElementById('set-email')||{}).value||'',
      telefon:(document.getElementById('set-tel')||{}).value||'',
      adresa:(document.getElementById('set-adr')||{}).value||'',
      fakturacni_adresa:(document.getElementById('set-fakt')||{}).value||'',
      notify_email:(document.getElementById('set-notmail')||{}).value||'',
      notify_contact_open:!!(document.getElementById('set-n1')||{}).checked,
      notify_contact_request:!!(document.getElementById('set-n2')||{}).checked,
      notify_reservation:!!(document.getElementById('set-n3')||{}).checked
    };
    try { var r=await fetch(API+'/external-reps/me/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); var j=await r.json().catch(function(){return{};}); if(!r.ok||!j.ok) throw new Error(j.error||('HTTP '+r.status)); alert('Uloženo.'); }
    catch(e){ alert('Uložení selhalo: '+(e.message||'')); }
  }
  async function savePassword(){
    var pw=(document.getElementById('set-pw')||{}).value||'';
    if(pw.length<4){ alert('Heslo musí mít aspoň 4 znaky.'); return; }
    try { var r=await fetch(API+'/external-reps/me/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:getToken(),password:pw})}); var j=await r.json().catch(function(){return{};}); if(!r.ok||!j.ok) throw new Error(j.error||('HTTP '+r.status)); alert('Heslo uloženo.'); var el=document.getElementById('set-pw'); if(el) el.value=''; }
    catch(e){ alert('Uložení hesla selhalo: '+(e.message||'')); }
  }
  window.openSettings=openSettings; window.closeSettings=closeSettings; window.saveSettings=saveSettings; window.savePassword=savePassword;

  function openPhoto(url){ if(!url) return; var ov=document.createElement('div'); ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out'; ov.onclick=function(){ ov.remove(); }; ov.innerHTML='<img src="'+esc(url)+'" style="max-width:96vw;max-height:92vh;object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)">'; document.body.appendChild(ov); }
  window.openPhoto=openPhoto;

  // Start — auto-login z e-mailového odkazu (?t=token)
  var _urlTok = new URLSearchParams(location.search).get('t');
  if(_urlTok){ setToken(_urlTok); try{ history.replaceState(null,'','/obchodnik-ext'); }catch(e){} }
  if(getToken()) loadPortal(); else doLogout();
</script>
</body>

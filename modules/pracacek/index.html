<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pracáček | HOLYOS</title>
  <link rel="icon" type="image/svg+xml" href="../../logo-holyos-icon.svg">
  <base href="../../">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .main-wrapper { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; display: flex; flex-direction: column; }
    .page-header {
      display:flex; align-items:center; gap:12px; padding:20px 24px;
      border-bottom:1px solid var(--border); flex-wrap:wrap;
    }
    .page-header h1 { font-size:18px; font-weight:700; margin:0; }
    .page-header .count { font-size:13px; color:var(--text2); margin-left:4px; }
    .content { padding:0 24px 24px; }

    .tabs { display:flex; gap:2px; border-bottom:1px solid var(--border); margin:16px 0; flex-wrap:wrap; }
    .tab { padding:10px 16px; background:transparent; border:none; color:var(--text2); font-size:13px; font-weight:500; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
    .tab:hover { color:var(--text); }
    .tab.active { color:#6366f1; border-bottom-color:#6366f1; }
    .tab-panel { display:none; }
    .tab-panel.active { display:block; }

    .btn { padding:8px 18px; border-radius:8px; border:1px solid var(--border); font-size:13px; font-weight:500; cursor:pointer; background:transparent; color:var(--text); display:inline-flex; align-items:center; gap:6px; }
    .btn-primary { background:#6366f1; color:#fff; border-color:#6366f1; }
    .btn-primary:hover { background:#4f46e5; }
    .btn-secondary { background:var(--surface2); }
    .btn-secondary:hover { background:var(--border); }
    .btn-danger { background:rgba(239,68,68,0.15); color:#ef4444; border-color:rgba(239,68,68,0.3); }
    .btn-sm { padding:5px 12px; font-size:12px; }

    .stats-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
    .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
    .stat-card .stat-label { font-size:11px; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
    .stat-card .stat-value { font-size:22px; font-weight:700; }

    .data-table { width:100%; border-collapse:separate; border-spacing:0; }
    .data-table th { background:var(--surface2); padding:10px 12px; text-align:left; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:var(--text2); border-bottom:1px solid var(--border); }
    .data-table td { padding:10px 12px; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:middle; }
    .data-table tr:hover td { background:rgba(99,102,241,0.06); }

    .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:500; }
    .b-proposed   { background:rgba(148,163,184,0.15); color:#94a3b8; }
    .b-accepted   { background:rgba(14,165,233,0.15); color:#0ea5e9; }
    .b-progress   { background:rgba(245,158,11,0.18); color:#f59e0b; }
    .b-blocked    { background:rgba(239,68,68,0.18); color:#ef4444; }
    .b-done       { background:rgba(34,197,94,0.15); color:#22c55e; }
    .b-cancelled  { background:rgba(148,163,184,0.10); color:#64748b; }
    .b-platform-ios { background:rgba(99,102,241,0.15); color:#6366f1; }
    .b-platform-android { background:rgba(34,197,94,0.15); color:#22c55e; }

    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:200; display:flex; align-items:center; justify-content:center; }
    .modal { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:28px; width:560px; max-width:95vw; max-height:90vh; overflow-y:auto; }
    .modal h2 { font-size:18px; margin-bottom:16px; }
    .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; padding-top:16px; border-top:1px solid var(--border); }

    .activation-code { font-family:monospace; font-size:36px; font-weight:700; letter-spacing:6px; text-align:center; padding:18px; background:rgba(99,102,241,0.1); border:2px dashed #6366f1; border-radius:12px; color:#a5b4fc; margin:18px 0; }
    .activation-meta { text-align:center; color:var(--text2); font-size:12px; margin-bottom:8px; }

    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .form-group { display:flex; flex-direction:column; gap:4px; }
    .form-group.full { grid-column:1 / -1; }
    .form-group label { font-size:12px; font-weight:500; color:var(--text2); }
    .form-group input, .form-group select, .form-group textarea { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 12px; color:var(--text); font-size:14px; font-family:inherit; }
    .form-group textarea { min-height:90px; resize:vertical; }

    .empty-state { text-align:center; padding:60px 20px; color:var(--text2); }
    .empty-state .empty-icon { font-size:48px; margin-bottom:12px; }

    .live-row { display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:10px; margin-bottom:8px; }
    .live-row .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#6366f1,#0ea5e9); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; flex-shrink:0; }
    .live-row .info { flex:1; min-width:0; }
    .live-row .name { font-weight:600; font-size:14px; }
    .live-row .meta { font-size:12px; color:var(--text2); margin-top:2px; }
    .live-row .stats { font-size:12px; color:var(--text2); }
    .live-row .stats b { color:var(--text); font-weight:600; }

    .filter-row { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
    .filter-row input, .filter-row select { background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:7px; padding:6px 10px; font-size:12px; }
  </style>
</head>
<body>
  <div id="sidebar"></div>
  <div class="main-wrapper">
    <div class="page-header">
      <span style="font-size:28px;">📱</span>
      <div>
        <h1>Pracáček <span class="count" id="prc-count"></span></h1>
        <div style="font-size:12px; color:var(--text2); margin-top:2px;">Mobilní aplikace — denní plán, úkoly, docházka</div>
      </div>
      <div style="margin-left:auto; display:flex; gap:8px;">
        <button class="btn btn-secondary btn-sm" id="prc-refresh">↻ Obnovit</button>
      </div>
    </div>

    <div class="content">
      <div class="tabs">
        <button class="tab active" data-tab="today">📅 Dnes</button>
        <button class="tab" data-tab="tasks">✅ Úkoly</button>
        <button class="tab" data-tab="devices">📱 Zařízení</button>
        <button class="tab" data-tab="skills">⭐ Skill profily</button>
        <button class="tab" data-tab="fences">🗺️ Geo fence</button>
      </div>

      <div class="tab-panel active" id="tab-today">
        <div class="stats-row" id="today-stats"></div>
        <div id="today-list"></div>
      </div>

      <div class="tab-panel" id="tab-tasks">
        <div class="filter-row">
          <button class="btn btn-primary btn-sm" id="btn-new-task">+ Nový úkol pro kolegu</button>
          <select id="task-filter-status">
            <option value="">Všechny stavy</option>
            <option value="proposed">Navržené</option>
            <option value="accepted">Přijaté</option>
            <option value="in_progress">Probíhá</option>
            <option value="blocked">Blokované</option>
            <option value="done">Hotové</option>
          </select>
        </div>
        <div id="tasks-table-wrap"></div>
      </div>

      <div class="tab-panel" id="tab-devices">
        <div class="filter-row">
          <button class="btn btn-primary btn-sm" id="btn-activate-device">+ Aktivovat zařízení</button>
        </div>
        <div id="devices-table-wrap"></div>
      </div>

      <div class="tab-panel" id="tab-skills">
        <div id="skills-list"></div>
      </div>

      <div class="tab-panel" id="tab-fences">
        <div class="filter-row">
          <button class="btn btn-primary btn-sm" id="btn-new-fence">+ Nový provoz (geo fence)</button>
        </div>
        <div id="fences-list"></div>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="js/sidebar.js"></script>
  <script>renderSidebar('pracacek');</script>
  <script src="modules/pracacek/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Požadavky | HOLYOS</title>
  <link rel="icon" type="image/svg+xml" href="../../logo-holyos-icon.svg">
  <base href="../../">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .main-wrapper { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; display: flex; flex-direction: column; }

    .tasks-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
    .tasks-toolbar select { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 12px; }

    /* Záložky: Aktivní / Archiv / Koš */
    .tasks-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .tasks-tab {
      padding: 10px 18px; background: transparent; border: none; color: var(--text2);
      font-size: 13px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent;
      margin-bottom: -1px; transition: color 0.15s, border-color 0.15s;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .tasks-tab:hover { color: var(--text); }
    .tasks-tab.active { color: #a78bfa; border-bottom-color: #a78bfa; }
    .tasks-tab .tab-count {
      display: inline-block; min-width: 20px; padding: 1px 7px; border-radius: 10px;
      background: var(--surface2); color: var(--text); font-size: 11px; font-weight: 700;
    }
    .tasks-tab.active .tab-count { background: rgba(168,139,250,0.2); color: #a78bfa; }

    /* Task karty — levý akcentovaný pruh podle stavu, barva karty jemně podle stavu */
    .task-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px 20px 16px 20px; margin-bottom: 12px; transition: all 0.2s;
      border-left: 4px solid var(--border); position: relative;
    }
    .task-card:hover { border-color: rgba(108,92,231,0.3); transform: translateX(2px); }
    .task-card.status-new         { border-left-color: #a78bfa; background: linear-gradient(90deg, rgba(168,139,250,0.06), var(--surface) 80px); }
    .task-card.status-in_progress { border-left-color: #3b82f6; background: linear-gradient(90deg, rgba(59,130,246,0.06), var(--surface) 80px); }
    .task-card.status-done        { border-left-color: #22c55e; background: linear-gradient(90deg, rgba(34,197,94,0.05), var(--surface) 80px); opacity: 0.85; }
    .task-card.status-cancelled   { border-left-color: #9ca3af; background: linear-gradient(90deg, rgba(156,163,175,0.05), var(--surface) 80px); opacity: 0.7; }
    .task-card.trashed            { opacity: 0.6; }

    .task-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .task-title { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.4; flex: 1; }
    .task-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }

    /* Výraznější status badge — větší, s glow efektem */
    .task-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.3px; text-transform: uppercase;
      border: 1px solid currentColor; box-shadow: 0 0 0 2px transparent;
    }
    .task-badge.new         { background: rgba(168,139,250,0.18); color: #a78bfa; box-shadow: 0 0 12px rgba(168,139,250,0.25); }
    .task-badge.in_progress { background: rgba(59,130,246,0.18); color: #3b82f6; box-shadow: 0 0 12px rgba(59,130,246,0.3); animation: pulse-blue 2s infinite; }
    .task-badge.done        { background: rgba(34,197,94,0.18); color: #22c55e; }
    .task-badge.cancelled   { background: rgba(156,163,175,0.18); color: #9ca3af; }
    .task-badge.deleted     { background: rgba(239,68,68,0.15); color: #ef4444; border-color: rgba(239,68,68,0.4); }

    @keyframes pulse-blue {
      0%, 100% { box-shadow: 0 0 12px rgba(59,130,246,0.3); }
      50%      { box-shadow: 0 0 20px rgba(59,130,246,0.55); }
    }

    .task-page-badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 10px; background: rgba(108,92,231,0.1); color: #a78bfa; }
    .task-time { font-size: 11px; color: var(--text2); }
    .task-user { font-size: 11px; color: var(--text2); }
    /* Řešitel — kdo na úkolu právě pracuje */
    .task-assignee {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; padding: 2px 8px; border-radius: 10px;
      background: rgba(59,130,246,0.12); color: #60a5fa;
      border: 1px solid rgba(59,130,246,0.3); font-weight: 600;
    }
    .task-assignee.unassigned { background: rgba(156,163,175,0.1); color: var(--text2); border-color: var(--border); font-weight: 500; font-style: italic; }
    .task-assignee.ai { background: rgba(14,165,233,0.12); color: #38bdf8; border-color: rgba(14,165,233,0.35); }

    .task-desc { font-size: 13px; color: var(--text); line-height: 1.5; white-space: pre-line; margin-bottom: 10px; }
    .task-screenshot { border-radius: 8px; overflow: hidden; border: 1px solid var(--border); max-width: 300px; margin-bottom: 10px; cursor: pointer; }
    .task-screenshot img { width: 100%; height: auto; display: block; }

    .task-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .task-btn { padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid; transition: all 0.2s; }
    .task-btn-deploy { background: rgba(108,92,231,0.15); color: #a78bfa; border-color: rgba(108,92,231,0.3); }
    .task-btn-deploy:hover { background: rgba(108,92,231,0.3); }
    .task-btn-status { background: rgba(59,130,246,0.1); color: #3b82f6; border-color: rgba(59,130,246,0.2); }
    .task-btn-status:hover { background: rgba(59,130,246,0.2); }
    .task-btn-delete { background: rgba(239,68,68,0.1); color: #ef4444; border-color: rgba(239,68,68,0.2); }
    .task-btn-delete:hover { background: rgba(239,68,68,0.2); }
    .task-btn-thread { background: rgba(168,139,250,0.1); color: #a78bfa; border-color: rgba(168,139,250,0.3); }
    .task-btn-thread:hover { background: rgba(168,139,250,0.25); }
    .task-btn-chat { background: rgba(34,197,94,0.1); color: #22c55e; border-color: rgba(34,197,94,0.3); }
    .task-btn-chat:hover { background: rgba(34,197,94,0.25); }
    .task-btn-restore { background: rgba(168,139,250,0.12); color: #a78bfa; border-color: rgba(168,139,250,0.3); }
    .task-btn-restore:hover { background: rgba(168,139,250,0.25); }
    .task-btn-hard-delete { background: rgba(239,68,68,0.2); color: #ef4444; border-color: rgba(239,68,68,0.5); font-weight: 700; }
    .task-btn-hard-delete:hover { background: rgba(239,68,68,0.35); }

    .stats-bar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .stat-mini { padding: 8px 14px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; }
    .stat-mini strong { font-size: 16px; }

    .empty-tasks { text-align: center; padding: 60px 20px; color: var(--text2); }
    .empty-tasks-icon { font-size: 48px; margin-bottom: 12px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 999; }
    .modal { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 700px; width: 95%; max-height: 85vh; overflow-y: auto; }
    .modal h3 { margin-bottom: 12px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

    .spec-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; font-size: 12px;
      font-family: 'Consolas', monospace; white-space: pre-wrap; line-height: 1.5; max-height: 400px; overflow-y: auto; }

    .screenshot-modal img { max-width: 100%; max-height: 80vh; border-radius: 8px; }

    @media (max-width: 768px) {
      .main-wrapper { margin-left: 0 !important; }
      .module-header { padding: 14px 16px 12px 56px !important; }
      .module-header h1 { font-size: 17px !important; }
      .module-body { padding: 12px 14px !important; }
      .stats-bar { flex-wrap: nowrap; overflow-x: auto; }
      .stat-mini { flex-shrink: 0; }
      .task-card { padding: 12px 14px; }
      .task-header { flex-direction: column; gap: 6px; }
      .task-actions { flex-wrap: wrap; }
      .task-screenshot { max-width: 100%; }
      .modal-overlay { align-items: flex-end; }
      .modal { max-width: 100% !important; width: 100% !important; border-radius: 14px 14px 0 0 !important; }
    }
  </style>
</head>
<body>
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-wrapper">
    <div class="module-header">
      <div class="module-icon" style="background: linear-gradient(135deg, #6c5ce7, #ef4444);">📋</div>
      <div>
        <h1>Požadavky na úpravy</h1>
        <p>Přehled požadavků z AI asistenta — zadání, screenshoty, nasazení</p>
      </div>
    </div>

    <div class="module-body" style="padding: 20px 32px;">
      <div class="stats-bar" id="stats-bar"></div>

      <div class="tasks-tabs" id="tasks-tabs">
        <button class="tasks-tab active" data-view="active" onclick="switchView('active')">
          🟢 Aktivní <span class="tab-count" id="count-active">0</span>
        </button>
        <button class="tasks-tab" data-view="archive" onclick="switchView('archive')">
          ✅ Archiv <span class="tab-count" id="count-archive">0</span>
        </button>
        <button class="tasks-tab" data-view="trash" onclick="switchView('trash')">
          🗑️ Koš <span class="tab-count" id="count-trash">0</span>
        </button>
      </div>

      <div class="tasks-toolbar" id="tasks-toolbar" style="display:none;">
        <select id="filter-status" onchange="loadTasks()">
          <option value="">Všechny stavy</option>
          <option value="new">Nové</option>
          <option value="in_progress">Rozpracované</option>
        </select>
      </div>

      <div id="tasks-list"></div>
    </div>
  </div>

  <div id="modal-root"></div>

  <script>
    var s = document.createElement('script');
    s.src = '/js/sidebar.js?v=' + Date.now();
    s.onload = function() { renderSidebar('admin-tasks'); };
    document.head.appendChild(s);
  </script>

  <script>
    let tasks = [];
    let currentView = 'active'; // active | archive | trash

    function switchView(view) {
      currentView = view;
      document.querySelectorAll('.tasks-tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
      // Filtr "status" má smysl jen v active view
      document.getElementById('tasks-toolbar').style.display = view === 'active' ? 'flex' : 'none';
      loadTasks();
    }

    async function loadTasks() {
      const params = new URLSearchParams({ view: currentView });
      if (currentView === 'active') {
        const status = document.getElementById('filter-status').value;
        if (status) params.set('status', status);
      }
      // List + stats PARALELNĚ — neblokují se navzájem
      const [tasksResp, statsResp] = await Promise.all([
        fetch('/api/admin-tasks?' + params.toString()),
        fetch('/api/admin-tasks/stats/summary'),
      ]);
      tasks = await tasksResp.json();
      // Auto-backfill suitability score pro tasky bez score (1× per session)
      maybeBackfillSuitability(tasks);
      if (statsResp.ok) {
        const s = await statsResp.json();
        applyStats(s);
      }
      renderTasks();
    }

    function applyStats(s) {
      s = s || {};
      document.getElementById('count-active').textContent = s.active || 0;
      document.getElementById('count-archive').textContent = s.archived || 0;
      document.getElementById('count-trash').textContent = s.trashed || 0;
      renderStats(s);
    }

    function renderStats(s) {
      s = s || {};
      document.getElementById('stats-bar').innerHTML = `
        <div class="stat-mini"><strong style="color:#a78bfa">${s.new || 0}</strong> nových</div>
        <div class="stat-mini"><strong style="color:#3b82f6">${s.in_progress || 0}</strong> rozpracovaných</div>
        <div class="stat-mini"><strong style="color:#22c55e">${s.archived || 0}</strong> v archivu</div>
        <div class="stat-mini"><strong style="color:#9ca3af">${s.trashed || 0}</strong> v koši</div>
      `;
    }

    function renderTasks() {
      const el = document.getElementById('tasks-list');
      if (tasks.length === 0) {
        el.innerHTML = `<div class="empty-tasks"><div class="empty-tasks-icon">📋</div><h3>Žádné požadavky</h3><p>Požadavky se vytvářejí přes AI tlačítko (vpravo nahoře) na každé stránce.</p></div>`;
        return;
      }

      let html = '';
      for (const t of tasks) {
        const desc = t.description.length > 200 ? t.description.substring(0, 200) + '…' : t.description;
        const time = new Date(t.created_at).toLocaleString('cs-CZ');
        const creator = t.creator || null;
        const user = creator ? (creator.display_name || creator.username) : '—';
        const userTitle = creator ? `${creator.display_name || ''} (${creator.username})`.trim() : 'Autor neznámý';

        const isTrashed = !!t.deleted_at;
        const cardClass = 'task-card status-' + t.status + (isTrashed ? ' trashed' : '');
        html += `<div class="${cardClass}">
          <div class="task-header">
            <div class="task-title">#${t.id} — ${escapeHtml(desc.split('\n')[0])}</div>
            <span class="task-badge ${t.status}">${statusLabel(t.status)}</span>
          </div>
          <div class="task-meta">
            ${isTrashed ? '<span class="task-badge deleted">🗑️ V koši</span>' : ''}
            ${(t.assignable_to_ai && !t.active_run) ? '<span class="task-badge" style="background:rgba(14,165,233,0.15);color:#0ea5e9;">🤖 AI Vývojář</span>' : ''}
            ${renderSuitabilityBadge(t)}
            ${renderAssigneeBadge(t)}
            <span class="task-page-badge">📍 ${t.page_title || t.page}</span>
            <span class="task-time">🕐 ${time}</span>
            <span class="task-user" title="${escapeHtml(userTitle)}">👤 ${escapeHtml(user)}</span>
          </div>
          <div class="task-desc">${escapeHtml(desc)}</div>`;

        if (t.has_screenshot) {
          // Thumbnail = stejný endpoint, ale lazy-loadovaný až po kliknutí.
          // Karta zobrazuje placeholder ikonku místo plného obrázku → rychlý render.
          html += `<div class="task-screenshot" onclick="showScreenshot(${t.id})" style="background:rgba(168,139,250,0.08);border:1px solid rgba(168,139,250,0.25);padding:14px;display:flex;align-items:center;gap:10px;max-width:280px;">
            <span style="font-size:28px;">📸</span>
            <div>
              <div style="font-size:13px;font-weight:600;color:var(--text);">Screenshot</div>
              <div style="font-size:11px;color:var(--text2);">Klikni pro zobrazení v plné velikosti</div>
            </div>
          </div>`;
        }

        // Další přílohy (PDF, Word, Excel, …) — uloženy v ai_answers.attachments
        const attachments = (t.ai_answers && Array.isArray(t.ai_answers.attachments)) ? t.ai_answers.attachments : [];
        if (attachments.length) {
          html += `<div style="margin:8px 0;display:flex;flex-direction:column;gap:4px;">`;
          attachments.forEach(a => {
            const icon = attachmentIcon(a);
            const sz = fmtBytes(a.size);
            html += `<a href="${escapeHtml(a.url || '#')}" target="_blank" rel="noopener" download="${escapeHtml(a.name || '')}"
              style="display:inline-flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(168,139,250,0.08);border:1px solid rgba(168,139,250,0.25);border-radius:6px;font-size:12px;color:#e8e8f0;text-decoration:none;max-width:500px;">
              <span style="font-size:16px;flex-shrink:0;">${icon}</span>
              <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(a.name || 'soubor')}</span>
              ${sz ? `<span style="color:var(--text2);font-size:10px;flex-shrink:0;">${sz}</span>` : ''}
            </a>`;
          });
          html += `</div>`;
        }

        const authorBtn = (creator && creator.id !== currentUserId())
          ? `<button class="task-btn task-btn-chat" onclick="msgAuthor(${creator.id})">✉️ Napsat autorovi</button>`
          : '';
        // Akce podle view — v Koši/Archivu jiná sada tlačítek
        let actionButtons = '';
        if (currentView === 'trash') {
          actionButtons = `
            <button class="task-btn task-btn-restore" onclick="restoreTask(${t.id})">↩️ Obnovit</button>
            <button class="task-btn task-btn-thread" onclick="openTaskThread(${t.id})">💬 Diskuze</button>
            ${authorBtn}
            <button class="task-btn task-btn-hard-delete" onclick="hardDeleteTask(${t.id})">🔥 Smazat trvale</button>`;
        } else if (currentView === 'archive') {
          actionButtons = `
            <button class="task-btn task-btn-deploy" onclick="deployTask(${t.id})">🚀 Nasadit s Claude</button>
            <button class="task-btn task-btn-restore" onclick="restoreTask(${t.id})">↩️ Vrátit do aktivních</button>
            <button class="task-btn task-btn-thread" onclick="openTaskThread(${t.id})">💬 Diskuze</button>
            ${authorBtn}
            <button class="task-btn task-btn-delete" onclick="deleteTask(${t.id})">🗑️ Do koše</button>`;
        } else {
          // Pokud je úkol už předán AI Vývojáři, místo "Předat AI" ukážeme
          // "🔁 Změnit AI repo" — backend odmítne reassign, pokud běží run.
          const aiBtn = t.assignable_to_ai
            ? `<button class="task-btn" onclick="reassignAiRepo(${t.id})" title="Změnit cílový repo (jen pokud neběží žádný run)" style="background:rgba(14,165,233,0.15);color:#0ea5e9;">🔁 Změnit AI repo</button>`
            : `<button class="task-btn task-btn-ai" onclick="assignToAi(${t.id})" style="background:rgba(14,165,233,0.15);color:#0ea5e9;">🤖 Předat AI Vývojáři</button>`;
          const acChatBtn = !t.assignable_to_ai
            ? `<button class="task-btn" onclick="openAcChat(${t.id})" title="AI doptá akceptační kritéria v chatu (Fáze 3 z briefu)" style="background:rgba(168,139,250,0.15);color:#a78bfa;">💬 Upřesnit AC s AI</button>`
            : '';
          const evalBtn = (t.ai_suitability_score === null || t.ai_suitability_score === undefined)
            ? `<button class="task-btn" onclick="evaluateSuitability(${t.id})" title="AI Vývojář vyhodnotí, jak vhodný je úkol pro autonomní zpracování" style="background:rgba(249,115,22,0.12);color:#f97316;">✨ Vyhodnotit pro AI</button>`
            : '';
          // Vzít si / Uvolnit — viditelnost kdo úkol řeší. Pokud běží AI run,
          // dáváme přednost zobrazení AI stavu a tlačítko Vzít si schováme,
          // ať si někdo nezačne shazovat AI běh.
          const myId = currentUserId();
          const claimBtn = (!t.active_run && (!t.assigned_to || t.assigned_to === myId))
            ? (t.assigned_to === myId
                ? `<button class="task-btn" onclick="unclaimTask(${t.id})" title="Uvolnit — někdo jiný to může převzít" style="background:rgba(156,163,175,0.15);color:#9ca3af;border-color:rgba(156,163,175,0.3);">🙅 Uvolnit</button>`
                : `<button class="task-btn" onclick="claimTask(${t.id})" title="Převzít úkol — bude vidět že na něm pracuješ" style="background:rgba(59,130,246,0.15);color:#60a5fa;border-color:rgba(59,130,246,0.3);">🙋 Vzít si</button>`)
            : '';
          actionButtons = `
            ${aiBtn}
            ${acChatBtn}
            ${evalBtn}
            ${claimBtn}
            <button class="task-btn task-btn-deploy" onclick="deployTask(${t.id})">🚀 Nasadit s Claude</button>
            <button class="task-btn task-btn-status" onclick="cycleStatus(${t.id})">📌 Změnit stav</button>
            <button class="task-btn task-btn-thread" onclick="openTaskThread(${t.id})">💬 Diskuze</button>
            ${authorBtn}
            <button class="task-btn task-btn-delete" onclick="deleteTask(${t.id})">🗑️ Do koše</button>`;
        }
        html += `<div class="task-actions">${actionButtons}</div></div>`;
      }
      el.innerHTML = html;
    }

    function statusLabel(s) {
      return { new: '🆕 Nový', in_progress: '🔧 Rozpracovaný', done: '✅ Hotový', cancelled: '❌ Zrušený' }[s] || s;
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function attachmentIcon(a) {
      const mime = (a.mime || '').toLowerCase();
      const name = (a.name || '').toLowerCase();
      if (mime.startsWith('image/')) return '🖼️';
      if (mime.includes('pdf') || name.endsWith('.pdf')) return '📕';
      if (mime.includes('word') || mime.includes('msword') || name.endsWith('.docx') || name.endsWith('.doc')) return '📄';
      if (mime.includes('sheet') || mime.includes('excel') || name.endsWith('.xlsx') || name.endsWith('.xls') || name.endsWith('.csv')) return '📊';
      if (mime.includes('zip') || name.endsWith('.zip') || name.endsWith('.rar')) return '🗜️';
      return '📎';
    }

    function fmtBytes(bytes) {
      if (!bytes) return '';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' kB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    async function showScreenshot(id) {
      const t = tasks.find(x => x.id === id);
      if (!t || !t.has_screenshot) return;
      // Screenshot lazy-load — v listu ho nemáme (optimalizace), stáhneme ho teď
      document.getElementById('modal-root').innerHTML = `
        <div class="modal-overlay" onclick="closeModal()">
          <div class="screenshot-modal" onclick="event.stopPropagation()">
            <div style="color:#a78bfa;padding:40px;font-size:14px;">Načítám screenshot…</div>
          </div>
        </div>`;
      try {
        const r = await fetch('/api/admin-tasks/' + id + '/screenshot');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        const modal = document.querySelector('.screenshot-modal');
        if (modal) modal.innerHTML = '<img src="' + data.screenshot + '">';
      } catch (e) {
        const modal = document.querySelector('.screenshot-modal');
        if (modal) modal.innerHTML = '<div style="color:#ef4444;padding:40px;">Chyba při načítání: ' + escapeHtml(e.message) + '</div>';
      }
    }

    function generateTaskSpec(task) {
      let spec = '═══════════════════════════════════════\n';
      spec += 'POŽADAVEK NA ÚPRAVU #' + task.id + '\n';
      spec += '═══════════════════════════════════════\n\n';

      spec += '📍 STRÁNKA: ' + (task.page_title || task.page) + '\n';
      spec += '   URL: ' + task.page + '\n\n';

      spec += '📝 POPIS POŽADAVKU:\n';
      spec += task.description + '\n\n';

      if (task.has_screenshot || task.screenshot) {
        spec += '📸 SCREENSHOT: Přiložen (uživatel nahrál vizuální referenci)\n\n';
      }

      // Další přílohy (PDF, Word, Excel, atd.)
      const atts = (task.ai_answers && Array.isArray(task.ai_answers.attachments)) ? task.ai_answers.attachments : [];
      if (atts.length) {
        spec += '📎 PŘÍLOHY (' + atts.length + '):\n';
        atts.forEach(a => {
          spec += '   • ' + (a.name || 'soubor') + ' — ' + (a.url || '') + '\n';
        });
        spec += '\n';
      }

      if (task.ai_answers && Object.keys(task.ai_answers).length > 0) {
        spec += '💬 UPŘESNĚNÍ OD UŽIVATELE:\n';
        for (const [key, val] of Object.entries(task.ai_answers)) {
          // attachments vyřešeny výše, přeskoč je v upřesnění
          if (key === 'attachments') continue;
          spec += '   • ' + val + '\n';
        }
        spec += '\n';
      }

      // Add page-specific context
      spec += '🔗 KONTEXT STRÁNKY:\n';
      var pageContextMap = {
        'Lidé a HR':            'modules/lide-hr/ (FE) + routes/hr.routes.js (BE). Entity: Person, Department, Attendance, Leave.',
        'Dashboard':            'index.html — úvodní přehled modulů + widgety.',
        'Vytvoření areálu':     'modules/vytvoreni-arealu/ — editor 2D půdorysu (haly, cesty, vjezdy).',
        'Programování výroby':  'modules/programovani-vyroby/ — rozmístění pracovišť a logistických tras.',
        'Simulace výroby':      'modules/simulace-vyroby/ — vizualizace běhu výroby.',
        'Pracovní postup':      'modules/pracovni-postup/ + routes/production.routes.js.',
        'Nákup a sklad':        'modules/nakup-sklad/ + routes/warehouse.routes.js. Entity: Company, Material, PurchaseOrder, Warehouse, Stock, Movement.',
        'Prodejní objednávky':  'modules/prodejni-objednavky/ + routes/sales.routes.js.',
        'Výrobní sloty':        'modules/vyrobni-sloty/ + routes/slots.routes.js. Entity: ProductionSlot (blokování, přiřazení zakázek).',
        'Sklady':               'modules/sklady/ — správa skladů a pozic.',
        'Pracoviště':           'modules/pracoviste/ — konfigurace pracovišť a přiřazení operací.',
        'Vozový park':          'modules/vozovy-park/ + routes/fleet.routes.js. Entity: Vehicle, POV/STK/známky, MCP fleet-server.',
        'CAD výkresy':          'modules/cad-vykresy/ + routes/cad.routes.js. Import ze SolidWorks přes client CAD bridge.',
        'Zprávy':               'modules/chat/ + js/user-chat-widget.js (floating) + routes/messages.routes.js. SSE přes services/notification-bus.js.',
        'AI Agenti':            'modules/ai-agenti/ + routes/ai.routes.js + services/ai/ orchestrator. MCP tools v mcp-servers/.',
        'Dev Hub':              'modules/dev-hub/ — interní vývojářské nástroje.',
        'Kiosky':               'modules/kiosky/ — kioskové obrazovky pro docházku / panely.',
        'Požadavky | HOLYOS':   'modules/admin-tasks/ + routes/admin-tasks.routes.js — tenhle modul.',
        'Historie změn':        'modules/audit-log/ + AuditLog v prisma/schema.prisma — automatický log změn.',
        'Myšlenková mapa':      'modules/holyos-mindmap.html — mindmap celého systému.',
      };
      var ctx = pageContextMap[task.page_title] || ('Stránka: ' + task.page);
      spec += '   ' + ctx + '\n\n';

      spec += '⚙️ TECHNICKÝ KONTEXT:\n';
      spec += '   • Backend: Node.js 18+ + Express 4 (app.js), routy v routes/*.routes.js\n';
      spec += '   • DB: PostgreSQL 14+ přes Prisma 6 (prisma/schema.prisma, client v config/database.js)\n';
      spec += '   • Frontend: Vanilla JS (ES6+), HTML + inline/shared CSS (css/dashboard.css, CSS variables)\n';
      spec += '   • Auth: JWT v HttpOnly cookie, middleware/auth.js (requireAuth), /api/auth/me pro ID\n';
      spec += '   • AI: Anthropic SDK (claude-sonnet-4-6), MCP tools v mcp-servers/\n';
      spec += '   • Realtime: SSE přes /api/notifications/stream, bus v services/notification-bus.js\n';
      spec += '   • Audit: model AuditLog (Prisma), middleware loguje změny\n';
      spec += '   • Hosting: Railway, persistent volume /app/data, deploy přes `railway up`\n\n';

      spec += '💡 PRAVIDLA (viz Výroba/.claude/CLAUDE.md):\n';
      spec += '   • Vždy Prisma, NIKDY raw SQL (kromě specifických raw dotazů s důvodem)\n';
      spec += '   • Include relationships namísto N+1 queries\n';
      spec += '   • Po změně schema.prisma vždy `npx prisma migrate dev --name "popis"`\n';
      spec += '   • Všechny routy (mimo /auth) mají `router.use(requireAuth)`\n';
      spec += '   • Chyby passovat do `next(err)`, ne `res.status(500).send()`\n';
      spec += '   • Validace přes zod (schema.safeParse)\n';
      spec += '   • Frontend — vanilla JS, žádný React/Vue/Angular\n';
      spec += '   • Komentáře, chybové hlášky a commity ČESKY\n';
      spec += '   • Zachovat konzistentní UI (CSS proměnné --primary, --bg, atd.)\n';
      spec += '   • Po dokončení změnit stav úkolu na "Hotový" v tomhle modulu\n';

      return spec;
    }

    function deployTask(id) {
      const task = tasks.find(x => x.id === id);
      if (!task) return;

      const spec = generateTaskSpec(task);
      document.getElementById('modal-root').innerHTML = `
        <div class="modal-overlay" onclick="closeModal()">
          <div class="modal" onclick="event.stopPropagation()">
            <h3>🚀 Nasadit požadavek #${task.id}</h3>
            <p style="font-size:13px;color:var(--text2);margin-bottom:12px;">Zkontrolujte zadání a zkopírujte ho do Claude chatu.</p>
            <div class="spec-box">${escapeHtml(spec)}</div>
            <div class="modal-actions">
              <button class="btn btn-secondary" onclick="closeModal()">Zavřít</button>
              <button class="btn btn-primary" onclick="copyTaskSpec(${task.id})" id="btn-copy-spec">📋 Zkopírovat zadání</button>
            </div>
          </div>
        </div>`;
    }

    function copyTaskSpec(id) {
      const task = tasks.find(x => x.id === id);
      if (!task) return;
      const spec = generateTaskSpec(task);
      navigator.clipboard.writeText(spec).then(() => {
        const btn = document.getElementById('btn-copy-spec');
        if (btn) {
          btn.textContent = '✅ Zkopírováno!';
          btn.style.background = '#00b894';
          btn.style.borderColor = '#00b894';
        }
        // Update task status
        updateTaskStatus(id, 'in_progress');
      });
    }

    async function cycleStatus(id) {
      const task = tasks.find(x => x.id === id);
      if (!task) return;
      const order = ['new', 'in_progress', 'done', 'cancelled'];
      const nextIdx = (order.indexOf(task.status) + 1) % order.length;
      await updateTaskStatus(id, order[nextIdx]);
    }

    async function updateTaskStatus(id, status) {
      await fetch('/api/admin-tasks/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      loadTasks();
    }

    async function deleteTask(id) {

      const r = await fetch('/api/admin-tasks/' + id, { method: 'DELETE' });
      if (!r.ok) { alert('Chyba při mazání'); return; }
      loadTasks();
    }

    async function hardDeleteTask(id) {
      if (!confirm('TRVALE smazat požadavek #' + id + '?\n\nTohle je nevratné — záznam zmizí z databáze včetně všech diskuzí.')) return;
      const r = await fetch('/api/admin-tasks/' + id + '?hard=true', { method: 'DELETE' });
      if (!r.ok) { const err = await r.json().catch(() => ({})); alert('Chyba: ' + (err.error || r.status)); return; }

    // ─── AI Vývojář — předání úkolu autonomnímu agentovi ────────────────────

    async function assignToAi(taskId) {
      const task = tasks.find(x => x.id === taskId);
      if (!task) return;

      let repos = [];
      try {
        const r = await fetch('/api/agent/repos?active=true', { credentials: 'include' });
        if (r.ok) repos = await r.json();
      } catch (_) {}

      if (!repos.length) {
        alert('Žádné aktivní repo pro AI Vývojáře.\n\nPřidej ho v Super Admin → AI Vývojář → Repozitáře.');
        return;
      }

      // Pre-fill akceptační kritéria — pokud už je vyplněné, ponech;
      // jinak postav draft z popisu a názvu úkolu.
      function buildAcDraft(t) {
        if (t.acceptance_criteria && t.acceptance_criteria.trim().length > 0) {
          return t.acceptance_criteria;
        }
        const desc = (t.description || '').trim();
        const firstLine = desc.split('\n')[0].trim();
        const restLines = desc.split('\n').slice(1).join('\n').trim();
        const goal = firstLine || (t.page_title || '').trim() || '(doplň cíl jednou větou)';
        const lines = [];
        lines.push('Cíl: ' + goal);
        lines.push('');
        lines.push('Definice hotovo:');
        lines.push('- ');
        lines.push('- ');
        if (restLines) {
          lines.push('');
          lines.push('Kontext z požadavku:');
          lines.push(restLines);
        }
        lines.push('');
        lines.push('Modul: ' + ((t.affected_module || t.page_title || t.page || 'globální')));
        lines.push('Typ změny: bug_fix | new_feature | refactor | ui_change | documentation');
        return lines.join('\n');
      }
      const acExisting = buildAcDraft(task);
      const repoExisting = task.target_repo_id || repos[0].id;
      const changeTypeExisting = task.change_type || '';
      const autonomyOverrideExisting = task.autonomy_override || '';
      const placeholder = 'Cíl: ...\nDefinice hotovo:\n- \n- \nModul: ...\nTyp změny: bug_fix | new_feature | refactor | ui_change | documentation';

      const optionsHtml = repos.map(function(r) {
        const sel = r.id === repoExisting ? ' selected' : '';
        return '<option value="' + escapeHtml(r.id) + '"' + sel + '>' + escapeHtml(r.name) + ' — ' + escapeHtml(r.git_url) + '</option>';
      }).join('');

      // Pre-fill change_type + autonomy_override do hidden state, použijeme po renderování
      window.__aiAssignPrefill = { changeType: changeTypeExisting, autonomyOverride: autonomyOverrideExisting };
      document.getElementById('modal-root').innerHTML =
        '<div class="modal-overlay" onclick="closeModal()">' +
          '<div class="modal" onclick="event.stopPropagation()">' +
            '<h3>🤖 Předat AI Vývojáři — požadavek #' + task.id + '</h3>' +
            '<p style="font-size:13px;color:var(--text2);margin-bottom:14px;">' +
              'Doplň akceptační kritéria a vyber cílový repozitář. Worker úkol zvedne do 30 s ' +
              '(pokud je Master switch ON v sekci AI Vývojář).' +
            '</p>' +
            '<label style="display:block;font-size:12px;color:var(--text2);margin-bottom:4px;">Cílový repozitář</label>' +
            '<select id="ai-target-repo" style="width:100%;padding:8px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;margin-bottom:12px;font-size:13px;">' +
              optionsHtml +
            '</select>' +
            '<div style="display:flex;gap:12px;margin-bottom:12px;">' +
              '<div style="flex:1;">' +
                '<label style="display:block;font-size:12px;color:var(--text2);margin-bottom:4px;" title="Mix-autonomy: typ změny určuje výchozí autonomy (documentation=full_auto, ui/bug/refactor/feature=pr_review, integration/data_migration=plan_review). Volitelné.">Typ změny</label>' +
                '<select id="ai-change-type" style="width:100%;padding:8px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:13px;">' +
                  '<option value="">(odhadne agent / default)</option>' +
                  '<option value="documentation">documentation — md/docs (full_auto)</option>' +
                  '<option value="ui_change">ui_change — frontend (pr_review)</option>' +
                  '<option value="bug_fix">bug_fix — fix existujícího (pr_review)</option>' +
                  '<option value="refactor">refactor — clean-up (pr_review)</option>' +
                  '<option value="new_feature">new_feature — nová funkce (pr_review)</option>' +
                  '<option value="integration">integration — API/3rd party (plan_review)</option>' +
                  '<option value="data_migration">data_migration — DB schema (plan_review)</option>' +
                '</select>' +
              '</div>' +
              '<div style="flex:1;">' +
                '<label style="display:block;font-size:12px;color:var(--text2);margin-bottom:4px;" title="Per-task override autonomy. Nezávisí na typu změny ani settings. Volitelné.">Autonomy override</label>' +
                '<select id="ai-autonomy-override" style="width:100%;padding:8px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:13px;">' +
                  '<option value="">(použij mapping podle typu)</option>' +
                  '<option value="full_auto">full_auto — bez approvalů</option>' +
                  '<option value="pr_review">pr_review — review až PR</option>' +
                  '<option value="plan_review">plan_review — schvalovat plán PŘED kódem</option>' +
                '</select>' +
              '</div>' +
            '</div>' +
            '<label style="display:block;font-size:12px;color:var(--text2);margin-bottom:4px;">Akceptační kritéria (povinné, min. 20 znaků)</label>' +
            '<textarea id="ai-acceptance" rows="8" placeholder="' + placeholder + '" ' +
              'style="width:100%;padding:8px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;font-family:inherit;font-size:13px;">' + escapeHtml(acExisting) + '</textarea>' +
            '<div class="modal-actions">' +
              '<button class="btn btn-secondary" onclick="closeModal()">Zrušit</button>' +
              '<button class="btn btn-primary" onclick="saveAiAssignment(' + task.id + ')">🚀 Předat AI Vývojáři</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      // Pre-fill change_type + autonomy_override z taska po renderování
      setTimeout(function() {
        const p = window.__aiAssignPrefill || {};
        const ct = document.getElementById('ai-change-type');
        const ao = document.getElementById('ai-autonomy-override');
        if (ct && p.changeType) ct.value = p.changeType;
        if (ao && p.autonomyOverride) ao.value = p.autonomyOverride;
      }, 0);
    }

    async function saveAiAssignment(taskId) {
      const ac = (document.getElementById('ai-acceptance').value || '').trim();
      const repoId = document.getElementById('ai-target-repo').value;
      if (ac.length < 20) { alert('Akceptační kritéria jsou moc krátká. Napiš aspoň 20 znaků.'); return; }
      if (!repoId) { alert('Vyber cílový repozitář.'); return; }
      try {
        // Pokud je úkol ve stavu 'new', posuneme ho na 'in_progress' — AI na něm
        // teď pracuje, takže "Nový" by bylo zavádějící. Status v hotovo vrátíme
        // ručně po review PR (nebo to udělá Fáze 2 přes webhook auto-merge).
        const task = tasks.find((x) => x.id === taskId);
        const changeType = (document.getElementById('ai-change-type') || {}).value || null;
        const autonomyOverride = (document.getElementById('ai-autonomy-override') || {}).value || null;
        const patch = {
          assignable_to_ai: true,
          acceptance_criteria: ac,
          target_repo_id: repoId,
          change_type: changeType,
          autonomy_override: autonomyOverride,
        };
        if (task && task.status === 'new') patch.status = 'in_progress';

        const r = await fetch('/api/admin-tasks/' + taskId, {
          method: 'PUT',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(patch),
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        closeModal();
        alert('✅ Úkol #' + taskId + ' byl předán AI Vývojáři. Worker ho zvedne do 30 s (pokud je Master switch ON).');
        loadTasks();
      } catch (e) { alert('Chyba při ukládání: ' + e.message); }
    }

    // ─── Reassign target_repa (úkol už je v AI Vývojáři) ─────────────────────
    //
    // Backend (PUT /api/admin-tasks/:id) odmítne reassign s 409, pokud existuje
    // aktivní run (RUNNING_STATUSES + pr_open). UX flow: uživatel pak musí
    // cancelnout/uzavřít run v modulu AI Vývojář a reassign zkusit znovu.
    async function reassignAiRepo(taskId) {
      try {
        const task = tasks.find((x) => x.id === taskId);
        if (!task) { alert('Úkol nenalezen.'); return; }

        const reposRes = await fetch('/api/agent/repos', { credentials: 'include' });
        if (!reposRes.ok) { alert('Nelze načíst repozitáře (HTTP ' + reposRes.status + ').'); return; }
        const allRepos = await reposRes.json();
        const repos = (Array.isArray(allRepos) ? allRepos : []).filter(function(r) { return r.active !== false; });
        if (!repos.length) { alert('Žádné aktivní repozitáře. Přidej nejdřív v modulu AI Vývojář.'); return; }

        const optionsHtml = repos.map(function(r) {
          const sel = r.id === task.target_repo_id ? ' selected' : '';
          return '<option value="' + escapeHtml(r.id) + '"' + sel + '>' + escapeHtml(r.name) + ' — ' + escapeHtml(r.git_url) + '</option>';
        }).join('');

        document.getElementById('modal-root').innerHTML =
          '<div class="modal-overlay" onclick="closeModal()">' +
            '<div class="modal" onclick="event.stopPropagation()">' +
              '<h3>🔁 Změnit cílový repo — požadavek #' + task.id + '</h3>' +
              '<p style="font-size:13px;color:var(--text2);margin-bottom:14px;">' +
                'Akceptační kritéria zůstávají. Pokud běží aktivní run, reassign se odmítne se zprávou — nejdřív ho cancelni v modulu AI Vývojář.' +
              '</p>' +
              '<label style="display:block;font-size:12px;color:var(--text2);margin-bottom:4px;">Cílový repozitář</label>' +
              '<select id="ai-reassign-repo" style="width:100%;padding:8px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;margin-bottom:12px;font-size:13px;">' +
                optionsHtml +
              '</select>' +
              '<div class="modal-actions">' +
                '<button class="btn btn-secondary" onclick="closeModal()">Zrušit</button>' +
                '<button class="btn btn-primary" onclick="saveAiReassign(' + task.id + ')">🔁 Reassign</button>' +
              '</div>' +
            '</div>' +
          '</div>';
      } catch (e) {
        alert('Chyba: ' + e.message);
      }
    }

    async function saveAiReassign(taskId) {
      const repoId = document.getElementById('ai-reassign-repo').value;
      if (!repoId) { alert('Vyber repozitář.'); return; }
      try {
        const r = await fetch('/api/admin-tasks/' + taskId, {
          method: 'PUT',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ target_repo_id: repoId }),
        });
        if (r.status === 409) {
          let err = {};
          try { err = await r.json(); } catch (_) {}
          alert((err && err.message) || 'Aktivní AI run blokuje reassign. Cancelni ho v modulu AI Vývojář.');
          return;
        }
        if (!r.ok) { alert('Reassign selhal (HTTP ' + r.status + ').'); return; }
        closeModal();
        await loadTasks();
      } catch (e) {
        alert('Chyba: ' + e.message);
      }
    }

    // ─── AC chat (Fáze 3 z briefu kap. 6) ──────────────────────────────────
    //
    // AI haiku vede konverzaci a doptává akceptační kritéria. Místo statického
    // modalu Předat AI Vývojáři se zadavatel může nejdřív rozhovořit s AI,
    // která průběžně aktualizuje task.acceptance_criteria, change_type, atd.
    // Po finalize se otevře assign modal s předvyplněnými AC.

    let _acChatState = { taskId: null, history: [], currentAc: null, finalized: false };

    async function openAcChat(taskId) {
      try {
        // Načti task pro initial history (ai_questions JSONB)
        const r = await fetch('/api/admin-tasks/' + taskId, { credentials: 'include' });
        if (!r.ok) { alert('Načtení úkolu selhalo: HTTP ' + r.status); return; }
        const task = await r.json();
        _acChatState = {
          taskId: task.id,
          history: Array.isArray(task.ai_questions) ? task.ai_questions : [],
          currentAc: {
            acceptance_criteria: task.acceptance_criteria,
            affected_module: task.affected_module,
            change_type: task.change_type,
            autonomy_override: task.autonomy_override,
          },
          finalized: false,
        };

        renderAcChatModal(task);
      } catch (e) {
        alert('Chyba: ' + e.message);
      }
    }

    function renderAcChatModal(task) {
      const histHtml = renderAcHistory(_acChatState.history);
      const acHtml = renderAcPreview(_acChatState.currentAc);
      const finalizedBanner = _acChatState.finalized
        ? '<div style="background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.4);border-radius:6px;padding:10px;margin-bottom:12px;color:#22c55e;font-size:13px;">' +
          '✅ <strong>AC je hotové.</strong> Klikni „Použít a předat AI Vývojáři" níže.' +
          '</div>'
        : '';

      document.getElementById('modal-root').innerHTML =
        '<div class="modal-overlay" onclick="closeModal()">' +
          '<div class="modal" style="max-width:900px;width:95%;max-height:90vh;display:flex;flex-direction:column;" onclick="event.stopPropagation()">' +
            '<h3>💬 Doptat AC s AI — požadavek #' + task.id + '</h3>' +
            '<p style="font-size:12px;color:var(--text2);margin-bottom:10px;">' +
              'Alan, AI Vývojář se tě postupně zeptá na povinná pole. Tvoje odpovědi jdou rovnou do akceptačních kritérií.' +
              ' <button onclick="resetAcChat(' + task.id + ')" style="font-size:11px;padding:2px 8px;margin-left:8px;background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:4px;cursor:pointer;">↺ Vynulovat konverzaci</button>' +
            '</p>' +
            finalizedBanner +
            '<div id="ac-chat-history" style="flex:1;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px;min-height:200px;max-height:380px;">' +
              histHtml +
            '</div>' +
            '<div id="ac-chat-current-ac" style="margin-bottom:12px;">' + acHtml + '</div>' +
            '<div style="display:flex;gap:8px;">' +
              '<textarea id="ac-chat-input" rows="2" placeholder="Tvoje odpověď nebo upřesnění..." style="flex:1;padding:8px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;font-family:inherit;font-size:13px;" onkeydown="if(event.ctrlKey&&event.key===&quot;Enter&quot;){sendAcChatMessage(' + task.id + ');}"></textarea>' +
              '<button class="btn btn-primary" onclick="sendAcChatMessage(' + task.id + ')" style="align-self:stretch;">📤 Odeslat<br><span style="font-size:10px;opacity:0.7;">Ctrl+Enter</span></button>' +
            '</div>' +
            '<div class="modal-actions">' +
              '<button class="btn btn-secondary" onclick="closeModal()">Zavřít</button>' +
              (_acChatState.finalized
                ? '<button class="btn btn-primary" onclick="closeModal(); setTimeout(()=>assignToAi(' + task.id + '), 50);">🚀 Použít a předat AI Vývojáři</button>'
                : '') +
            '</div>' +
          '</div>' +
        '</div>';

      // Auto-scroll history dolů
      const h = document.getElementById('ac-chat-history');
      if (h) h.scrollTop = h.scrollHeight;

      // Inicialní zpráva, pokud history je prázdná
      if (_acChatState.history.length === 0) {
        document.getElementById('ac-chat-history').innerHTML =
          '<div style="color:var(--text2);font-size:12px;font-style:italic;">' +
          'Napiš krátký popis úkolu nebo otázku, na co se chceš zeptat. Alan začne se základními poli (cíl, definice hotovo, modul, typ změny).' +
          '</div>';
      }
    }

    function renderAcHistory(history) {
      if (!history || history.length === 0) return '';
      const lines = [];
      for (const msg of history) {
        const isUser = msg.role === 'user';
        const txt = typeof msg.content === 'string'
          ? msg.content
          : (Array.isArray(msg.content) ? msg.content.filter(b => b.type === 'text').map(b => b.text).join('\n') : JSON.stringify(msg.content).slice(0, 200));
        if (!txt || !txt.trim()) continue;
        lines.push(
          '<div style="margin-bottom:10px;">' +
            '<div style="font-size:11px;color:' + (isUser ? '#0ea5e9' : '#a78bfa') + ';font-weight:600;margin-bottom:2px;">' +
              (isUser ? '👤 Ty' : '🤖 Alan') +
            '</div>' +
            '<div style="font-size:13px;color:var(--text);white-space:pre-wrap;line-height:1.4;">' +
              escapeHtml(txt) +
            '</div>' +
          '</div>'
        );
      }
      return lines.join('');
    }

    function renderAcPreview(ac) {
      if (!ac) return '';
      const has = ac.acceptance_criteria || ac.affected_module || ac.change_type || ac.autonomy_override;
      if (!has) return '';
      let html = '<details style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;">' +
        '<summary style="cursor:pointer;font-size:12px;color:var(--text2);font-weight:600;">📋 Aktuální AC (klikni pro detail)</summary>' +
        '<div style="margin-top:8px;font-size:12px;">';
      if (ac.acceptance_criteria) {
        html += '<div style="margin-bottom:6px;"><strong>Akceptační kritéria:</strong><br><div style="white-space:pre-wrap;color:var(--text);font-family:ui-monospace,monospace;font-size:11px;background:rgba(0,0,0,0.2);padding:6px;border-radius:4px;margin-top:2px;">' + escapeHtml(ac.acceptance_criteria) + '</div></div>';
      }
      if (ac.affected_module) html += '<div><strong>Modul:</strong> ' + escapeHtml(ac.affected_module) + '</div>';
      if (ac.change_type) html += '<div><strong>Typ změny:</strong> ' + escapeHtml(ac.change_type) + '</div>';
      if (ac.autonomy_override) html += '<div><strong>Autonomy override:</strong> ' + escapeHtml(ac.autonomy_override) + '</div>';
      html += '</div></details>';
      return html;
    }

    async function sendAcChatMessage(taskId) {
      const input = document.getElementById('ac-chat-input');
      const message = (input && input.value || '').trim();
      if (!message) { alert('Napiš zprávu.'); return; }
      const btn = document.querySelector('[onclick*="sendAcChatMessage"]');
      if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Alan přemýšlí...'; }
      try {
        const r = await fetch('/api/admin-tasks/' + taskId + '/ac-chat', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        if (!r.ok) {
          let err = {};
          try { err = await r.json(); } catch (_) {}
          alert((err && err.error) || ('HTTP ' + r.status));
          return;
        }
        const data = await r.json();

        // Update state
        // Backend uložil novou history do task.ai_questions. Pro UI ji rekonstruujeme.
        _acChatState.history.push({ role: 'user', content: message });
        _acChatState.history.push({ role: 'assistant', content: data.ai_message });
        _acChatState.currentAc = data.current_ac;
        _acChatState.finalized = !!data.finalized || _acChatState.finalized;

        if (data.escalate) {
          alert('🛑 Doporučení AI: ' + (data.escalate_reason || 'Úkol není zralý, přiřaď člověku.'));
        }

        // Re-render — vyrobíme dočasný task obj kvůli signature
        renderAcChatModal({ id: taskId });
      } catch (e) {
        alert('Chyba: ' + e.message);
      } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = '📤 Odeslat<br><span style="font-size:10px;opacity:0.7;">Ctrl+Enter</span>'; }
      }
    }

    async function resetAcChat(taskId) {
      if (!confirm('Vynulovat konverzaci s Alanem? AC pole zůstanou, ale historie zmizí.')) return;
      try {
        await fetch('/api/admin-tasks/' + taskId + '/ac-chat', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reset: true, message: '__reset__' }),
        });
        _acChatState.history = [];
        _acChatState.finalized = false;
        renderAcChatModal({ id: taskId });
      } catch (e) {
        alert('Reset selhal: ' + e.message);
      }
    }

    // ─── Řešitel (assignee) — kdo na úkolu právě pracuje ───────────────────
    function renderAssigneeBadge(t) {
      // Mapování stavů AI runu na lidsky čitelný štítek
      const aiLabelMap = {
        queued: 'Ve frontě', triaging: 'Triage', awaiting_clarification: 'Čeká na doplnění',
        planning: 'Plán', awaiting_approval: 'Schválit plán',
        coding: 'Píše kód', testing: 'Testuje',
        pr_open: 'PR otevřen', merged: 'Mergnuto', completed: 'Hotovo',
        failed: 'Chyba', cancelled: 'Zrušeno', escalated: 'Eskalováno',
      };
      // Aktivní AI run má přednost před lidským řešitelem
      if (t.active_run) {
        const r = t.active_run;
        const lbl = aiLabelMap[r.status] || r.status;
        const repo = (r.repo && r.repo.name) ? ' · ' + r.repo.name : '';
        const title = 'AI Vývojář — run ' + r.id + ' (' + r.status + ')' + repo;
        return '<span class="task-assignee ai" title="' + escapeHtml(title) + '">🤖 ' + escapeHtml(lbl) + (r.pr_url ? ' · 🔗 PR' : '') + '</span>';
      }
      // Lidský řešitel
      if (t.assignee) {
        const name = t.assignee.display_name || t.assignee.username;
        const since = t.assigned_at ? new Date(t.assigned_at).toLocaleString('cs-CZ') : '';
        const title = 'Pracuje: ' + name + (since ? ' (od ' + since + ')' : '');
        return '<span class="task-assignee" title="' + escapeHtml(title) + '">👷 ' + escapeHtml(name) + '</span>';
      }
      // Nikdo zatím
      if (t.status === 'in_progress') {
        return '<span class="task-assignee unassigned" title="Stav je rozpracovaný, ale není přiřazen žádný řešitel">⚠️ Bez řešitele</span>';
      }
      return '<span class="task-assignee unassigned" title="Úkol čeká na řešitele">— Nikdo</span>';
    }

    async function claimTask(taskId) {
      try {
        const r = await fetch('/api/admin-tasks/' + taskId + '/claim', {
          method: 'POST', credentials: 'include',
        });
        if (!r.ok) { alert('Převzetí selhalo: HTTP ' + r.status); return; }
        await loadTasks();
      } catch (e) { alert('Chyba: ' + e.message); }
    }

    async function unclaimTask(taskId) {
      if (!confirm('Uvolnit úkol #' + taskId + '? Někdo jiný si ho bude moct vzít.')) return;
      try {
        const r = await fetch('/api/admin-tasks/' + taskId + '/unclaim', {
          method: 'POST', credentials: 'include',
        });
        if (!r.ok) { alert('Uvolnění selhalo: HTTP ' + r.status); return; }
        await loadTasks();
      } catch (e) { alert('Chyba: ' + e.message); }
    }

    // ─── AI Suitability scoring (Fáze 4) ───────────────────────────────────
    function renderSuitabilityBadge(t) {
      if (t.ai_suitability_score === null || t.ai_suitability_score === undefined) return '';
      const s = t.ai_suitability_score;
      let color, label;
      if (s >= 70) { color = '#22c55e'; label = '🤖✓ AI: ' + s + '%'; }
      else if (s >= 40) { color = '#f59e0b'; label = '🤖? AI: ' + s + '%'; }
      else { color = '#ef4444'; label = '👤 AI: ' + s + '%'; }
      const reasoning = t.ai_suitability_reasoning ? escapeHtml(t.ai_suitability_reasoning) : '';
      return '<span class="task-badge" style="background:' + color + '22;color:' + color + ';border-color:' + color + ';" title="' + reasoning + '">' + label + '</span>';
    }

    async function evaluateSuitability(taskId) {
      try {
        const r = await fetch('/api/admin-tasks/' + taskId + '/evaluate-suitability', {
          method: 'POST', credentials: 'include',
        });
        if (!r.ok) { alert('Vyhodnocení selhalo: HTTP ' + r.status); return; }
        const data = await r.json();
        alert('🤖 AI suitability: ' + (data.ai_suitability_score !== null ? data.ai_suitability_score + '%' : '?') + '\n\n' + (data.ai_suitability_reasoning || '(bez vysvětlení)'));
        loadTasks();
      } catch (e) {
        alert('Chyba: ' + e.message);
      }
    }

    // Hromadný backfill suitability pro tasky bez score — volá se automaticky
    // při načtení listu (jen 1× per session, aby se nezadřela Anthropic API).
    let _backfilledInSession = false;
    async function maybeBackfillSuitability(tasks) {
      if (_backfilledInSession) return;
      const withoutScore = (tasks || []).filter((t) =>
        t.ai_suitability_score === null || t.ai_suitability_score === undefined
      );
      if (withoutScore.length === 0) return;
      _backfilledInSession = true;
      try {
        const r = await fetch('/api/admin-tasks/backfill-suitability', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ limit: Math.min(withoutScore.length, 20) }),
        });
        if (r.ok) {
          const data = await r.json();
          if (data.evaluated > 0) {
            console.log('[admin-tasks] Backfill suitability spuštěn pro ' + data.evaluated + ' úkolů');
            // Po 30 s reload (score by mělo být v DB)
            setTimeout(() => loadTasks(), 30000);
          }
        }
      } catch (e) {
        console.warn('[admin-tasks] Backfill selhal:', e.message);
      }
    }

    function closeModal() {
      document.getElementById('modal-root').innerHTML = '';
    }

    // ─── Chat integrace ──────────────────────────────────────────────────────

    // JWT je v httpOnly cookie — neumíme ho dekódovat. Místo toho si načteme
    // /api/auth/me jednou při startu modulu a id cache-neme do __meId.
    let __meId = null;
    function currentUserId() {
      if (__meId) return __meId;
      // Fallback pro starší flow (přechodné období, lokální dev se starým tokenem)
      try {
        const t = sessionStorage.getItem('token') || localStorage.getItem('token');
        if (!t) return null;
        return JSON.parse(atob(t.split('.')[1])).id;
      } catch (_) { return null; }
    }
    async function fetchMe() {
      try {
        const r = await fetch('/api/auth/me', { credentials: 'include' });
        if (!r.ok) return;
        const me = await r.json();
        __meId = me.id || (me.user && me.user.id) || null;
      } catch (_) { /* offline / not logged in */ }
    }

    async function openTaskThread(taskId) {
      // Počkej si na widget (užitečné, pokud sidebar.js ještě nedonačítá skripty)
      let tries = 0;
      while (!window.HolyOSChat && tries < 30) { await new Promise(r => setTimeout(r, 100)); tries++; }
      if (window.HolyOSChat && window.HolyOSChat.openTaskChannel) {
        window.HolyOSChat.openTaskChannel(taskId);
      } else {
        // Fallback — přejdi na fullscreen chat
        try {
          const res = await fetch('/api/messages/channels/task/' + taskId, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + (sessionStorage.getItem('token') || localStorage.getItem('token') || '') },
          });
          const ch = await res.json();
          if (ch.id) window.location.href = '/modules/chat/?channel=' + ch.id;
        } catch (e) {
          alert('Chat zatím není k dispozici: ' + e.message);
        }
      }
    }

    async function msgAuthor(userId) {
      let tries = 0;
      while (!window.HolyOSChat && tries < 30) { await new Promise(r => setTimeout(r, 100)); tries++; }
      if (window.HolyOSChat && window.HolyOSChat.openDirectWith) {
        window.HolyOSChat.openDirectWith(userId);
      } else {
        try {
          const res = await fetch('/api/messages/channels/direct', {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + (sessionStorage.getItem('token') || localStorage.getItem('token') || ''),
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ user_id: userId }),
          });
          const ch = await res.json();
          if (ch.id) window.location.href = '/modules/chat/?channel=' + ch.id;
        } catch (e) {
          alert('Chat zatím není k dispozici: ' + e.message);
        }
      }
    }

    // Auto-otevření threadu přes ?task=…
    (function handleTaskQuery() {
      const params = new URLSearchParams(window.location.search);
      const tid = params.get('task');
      if (tid) {
        // Počkej na naloaďování úkolů, pak otevři thread
        const checker = setInterval(() => {
          if (tasks.length > 0) {
            clearInterval(checker);
            openTaskThread(parseInt(tid));
          }
        }, 200);
        setTimeout(() => clearInterval(checker), 5000);
      }
    })();

    // Init — paralelně načteme svoje user id (pro claim/unclaim viditelnost)
    // a seznam úkolů. fetchMe je rychlé, takže do prvního renderu většinou stihne.
    fetchMe().then(() => loadTasks());
  </script>
</body>
</html>

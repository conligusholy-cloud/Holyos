<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Vedoucí obchodu — Přehled</title>
<style>
  :root{
    --bg:#0f1115; --surface:#171a21; --surface2:#1f2430; --line:rgba(255,255,255,.09);
    --text:#f2f3f5; --muted:#9aa0ad; --muted2:#6b7280; --primary:#eab308; --primary-d:#1a1408;
    --new:#3b82f6; --contacted:#8b5cf6; --qualified:#eab308; --converted:#22c55e; --rejected:#ef4444;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.45}
  body{padding-bottom:40px}
  .top{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px calc(12px + env(safe-area-inset-top,0)) 16px;display:flex;align-items:center;justify-content:space-between}
  .top h1{font-size:18px;margin:0;font-weight:700}
  .logout{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 12px;font-size:12px;cursor:pointer}
  .wrap{padding:12px 14px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2);margin:22px 0 8px}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
  .stat .v{font-size:26px;font-weight:800}
  .stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
  .row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
  .row-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .name{font-weight:700;font-size:15.5px}
  .pct{font-weight:800;font-size:16px;color:var(--converted)}
  .bar{display:flex;height:8px;border-radius:6px;overflow:hidden;margin-top:10px;background:var(--surface2)}
  .bar span{display:block;height:100%}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11.5px;color:var(--muted)}
  .legend b{color:var(--text);font-weight:600}
  .sub{font-size:12px;color:var(--muted);margin-top:6px}
  .list-item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--surface);font-size:13.5px}
  .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
  .muted{color:var(--muted)}
  .loading,.empty,.err{padding:40px 16px;text-align:center;color:var(--muted)}
  .err{color:#fca5a5}
</style>
</head>
<body>
  <div class="top">
    <h1>Přehled obchodu</h1>
    <button class="logout" onclick="doLogout()">Odhlásit</button>
  </div>
  <div class="wrap" id="content"><div class="loading">Načítám…</div></div>

<script>
  var STATUS = { new:{l:'Nový',c:'var(--new)'}, contacted:{l:'Kontaktován',c:'var(--contacted)'}, qualified:{l:'Kvalifikován',c:'var(--qualified)'}, smlouva_odeslat:{l:'Odeslat dokumentaci',c:'#f97316'}, smlouva_odeslana:{l:'Dokumentace odeslána',c:'#8b5cf6'}, converted:{l:'Převeden',c:'var(--converted)'}, nezajem:{l:'Nemá zájem',c:'#ef4444'}, rejected:{l:'Zamítnut',c:'var(--rejected)'} };
  var RES_STATUS = { hold:'Blokace 1 h', reserved:'Rezervováno', active:'Aktivní', expired:'Vypršelo', cancelled:'Zrušeno', signed:'Podepsáno' };
  var PLABEL = { day:'Den', week:'Týden', month:'Měsíc', year:'Rok' };
  var SELLERS = [];
  function sellerName(s){ return ((s.first_name||'')+' '+(s.last_name||'')).trim() || ('#'+s.id); }
  function fmtMoney(v){ return (v||0).toLocaleString('cs-CZ')+' Kč'; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmtDate(iso){ if(!iso) return '—'; var d=new Date(iso); return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }

  async function init(){
    var box = document.getElementById('content');
    try {
      var meR = await fetch('/api/auth/me', { credentials:'include' });
      if (meR.status === 401){ window.location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname); return; }
      var r = await fetch('/api/compounder/sales-overview', { credentials:'include' });
      if (r.status === 403){ box.innerHTML = '<div class="err">Tato obrazovka je jen pro vedoucího obchodu.</div>'; return; }
      if (!r.ok) throw new Error('HTTP '+r.status);
      var d = await r.json();
      try { var sr = await fetch('/api/compounder/sellers', { credentials:'include' }); SELLERS = sr.ok ? await sr.json() : []; } catch(e){ SELLERS = []; }
      render(d);
    } catch(e){ box.innerHTML = '<div class="err">Nepodařilo se načíst přehled: '+esc(e.message)+'</div>'; }
  }

  function statusBar(bs, total){
    if (!total) return '';
    var order = ['new','contacted','qualified','converted','rejected'];
    var seg = order.map(function(k){ var n=bs[k]||0; if(!n) return ''; return '<span style="width:'+(n/total*100)+'%;background:'+STATUS[k].c+'"></span>'; }).join('');
    var leg = order.filter(function(k){return bs[k];}).map(function(k){ return '<span><b style="color:'+STATUS[k].c+'">'+bs[k]+'</b> '+STATUS[k].l+'</span>'; }).join('');
    return '<div class="bar">'+seg+'</div><div class="legend">'+leg+'</div>';
  }

  function render(d){
    var t = d.totals||{};
    var h = '<div class="cards">' +
      stat(t.leads||0, 'Kontakty') +
      stat(t.converted||0, 'Převedeno') +
      stat((t.conversionPct||0)+' %', 'Konverze') +
      stat(t.unassigned||0, 'Nepřiřazeno') +
    '</div>';

    h += '<div id="ai-mgr"></div>';

    var at = (d.activeToday||[]).slice();
    // Nahoře lead s nejnovější aktivitou (podle času poslední akce).
    at.sort(function(a,b){ return new Date(b.lastAt||0) - new Date(a.lastAt||0); });
    h += '<h2>Dnes aktivní leady ('+at.length+')</h2>';
    if (!at.length){ h += '<div class="empty">Dnes zatím nikdo aktivní.</div>'; }
    else {
      h += at.map(function(x){
        var t = x.lastAt ? new Date(x.lastAt) : null;
        var tim = t ? (('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2)) : '';
        return '<div class="list-item"><div class="row-h"><span style="color:#22c55e">● <b>'+esc(x.name||'—')+'</b></span>' +
          '<span style="font-weight:700;white-space:nowrap">'+esc(tim)+'</span></div>' +
          '<div class="muted" style="margin-top:2px">' +
            (x.ownerName?('obch.: <b style="color:var(--text)">'+esc(x.ownerName)+'</b> · '):'<span style="color:#fca5a5">bez obchodníka</span> · ') +
            'zajímalo: '+esc(x.interest||'—')+' · '+(x.events||0)+' akcí'+(x.minutes?(' · '+esc(x.minutes)):'') +
          '</div></div>';
      }).join('');
    }

    h += '<h2>Výkon obchodníků</h2>';
    var sellers = d.sellers||[];
    if (!sellers.length){ h += '<div class="empty">Zatím žádní obchodníci s kontakty.</div>'; }
    else {
      h += sellers.map(function(s){
        return '<div class="row"><div class="row-h"><div class="name">'+esc(s.name)+'</div><div class="pct">'+s.conversionPct+' %</div></div>' +
          '<div class="sub">'+s.total+' kontaktů · '+s.converted+' převedeno · poslední aktivita '+fmtDate(s.lastActivityAt)+'</div>' +
          statusBar(s.byStatus||{}, s.total) +
        '</div>';
      }).join('');
    }

    h += '<h2>Cíle a plnění</h2>';
    if (!SELLERS.length){ h += '<div class="empty">Žádní obchodníci. Zaškrtni roli Obchodník v Lidé a HR.</div>'; }
    else {
      h += SELLERS.map(function(s){
        return '<details class="row" ontoggle="if(this.open) loadPlan('+s.id+')"><summary style="cursor:pointer;font-weight:700">'+esc(sellerName(s))+'</summary><div id="plan-'+s.id+'" style="margin-top:10px"><div class="muted">Klepni pro načtení…</div></div></details>';
      }).join('');
    }

    if (t.unassigned){
      h += '<h2>Nezpracované</h2><div class="row" style="border-color:rgba(239,68,68,.4)"><div class="name" style="color:#fca5a5">'+t.unassigned+' kontaktů bez obchodníka</div><div class="sub">Přiřaď je v modulu Prodejní objednávky → Compounder.</div></div>';
    }

    var rv = d.reservations||{};
    h += '<h2>Rezervace ('+(rv.total||0)+')</h2>';
    var items = rv.items||[];
    if (!items.length){ h += '<div class="empty">Žádné rezervace.</div>'; }
    else {
      h += items.map(function(x){
        return '<div class="list-item"><b>'+esc(x.kiosk_code||'—')+'</b> · '+esc(RES_STATUS[x.status]||x.status||'')+
          (x.reserved_until? ' · do '+fmtDate(x.reserved_until):'')+
          '<div class="muted" style="margin-top:2px">'+esc(x.lead_name||'—')+(x.owner_name?(' · '+esc(x.owner_name)):'')+'</div></div>';
      }).join('');
    }

    h += '<h2>Poslední aktivita týmu</h2>';
    var recent = d.recent||[];
    if (!recent.length){ h += '<div class="empty">Zatím nic.</div>'; }
    else {
      h += recent.map(function(x){
        var st = STATUS[x.status]||STATUS.new;
        return '<div class="list-item"><div class="row-h"><span>'+esc(x.name||'—')+'</span><span class="badge" style="background:'+st.c+'22;color:'+st.c+'">'+st.l+'</span></div>' +
          '<div class="muted" style="margin-top:2px">'+(x.owner_name?esc(x.owner_name)+' · ':'')+fmtDate(x.updated_at)+'</div></div>';
      }).join('');
    }

    document.getElementById('content').innerHTML = h;
    loadAiManager();
  }
  function stat(v, k){ return '<div class="stat"><div class="v">'+esc(v)+'</div><div class="k">'+esc(k)+'</div></div>'; }

  // ─── AI vedoucí obchodu: přehled dne + výplatní souhrn ─────────────────────
  async function loadAiManager(){
    var box = document.getElementById('ai-mgr'); if(!box) return;
    box.innerHTML = '<h2>🧭 AI vedoucí obchodu — dnešek</h2><div class="muted" style="padding:0 2px">Načítám…</div>';
    try {
      var r = await fetch('/api/compounder/sales/team-day', { credentials:'include' });
      if (!r.ok){ box.innerHTML = ''; return; }
      var d = await r.json();
      renderAiManager(box, d);
    } catch(e){ box.innerHTML = ''; }
  }
  function scoreCol(s){ return s==null?'var(--muted)':(s>=80?'#22c55e':s>=55?'#eab308':s>=30?'#f59e0b':'#ef4444'); }
  // Koláč stavů úkolů (splněno/otevřeno/přeskočeno) se středovým % splnění = „speed metr" dne.
  function vDonut(done, open, skipped){
    done=Number(done)||0; open=Number(open)||0; skipped=Number(skipped)||0;
    var tot=done+open+skipped; var C=2*Math.PI*26;
    if(!tot) return '<svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--line)" stroke-width="10"/><text x="32" y="37" text-anchor="middle" font-size="12" fill="var(--muted2)">—</text></svg>';
    function seg(val,color,cumBefore){ if(!val) return ''; var len=C*(val/tot); return '<circle cx="32" cy="32" r="26" fill="none" stroke="'+color+'" stroke-width="10" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-C*(cumBefore/tot)).toFixed(2)+'" transform="rotate(-90 32 32)"/>'; }
    var pct=Math.round(done/tot*100);
    return '<svg width="64" height="64" viewBox="0 0 64 64">'+
      seg(done,'#22c55e',0)+seg(open,'#eab308',done)+seg(skipped,'#6b7280',done+open)+
      '<text x="32" y="37" text-anchor="middle" font-size="15" font-weight="800" fill="var(--text)">'+pct+'%</text></svg>';
  }
  function vSpeedBlock(p){
    var done=p.tasks_done||0, open=p.tasks_open||0, skipped=p.tasks_skipped||0;
    return '<div style="display:flex;align-items:center;gap:14px;margin-top:8px;padding:10px;background:var(--surface2);border-radius:10px">'
      + vDonut(done,open,skipped)
      + '<div style="flex:1;min-width:0">'
        + '<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px">'
          + '<span style="color:#22c55e;font-weight:700">✓ '+done+' splněno</span>'
          + '<span style="color:#eab308;font-weight:700">● '+open+' otevřeno</span>'
          + (skipped?('<span style="color:#9aa0ad;font-weight:700">— '+skipped+' přeskočeno</span>'):'')
        + '</div>'
        + '<div style="margin-top:6px;font-size:13px"><b style="font-size:22px;color:var(--primary)">'+(p.contacts_worked_today||0)+'</b> <span style="color:var(--muted2)">kontaktů dnes</span>'
          + (p.calls_today?(' · <b>'+p.calls_today+'</b> hovorů'):'')
          + (p.new_contacts_today?(' · <b>'+p.new_contacts_today+'</b> nových'):'') + '</div>'
      + '</div></div>';
  }
  function renderAiManager(box, d){
    var per = d.per || [];
    var totA = 0, totD = 0;
    per.forEach(function(p){ totA += (p.tasks_assigned||0); totD += (p.tasks_done||0); });
    var h = '<h2>🧭 AI vedoucí obchodu — dnešek</h2>';
    h += '<div class="row"><div class="row-h"><div class="name">Dnešní úkoly týmu</div><button class="logout" onclick="sendOwnerReport(this)">Poslat report majitelům</button></div><div class="sub">Zadáno '+totA+' úkolů · splněno '+totD+'</div></div>';
    if (!per.length){ h += '<div class="empty">Žádní aktivní obchodníci.</div>'; }
    else {
      h += per.map(function(p){
        var revPct = p.month_target_revenue ? Math.round((p.month_actual_revenue||0)/p.month_target_revenue*100) : null;
        return '<details class="row" ontoggle="if(this.open) loadPersonTasks('+p.person_id+')"><summary style="cursor:pointer;list-style:none">' +
          '<div class="row-h"><div class="name">'+esc(p.name)+' <span style="font-weight:400;color:var(--muted2);font-size:12px">▾ úkoly</span></div>'+(p.day_score!=null?'<div class="pct" style="color:'+scoreCol(p.day_score)+'">'+p.day_score+'</div>':'')+'</div>' +
          '<div class="sub">Úkoly: '+(p.tasks_done||0)+'/'+(p.tasks_assigned||0)+' splněno'+(p.tasks_skipped?(' · '+p.tasks_skipped+' přeskočeno'):'')+(p.tasks_open?(' · '+p.tasks_open+' otevřeno'):'')+'</div>' +
          vSpeedBlock(p) +
          (p.focus?'<div class="muted" style="margin-top:4px;font-size:12.5px">🎯 '+esc(p.focus)+'</div>':'') +
          (p.day_summary?'<div class="muted" style="margin-top:4px;font-size:12.5px">'+esc(p.day_summary)+'</div>':'') +
          '<div style="margin-top:8px;padding:8px 10px;background:var(--surface2);border-radius:10px">' +
            '<div style="font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em">🎯 Cíl (měsíc)</div>' +
            '<div style="font-weight:800;font-size:16px;margin-top:2px">Obrat '+fmtMoney(p.month_target_revenue||0)+'</div>' +
            '<div class="sub">'+(p.month_target_reservations||0)+' rezervací · '+(p.month_target_new_contacts||0)+' nových kontaktů · '+(p.month_target_conversions||0)+' konverzí</div>' +
            '<div class="sub" style="margin-top:4px">Zatím: '+fmtMoney(p.month_actual_revenue||0)+(revPct!=null?(' ('+revPct+' %)'):'')+' · '+(p.month_actual_reservations||0)+' rez. · '+(p.month_actual_new_contacts||0)+' kont.</div>' +
          '</div>' +
          '</summary><div id="ptasks-'+p.person_id+'" style="margin-top:10px"><div class="muted">Klepni pro načtení úkolů…</div></div>' +
        '</details>';
      }).join('');
    }
    h += '<h2>💰 Měsíční výplatní souhrn</h2><div id="pay-summary"><div class="muted" style="padding:0 2px">Načítám…</div></div>';
    box.innerHTML = h;
    loadPaySummary();
  }
  var TK_ICON_V = { call:'📞', followup:'🔁', invite:'✉️', close:'🤝', reservation:'🏠', meeting:'📅', prospecting:'🎯', admin:'🗂️', other:'•' };
  function fmtMinV(m){ m=Number(m)||0; if(!m) return ''; if(m<60) return m+' min'; var h=Math.floor(m/60), r=m%60; return h+' h'+(r?(' '+r+' min'):''); }
  function personTaskHtml(t){
    var stcol = t.status==='done'?'#22c55e':(t.status==='skipped'?'#6b7280':'var(--primary)');
    var stlbl = t.status==='done'?'✓ splněno':(t.status==='skipped'?'přeskočeno':'otevřeno');
    return '<div class="list-item"><div class="row-h"><span>'+(TK_ICON_V[t.kind]||'•')+' <b>'+esc(t.title)+'</b>'+(t.est_min?' <span class="muted" style="font-weight:400">· ⏱ '+fmtMinV(t.est_min)+'</span>':'')+'</span><span class="badge" style="background:'+stcol+'22;color:'+stcol+'">'+stlbl+'</span></div>' +
      (t.detail?'<div class="muted" style="margin-top:3px;font-size:12.5px">'+esc(t.detail)+'</div>':'') +
      (t.reasoning?'<div class="muted" style="margin-top:2px;font-size:12px">💡 '+esc(t.reasoning)+'</div>':'') +
    '</div>';
  }
  async function loadPersonTasks(pid){
    var box = document.getElementById('ptasks-'+pid); if(!box || box.dataset.loaded==='1') return;
    box.dataset.loaded = '1'; box.innerHTML = '<div class="muted">Načítám úkoly…</div>';
    try {
      var r = await fetch('/api/compounder/my-day?person_id='+pid, { credentials:'include' });
      if (!r.ok){ box.innerHTML = '<div class="muted">Nepodařilo se načíst úkoly.</div>'; box.dataset.loaded=''; return; }
      var d = await r.json();
      var tasks = (d.plan && d.plan.tasks) || [];
      if (!tasks.length){ box.innerHTML = '<div class="muted">Na dnešek zatím žádné úkoly.</div>'; return; }
      var planMin = tasks.reduce(function(s,t){ return s+(Number(t.est_min)||0); }, 0);
      var head = planMin ? ('<div class="sub" style="margin-bottom:6px">Naplánováno '+fmtMinV(planMin)+' / 8 h · '+tasks.length+' úkolů</div>') : '';
      box.innerHTML = head + tasks.map(personTaskHtml).join('');
    } catch(e){ box.innerHTML = '<div class="muted">Chyba načítání.</div>'; box.dataset.loaded=''; }
  }
  async function loadPaySummary(){
    var box = document.getElementById('pay-summary'); if(!box) return;
    try {
      var r = await fetch('/api/compounder/sales/reviews?kind=month', { credentials:'include' });
      if (!r.ok){ box.innerHTML = '<div class="muted">Zatím žádné měsíční hodnocení. Vygeneruje se poslední den v měsíci (nebo ručně).</div>'; return; }
      var d = await r.json();
      var rows = d.reviews || [];
      if (!rows.length){ box.innerHTML = '<div class="muted">Zatím žádné měsíční hodnocení.</div>'; return; }
      var latest = rows[0].period_start;
      rows = rows.filter(function(x){ return x.period_start === latest; });
      box.innerHTML = rows.map(payRowHtml).join('');
    } catch(e){ box.innerHTML = ''; }
  }
  function payRowHtml(rv){
    var cur = rv.pay_currency || 'CZK';
    var money = function(v){ return (v!=null) ? (Number(v).toLocaleString('cs-CZ')+' '+cur) : '—'; };
    return '<div class="row"><div class="row-h"><div class="name">'+esc(rv.person_name)+'</div><div class="pct" style="color:'+scoreCol(rv.score)+'">'+rv.score+'</div></div>' +
      (rv.summary?'<div class="muted" style="margin-top:4px;font-size:12.5px">'+esc(rv.summary)+'</div>':'') +
      '<div class="sub" style="margin-top:6px">Návrh: základ '+money(rv.pay_base)+' · bonus '+money(rv.pay_bonus)+' · provize '+money(rv.pay_commission)+'</div>' +
      '<div class="name" style="margin-top:2px">Celkem návrh: '+money(rv.pay_total)+'</div>' +
      (rv.pay_note?'<div class="muted" style="margin-top:4px;font-size:12px">'+esc(rv.pay_note)+'</div>':'') +
      (rv.approved_at
        ? '<div style="color:#22c55e;margin-top:8px;font-size:13px">✓ Schváleno: '+money(rv.approved_total!=null?rv.approved_total:rv.pay_total)+(rv.approved_note?(' — '+esc(rv.approved_note)):'')+'</div>'
        : '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><input id="appr-'+rv.id+'" type="number" placeholder="Schválená částka" value="'+(rv.pay_total!=null?rv.pay_total:'')+'" style="flex:1;min-width:120px;background:var(--surface2);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:8px 10px"><button class="logout" style="border-color:#22c55e;color:#22c55e" onclick="approvePay('+rv.id+')">Schválit</button></div>') +
    '</div>';
  }
  async function approvePay(id){
    var inp = document.getElementById('appr-'+id); var val = inp ? inp.value : '';
    try { await fetch('/api/compounder/sales/reviews/'+id+'/approve', { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ approved_total: val==='' ? null : Number(val) }) }); } catch(e){}
    loadPaySummary();
  }
  async function sendOwnerReport(btn){
    if (btn){ btn.disabled = true; btn.textContent = 'Odesílám…'; }
    try { await fetch('/api/compounder/sales/owner-report', { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body:'{}' }); if(btn){ btn.textContent = '✓ Odesláno'; } }
    catch(e){ if(btn){ btn.textContent = 'Chyba'; } }
    setTimeout(function(){ if(btn){ btn.disabled = false; btn.textContent = 'Poslat report majitelům'; } }, 1600);
  }

  async function loadPlan(pid){
    var box = document.getElementById('plan-'+pid); if (!box) return;
    box.innerHTML = '<div class="muted">Načítám…</div>';
    try {
      var r = await fetch('/api/compounder/my-plan?person_id='+pid, { credentials:'include' });
      var j = await r.json();
      if (!j || !j.metrics){ box.innerHTML = '<div class="muted">Nelze načíst.</div>'; return; }
      var head = '<tr><th></th>'+j.periods.map(function(p){ return '<th style="font-size:11px;color:var(--muted2);padding:4px">'+(PLABEL[p]||p)+'</th>'; }).join('')+'</tr>';
      var rows = j.metrics.map(function(m){
        var cells = j.periods.map(function(p){
          var c = (j.data[m.key] && j.data[m.key][p]) || { actual:0, target:0 };
          var actTxt = (m.key==='revenue') ? fmtMoney(c.actual) : c.actual;
          var pct = c.target ? Math.round(c.actual/c.target*100) : null;
          var col = (pct==null) ? 'var(--muted)' : (pct>=100?'#22c55e':pct>=50?'#eab308':'var(--text)');
          return '<td style="text-align:center;padding:4px">' +
            '<div style="font-size:12px;color:'+col+';white-space:nowrap">'+actTxt+(pct!=null?(' · '+pct+'%'):'')+'</div>' +
            '<input type="number" min="0" value="'+(c.target||'')+'" placeholder="cíl" onchange="setTarget('+pid+',\''+m.key+'\',\''+p+'\',this.value)" style="width:70px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:5px;color:var(--text);font-size:12px;text-align:center;margin-top:3px">' +
          '</td>';
        }).join('');
        return '<tr><td style="padding:4px;color:var(--muted);white-space:nowrap">'+esc(m.label)+'</td>'+cells+'</tr>';
      }).join('');
      box.innerHTML = '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">'+head+rows+'</table></div><div style="font-size:11px;color:var(--muted2);margin-top:6px">Nahoře skutečnost · % plnění; do políčka zadej cíl (uloží se hned).</div>';
    } catch(e){ box.innerHTML = '<div class="err">Chyba načítání plánu.</div>'; }
  }
  async function setTarget(pid, metric, period, value){
    try {
      await fetch('/api/compounder/sales-targets', { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ person_id:pid, metric:metric, period:period, value:Number(value)||0 }) });
      loadPlan(pid);
    } catch(e){ alert('Cíl se nepodařilo uložit.'); }
  }

  async function doLogout(){ try{ await fetch('/api/auth/logout', { method:'POST', credentials:'include' }); }catch(e){} window.location.href='/login.html'; }

  init();
</script>
</body>
</html>

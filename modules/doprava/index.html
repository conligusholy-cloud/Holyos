<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Doprava | HOLYOS</title>
  <link rel="icon" type="image/svg+xml" href="../../logo-holyos-icon.svg">
  <base href="../../">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .main-wrapper { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; display: flex; flex-direction: column; }
    .page-header { display:flex; align-items:center; gap:12px; padding:20px 24px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .page-header h1 { font-size:18px; font-weight:700; margin:0; }
    .page-header .count { font-size:13px; color:var(--text2); margin-left:4px; }
    .content { padding:0 24px 24px; }
    .toolbar { display:flex; gap:12px; margin:16px 0; align-items:center; flex-wrap:wrap; }

    .btn { padding:8px 18px; border-radius:8px; border:1px solid var(--border); font-size:13px; font-weight:500; cursor:pointer; transition:all 0.15s; display:inline-flex; align-items:center; gap:6px; background:transparent; color:var(--text); }
    .btn-primary { background:#a78bfa; color:#160b2e; border-color:#a78bfa; font-weight:600; }
    .btn-primary:hover { background:#8b5cf6; }
    .btn-secondary { background:var(--surface2); color:var(--text); }
    .btn-secondary:hover { background:var(--border); }
    .btn-success { background:#22c55e; color:#04210f; border-color:#22c55e; font-weight:600; }
    .btn-success:hover { background:#16a34a; }
    .btn-sm { padding:5px 12px; font-size:12px; }

    .module-tabs { display:flex; gap:2px; border-bottom:1px solid var(--border); padding:0 24px; overflow-x:auto; }
    .module-tab { padding:12px 18px; background:transparent; border:none; color:var(--text2); font-size:13px; font-weight:500; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
    .module-tab:hover { color:var(--text); }
    .module-tab.active { color:#a78bfa; border-bottom-color:#a78bfa; }
    .module-panel { display:none; }
    .module-panel.active { display:block; }

    .data-table { width:100%; border-collapse:separate; border-spacing:0; }
    .data-table th { background:var(--surface2); padding:10px 12px; text-align:left; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:var(--text2); border-bottom:1px solid var(--border); }
    .data-table td { padding:10px 12px; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:middle; }
    .data-table tr:hover td { background:rgba(167,139,250,0.06); }
    .data-table .num { text-align:right; font-variant-numeric: tabular-nums; }

    .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:500; white-space:nowrap; }
    .badge-new { background:rgba(99,102,241,0.18); color:#818cf8; }
    .badge-quoting { background:rgba(245,158,11,0.18); color:#f59e0b; }
    .badge-quoted { background:rgba(34,211,238,0.18); color:#22d3ee; }
    .badge-confirmed { background:rgba(34,197,94,0.18); color:#22c55e; }
    .badge-cancelled { background:rgba(239,68,68,0.18); color:#ef4444; }
    .badge-pending { background:rgba(245,158,11,0.18); color:#f59e0b; }
    .badge-defined { background:rgba(34,197,94,0.18); color:#22c55e; }

    .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .filter-input, .filter-select { padding:6px 10px; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:7px; font-size:12px; }
    .filter-input:focus, .filter-select:focus { border-color:#a78bfa; outline:none; }

    .form-row { display:flex; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
    .form-row > div { flex:1; min-width:160px; }
    .form-row label { display:block; font-size:11px; color:var(--text2); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px; }
    .form-row input, .form-row select, .form-row textarea { width:100%; padding:8px 10px; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:7px; font-size:13px; box-sizing:border-box; }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color:#a78bfa; outline:none; }
    .form-row textarea { resize:vertical; min-height:70px; font-family:inherit; }

    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; display:none; align-items:center; justify-content:center; padding:20px; }
    .modal-overlay.active { display:flex; }
    .modal { background:var(--surface); border-radius:12px; max-width:760px; width:100%; max-height:92vh; overflow-y:auto; padding:24px; border:1px solid var(--border); }
    .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--border); }
    .modal-header h2 { margin:0; font-size:16px; }
    .modal-close { background:transparent; border:none; color:var(--text2); font-size:22px; cursor:pointer; padding:0 8px; }
    .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; padding-top:12px; border-top:1px solid var(--border); flex-wrap:wrap; }

    .empty-state { padding:40px 20px; text-align:center; color:var(--text2); font-size:13px; }
    .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
    .info-grid .block { background:var(--surface2); padding:12px; border-radius:8px; border:1px solid var(--border); }
    .info-grid .label { font-size:11px; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
    .info-grid .value { font-size:13px; }
    .price-box { background:rgba(167,139,250,0.08); border:1px solid rgba(167,139,250,0.3); border-radius:10px; padding:14px 16px; margin:12px 0; }
    .price-box .big { font-size:24px; font-weight:700; color:#a78bfa; }

    @media (max-width: 768px) { .main-wrapper { margin-left: 0; } .info-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-wrapper">
    <div class="page-header">
      <span style="font-size:24px;">🚚</span>
      <h1>Doprava</h1>
      <span class="count" id="header-count"></span>
    </div>

    <nav class="module-tabs">
      <button class="module-tab active" data-tab="queue">📦 Fronta zásilek</button>
      <button class="module-tab" data-tab="settings">⚙️ Nastavení</button>
    </nav>

    <div class="content">
      <!-- TAB: FRONTA -->
      <div class="module-panel active" id="panel-queue">
        <div class="toolbar">
          <div class="filters">
            <input type="text" class="filter-input" id="q-search" placeholder="🔍 Číslo objednávky, příjemce, firma...">
            <select class="filter-select" id="q-status">
              <option value="">Všechny stavy</option>
              <option value="new">Nový</option>
              <option value="quoting">Poptávám</option>
              <option value="quoted">Naceněno</option>
              <option value="confirmed">Potvrzeno</option>
              <option value="cancelled">Zrušeno</option>
            </select>
          </div>
          <span style="flex:1;"></span>
          <button class="btn btn-secondary btn-sm" id="q-refresh">↻ Aktualizovat</button>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>Objednávka</th><th>Země</th><th>Příjemce</th><th>Dopravce</th>
              <th class="num">Prodejní cena</th><th>Cena dopravy</th><th>Stav</th><th></th>
            </tr>
          </thead>
          <tbody id="queue-tbody"><tr><td colspan="8" class="empty-state">Načítám…</td></tr></tbody>
        </table>
      </div>

      <!-- TAB: NASTAVENÍ -->
      <div class="module-panel" id="panel-settings">
        <div style="max-width:420px;">
          <div class="form-row">
            <div>
              <label>Výchozí provize na dopravu (%)</label>
              <input type="number" step="0.01" min="0" id="set-markup" placeholder="např. 15">
            </div>
          </div>
          <p style="font-size:12px; color:var(--text2); margin:0 0 12px;">
            Předvyplní se u každé nové zásilky jako navýšení domluvené ceny dopravy. U konkrétní zásilky lze přepsat.
          </p>
          <div style="display:flex; gap:8px; align-items:center;">
            <button class="btn btn-primary" id="settings-save">Uložit</button>
            <span id="settings-msg" style="font-size:12px; color:var(--text2);"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal container -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modal-title">Zásilka</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="js/sidebar.js?v=2026-07-01-1"></script>
  <script>renderSidebar('doprava');</script>
  <script src="modules/doprava/app.js?v=2026-07-01-1"></script>
</body>
</html>

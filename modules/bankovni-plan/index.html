<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bankovní plán | HOLYOS</title>
  <link rel="icon" type="image/svg+xml" href="../../logo-holyos-icon.svg">
  <base href="../../">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .main-wrapper { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; display: flex; flex-direction: column; }
    body.embed .main-wrapper { margin-left: 0; }
    body.embed #sidebar { display: none; }
    body.embed .page-header { padding-top: 12px; }
    .page-header { display:flex; align-items:center; gap:12px; padding:20px 24px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .page-header h1 { font-size:18px; font-weight:700; margin:0; }
    .page-header .sub { font-size:12px; color:var(--text2); }
    .content { padding:20px 24px 40px; }
    .btn { padding:8px 16px; border-radius:8px; border:1px solid var(--border); font-size:13px; font-weight:500; cursor:pointer; background:transparent; color:var(--text); }
    .btn-primary { background:#0ea5e9; color:#fff; border-color:#0ea5e9; }
    .btn-primary:hover { background:#0284c7; }
    .seg { display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
    .seg button { padding:7px 14px; background:transparent; color:var(--text2); border:none; cursor:pointer; font-size:13px; font-weight:600; }
    .seg button.on { background:#0ea5e9; color:#fff; }
    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:22px; }
    .kpi { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
    .kpi .l { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--text2); }
    .kpi .v { font-size:23px; font-weight:800; margin-top:4px; }
    .kpi .s { font-size:11px; color:var(--text2); margin-top:3px; }
    .kpi.hl { border-color:rgba(14,165,233,.45); background:rgba(14,165,233,.07); }
    .sec { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:20px; }
    .sec h2 { font-size:14px; font-weight:700; margin:0 0 4px; }
    .sec .note { font-size:11px; color:var(--text2); margin-bottom:12px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    @media(max-width:900px){ .grid2 { grid-template-columns:1fr; } }
    canvas { max-width:100%; }
    .tag { display:inline-block; font-size:10px; font-weight:700; padding:1px 7px; border-radius:6px; vertical-align:middle; }
    .tag-actual { background:rgba(34,197,94,.16); color:#22c55e; }
    .tag-assume { background:rgba(245,158,11,.16); color:#f59e0b; }
    table.dt { width:100%; border-collapse:collapse; font-size:12.5px; }
    table.dt th { text-align:left; padding:7px 10px; color:var(--text2); text-transform:uppercase; font-size:10.5px; letter-spacing:.4px; border-bottom:1px solid var(--border); }
    table.dt td { padding:7px 10px; border-bottom:1px solid rgba(255,255,255,.04); }
    table.dt th.r, table.dt td.r { text-align:right; }
    .flag { font-size:11px; padding:1px 6px; border-radius:5px; }
    .flag-out { background:rgba(168,85,247,.16); color:#c084fc; }
    .flag-loss { background:rgba(239,68,68,.16); color:#ef4444; }
    .asum { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
    .asum label { font-size:11px; color:var(--text2); display:block; margin-bottom:3px; }
    .asum input { width:100%; box-sizing:border-box; background:var(--bg); border:1px solid var(--border); border-radius:7px; padding:7px 9px; color:var(--text); font-size:13px; }
    .banner { background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.35); color:#f59e0b; border-radius:10px; padding:12px 14px; font-size:13px; margin-bottom:18px; }
    .seg-b { padding:7px 16px; background:transparent; color:var(--text2); border:none; cursor:pointer; font-size:13px; font-weight:600; }
    .seg-b.on { background:#3b82f6; color:#fff; }
  </style>
</head>
<body>
  <div id="sidebar"></div>
  <div class="main-wrapper">
    <div class="page-header">
      <span style="font-size:26px;">🏦</span>
      <div>
        <h1>Bankovní Business Plan</h1>
        <div class="sub" id="bp-sub">Datově podložený finanční model sítě prádlomatů</div>
      </div>
      <div style="margin-left:auto; display:flex; gap:10px; align-items:center;">
        <span class="seg"><button id="cur-CZK" class="on" onclick="setBase('CZK')">CZK</button><button id="cur-EUR" onclick="setBase('EUR')">EUR</button></span>
        <button class="btn" onclick="openAiAnalysis()" title="AI analýza plánu — pracuje jen s daty na této stránce" style="background:#7c5cff;color:#fff;border:none">🤖 AI analýza</button>
        <button class="btn" onclick="openAiBrief()" title="Vygeneruj kompletní zadání s reálnými daty pro AI chat (prezentace / dokument)" style="background:#0ea5e9;color:#fff;border:none">📝 Zadání pro AI</button>
        <button class="btn" onclick="openAiInstr()" title="Nastavení pokynů pro AI agenta">⚙️</button>
        <a class="btn" href="/modules/bankovni-plan/report.html" target="_blank" title="Bankovní report připravený k tisku / uložení do PDF" style="text-decoration:none">📄 Report (PDF)</a>
        <button class="btn" onclick="rebuild()" id="bp-rebuild" title="Znovu stáhnout data ze SIS">↻ Přebudovat data</button>
      </div>
    </div>
    <div class="content" id="bp-content">
      <div style="color:var(--text2); padding:40px; text-align:center;">Načítám…</div>
    </div>
  </div>

  <script>
    // Embed režim (?embed=1) = vloženo jako záložka v Prodejních objednávkách → bez vlastního sidebaru.
    var _embed = /[?&]embed=1/.test(location.search);
    if (_embed) { document.body.classList.add('embed'); }
    else {
      var s = document.createElement('script');
      s.src = 'js/sidebar.js?v=' + Date.now();
      s.onload = function() { renderSidebar('bankovni-plan'); };
      document.head.appendChild(s);
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script>
    var BASE = 'CZK';
    var DATA = null;
    var _charts = {};

    function money(n){
      if (n == null || !isFinite(n)) return '—';
      var sym = BASE === 'EUR' ? '€' : 'Kč';
      return Math.round(n).toLocaleString('cs-CZ') + ' ' + sym;
    }
    function num(n){ return (n==null||!isFinite(n)) ? '—' : Math.round(n).toLocaleString('cs-CZ'); }
    function pct(n){ return (n==null||!isFinite(n)) ? '—' : (Math.round(n*1000)/10).toLocaleString('cs-CZ') + ' %'; }

    function setBase(b){
      BASE = b;
      document.getElementById('cur-CZK').className = b==='CZK'?'on':'';
      document.getElementById('cur-EUR').className = b==='EUR'?'on':'';
      load();
    }

    async function load(){
      var box = document.getElementById('bp-content');
      try {
        var r = await fetch('/api/bank-plan/overview?base=' + BASE, { credentials:'include' });
        if (r.status === 404){ box.innerHTML = emptyState(); return; }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        DATA = await r.json();
        loadLeasePhotos();
        render();
      } catch(e){ box.innerHTML = '<div class="banner">Nepodařilo se načíst data: ' + (e.message||'') + '</div>'; }
    }

    // Fotky prádlomatu pro leasingový podklad (server-side, sdílené).
    var _leasePhotos = [];
    async function loadLeasePhotos(){
      try { var r=await fetch('/api/bank-plan/leasing-photos',{credentials:'include'}); if(r.ok){ var j=await r.json(); _leasePhotos = Array.isArray(j.photos)?j.photos:[]; if(_bpMode==='leasing') render(); } } catch(e){}
    }
    // Nahrání fotek: zmenšení v prohlížeči (max 1200 px, JPEG) → data URL → uložit na server.
    function _resizeImage(file, maxPx){
      return new Promise(function(resolve,reject){
        var img=new Image(); var url=URL.createObjectURL(file);
        img.onload=function(){
          var w=img.width,h=img.height; var sc=Math.min(1, maxPx/Math.max(w,h));
          var cw=Math.round(w*sc),ch=Math.round(h*sc);
          var c=document.createElement('canvas'); c.width=cw; c.height=ch;
          c.getContext('2d').drawImage(img,0,0,cw,ch);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg',0.82));
        };
        img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error('Obrázek nelze načíst')); };
        img.src=url;
      });
    }
    window.leaseUploadPhotos = async function(input){
      var files=Array.prototype.slice.call(input.files||[]);
      if(!files.length) return;
      var st=document.getElementById('lease-photo-status'); if(st) st.textContent='Zpracovávám…';
      try {
        var slots=Math.max(0, 3-_leasePhotos.length);
        var use=files.slice(0, slots);
        for (var i=0;i<use.length;i++){ var d=await _resizeImage(use[i],1200); _leasePhotos.push(d); }
        _leasePhotos=_leasePhotos.slice(0,3);
        var r=await fetch('/api/bank-plan/leasing-photos',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({photos:_leasePhotos})});
        var j=await r.json(); _leasePhotos=Array.isArray(j.photos)?j.photos:_leasePhotos;
        if(st) st.textContent='Uloženo ✓';
        render();
      } catch(e){ if(st) st.textContent='Chyba: '+(e.message||''); }
      input.value='';
    };
    window.leaseRemovePhoto = async function(idx){
      _leasePhotos.splice(idx,1);
      try { await fetch('/api/bank-plan/leasing-photos',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({photos:_leasePhotos})}); } catch(e){}
      render();
    };

    function emptyState(){
      return '<div class="banner">Snapshot dat ze SIS zatím není vytvořený. Klikni na <b>↻ Přebudovat data</b> nahoře — stáhne se historie ze SIS (~1–2 min).</div>';
    }

    function kpi(l, v, s, hl){ return '<div class="kpi'+(hl?' hl':'')+'"><div class="l">'+l+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>'; }

    function render(){
      var d = DATA; var t = d.trackRecord; var u = d.unitEconomics;
      var gen = d.generatedAt ? new Date(d.generatedAt).toLocaleString('cs-CZ') : '—';
      document.getElementById('bp-sub').textContent = 'Data ze SIS · ' + t.firstData + ' → ' + t.lastData + ' · snapshot ' + gen;

      // Přepínač pohledu: Bankovní plán vs Leasingový podklad.
      var _tgl=function(m,lbl){ var on=(_bpMode===m); return '<button class="btn" onclick="setBpMode(\''+m+'\')" style="'+(on?'background:#eab308;color:#0e1a22;border:none;font-weight:700':'')+'">'+lbl+'</button>'; };
      var toggle = '<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">'+_tgl('bank','🏦 Bankovní plán')+_tgl('leasing','📄 Leasingový podklad')+'</div>';
      if(_bpMode==='leasing'){
        document.getElementById('bp-content').innerHTML = toggle + leasingHtml();
        if(!FC || !FC.unitBreakdown) loadForecast();
        drawLeaseCharts();
        return;
      }

      var h = toggle;
      // Banner rozlišení ACTUAL/ASSUMPTION
      h += '<div class="banner">Track record a tržby jsou <b>skutečná data ze SIS</b> <span class="tag tag-actual">ACTUAL</span>. Pozor na DPH: SIS eviduje částky <b>s DPH</b> (co platí zákazník), ale model počítá se všemi tržbami i EBITDA <b>bez DPH</b> (DPH se odvádí státu, není příjem). Sazby DPH (CZ 21 %, PL/IE 23 %) upravíš dole v Předpokladech. EBITDA a marže navíc používají provozní předpoklady <span class="tag tag-assume">ASSUMPTION</span> (nájem, servis %, energie %).</div>';

      // Executive KPI
      h += '<div class="kpis">';
      h += kpi('Roky dat', String(t.yearsData).replace('.',','), 'od ' + t.firstData);
      h += kpi('Aktivní lokality', num(t.activeCount), t.closedCount + ' uzavřených · ' + t.realCount + ' celkem');
      h += kpi('Location-months', num(t.locationMonths), 'reálný provoz');
      h += kpi('Transakce', num(t.totalTx), 'celkem v SIS');
      h += kpi('Kumulativní tržby', money(t.cumulativeRevenue), 'bez DPH · za celé období');
      h += kpi('Medián tržby / měs', money(u.revenueDist.p50), 'bez DPH · na lokalitu');
      h += kpi('Medián EBITDA / měs', money(u.medianEbitda), 'marže ' + pct(u.revenueDist.p50 ? u.medianEbitda/u.revenueDist.p50 : 0), true);
      h += kpi('Base scénář EBITDA', money(u.baseCaseEbitda), (u.baseFactorPct?('medián '+(u.baseFactorPct>=0?'+':'')+String(u.baseFactorPct).replace('.',',')+' %'):'= historický medián'), true);
      h += '</div>';

      // Track record graf (portfolio tržby v čase)
      h += '<div class="sec"><h2>Vývoj tržeb portfolia (bez DPH) <span class="tag tag-actual">ACTUAL</span></h2><div class="note">Měsíční tržby všech zahrnutých lokalit dohromady, bez DPH ('+BASE+').</div><canvas id="ch-rev" height="90"></canvas></div>';

      // Distribuce
      h += '<div class="grid2">';
      h += '<div class="sec"><h2>Distribuce tržeb / lokalitu (bez DPH) <span class="tag tag-actual">ACTUAL</span></h2><div class="note">Průměrná měsíční tržba bez DPH (posl. 12 měs.) — percentily. Medián je pro banku směrodatnější než průměr.</div><canvas id="ch-revdist" height="150"></canvas></div>';
      h += '<div class="sec"><h2>Distribuce EBITDA / lokalitu <span class="tag tag-assume">ASSUMPTION</span></h2><div class="note">Site EBITDA/měs dle předpokladů (percentily napříč lokalitami).</div><canvas id="ch-ebitdist" height="150"></canvas></div>';
      h += '</div>';

      // Sezónnost + kohorty
      h += '<div class="grid2">';
      h += '<div class="sec"><h2>Sezónnost <span class="tag tag-actual">ACTUAL</span></h2><div class="note">Index měsíců, 100 = průměr. Léto vs zima.</div><canvas id="ch-seas" height="150"></canvas></div>';
      h += '<div class="sec"><h2>Náběh nové lokality (kohorty) <span class="tag tag-actual">ACTUAL</span></h2><div class="note">Medián tržby podle počtu měsíců od otevření.</div><canvas id="ch-cohort" height="150"></canvas></div>';
      h += '</div>';

      // Lokality — top + flagy
      h += '<div class="sec" id="fc-section"><h2>Model financování &amp; růst <span class="tag" style="background:rgba(59,130,246,.16);color:#60a5fa">FORECAST</span></h2><div id="fc-body" class="note">Načítám model…</div></div>';

      h += '<div class="sec"><h2>Lokality <span class="tag tag-actual">ACTUAL</span> + <span class="tag tag-assume">ASSUMPTION</span></h2><div class="note">Aktivní lokality, řazeno dle EBITDA. 🟣 outlier (nad P90), 🔴 ztrátová.</div>' + locTable() + '</div>';

      // Analýza rizik
      h += riskAnalysisHtml();

      // Předpoklady
      h += assumptionsForm();

      document.getElementById('bp-content').innerHTML = h;
      drawCharts();
      loadForecast();
    }

    // ─── Leasingový podklad ────────────────────────────────────────────────
    var _bpMode = 'bank';
    window.setBpMode = function(m){ _bpMode = m; render(); };
    var _lease = null;
    function leaseInit(){
      if (_lease) return;
      var u = FC.unitBreakdown || {};
      var rd = (DATA.unitEconomics && DATA.unitEconomics.revenueDist) || {};
      var def = { price: Math.round(u.allIn || 1400000), count: 1, term: 60, down: 10, residual: 1, rate: 8, revBase: Math.round(rd.p50 || u.revenue || 37693), revPct: 100, addDryCount: 0, addDryPrice: 50 };
      try { var s = JSON.parse(localStorage.getItem('bp.lease') || 'null'); if (s && typeof s === 'object') def = Object.assign(def, s); } catch (e) {}
      _lease = def;
    }
    window.leaseSave = function(){
      try { localStorage.setItem('bp.lease', JSON.stringify(_lease)); } catch(e){}
      var el = document.getElementById('lease-saved'); if (el){ el.textContent = 'Uloženo ✓'; setTimeout(function(){ if(el) el.textContent=''; }, 2500); }
      render();
    };
    window.setLease = function(k, v){
      leaseInit();
      _lease[k] = (k==='count'||k==='term') ? (parseInt(v,10)||0) : (parseFloat(String(v).replace(/\s/g,'').replace(',','.'))||0);
      render();
    };
    var _leaseVat = 'neplatce'; // start bývá neplátce; přepínatelné
    window.setLeaseVat = function(m){ _leaseVat = m; render(); };
    // Poměry nákladů z ekonomiky jedné jednotky (bez DPH) — pro škálování na scénáře P25/P50/P75.
    function leaseRatios(){
      var u = FC.unitBreakdown, rev = u.revenue||1;
      return {
        rentBez: u.rent||0,
        varPct: ((u.service||0)+(u.energy||0)+(u.fee||0))/rev,   // servis+energie+poplatky (% obratu)
        maintPct: (u.maintenance||0)/rev,
      };
    }
    // Ekonomika jedné jednotky pro danou měsíční tržbu BEZ DPH, v režimu plátce/neplátce.
    function leaseUnit(revBez, vatMode, vat){
      var R = leaseRatios();
      var ebitdaBez = revBez - R.rentBez - revBez*R.varPct;
      var noiBez = ebitdaBez - revBez*R.maintPct;
      var k = (vatMode==='neplatce') ? (1+vat/100) : 1; // neplátce = vše v hrubých hodnotách
      return { rev: revBez*k, ebitda: ebitdaBez*k, noi: noiBez*k, marginPct: revBez>0?ebitdaBez/revBez:0, _bezNoi: noiBez };
    }
    // Měsíční anuita se zůstatkovou hodnotou (balloon): PMT financuje (financed − PV(residual)).
    function leasePMT(financed, residual, ratePct, n){
      var r = ratePct/100/12; if (n<=0) return 0;
      if (r===0) return (financed - residual)/n;
      return (financed - residual/Math.pow(1+r,n)) * (r/(1-Math.pow(1+r,-n)));
    }
    function leasingHtml(){
      if (!FC || !FC.unitBreakdown) return '<div class="banner">Načítám model jedné jednotky ze SIS… za chvíli přepni sem znovu (nebo dej <b>↻ Přebudovat data</b>).</div>';
      leaseInit();
      var u = FC.unitBreakdown;
      var t = DATA.trackRecord;
      var L = _lease;
      var vat = 21;
      var mode = _leaseVat; // 'platce' | 'neplatce'
      var rd = DATA.unitEconomics.revenueDist || {};
      var revPct = (L.revPct!=null?L.revPct:100);
      var revReal = (L.revBase || rd.p50 || u.revenue) * (revPct/100); // skutečná tržba (SIS) × faktor
      var modelAdd = (L.addDryCount||0) * (L.addDryPrice||0);          // zahrnuto v tržbě (bez zmínky v podkladu)
      var revBezBase = revReal + modelAdd;                             // použitá tržba bez DPH
      var base = leaseUnit(revBezBase, mode, vat);
      var noi = base.noi;                     // NOI v režimu (bez/hrubé)
      var price = (mode==='neplatce') ? Math.round(L.price*(1+vat/100)) : L.price;
      var financed = price*(1 - L.down/100);
      var residual = price*L.residual/100;
      var pmt = leasePMT(financed, residual, L.rate, L.term);
      var dscr = pmt>0 ? noi/pmt : 0;
      var cushion = noi>0 ? (1 - pmt/noi)*100 : 0; // o kolik % může tržba/NOI klesnout než DSCR=1
      var pass = dscr>=1.20, ok = dscr>=1.0;
      var dcol = pass?'#22c55e':(ok?'#eab308':'#ef4444');
      var modeLbl = (mode==='neplatce') ? 'Neplátce DPH (částky vč. neodpočitatelné DPH)' : 'Plátce DPH (částky bez DPH)';

      // Dopočet zůstatkové hodnoty dle reálného vytížení (cykly ze SIS)
      var lifeCycles = 30000;
      var cyclesPerMonth = (t.locationMonths>0 && t.totalTx>0) ? (t.totalTx/t.locationMonths) : 0;
      var cyclesUsed5 = cyclesPerMonth * 60;                              // 5 let = 60 měs
      var remCycles5 = Math.max(0, lifeCycles - cyclesUsed5);
      var remPct5 = lifeCycles>0 ? remCycles5/lifeCycles : 0;
      var techResidual5 = Math.round(L.price * remPct5);                 // bez DPH, lineárně dle zbývajících cyklů

      var inp = function(k,lbl,val,suf){ return '<div style="flex:1;min-width:130px"><label style="display:block;font-size:11px;color:var(--text2);margin-bottom:3px">'+lbl+'</label><div style="display:flex;align-items:center;gap:4px"><input value="'+val+'" onchange="setLease(\''+k+'\',this.value)" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);font-size:13px"><span style="font-size:11px;color:var(--text2)">'+(suf||'')+'</span></div></div>'; };

      var h = '';
      h += '<div class="banner">Podklad pro <b>leasingovou / financující společnost</b>. Ukazuje, že <b>jedna jednotka (prádlomat) funguje samostatně</b> — její provozní zisk pokryje leasingovou splátku s rezervou — a že je model <b>škálovatelný</b> (síť '+t.activeCount+' jednotek, '+String(t.yearsData).replace('.',',')+' let dat ze SIS). Cíl: leasingovka vyhodnotí výrobek jako profinancovatelný a můžeme ho zákazníkovi nabídnout s financováním.</div>';

    function crossCalcHtml(target){

        + '💰 Objem úvěru na vybudování: <b style="color:var(--text)">'+money(loan)+'</b> <span style="color:var(--text2)">('+units+' × '+money(debtU)+' úvěr/stroj)</span>';

    // Volatilita + nejhorší klouzavé období (z analytiky portfolia).
    async function loadVolatility(){
      var box=document.getElementById('fc-volatility'); if(!box) return; box.innerHTML='';
      try{
        var res=await Promise.all([
          fetch('/api/bank-plan/overview?base='+BASE,{credentials:'include'}).then(function(r){return r.json();}),
          fetch('/api/bank-plan/scenarios?base='+BASE+'&mode=reinvest',{credentials:'include'}).then(function(r){return r.json();}).catch(function(){return{};}),
        ]);
        var d=res[0], scD=res[1]||{};
        var v=d.volatility||{}, wr=d.worstRolling||{};
        if(!v.count) return;
        var m12=wr.m12, m3=wr.m3;
        var gm=(wr.graceMonthsExcluded!=null?wr.graceMonthsExcluded:6);
        // σ rezerva = o kolik σ musí tržba spadnout k breakevenu (DSCR=1,0). = rezerva% ÷ CV%.
        var be=(scD.scenarios||[]).find(function(x){return x.key==='breakeven';});
        var cushion=be&&be.cushionPct;
        var sigma=(cushion!=null && v.cvPct)?(cushion/v.cvPct):null;
        box.innerHTML='<div class="sec" style="background:var(--surface2)"><h2>Volatilita &amp; nejhorší období <span class="tag tag-actual">ACTUAL</span></h2>'+
          '<div class="note">Průměrná tržba <b>na jednu lokalitu</b>, <b>bez prvních '+gm+' měsíců</b> každého prádlomatu (náběh + odklad splátek) — ať to neměří růst sítě ani startovací období. Odolnost vůči skutečně pozorovanému horšímu období (§19/§20).</div>'+
          '<div class="kpis">'+
          kpi('Variační koeficient (CV)', (v.cvPct!=null?String(v.cvPct).replace('.',',')+' %':'—'), 'kolísání tržby na lokalitu')+
          kpi('σ rezerva do breakevenu', (sigma!=null?String(Math.round(sigma*10)/10).replace('.',',')+'σ':'—'), (cushion!=null?('tržba by musela klesnout o ~'+String(Math.round(sigma*10)/10).replace('.',',')+' směr. odchylky'):''), true)+
          kpi('Nejhorší měsíc / lok.', money(v.worst), (v.worstYm||''))+
          kpi('Nejhorší 12M (Ø/měs·lok.)', (m12?money(Math.round(m12.avg)):'—'), (m12?(m12.startYm+' – '+m12.endYm):''))+
          '</div>'+
          (sigma!=null?('<div class="note" style="margin-top:6px">💪 <b>Argument pro banku:</b> stabilizovaná lokalita má kolísání tržeb jen '+String(v.cvPct).replace('.',',')+' %. K porušení krytí splátky (DSCR 1,0) by tržba musela spadnout o <b>~'+String(Math.round(sigma*10)/10).replace('.',',')+' směrodatné odchylky</b> pod normál — statisticky jde o velmi nepravděpodobnou událost. Dluh je nastaven tak, že je bezpečně obsluhovatelný i v historicky doloženém horším období.</div>'):'')+
          '</div>';
      }catch(e){}
    }

        var rows = [
          {key:'base',label:'Base',factor:1,editable:false,target:1.3,basis:'100 % mediánu'},
          {key:'downside',label:'Downside',factor:FC_FACTORS.downside,editable:true,target:1.2},

          '<div class="note"><b>Klikni na řádek</b> = zvol scénář (grafy a čísla dole se přepočítají). Faktor u Downside/Stress můžeš <b>přepsat</b>. <b>DSCR = NOI jednotky ÷ splátka</b>, PASS/FAIL vůči targetu. <b>Breakeven</b> = tržba pro DSCR 1,0 (rezerva = o kolik smí tržby klesnout).</div>'+
          '<div style="overflow-x:auto"><table class="dt"><thead><tr>'+

        rows.forEach(function(rw){
          var c = calc(rw.factor);
          var pass = (c.dscr!=null && rw.target) ? (c.dscr>=rw.target) : null;
          var active = FC_SCEN===rw.key;
          var inp = 'background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);width:64px;padding:3px 6px;font-size:12px;text-align:right';
          var basisCell = rw.key==='base' ? '100 % mediánu'
            : (rw.editable ? ('× <input type="number" step="0.05" min="0.1" max="3" value="'+rw.factor+'" onclick="event.stopPropagation()" onchange="fcSetFactor(&#39;'+rw.key+'&#39;,this.value)" style="'+inp+'"> ('+(rw.factor<1?'−':'+')+Math.round(Math.abs(rw.factor-1)*100)+' %)') : '—');
          h += '<tr onclick="fcScen(&#39;'+rw.key+'&#39;)" style="cursor:pointer;'+(active?'background:rgba(234,179,8,.10)':'')+'">'+
            '<td style="font-weight:700">'+(active?'▸ ':'')+rw.label+'</td><td class="muted">'+basisCell+'</td>'+
            '<td style="text-align:right">'+money(c.rev)+'</td><td style="text-align:right">'+money(c.eb)+'</td><td style="text-align:right">'+money(c.ann)+'</td>'+

        return '<div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;'+bt+bold+'"><span style="color:var(--text2)">'+sign+lbl+'</span><span style="text-align:right;color:'+col+';'+bold+'">'+money(val)+pctTxt+'</span></div>';
      }
      leaseInit();
      var _L=_lease, _rd=DATA.unitEconomics.revenueDist||{};
      var _revPct=(_L.revPct!=null?_L.revPct:100);
      var _modelAdd=(_L.addDryCount||0)*(_L.addDryPrice||0);
      var _k=(_leaseVat==='neplatce')?(1+21/100):1;    // režim DPH (neplátce = vč. neodpočitatelné DPH)
      var _revBez=(_L.revBase||_rd.p50||u.revenue)*(_revPct/100)+_modelAdd;   // použitá tržba (bez DPH)
      var _rr=leaseRatios();
      var _vsum=(u.service||0)+(u.energy||0)+(u.fee||0)||1;
      var _nVar=_revBez*_rr.varPct;
      var rev=_revBez*_k;
      var _rent=_rr.rentBez*_k, _svc=_nVar*((u.service||0)/_vsum)*_k, _ene=_nVar*((u.energy||0)/_vsum)*_k, _fee=_nVar*((u.fee||0)/_vsum)*_k;

    // Náběhová křivka v leasingovém pohledu (samostatně — leasing větev nevolá drawCharts).
    function drawLeaseRamp(){
      if (!window.Chart) return;
      var el = document.getElementById('ch-lease-ramp'); if (!el) return;
      if (_charts.leaseRamp) { try{ _charts.leaseRamp.destroy(); }catch(e){} }
      var grid='rgba(255,255,255,.07)', tick='#94a3b8';
      var co = (DATA.cohort||[]).filter(function(c){ return c.count>0; });
      var _Lr=(_lease||{}); var _revPctR=(_Lr.revPct!=null?_Lr.revPct:100); var _modelAddR=(_Lr.addDryCount||0)*(_Lr.addDryPrice||0);
      var _adjR=function(m){ return (m||0)*(_revPctR/100)+_modelAddR; };   // úprava tržby + sušení navíc (zahrnuto v tržbě)
      var plateau=0; co.forEach(function(c){ var v=_adjR(c.median); if(v>plateau) plateau=v; });
      var labels = co.map(function(c){ return 'M'+c.month; });
      var vals = co.map(function(c){ return Math.round(_adjR(c.median)); });
      var ptcol = co.map(function(c){ return c.month<6 ? '#f59e0b' : '#22c55e'; });
      // Breakeven: tržba bez DPH, při které NOI = leasingová splátka (DSCR 1,0).
      var beRev = null;
      if (FC && FC.unitBreakdown){
        leaseInit();
        var L=_lease, mode=_leaseVat, vat=21;
        var price=(mode==='neplatce')?Math.round(L.price*(1+vat/100)):L.price;
        var financed=price*(1-L.down/100), residual=price*L.residual/100;
        var pmt=leasePMT(financed,residual,L.rate,L.term);
        var pmtBez=pmt/(mode==='neplatce'?(1+vat/100):1);
        var R=leaseRatios(); var denom=(1-R.varPct-R.maintPct);
        beRev = denom>0 ? (pmtBez + R.rentBez)/denom : null;
      }
      var datasets=[
        { label:'Medián tržby / měs', data:vals, borderColor:'#22c55e', backgroundColor:'rgba(34,197,94,.12)', fill:true, tension:.25, pointRadius:3, pointBackgroundColor:ptcol, pointBorderColor:ptcol },
        { label:'Stabilizovaná úroveň', data:labels.map(function(){ return Math.round(plateau); }), borderColor:'#64748b', borderDash:[6,4], pointRadius:0, fill:false }
      ];
      if (beRev!=null && isFinite(beRev)){
        datasets.push({ label:'Zisk = splátka (DSCR 1,0)', data:labels.map(function(){ return Math.round(beRev); }), borderColor:'#ef4444', borderDash:[4,4], borderWidth:2, pointRadius:0, fill:false });
      }
      _charts.leaseRamp = new Chart(el, { type:'line',
        data:{ labels:labels, datasets:datasets },
        options:{ animation:false, plugins:{ legend:{ display:true, labels:{ color:tick } } }, scales:{ x:{ grid:{color:grid}, ticks:{color:tick} }, y:{ grid:{color:grid}, ticks:{color:tick}, beginAtZero:true } }, maintainAspectRatio:true } });
    }
    window.drawLeaseRamp = drawLeaseRamp;

    // Distribuce tržby/EBITDA na 1 jednotku (přepočteno vč. sušení navíc) + sezónnost pro leasing.
    function drawLeaseCharts(){
      if (!window.Chart) return;
      drawLeaseRamp();
      var grid='rgba(255,255,255,.07)', tick='#94a3b8';
      var common={ animation:false, plugins:{legend:{display:false}}, scales:{ x:{grid:{color:grid},ticks:{color:tick}}, y:{grid:{color:grid},ticks:{color:tick}} }, maintainAspectRatio:true };

          options:Object.assign({},common,{ scales:{ x:{grid:{color:grid},ticks:{color:tick}}, y:{grid:{color:grid},ticks:{color:tick},beginAtZero:true,suggestedMax:140 } } }) });
      }
      // Vývoj tržeb portfolia (s DPH) — od začátku po poslední kompletní měsíc — nepotřebuje FC
      var elP=document.getElementById('ch-lease-portfolio');
      if(elP){ if(_charts.leasePortfolio){try{_charts.leasePortfolio.destroy();}catch(e){}}
        var pm=DATA.portfolioMonthly||{};
        var _now=new Date(); var curYM=_now.getFullYear()+'-'+String(_now.getMonth()+1).padStart(2,'0');
        var pyms=Object.keys(pm).sort().filter(function(y){ return y<curYM; });

          options:common });

      // distribuce tržby/EBITDA — potřebují leaseUnit (FC.unitBreakdown)
      if(!FC || !FC.unitBreakdown) return;

      var ps=['p10','p25','p50','p75','p90'];

        _charts.leaseRev=new Chart(elR,{ type:'bar', data:{ labels:['P10','P25','Medián','P75','P90'], datasets:[{ data:revVals, backgroundColor:'#0ea5e9' }] }, options:common });
      }
      var elE=document.getElementById('ch-lease-ebitdist');
      if(elE){ if(_charts.leaseEb){try{_charts.leaseEb.destroy();}catch(e){}}
        var ebVals=ps.map(function(k){ return Math.round(leaseUnit(adj(rd[k]),mode,vat).ebitda); });
        _charts.leaseEb=new Chart(elE,{ type:'bar', data:{ labels:['P10','P25','Medián','P75','P90'], datasets:[{ data:ebVals, backgroundColor:['#94a3b8','#94a3b8','#22c55e','#94a3b8','#94a3b8'] }] }, options:common });
      }
    }

        '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px">'+
        '<button class="btn" onclick="bpBriefDownload()">⬇ Stáhnout .md</button>'+
        '<button class="btn btn-primary" onclick="bpBriefCopy(this)">📋 Kopírovat</button></div>';
      var ta=document.getElementById('bp-brief-txt'); if(ta) ta.value=txt;
    }
    function bpBriefCopy(btn){
      var ta=document.getElementById('bp-brief-txt'); if(!ta) return;
      ta.select();
      try{ navigator.clipboard.writeText(ta.value); }catch(e){ try{ document.execCommand('copy'); }catch(_){} }
      if(btn){ var o=btn.textContent; btn.textContent='✓ Zkopírováno'; setTimeout(function(){ btn.textContent=o; },1600); }
    }
    function bpBriefDownload(){
      var ta=document.getElementById('bp-brief-txt'); if(!ta) return;
      var blob=new Blob([ta.value],{type:'text/markdown;charset=utf-8'});
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='zadani-bankovni-plan.md';
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
    }
    window.openAiBrief=openAiBrief; window.bpBriefCopy=bpBriefCopy; window.bpBriefDownload=bpBriefDownload;
    window.openAiInstr=openAiInstr; window.saveAiInstr=saveAiInstr; window.openAiAnalysis=openAiAnalysis;
    async function rebuild(){
      var btn = document.getElementById('bp-rebuild');
      btn.disabled = true; btn.textContent = '⏳ Stahuji ze SIS…';
      try {
        var r = await fetch('/api/bank-plan/history/rebuild', { method:'POST', credentials:'include' });
        var j = await r.json();
        if (!r.ok && r.status!==409) throw new Error(j.error||('HTTP '+r.status));
      } catch(e){ btn.disabled=false; btn.textContent='↻ Přebudovat data'; alert('Nepodařilo se spustit: '+(e.message||'')); return; }
      if (_polling) clearInterval(_polling);
      _polling = setInterval(async function(){
        try {
          var s = await (await fetch('/api/bank-plan/history/status', { credentials:'include' })).json();
          if (s.state && !s.state.building) {
            clearInterval(_polling); _polling=null;
            btn.disabled=false; btn.textContent='↻ Přebudovat data';
            if (s.state.error) alert('Přebudování selhalo: '+s.state.error);
            load();
          }
        } catch(e){}
      }, 4000);
    }

    // Oddělování tisíců (mezera). Prázdné → ''. Zachová desetinnou čárku.
    function fmtNum(v){ if(v==null||v==='') return ''; var n=parseFloat(String(v).replace(/[\s ]/g,'').replace(',','.')); if(!isFinite(n)) return String(v); return n.toLocaleString('cs-CZ'); }
    window.fmtNum = fmtNum;
    function pctHint(key){ var el=document.getElementById('as-'+key); if(!el) return; var med=(DATA&&DATA.unitEconomics&&DATA.unitEconomics.revenueDist&&DATA.unitEconomics.revenueDist.p50)||0; var kc=(parseFloat(String(el.value).replace(',','.'))||0)/100*med; var s=document.getElementById('hint-'+key); if(s) s.textContent=money(kc); }
    function setPct(key,val){ var el=document.getElementById('as-'+key); if(el){ el.value=val; pctHint(key); } }
    window.pctHint=pctHint; window.setPct=setPct;

    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

    load();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bankovní plán | HOLYOS</title>
  <link rel="icon" type="image/svg+xml" href="../../logo-holyos-icon.svg">
  <base href="../../">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .main-wrapper { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; display: flex; flex-direction: column; }
    body.embed .main-wrapper { margin-left: 0; }
    body.embed #sidebar { display: none; }
    body.embed .page-header { padding-top: 12px; }
    .page-header { display:flex; align-items:center; gap:12px; padding:20px 24px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .page-header h1 { font-size:18px; font-weight:700; margin:0; }
    .page-header .sub { font-size:12px; color:var(--text2); }
    .content { padding:20px 24px 40px; }
    .btn { padding:8px 16px; border-radius:8px; border:1px solid var(--border); font-size:13px; font-weight:500; cursor:pointer; background:transparent; color:var(--text); }
    .btn-primary { background:#0ea5e9; color:#fff; border-color:#0ea5e9; }
    .btn-primary:hover { background:#0284c7; }
    .seg { display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
    .seg button { padding:7px 14px; background:transparent; color:var(--text2); border:none; cursor:pointer; font-size:13px; font-weight:600; }
    .seg button.on { background:#0ea5e9; color:#fff; }
    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:22px; }
    .kpi { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
    .kpi .l { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--text2); }
    .kpi .v { font-size:23px; font-weight:800; margin-top:4px; }
    .kpi .s { font-size:11px; color:var(--text2); margin-top:3px; }
    .kpi.hl { border-color:rgba(14,165,233,.45); background:rgba(14,165,233,.07); }
    .sec { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:20px; }
    .sec h2 { font-size:14px; font-weight:700; margin:0 0 4px; }
    .sec .note { font-size:11px; color:var(--text2); margin-bottom:12px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    @media(max-width:900px){ .grid2 { grid-template-columns:1fr; } }
    canvas { max-width:100%; }
    .tag { display:inline-block; font-size:10px; font-weight:700; padding:1px 7px; border-radius:6px; vertical-align:middle; }
    .tag-actual { background:rgba(34,197,94,.16); color:#22c55e; }
    .tag-assume { background:rgba(245,158,11,.16); color:#f59e0b; }
    table.dt { width:100%; border-collapse:collapse; font-size:12.5px; }
    table.dt th { text-align:left; padding:7px 10px; color:var(--text2); text-transform:uppercase; font-size:10.5px; letter-spacing:.4px; border-bottom:1px solid var(--border); }
    table.dt td { padding:7px 10px; border-bottom:1px solid rgba(255,255,255,.04); }
    .flag { font-size:11px; padding:1px 6px; border-radius:5px; }
    .flag-out { background:rgba(168,85,247,.16); color:#c084fc; }
    .flag-loss { background:rgba(239,68,68,.16); color:#ef4444; }
    .asum { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
    .asum label { font-size:11px; color:var(--text2); display:block; margin-bottom:3px; }
    .asum input { width:100%; box-sizing:border-box; background:var(--bg); border:1px solid var(--border); border-radius:7px; padding:7px 9px; color:var(--text); font-size:13px; }
    .banner { background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.35); color:#f59e0b; border-radius:10px; padding:12px 14px; font-size:13px; margin-bottom:18px; }
    .seg-b { padding:7px 16px; background:transparent; color:var(--text2); border:none; cursor:pointer; font-size:13px; font-weight:600; }
    .seg-b.on { background:#3b82f6; color:#fff; }
  </style>
</head>
<body>
  <div id="sidebar"></div>
  <div class="main-wrapper">
    <div class="page-header">
      <span style="font-size:26px;">🏦</span>
      <div>
        <h1>Bankovní Business Plan</h1>
        <div class="sub" id="bp-sub">Datově podložený finanční model sítě prádlomatů</div>
      </div>
      <div style="margin-left:auto; display:flex; gap:10px; align-items:center;">
        <span class="seg"><button id="cur-CZK" class="on" onclick="setBase('CZK')">CZK</button><button id="cur-EUR" onclick="setBase('EUR')">EUR</button></span>
        <a class="btn" href="/modules/bankovni-plan/report.html" target="_blank" title="Bankovní report připravený k tisku / uložení do PDF" style="text-decoration:none">📄 Report (PDF)</a>
        <button class="btn" onclick="rebuild()" id="bp-rebuild" title="Znovu stáhnout data ze SIS">↻ Přebudovat data</button>
      </div>
    </div>
    <div class="content" id="bp-content">
      <div style="color:var(--text2); padding:40px; text-align:center;">Načítám…</div>
    </div>
  </div>

  <script>
    // Embed režim (?embed=1) = vloženo jako záložka v Prodejních objednávkách → bez vlastního sidebaru.
    var _embed = /[?&]embed=1/.test(location.search);
    if (_embed) { document.body.classList.add('embed'); }
    else {
      var s = document.createElement('script');
      s.src = 'js/sidebar.js?v=' + Date.now();
      s.onload = function() { renderSidebar('bankovni-plan'); };
      document.head.appendChild(s);
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script>
    var BASE = 'CZK';
    var DATA = null;
    var _charts = {};

    function money(n){
      if (n == null || !isFinite(n)) return '—';
      var sym = BASE === 'EUR' ? '€' : 'Kč';
      return Math.round(n).toLocaleString('cs-CZ') + ' ' + sym;
    }
    function num(n){ return (n==null||!isFinite(n)) ? '—' : Math.round(n).toLocaleString('cs-CZ'); }
    function pct(n){ return (n==null||!isFinite(n)) ? '—' : (Math.round(n*1000)/10).toLocaleString('cs-CZ') + ' %'; }

    function setBase(b){
      BASE = b;
      document.getElementById('cur-CZK').className = b==='CZK'?'on':'';
      document.getElementById('cur-EUR').className = b==='EUR'?'on':'';
      load();
    }

    async function load(){
      var box = document.getElementById('bp-content');
      try {
        var r = await fetch('/api/bank-plan/overview?base=' + BASE, { credentials:'include' });
        if (r.status === 404){ box.innerHTML = emptyState(); return; }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        DATA = await r.json();
        render();
      } catch(e){ box.innerHTML = '<div class="banner">Nepodařilo se načíst data: ' + (e.message||'') + '</div>'; }
    }

    function emptyState(){
      return '<div class="banner">Snapshot dat ze SIS zatím není vytvořený. Klikni na <b>↻ Přebudovat data</b> nahoře — stáhne se historie ze SIS (~1–2 min).</div>';
    }

    function kpi(l, v, s, hl){ return '<div class="kpi'+(hl?' hl':'')+'"><div class="l">'+l+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>'; }

    function render(){
      var d = DATA; var t = d.trackRecord; var u = d.unitEconomics;
      var gen = d.generatedAt ? new Date(d.generatedAt).toLocaleString('cs-CZ') : '—';
      document.getElementById('bp-sub').textContent = 'Data ze SIS · ' + t.firstData + ' → ' + t.lastData + ' · snapshot ' + gen;

      var h = '';
      // Banner rozlišení ACTUAL/ASSUMPTION
      h += '<div class="banner">Track record a tržby jsou <b>skutečná data ze SIS</b> <span class="tag tag-actual">ACTUAL</span>. Pozor na DPH: SIS eviduje částky <b>s DPH</b> (co platí zákazník), ale model počítá se všemi tržbami i EBITDA <b>bez DPH</b> (DPH se odvádí státu, není příjem). Sazby DPH (CZ 21 %, PL/IE 23 %) upravíš dole v Předpokladech. EBITDA a marže navíc používají provozní předpoklady <span class="tag tag-assume">ASSUMPTION</span> (nájem, servis %, energie %).</div>';

      // Executive KPI
      h += '<div class="kpis">';
      h += kpi('Roky dat', String(t.yearsData).replace('.',','), 'od ' + t.firstData);
      h += kpi('Aktivní lokality', num(t.activeCount), t.closedCount + ' uzavřených · ' + t.realCount + ' celkem');
      h += kpi('Location-months', num(t.locationMonths), 'reálný provoz');
      h += kpi('Transakce', num(t.totalTx), 'celkem v SIS');
      h += kpi('Kumulativní tržby', money(t.cumulativeRevenue), 'bez DPH · za celé období');
      h += kpi('Medián tržby / měs', money(u.revenueDist.p50), 'bez DPH · na lokalitu');
      h += kpi('Medián EBITDA / měs', money(u.ebitdaDist.p50), 'marže ' + pct(u.marginDist.p50), true);
      h += kpi('Base scénář EBITDA', money(u.baseCaseEbitda), (u.baseFactorPct?('medián '+(u.baseFactorPct>=0?'+':'')+String(u.baseFactorPct).replace('.',',')+' %'):'= historický medián'), true);
      h += '</div>';

      // Track record graf (portfolio tržby v čase)
      h += '<div class="sec"><h2>Vývoj tržeb portfolia (bez DPH) <span class="tag tag-actual">ACTUAL</span></h2><div class="note">Měsíční tržby všech zahrnutých lokalit dohromady, bez DPH ('+BASE+').</div><canvas id="ch-rev" height="90"></canvas></div>';

      // Distribuce
      h += '<div class="grid2">';
      h += '<div class="sec"><h2>Distribuce tržeb / lokalitu (bez DPH) <span class="tag tag-actual">ACTUAL</span></h2><div class="note">Průměrná měsíční tržba bez DPH (posl. 12 měs.) — percentily. Medián je pro banku směrodatnější než průměr.</div><canvas id="ch-revdist" height="150"></canvas></div>';
      h += '<div class="sec"><h2>Distribuce EBITDA / lokalitu <span class="tag tag-assume">ASSUMPTION</span></h2><div class="note">Site EBITDA/měs dle předpokladů (percentily napříč lokalitami).</div><canvas id="ch-ebitdist" height="150"></canvas></div>';
      h += '</div>';

      // Sezónnost + kohorty
      h += '<div class="grid2">';
      h += '<div class="sec"><h2>Sezónnost <span class="tag tag-actual">ACTUAL</span></h2><div class="note">Index měsíců, 100 = průměr. Léto vs zima.</div><canvas id="ch-seas" height="150"></canvas></div>';
      h += '<div class="sec"><h2>Náběh nové lokality (kohorty) <span class="tag tag-actual">ACTUAL</span></h2><div class="note">Medián tržby podle počtu měsíců od otevření.</div><canvas id="ch-cohort" height="150"></canvas></div>';
      h += '</div>';

      // Lokality — top + flagy
      h += '<div class="sec" id="fc-section"><h2>Model financování &amp; růst <span class="tag" style="background:rgba(59,130,246,.16);color:#60a5fa">FORECAST</span></h2><div id="fc-body" class="note">Načítám model…</div></div>';

      h += '<div class="sec"><h2>Lokality <span class="tag tag-actual">ACTUAL</span> + <span class="tag tag-assume">ASSUMPTION</span></h2><div class="note">Aktivní lokality, řazeno dle EBITDA. 🟣 outlier (nad P90), 🔴 ztrátová.</div>' + locTable() + '</div>';

      // Analýza rizik
      h += riskAnalysisHtml();

      // Předpoklady
      h += assumptionsForm();

      document.getElementById('bp-content').innerHTML = h;
      drawCharts();
      loadForecast();
    }

    function locTable(){
      var locs = (DATA.locations||[]).slice().sort(function(a,b){
        if (!!a.excluded !== !!b.excluded) return a.excluded ? 1 : -1; // vyřazené dolů
        return (b.ebitda||0)-(a.ebitda||0);
      });
      var p90 = DATA.unitEconomics.revenueDist.p90;
      var exCount = locs.filter(function(l){return l.excluded;}).length;
      var h = '<div class="note" style="margin-bottom:8px">Zaškrtnuté = v plánu. Odškrtnutím lokalitu vyřadíš (nesmysly/testy) — nezapočítá se do žádných čísel.'+(exCount?(' Vyřazeno: '+exCount+'.'):'')+'</div>';
      h += '<div style="overflow-x:auto;"><table class="dt"><thead><tr><th>V plánu</th><th>Kód</th><th>Verze</th><th>Lokalita</th><th>Otevřeno</th><th style="text-align:right">Tržba/měs<br><span style="font-weight:400;text-transform:none">bez DPH</span></th><th style="text-align:right">EBITDA/měs</th><th style="text-align:right">Marže</th><th></th></tr></thead><tbody>';
      locs.forEach(function(l){
        var flags = '';
        if (l.classification === 'closed') flags += ' <span class="flag" style="background:rgba(148,163,184,.16);color:#94a3b8">uzavřená</span>';
        if (!l.excluded && l.avgRev != null && p90 != null && l.avgRev >= p90) flags += ' <span class="flag flag-out">🟣 outlier</span>';
        if (!l.excluded && (l.ebitda||0) < 0) flags += ' <span class="flag flag-loss">🔴 ztráta</span>';
        var dim = l.excluded ? 'opacity:.42;' : '';
        var chk = '<input type="checkbox" '+(l.excluded?'':'checked')+' onchange="toggleExclude(&#39;'+esc(l.code)+'&#39;, !this.checked)" title="'+(l.excluded?'Vrátit do plánu':'Vyřadit z plánu')+'" style="width:17px;height:17px;cursor:pointer;accent-color:#0ea5e9">';
        var vcol = { V2:'#f59e0b', V3:'#0ea5e9', V4:'#a855f7' }[l.version] || '#94a3b8';
        var vbadge = l.version ? '<span class="flag" style="background:'+vcol+'22;color:'+vcol+';font-weight:700">'+esc(l.version)+'</span>' : '<span style="color:var(--text2)">—</span>';
        var curLbl = l.currency && l.currency !== 'CZK' ? ' <span style="font-size:10px;color:#f59e0b">'+esc(l.currency)+'</span>' : '';
        h += '<tr style="'+dim+'"><td style="text-align:center">'+chk+'</td><td style="font-weight:600">'+esc(l.code)+curLbl+'</td><td>'+vbadge+'</td><td>'+esc(l.label||'')+'</td><td>'+(l.openDate||'—')+'</td>'+
          '<td style="text-align:right">'+money(l.avgRev)+'</td>'+
          '<td style="text-align:right;color:'+((l.ebitda||0)<0?'#ef4444':'#22c55e')+';font-weight:600">'+money(l.ebitda)+'</td>'+
          '<td style="text-align:right">'+pct(l.margin)+'</td><td>'+flags+'</td></tr>';
      });
      h += '</tbody></table></div>';
      return h;
    }
    async function toggleExclude(code, excluded){
      try {
        var r = await fetch('/api/bank-plan/exclude', { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ code:code, excluded:excluded }) });
        if(!r.ok) throw new Error('HTTP '+r.status);
        await load(); // přepočítá všechna čísla i grafy
      } catch(e){ alert('Změna selhala: '+(e.message||'')); }
    }
    window.toggleExclude = toggleExclude;

    function riskAnalysisHtml(){
      var risks = (DATA.assumptions && DATA.assumptions.risks) || [];
      var lvl = ['nízká','střední','vysoká'];
      var lvlCol = { 'nízká':'#22c55e', 'střední':'#f59e0b', 'vysoká':'#ef4444' };
      function sel(idx,field,val){ return '<select data-ri="'+idx+'" data-rf="'+field+'" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 6px;color:'+(lvlCol[val]||'var(--text)')+';font-size:12px;font-weight:600">'+lvl.map(function(o){return '<option'+(o===val?' selected':'')+'>'+o+'</option>';}).join('')+'</select>'; }
      var h='<div class="sec"><h2>Analýza rizik <span class="tag tag-assume">ASSUMPTION</span></h2><div class="note">Editovatelné. Pravděpodobnost a dopad: nízká / střední / vysoká. Půjde i do PDF.</div>'+
        '<div style="overflow-x:auto"><table class="dt"><thead><tr><th>Riziko</th><th>Pravděpodobnost</th><th>Dopad</th><th>Mitigace</th><th>🤖 AI hodnocení &amp; doporučení</th></tr></thead><tbody>';
      risks.forEach(function(r,i){
        var ai = (RISK_AI && RISK_AI[r.label]) ? RISK_AI[r.label] : null;
        var aiCell = ai ? ('<div style="font-size:12px"><div>'+esc(ai.assessment||'')+'</div><div style="color:#60a5fa;margin-top:3px">➤ '+esc(ai.recommendation||'')+'</div></div>') : '<span style="color:var(--muted2);font-size:11px">—</span>';
        h+='<tr><td style="font-weight:600;white-space:nowrap">'+esc(r.label)+'</td>'+
          '<td>'+sel(i,'probability',r.probability)+'</td><td>'+sel(i,'impact',r.impact)+'</td>'+
          '<td><input data-ri="'+i+'" data-rf="mitigation" value="'+esc(r.mitigation||'')+'" style="width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 8px;color:var(--text);font-size:12px"></td>'+
          '<td style="min-width:260px">'+aiCell+'</td></tr>';
      });
      h+='</tbody></table></div><div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" onclick="saveRisks()">💾 Uložit rizika</button><button class="btn" id="ai-risk-btn" onclick="aiAssessRisks()" style="background:#7c5cff;color:#fff;border:none">🤖 AI zhodnocení rizik</button></div></div>';
      return h;
    }
    async function saveRisks(){
      var risks=((DATA.assumptions&&DATA.assumptions.risks)||[]).map(function(r){return Object.assign({},r);});
      document.querySelectorAll('[data-ri]').forEach(function(el){ var i=+el.getAttribute('data-ri'); var f=el.getAttribute('data-rf'); if(risks[i]) risks[i][f]=el.value; });
      try {
        await fetch('/api/bank-plan/assumptions',{method:'PUT',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({risks:risks})});
        await load();
      } catch(e){ alert('Uložení selhalo: '+(e.message||'')); }
    }
    window.saveRisks=saveRisks;
    var RISK_AI = null; // { label: {assessment, recommendation} }
    async function aiAssessRisks(){
      var btn=document.getElementById('ai-risk-btn'); if(btn){ btn.disabled=true; btn.textContent='🤖 Analyzuji…'; }
      try {
        var r=await fetch('/api/bank-plan/risks/ai-assess',{method:'POST',credentials:'include'});
        var d=await r.json();
        if(!r.ok||!d.items) throw new Error(d.error||('HTTP '+r.status));
        RISK_AI={}; d.items.forEach(function(it){ RISK_AI[it.label]=it; });
        // AI navrhla i pravděpodobnost/dopad → dosadíme do rizik (rozbalovačky).
        var LV={'nízká':1,'střední':1,'vysoká':1};
        var risks=(DATA.assumptions&&DATA.assumptions.risks)||[];
        risks.forEach(function(r){ var it=RISK_AI[r.label]; if(it){ if(it.probability&&LV[it.probability]) r.probability=it.probability; if(it.impact&&LV[it.impact]) r.impact=it.impact; } });
        render(); // překreslí tabulku s AI sloupcem i novými hodnotami
      } catch(e){ alert('AI zhodnocení selhalo: '+(e.message||'')); if(btn){ btn.disabled=false; btn.textContent='🤖 AI zhodnocení rizik'; } }
    }
    window.aiAssessRisks=aiAssessRisks;
    function assumptionsForm(){
      var a = DATA.assumptions||{};
      function f(key, label, val){ return '<div><label>'+label+'</label><input id="as-'+key+'" value="'+(val!=null?val:'')+'"></div>'; }
      var fx = a.fx||{};
      var medRev = (DATA.unitEconomics && DATA.unitEconomics.revenueDist && DATA.unitEconomics.revenueDist.p50) || 0;
      var um = DATA.unitModel || {};
      function fPctRev(key, label, val, desc, ref){
        var kc = (parseFloat(val)||0)/100*medRev;
        var refLine = (ref!=null) ? ' · <span style="color:#0ea5e9;cursor:pointer" onclick="setPct(&#39;'+key+'&#39;,'+ref+')">dle ekonomiky prádlomatu: '+String(ref).replace('.',',')+' % → použít</span>' : '';
        return '<div><label>'+label+'</label><input id="as-'+key+'" value="'+(val!=null?val:'')+'" oninput="pctHint(&#39;'+key+'&#39;)">'+
          '<div style="font-size:11px;color:var(--text2);margin-top:4px;">'+(desc?(desc+' · '):'')+'≈ <b id="hint-'+key+'" style="color:var(--text)">'+money(kc)+'</b> /měs z mediánu '+money(medRev)+refLine+'</div></div>';
      }
      var h = '<div class="sec"><h2>Předpoklady <span class="tag tag-assume">ASSUMPTION</span></h2><div class="note">Vstupují do výpočtu EBITDA a Base Case. <b>Celý model počítá bez DPH</b> (net tržby − net náklady = net EBITDA). Servis a energie jsou odvozené z ekonomiky jednoho prádlomatu (V3). Uložení přepočítá čísla.</div><div class="asum">';
      h += fPctRev('servicePct','Servis (% z obratu bez DPH)', a.servicePct, 'vše vč. spotřeby detergentů', um.servicePct);
      h += fPctRev('energyPct','Energie (% z obratu bez DPH)', a.energyPct, 'voda, elektřina, odpad', um.energyPct);
      h += fPctRev('paymentFeePct','Platební poplatky (% z obratu bez DPH)', a.paymentFeePct);
      var rs = DATA.rentStats || {};
      var rentHint = (rs.avgKnownRentCzk != null)
        ? '<div style="font-size:11px;color:var(--text2);margin-top:4px;">Průměr známých nájmů: <b style="color:var(--text)">' + rs.avgKnownRentCzk.toLocaleString('cs-CZ') + ' Kč</b> (z ' + rs.count + ' z ' + rs.totalPlan + ' lokalit)</div>'
        : '<div style="font-size:11px;color:var(--text2);margin-top:4px;">Nájmy zatím nejsou v Compoundingu vyplněné.</div>';

        vatByCurrency: Object.assign({}, (DATA.assumptions&&DATA.assumptions.vatByCurrency)||{}, { CZK:v('vatCZK'), EUR:v('vatEUR'), PLN:v('vatPLN') }),

      h += '<div class="grid2">';

      h += '</div>';
      h += '<div class="sec" style="background:var(--surface2)"><h2>Roční čistý zisk sítě 💰</h2><div class="note">Čistý zisk za rok = EBITDA − daň − splátky úvěru. Jak se úvěry postupně doplácí, splátky mizí a čistý zisk skokově roste. Žlutě čistý zisk, modře počet jednotek celkem, fialově (čárkovaně) jednotky pořízené z úvěru — zbytek je ze samofinancování.</div><canvas id="fc-cum" height="120"></canvas></div>';
      h += yearlyTableHtml();
      h += requestedFinancingHtml();
      h += creditCommitteeHtml();
      h += fcFinancingForm();
      body.innerHTML = h;

    // Debt Sizing Optimizer — max. bezpečný dluh/jednotku pro cílové DSCR (Base/Downside).

    // Volatilita + nejhorší klouzavé období (z analytiky portfolia).
    async function loadVolatility(){
      var box=document.getElementById('fc-volatility'); if(!box) return; box.innerHTML='';
      try{
        var res=await Promise.all([
          fetch('/api/bank-plan/overview?base='+BASE,{credentials:'include'}).then(function(r){return r.json();}),
          fetch('/api/bank-plan/scenarios?base='+BASE+'&mode=reinvest',{credentials:'include'}).then(function(r){return r.json();}).catch(function(){return{};}),
        ]);
        var d=res[0], scD=res[1]||{};
        var v=d.volatility||{}, wr=d.worstRolling||{};
        if(!v.count) return;
        var m12=wr.m12, m3=wr.m3;
        var gm=(wr.graceMonthsExcluded!=null?wr.graceMonthsExcluded:6);
        // σ rezerva = o kolik σ musí tržba spadnout k breakevenu (DSCR=1,0). = rezerva% ÷ CV%.
        var be=(scD.scenarios||[]).find(function(x){return x.key==='breakeven';});
        var cushion=be&&be.cushionPct;
        var sigma=(cushion!=null && v.cvPct)?(cushion/v.cvPct):null;
        box.innerHTML='<div class="sec" style="background:var(--surface2)"><h2>Volatilita &amp; nejhorší období <span class="tag tag-actual">ACTUAL</span></h2>'+
          '<div class="note">Průměrná tržba <b>na jednu lokalitu</b>, <b>bez prvních '+gm+' měsíců</b> každého prádlomatu (náběh + odklad splátek) — ať to neměří růst sítě ani startovací období. Odolnost vůči skutečně pozorovanému horšímu období (§19/§20).</div>'+
          '<div class="kpis">'+
          kpi('Variační koeficient (CV)', (v.cvPct!=null?String(v.cvPct).replace('.',',')+' %':'—'), 'kolísání tržby na lokalitu')+
          kpi('σ rezerva do breakevenu', (sigma!=null?String(Math.round(sigma*10)/10).replace('.',',')+'σ':'—'), (cushion!=null?('tržba by musela klesnout o ~'+String(Math.round(sigma*10)/10).replace('.',',')+' směr. odchylky'):''), true)+
          kpi('Nejhorší měsíc / lok.', money(v.worst), (v.worstYm||''))+
          kpi('Nejhorší 12M (Ø/měs·lok.)', (m12?money(Math.round(m12.avg)):'—'), (m12?(m12.startYm+' – '+m12.endYm):''))+
          '</div>'+
          (sigma!=null?('<div class="note" style="margin-top:6px">💪 <b>Argument pro banku:</b> stabilizovaná lokalita má kolísání tržeb jen '+String(v.cvPct).replace('.',',')+' %. K porušení krytí splátky (DSCR 1,0) by tržba musela spadnout o <b>~'+String(Math.round(sigma*10)/10).replace('.',',')+' směrodatné odchylky</b> pod normál — statisticky jde o velmi nepravděpodobnou událost. Dluh je nastaven tak, že je bezpečně obsluhovatelný i v historicky doloženém horším období.</div>'):'')+
          '</div>';
      }catch(e){}
    }
    // Ovládací tabulka scénářů: klik na řádek = aktivní scénář (přepočítá grafy dole),
    // faktor u Downside/Stress je editovatelný (živý přepočet), Breakeven je dopočtený řádek.
    async function loadScenarioTable(){
      var box = document.getElementById('fc-scentable'); if(!box) return;
      if(!box.innerHTML) box.innerHTML = '<div class="note">Načítám…</div>';
      try {
        var r = await fetch('/api/bank-plan/scenarios?base='+BASE+'&mode=reinvest', { credentials:'include' });
        var d = await r.json(); if(!r.ok || !d.scenarios) { box.innerHTML=''; return; }
        var P = d.params || {};
        var beRow = (d.scenarios||[]).find(function(x){return x.key==='breakeven';});
        var dsc = function(x){ return x!=null ? (Math.round(x*100)/100).toLocaleString('cs-CZ')+'×' : '—'; };
        var badge = function(p){ if(p==null) return '<span style="color:var(--muted2)">—</span>'; return p
          ? '<span style="background:rgba(34,197,94,.16);color:#22c55e;border:1px solid rgba(34,197,94,.4);border-radius:6px;padding:2px 9px;font-weight:800;font-size:11px">PASS</span>'
          : '<span style="background:rgba(239,68,68,.16);color:#ef4444;border:1px solid rgba(239,68,68,.4);border-radius:6px;padding:2px 9px;font-weight:800;font-size:11px">FAIL</span>'; };
        // klientský přepočet řádku z faktoru
        var calc = function(f){ var rev=P.p50*f; var eb=rev-P.rentBase-rev*P.varPct/100; var cf=eb-rev*P.maintPct/100; var dscr=P.annuityBase>0?cf/P.annuityBase:null; return {rev:Math.round(rev),eb:Math.round(eb),ann:Math.round(P.annuityBase),dscr:dscr}; };
        var rows = [
          {key:'base',label:'Base',factor:1,editable:false,target:1.3,basis:'100 % mediánu'},
          {key:'downside',label:'Downside',factor:FC_FACTORS.downside,editable:true,target:1.2},
          {key:'stress',label:'Stress',factor:FC_FACTORS.stress,editable:true,target:1.0},
        ];
        var h = '<div class="sec" style="background:var(--surface2)"><h2>Scénáře &amp; ovládání <span class="tag tag-actual">ACTUAL</span></h2>'+
          '<div class="note"><b>Klikni na řádek</b> = zvol scénář (grafy a čísla dole se přepočítají). Faktor u Downside/Stress můžeš <b>přepsat</b>. <b>DSCR = NOI jednotky ÷ splátka</b>, PASS/FAIL vůči targetu. <b>Breakeven</b> = tržba pro DSCR 1,0 (rezerva = o kolik smí tržby klesnout).</div>'+
          '<div style="overflow-x:auto"><table class="dt"><thead><tr>'+
          '<th>Scénář</th><th>Základ (faktor)</th><th style="text-align:right">Revenue / lok.</th><th style="text-align:right">EBITDA / lok.</th><th style="text-align:right">Splátka / lok.</th><th style="text-align:right">DSCR</th><th style="text-align:right">Target</th><th style="text-align:center">Stav</th></tr></thead><tbody>';
        rows.forEach(function(rw){
          var c = calc(rw.factor);
          var pass = (c.dscr!=null && rw.target) ? (c.dscr>=rw.target) : null;
          var active = FC_SCEN===rw.key;
          var inp = 'background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);width:64px;padding:3px 6px;font-size:12px;text-align:right';
          var basisCell = rw.key==='base' ? '100 % mediánu'
            : (rw.editable ? ('× <input type="number" step="0.05" min="0.1" max="3" value="'+rw.factor+'" onclick="event.stopPropagation()" onchange="fcSetFactor(&#39;'+rw.key+'&#39;,this.value)" style="'+inp+'"> ('+(rw.factor<1?'−':'+')+Math.round(Math.abs(rw.factor-1)*100)+' %)') : '—');
          h += '<tr onclick="fcScen(&#39;'+rw.key+'&#39;)" style="cursor:pointer;'+(active?'background:rgba(234,179,8,.10)':'')+'">'+
            '<td style="font-weight:700">'+(active?'▸ ':'')+rw.label+'</td><td class="muted">'+basisCell+'</td>'+
            '<td style="text-align:right">'+money(c.rev)+'</td><td style="text-align:right">'+money(c.eb)+'</td><td style="text-align:right">'+money(c.ann)+'</td>'+
            '<td style="text-align:right;font-weight:700">'+dsc(c.dscr)+'</td><td style="text-align:right">'+dsc(rw.target)+'</td>'+
            '<td style="text-align:center">'+badge(pass)+'</td></tr>';
        });
        if (beRow) {
          var activeBE = FC_SCEN==='breakeven';
          h += '<tr onclick="fcScen(&#39;breakeven&#39;)" style="cursor:pointer;border-top:2px solid var(--border);'+(activeBE?'background:rgba(234,179,8,.10)':'')+'">'+
            '<td style="font-weight:700">'+(activeBE?'▸ ':'')+'Breakeven (DSCR 1,0)</td><td class="muted">tržba pro DSCR 1,0</td>'+
            '<td style="text-align:right">'+money(beRow.perUnitRevenue)+'</td><td style="text-align:right">'+money(beRow.perUnitEbitda)+'</td><td style="text-align:right">'+money(beRow.perUnitAnnuity)+'</td>'+
            '<td style="text-align:right;font-weight:700">1×</td><td style="text-align:right"><span class="muted">hranice</span></td>'+
            '<td style="text-align:center"><span style="color:#eab308;font-weight:700;font-size:11px">rezerva '+(beRow.cushionPct!=null?('−'+String(beRow.cushionPct).replace('.',',')+' %'):'—')+'</span></td></tr>';
        }
        h += '</tbody></table></div></div>';
        box.innerHTML = h;
      } catch(e){ box.innerHTML=''; }
    }
    function unitBreakdownHtml(){
      var u = FC.unitBreakdown; if(!u) return '';
      function row(lbl, val, opts){
        opts = opts||{};

        var sign = opts.minus ? '− ' : (opts.plus?'':'');
        var bold = opts.bold ? 'font-weight:800;' : '';

        return '<div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;'+bt+bold+'"><span style="color:var(--text2)">'+sign+lbl+'</span><span style="text-align:right;color:'+col+';'+bold+'">'+money(val)+pctTxt+'</span></div>';
      }
      var rev = u.revenue||1;
      var h = '<div class="sec" style="background:var(--surface2)"><h2>🧺 Ukázka jedné lokality (mediánová, měsíčně) <span class="tag tag-actual">ACTUAL</span> + <span class="tag tag-assume">ASSUMPTION</span></h2>'+
        '<div class="note">Reprezentativní prádlomat (skutečný medián, bez DPH): co vydělá a co zbyde po odečtení všeho včetně splátky úvěru. Agregátní model níže používá scénáře: Base = historický medián, Downside = medián −10 %, Stress = medián −15 %.</div>'+
        '<div style="max-width:520px">';
      h += row('Obrat (bez DPH)', u.revenue, {bold:true});
      h += row('Nájem', u.rent, {minus:true, col:'#ef4444', pct:u.rent/rev});
      h += row('Servis', u.service, {minus:true, col:'#ef4444', pct:u.service/rev});

      var ed = DATA.unitEconomics.ebitdaDist; var bc = DATA.unitEconomics.baseCaseEbitda;
      _charts.ebitdist = new Chart(document.getElementById('ch-ebitdist'), { type:'bar',
        data:{ labels:['P10','P25','Medián','P75','P90'], datasets:[{ data:[ed.p10,ed.p25,ed.p50,ed.p75,ed.p90].map(Math.round), backgroundColor:['#94a3b8','#94a3b8','#22c55e','#94a3b8','#94a3b8'] }] },
        options: Object.assign({}, common, { plugins:{ legend:{display:false}, tooltip:{ callbacks:{ afterBody:function(){ return 'Base scénář: '+money(bc); } } } } }) });

      // sezónnost
      var mon = ['Led','Úno','Bře','Dub','Kvě','Čer','Čvc','Srp','Zář','Říj','Lis','Pro'];
      var seas = DATA.seasonality||[];
      _charts.seas = new Chart(document.getElementById('ch-seas'), { type:'bar',
        data:{ labels:mon, datasets:[{ data:seas.map(function(x){return x==null?null:x;}), backgroundColor: seas.map(function(x){ return (x!=null&&x>=100)?'#22c55e':'#f59e0b'; }) }] },
        options: Object.assign({}, common, { scales:{ x:{ grid:{color:grid}, ticks:{color:tick} }, y:{ grid:{color:grid}, ticks:{color:tick}, beginAtZero:true, suggestedMax:140 } } }) });

      // kohorty (medián dle měsíců od otevření)
      var co = (DATA.cohort||[]).filter(function(c){ return c.count>0; });
      _charts.cohort = new Chart(document.getElementById('ch-cohort'), { type:'line',
        data:{ labels:co.map(function(c){return 'M'+c.month;}), datasets:[{ data:co.map(function(c){return Math.round(c.median||0);}), borderColor:'#22c55e', backgroundColor:'rgba(34,197,94,.12)', fill:true, tension:.25, pointRadius:2 }] },
        options: common });
    }

    var _polling = null;
    async function rebuild(){
      var btn = document.getElementById('bp-rebuild');
      btn.disabled = true; btn.textContent = '⏳ Stahuji ze SIS…';
      try {
        var r = await fetch('/api/bank-plan/history/rebuild', { method:'POST', credentials:'include' });
        var j = await r.json();
        if (!r.ok && r.status!==409) throw new Error(j.error||('HTTP '+r.status));
      } catch(e){ btn.disabled=false; btn.textContent='↻ Přebudovat data'; alert('Nepodařilo se spustit: '+(e.message||'')); return; }
      if (_polling) clearInterval(_polling);
      _polling = setInterval(async function(){
        try {
          var s = await (await fetch('/api/bank-plan/history/status', { credentials:'include' })).json();
          if (s.state && !s.state.building) {
            clearInterval(_polling); _polling=null;
            btn.disabled=false; btn.textContent='↻ Přebudovat data';
            if (s.state.error) alert('Přebudování selhalo: '+s.state.error);
            load();
          }
        } catch(e){}
      }, 4000);
    }

    // Oddělování tisíců (mezera). Prázdné → ''. Zachová desetinnou čárku.
    function fmtNum(v){ if(v==null||v==='') return ''; var n=parseFloat(String(v).replace(/[\s ]/g,'').replace(',','.')); if(!isFinite(n)) return String(v); return n.toLocaleString('cs-CZ'); }
    window.fmtNum = fmtNum;
    function pctHint(key){ var el=document.getElementById('as-'+key); if(!el) return; var med=(DATA&&DATA.unitEconomics&&DATA.unitEconomics.revenueDist&&DATA.unitEconomics.revenueDist.p50)||0; var kc=(parseFloat(String(el.value).replace(',','.'))||0)/100*med; var s=document.getElementById('hint-'+key); if(s) s.textContent=money(kc); }
    function setPct(key,val){ var el=document.getElementById('as-'+key); if(el){ el.value=val; pctHint(key); } }
    window.pctHint=pctHint; window.setPct=setPct;

    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

    load();
  </script>
</body>
</html>

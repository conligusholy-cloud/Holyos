<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Obchodník — Moje kontakty</title>
<style>
  :root{
    --bg:#0f1115; --surface:#171a21; --surface2:#1f2430; --line:rgba(255,255,255,.09);
    --text:#f2f3f5; --muted:#9aa0ad; --muted2:#6b7280; --primary:#eab308; --primary-d:#1a1408;
    --new:#3b82f6; --contacted:#8b5cf6; --qualified:#eab308; --converted:#22c55e; --rejected:#ef4444;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.45}
  body{padding-bottom:88px}
  a{color:inherit}
  /* Header */
  .top{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px calc(10px + env(safe-area-inset-top,0)) 16px}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .top h1{font-size:18px;margin:0;font-weight:700}
  .who{font-size:12px;color:var(--muted)}
  .logout{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 12px;font-size:12px;cursor:pointer}
  .search{margin-top:10px;width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--text);font-size:15px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
  .chip.active{background:var(--primary);border-color:var(--primary);color:var(--primary-d);font-weight:600}
  /* List */
  .list{padding:8px 12px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
  .card.today{border-left:3px solid #22c55e}
  .card-main{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
  .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .card-body{flex:1;min-width:0}
  .card-name{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .chev{color:var(--muted2);font-size:13px;transition:transform .2s}
  .gear{color:var(--muted2);font-size:16px;padding:4px 6px;cursor:pointer}
  .card.open .chev{transform:rotate(90deg)}
  /* Detail */
  .detail{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
  .card.open .detail{display:block}
  .field{margin-top:12px}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted2);margin-bottom:5px}
  select,textarea,.qinput{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--text);font-size:15px;font-family:inherit}
  textarea{min-height:70px;resize:vertical}
  .quick{display:flex;gap:8px;margin-top:6px}
  .quick .qinput{flex:1}
  .btn{border:none;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .btn-p{background:var(--primary);color:var(--primary-d)}
  .btn-g{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
  .actions-row{display:flex;gap:8px;margin-top:12px}
  .actions-row a{flex:1;text-align:center;text-decoration:none;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:14px;font-weight:600}
  .note-log{white-space:pre-wrap;font-size:12.5px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:6px;max-height:150px;overflow:auto}
  .saved{color:var(--converted);font-size:12px;margin-left:8px}
  /* FAB + modal */
  .fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0));background:var(--primary);color:var(--primary-d);border:none;border-radius:999px;padding:15px 20px;font-size:15px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.4);cursor:pointer;z-index:30}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:40}
  .modal.open{display:flex}
  .sheet{background:var(--surface);width:100%;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0));border-top:1px solid var(--line)}
  .sheet h2{margin:0 0 14px;font-size:17px}
  .empty,.loading{padding:48px 20px;text-align:center;color:var(--muted)}
  .err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5;padding:10px 12px;border-radius:10px;margin:12px}
</style>
</head>
<body>
  <div class="top">
    <div class="top-row">
      <div>
        <h1>Moje kontakty</h1>
        <div class="who" id="who">…</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="logout" onclick="openSettings()" title="Nastavení notifikací">⚙️ Notifikace</button>
        <button class="logout" onclick="doLogout()">Odhlásit</button>
      </div>
    </div>
    <input class="search" id="search" placeholder="Hledat jméno / e-mail…" oninput="onSearch()">
  </div>

  <div class="chips" id="chips"></div>
  <div id="myplan" style="padding:0 12px"></div>
  <div id="content"><div class="loading">Načítám…</div></div>

  <button class="fab" onclick="openAdd()">+ Nový kontakt</button>

  <div class="modal" id="add-modal">
    <div class="sheet">
      <h2>Nový kontakt</h2>
      <div class="field"><label>Jméno</label><input class="qinput" id="a-name" placeholder="Jméno / firma"></div>
      <div class="field"><label>E-mail</label><input class="qinput" id="a-email" type="email" placeholder="email@…" inputmode="email"></div>
      <div class="field"><label>Telefon</label><div style="display:flex;gap:8px"><select id="a-dial" style="flex:0 0 120px"></select><input class="qinput" id="a-phone" type="tel" placeholder="číslo" inputmode="tel" style="flex:1"></div></div>
      <p style="font-size:12px;color:var(--muted);margin:6px 0 0">Povinný je aspoň jeden kontakt — e-mail <b>nebo</b> telefon.</p>
      <div class="field"><label>Jazyk</label><select id="a-lang"></select></div>
      <div class="actions-row">
        <button class="btn btn-g" style="flex:1" onclick="closeAdd()">Zrušit</button>
        <button class="btn btn-p" style="flex:2" id="a-save" onclick="saveAdd()">Uložit kontakt</button>
      </div>
      <p id="a-err" style="color:#fca5a5;font-size:13px;margin:8px 0 0;min-height:16px"></p>
    </div>
  </div>

  <div class="modal" id="edit-modal">
    <div class="sheet">
      <h2>Údaje kontaktu</h2>
      <p id="e-created" style="font-size:12px;color:var(--muted);margin:0 0 12px"></p>
      <div class="field"><label>Jméno / firma</label><input class="qinput" id="e-name" placeholder="Jméno / firma"></div>
      <div class="field"><label>E-mail</label><input class="qinput" id="e-email" type="email" placeholder="email@…" inputmode="email"></div>
      <div class="field"><label>Telefon</label><div style="display:flex;gap:8px"><select id="e-dial" style="flex:0 0 120px"></select><input class="qinput" id="e-phone" type="tel" placeholder="číslo" inputmode="tel" style="flex:1"></div></div>
      <div class="field"><label>Jazyk</label><select id="e-lang"></select></div>
      <div class="actions-row">
        <button class="btn btn-g" style="flex:1" onclick="closeEdit()">Zrušit</button>
        <button class="btn btn-p" style="flex:2" id="e-save" onclick="saveEdit()">Uložit údaje</button>
      </div>
      <p id="e-err" style="color:#fca5a5;font-size:13px;margin:8px 0 0;min-height:16px"></p>
    </div>
  </div>

  <div class="modal" id="settings-modal">
    <div class="sheet">
      <h2>Nastavení notifikací</h2>
      <p style="font-size:12px;color:var(--muted);margin:0 0 14px">Push notifikace do aplikace Velín na tvůj telefon.</p>
      <label style="display:flex;align-items:center;gap:12px;font-size:15px;margin:10px 0;cursor:pointer"><input type="checkbox" id="ns-new" style="width:20px;height:20px;accent-color:var(--primary)"> Nový přidělený kontakt</label>
      <label style="display:flex;align-items:center;gap:12px;font-size:15px;margin:10px 0;cursor:pointer"><input type="checkbox" id="ns-activity" style="width:20px;height:20px;accent-color:var(--primary)"> Aktivita na mém kontaktu (portál)</label>
      <label style="display:flex;align-items:center;gap:12px;font-size:15px;margin:10px 0;cursor:pointer"><input type="checkbox" id="ns-invite" style="width:20px;height:20px;accent-color:var(--primary)"> Neotevřená pozvánka po 12 h</label>
      <div class="actions-row">
        <button class="btn btn-g" style="flex:1" onclick="closeSettings()">Zavřít</button>
        <button class="btn btn-p" style="flex:2" id="ns-save" onclick="saveSettings()">Uložit</button>
      </div>
      <p id="ns-msg" style="font-size:12px;margin:8px 0 0;min-height:16px"></p>
    </div>
  </div>

<script>
  var API = '/api/compounder';
  var STATUS = { new:{l:'Nový',c:'var(--new)'}, contacted:{l:'Kontaktován',c:'var(--contacted)'}, qualified:{l:'Kvalifikován',c:'var(--qualified)'}, converted:{l:'Převeden',c:'var(--converted)'}, rejected:{l:'Zamítnut',c:'var(--rejected)'} };
  var LANGS = { '':'—', en:'English', bg:'Български', cs:'Čeština', da:'Dansk', de:'Deutsch', el:'Ελληνικά', es:'Español', et:'Eesti', fi:'Suomi', fr:'Français', ga:'Gaeilge', hr:'Hrvatski', hu:'Magyar', it:'Italiano', lt:'Lietuvių', lv:'Latviešu', mt:'Malti', nl:'Nederlands', pl:'Polski', pt:'Português', ro:'Română', sk:'Slovenčina', sl:'Slovenščina', sv:'Svenska' };
  var COUNTRIES = [
    {c:'CZ',f:'🇨🇿',d:'+420'},{c:'SK',f:'🇸🇰',d:'+421'},{c:'DE',f:'🇩🇪',d:'+49'},{c:'AT',f:'🇦🇹',d:'+43'},
    {c:'PL',f:'🇵🇱',d:'+48'},{c:'HU',f:'🇭🇺',d:'+36'},{c:'FR',f:'🇫🇷',d:'+33'},{c:'IT',f:'🇮🇹',d:'+39'},
    {c:'ES',f:'🇪🇸',d:'+34'},{c:'PT',f:'🇵🇹',d:'+351'},{c:'NL',f:'🇳🇱',d:'+31'},{c:'BE',f:'🇧🇪',d:'+32'},
    {c:'GB',f:'🇬🇧',d:'+44'},{c:'IE',f:'🇮🇪',d:'+353'},{c:'DK',f:'🇩🇰',d:'+45'},{c:'SE',f:'🇸🇪',d:'+46'},
    {c:'FI',f:'🇫🇮',d:'+358'},{c:'RO',f:'🇷🇴',d:'+40'},{c:'BG',f:'🇧🇬',d:'+359'},{c:'GR',f:'🇬🇷',d:'+30'},
    {c:'HR',f:'🇭🇷',d:'+385'},{c:'SI',f:'🇸🇮',d:'+386'},{c:'LT',f:'🇱🇹',d:'+370'},{c:'LV',f:'🇱🇻',d:'+371'},
    {c:'EE',f:'🇪🇪',d:'+372'},{c:'LU',f:'🇱🇺',d:'+352'},{c:'MT',f:'🇲🇹',d:'+356'},{c:'CY',f:'🇨🇾',d:'+357'},
    {c:'CH',f:'🇨🇭',d:'+41'},{c:'NO',f:'🇳🇴',d:'+47'},{c:'US',f:'🇺🇸',d:'+1'}
  ];
  function dialOptions(sel){ return COUNTRIES.map(function(x){ return '<option value="'+x.d+'"'+(x.d===sel?' selected':'')+'>'+x.f+' '+x.d+'</option>'; }).join(''); }
  function splitPhone(phone){ phone=(phone||'').trim(); var s=COUNTRIES.slice().sort(function(a,b){return b.d.length-a.d.length;}); for(var i=0;i<s.length;i++){ if(phone.indexOf(s[i].d)===0) return { dial:s[i].d, num: phone.slice(s[i].d.length).trim() }; } return { dial:'+420', num: phone }; }
  function combinePhone(dial, num){ num=(num||'').trim(); return num ? (dial+' '+num) : ''; }
  var SECDEFS = [['ekonomika','Provozovatel'],['nabidka','Investor'],['distributor','Distributor']];
  var RES_STATUS = { reserved:'Rezervováno', active:'Aktivní', expired:'Vypršelo', cancelled:'Zrušeno', signed:'Podepsáno' };
  var CONTRACT_TYPES = [['rezervacni','Rezervační'],['kupni','Kupní'],['servisni','Servisní']];
  var CONTRACT_STATUS = { koncept:'Koncept', odeslano:'Odesláno', vyplneno:'Vyplněno', k_podpisu:'Čeká na náš podpis', podepsano:'Podepsáno' };
  var SPEECH_OK = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  var state = { leads:[], filter:'', search:'', openId:null };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function langCode(l){ return (l||'').toLowerCase().split(/[-_]/)[0]; }
  function warmth(l){ var w=l.warmthPct; if(w==null) return null; return { w:w, lbl: w>=70?'Horký':w>=45?'Zahřátý':w>=25?'Vlažný':'Studený', col: w>=70?'#ef4444':w>=45?'#eab308':w>=25?'#3b82f6':'#6b7280' }; }
  function fmtDate(iso){ if(!iso) return '—'; var d=new Date(iso); return fmtD(d); }
  function fmtD(d){ if(!d) return '—'; return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
  function parseActLogDate(log){ if(!log) return null; var m=String(log).match(/\[(\d{2})\.(\d{2})\.(\d{4}) (\d{2}):(\d{2})\]/); return m ? new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5]) : null; }
  function lastActivityDate(l){ var d1=l.lastActivityAt?new Date(l.lastActivityAt):null; var d2=parseActLogDate(l.activity_log); if(d1&&d2) return d1>d2?d1:d2; return d1||d2; }
  function isTodayD(d){ if(!d) return false; var n=new Date(); return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate(); }
  var EVENT_LABEL = { portal_view:'Otevřel portál', section_view:'Prohlížel sekci', doc_download:'Stáhl dokument', location_assess:'Zhodnotil lokalitu', contact_request:'Požádal o kontakt', register_success:'Registrace', page_leave:'Odešel ze stránky', card_flip:'Otočil kartu', page_switch:'Přepnul stránku', visit_end:'Konec návštěvy' };

  async function api(path, opts){
    opts = opts || {}; opts.credentials = 'include';
    var r = await fetch(API + path, opts);
    if (r.status === 401){ window.location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname); throw new Error('401'); }
    return r;
  }

  async function init(){
    try {
      var me = await (await fetch('/api/auth/me', { credentials:'include' })).json().catch(function(){return null;});
      if (!me || !me.user){ window.location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname); return; }
      var p = me.user.person;
      document.getElementById('who').textContent = p ? ((p.firstName||'')+' '+(p.lastName||'')).trim() : (me.user.displayName||'');
      renderChips();
      buildLangOptions();
      await load();
      loadMyPlan();
    } catch(e){ /* redirect handled */ }
  }

  function renderChips(){
    var chips = [['','Vše']].concat(Object.keys(STATUS).map(function(k){ return [k, STATUS[k].l]; }));
    document.getElementById('chips').innerHTML = chips.map(function(c){
      return '<div class="chip'+(state.filter===c[0]?' active':'')+'" onclick="setFilter(\''+c[0]+'\')">'+c[1]+'</div>';
    }).join('');
  }
  function setFilter(f){ state.filter=f; renderChips(); load(); }
  var searchTimer=null;
  function onSearch(){ clearTimeout(searchTimer); searchTimer=setTimeout(function(){ state.search=document.getElementById('search').value.trim(); load(); }, 300); }

  async function load(){
    var box = document.getElementById('content');
    box.innerHTML = '<div class="loading">Načítám…</div>';
    try {
      var qs = new URLSearchParams({ status: state.filter, search: state.search }).toString();
      var r = await api('/my-leads?' + qs);
      if (!r.ok) throw new Error('HTTP '+r.status);
      state.leads = await r.json();
      render();
    } catch(e){ box.innerHTML = '<div class="err">Nepodařilo se načíst kontakty: '+esc(e.message)+'</div>'; }
  }

  function render(){
    var box = document.getElementById('content');
    if (!state.leads.length){ box.innerHTML = '<div class="empty">Zatím žádné přiřazené kontakty.</div>'; return; }
    box.innerHTML = '<div class="list">' + state.leads.map(cardHtml).join('') + '</div>';
    if (state.openId){ loadActivity(state.openId); loadReservations(state.openId); }
  }

  function cardHtml(l){
    var st = STATUS[l.status] || STATUS.new;
    var lc = langCode(l.lang);
    var open = state.openId === l.id;
    var wm = warmth(l);
    var subParts = [];
    if (l.email) subParts.push(esc(l.email));
    if (l.phone) subParts.push(esc(l.phone));
    var subHtml = subParts.join(' · ');
    if (wm) subHtml += (subHtml ? ' · ' : '') + '<span style="color:'+wm.col+';font-weight:600">'+wm.lbl+' '+wm.w+'</span>';
    if (l.requestedContact) subHtml += ' <span title="Požádal o kontakt">📞</span>';
    var waNum = (l.phone||'').replace(/[^0-9]/g,'');
    var telClean = (l.phone||'').replace(/\s+/g,'');
    var laDate = lastActivityDate(l); var laToday = isTodayD(laDate);
    var statusSel = '<select onchange="setField('+l.id+',\'status\',this.value)">' + Object.keys(STATUS).map(function(k){ return '<option value="'+k+'"'+(l.status===k?' selected':'')+'>'+STATUS[k].l+'</option>'; }).join('') + '</select>';
    var langSel = '<select onchange="setField('+l.id+',\'lang\',this.value)">' + Object.keys(LANGS).map(function(k){ return '<option value="'+k+'"'+(lc===k?' selected':'')+'>'+(k?k.toUpperCase()+' · ':'')+LANGS[k]+'</option>'; }).join('') + '</select>';
    var secsArr = (l.visible_sections||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
    var secBoxes = SECDEFS.map(function(d){ var on = secsArr.indexOf(d[0])>=0; return '<label style="display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0;cursor:pointer"><input type="checkbox" '+(on?'checked':'')+' onchange="toggleSection('+l.id+',\''+d[0]+'\',this.checked)" style="width:18px;height:18px;accent-color:var(--primary)">'+d[1]+'</label>'; }).join('');
    var accInfo = accessInfoHtml(l);
    return '<div class="card'+(open?' open':'')+(laToday?' today':'')+'" id="card-'+l.id+'">' +
      '<div class="card-main" onclick="toggle('+l.id+')">' +
        '<span class="dot" style="background:'+st.c+'"></span>' +
        '<div class="card-body"><div class="card-name">'+esc(l.name||l.email)+'</div><div class="card-sub">'+(subHtml||'—')+'</div>'+(laToday?'<div style="font-size:11px;color:#22c55e;margin-top:2px">Poslední aktivita: '+fmtD(laDate)+'</div>':'')+'</div>' +
        '<span class="badge" style="background:'+st.c+'22;color:'+st.c+'">'+st.l+'</span>' +
        '<span class="gear" onclick="event.stopPropagation();openEdit('+l.id+')" title="Upravit údaje kontaktu">⚙️</span>' +
        '<span class="chev">▸</span>' +
      '</div>' +
      '<div class="detail">' +
        '<div class="actions-row" style="margin-top:12px">' +
          (l.phone ? '<a href="tel:'+esc(telClean)+'">📞 Volat</a>' : '') +
          (waNum ? '<a href="https://wa.me/'+waNum+'" target="_blank" rel="noopener">💬 WhatsApp</a>' : '') +
          (l.phone ? '<a href="sms:'+esc(telClean)+'">📩 SMS</a>' : '') +
          (l.email ? '<a href="mailto:'+esc(l.email)+'">✉️ E-mail</a>' : '') +
        '</div>' +
        '<div style="font-size:12px;margin-top:8px;color:'+(laToday?'#22c55e':'var(--muted)')+'">Poslední aktivita: '+(laDate?fmtD(laDate):'—')+'</div>' +
        '<div class="field"><label>Stav</label>'+statusSel+'</div>' +
        '<div class="field"><label>Portál</label>' +
          '<button class="btn btn-g" style="width:100%"'+(l.email?'':' disabled')+' onclick="sendAccess('+l.id+')">✉️ Odeslat přístup na portál</button>' +
          (l.email ? '' : '<div style="color:var(--muted2);font-size:12px;margin-top:4px">Kontakt nemá e-mail — přístup nelze odeslat.</div>') +
          '<div id="access-info-'+l.id+'" style="font-size:12px;color:var(--muted);margin-top:6px">'+accInfo+'</div>' +
          '<div id="access-msg-'+l.id+'" style="font-size:12px;margin-top:4px"></div>' +
          '<div style="margin-top:10px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted2)">Viditelné sekce portálu</div>' + secBoxes +
        '</div>' +
        '<div class="field"><label>Zaznamenat aktivitu</label>' +

  async function loadContracts(kiosk, label){
    var box = document.getElementById(ctId(kiosk)); if (!box) return;
    box.innerHTML = '<div style="color:var(--muted);font-size:12px">Načítám smlouvy…</div>';
    try {
      var r = await api('/contracts/list?code='+encodeURIComponent(kiosk));
      var list = r.ok ? await r.json() : [];
      var byType = {};
      list.forEach(function(c){ if (!byType[c.type] || c.id > byType[c.type].id) byType[c.type] = c; });
      var exists = function(t){ return !!byType[t]; };
      box.innerHTML = '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted2);margin-bottom:4px">Smlouvy</div>' +
        CONTRACT_TYPES.map(function(d){
          var t=d[0], lbl=d[1], c=byType[t];
          var locked = (t==='kupni' && !exists('rezervacni')) || (t==='servisni' && !exists('kupni'));
          var status = c ? (CONTRACT_STATUS[c.status]||c.status) : '';
          var link = c ? ' · <a href="#" onclick="copyContractLink(event,'+c.id+')" style="color:var(--primary)">odkaz</a>' : '';
          return '<label style="display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0;'+(locked?'opacity:.4':'cursor:pointer')+'">'+
            '<input type="checkbox" '+(c?'checked':'')+' '+(locked?'disabled':'')+' onchange="toggleContract(this,\''+encodeURIComponent(kiosk)+'\',\''+encodeURIComponent(label)+'\',\''+t+'\','+(c?c.id:'null')+',\''+(c?c.status:'')+'\')" style="width:18px;height:18px;accent-color:var(--primary)">'+
            '<span>'+lbl+(status?' <span style="color:var(--muted)">('+status+')</span>':'')+link+'</span>'+
          '</label>';
        }).join('') +
        '<div style="color:var(--muted2);font-size:11px;margin-top:2px">Zaškrtnutí smlouvu připraví a zpřístupní zákazníkovi (odkaz k podpisu).</div>';
    } catch(e){ box.innerHTML = '<div style="color:var(--muted2);font-size:12px">Smlouvy se nepodařilo načíst.</div>'; }

  async function toggleContract(el, kioskEnc, labelEnc, type, id, status){
    var kiosk = decodeURIComponent(kioskEnc), label = decodeURIComponent(labelEnc);
    el.disabled = true;

      if (el.checked){

        }
        await api('/contracts/'+cid+'/share', { method:'POST' });

        if (id && id!=='null'){

  var LANG_BCP = { cs:'cs-CZ', sk:'sk-SK', en:'en-US', de:'de-DE', pl:'pl-PL', hu:'hu-HU', fr:'fr-FR', it:'it-IT', es:'es-ES', pt:'pt-PT', nl:'nl-NL', ro:'ro-RO', bg:'bg-BG', el:'el-GR', hr:'hr-HR', sl:'sl-SI', da:'da-DK', sv:'sv-SE', fi:'fi-FI' };

  function dictate(id){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var inp = document.getElementById('act-'+id);
    var btn = document.getElementById('mic-'+id);
    if (!SR){ alert('Diktování v tomto prohlížeči není podporováno (funguje hlavně na Androidu a v Chrome).'); return; }
    if (recog){ try{ recog.stop(); }catch(e){} return; }
    recog = new SR(); recogBtn = btn;
    var lead = state.leads.find(function(x){return x.id===id;});
    recog.lang = LANG_BCP[langCode(lead && lead.lang)] || 'cs-CZ';
    recog.interimResults = false; recog.continuous = true;
    recog.onresult = function(e){ var t=''; for (var i=e.resultIndex;i<e.results.length;i++){ t += e.results[i][0].transcript; } if (inp) inp.value = (inp.value ? inp.value+' ' : '') + t.trim(); };
    recog.onend = function(){ if (recogBtn) recogBtn.textContent='🎤 Diktovat'; recog=null; recogBtn=null; };
    recog.onerror = function(){ if (recogBtn) recogBtn.textContent='🎤 Diktovat'; recog=null; recogBtn=null; };
    if (btn) btn.textContent='● Nahrávám… (klepni pro stop)';
    try{ recog.start(); }catch(e){}
  }

  function toggleCall(id){

    var inp = document.getElementById('act-'+id);

      callTimers[id] = { start: Date.now(), interval: setInterval(function(){
        if (!callTimers[id] || !btn) return;
        btn.textContent = '● Ukončit hovor (' + fmtDur(Math.floor((Date.now()-callTimers[id].start)/1000)) + ')';
      }, 1000) };
      if (btn) btn.textContent = '● Ukončit hovor (00:00)';
    } else {
      clearInterval(t.interval);
      var s = Math.floor((Date.now()-t.start)/1000);
      delete callTimers[id];
      if (btn) btn.textContent = '⏱️ Zaznamenat hovor';
      if (inp){ inp.value = 'Hovor ' + fmtDur(s) + ' – ' + (inp.value||''); inp.focus(); }

  function closeSettings(){ document.getElementById('settings-modal').classList.remove('open'); }
  async function saveSettings(){
    var body = {
      new_contact: document.getElementById('ns-new').checked,
      contact_activity: document.getElementById('ns-activity').checked,
      invite_unopened: document.getElementById('ns-invite').checked,
    };
    var btn = document.getElementById('ns-save'); btn.disabled = true; btn.textContent = 'Ukládám…';
    try {
      var r = await api('/my-notify-settings', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      if (r.ok){ document.getElementById('ns-msg').innerHTML = '<span style="color:var(--converted)">✓ Uloženo</span>'; setTimeout(closeSettings, 700); }
      else { document.getElementById('ns-msg').innerHTML = '<span style="color:#fca5a5">Uložení selhalo</span>'; }
    } catch(e){ document.getElementById('ns-msg').innerHTML = '<span style="color:#fca5a5">Uložení selhalo</span>'; }
    finally { btn.disabled = false; btn.textContent = 'Uložit'; }
  }

  async function doLogout(){ try{ await fetch('/api/auth/logout', { method:'POST', credentials:'include' }); }catch(e){} window.location.href='/login.html'; }

  init();
</script>
</body>
</html>

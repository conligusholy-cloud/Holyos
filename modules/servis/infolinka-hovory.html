<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0b0f14">
  <title>Infolinka — hovory</title>
  <link rel="icon" type="image/svg+xml" href="/logo-holyos-icon.svg">
  <style>
    :root{ --bg:#0b0f14; --card:#141c26; --card2:#1b2530; --border:#26333f; --text:#e8eef3; --text2:#8ea1b3; --acc:#22d3ee; --ok:#22c55e; --warn:#eab308; --err:#ef4444; }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .wrap{ max-width:620px; margin:0 auto; padding:14px 14px 40px; }
    .top{ display:flex; align-items:center; gap:10px; padding:4px 2px 12px; position:sticky; top:0; background:var(--bg); z-index:5; }
    .top .logo{ width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--acc),#06b6d4); color:#04222b; display:flex; align-items:center; justify-content:center; font-size:18px; }
    .top h1{ font-size:17px; margin:0; font-weight:700; }
    .top .sub{ font-size:12px; color:var(--text2); }
    .top .refresh{ margin-left:auto; background:var(--card2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:9px 14px; font-size:14px; font-weight:600; }
    .card{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
    .card .row1{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
    .num{ font-size:17px; font-weight:700; color:var(--acc); text-decoration:none; }
    .time{ font-size:12px; color:var(--text2); white-space:nowrap; }
    .want{ font-size:14px; line-height:1.5; margin:2px 0 8px; }
    .want.empty{ color:var(--text2); font-style:italic; }
    .meta{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .chip{ font-size:12px; padding:3px 10px; border-radius:20px; font-weight:600; white-space:nowrap; }
    .chip.ok{ background:rgba(34,197,94,0.15); color:var(--ok); }
    .chip.warn{ background:rgba(234,179,8,0.15); color:var(--warn); }
    .chip.none{ background:var(--card2); color:var(--text2); }
    .chip.len{ background:var(--card2); color:var(--text2); }
    .chip.cb{ background:rgba(34,211,238,0.15); color:var(--acc); }
    .cbwrap{ margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
    .actions{ display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
    .call-btn{ background:var(--ok); color:#04220f; border:none; border-radius:10px; padding:9px 14px; font-size:14px; font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
    audio{ height:34px; max-width:100%; vertical-align:middle; }
    .tr-toggle{ background:var(--card2); border:1px solid var(--border); color:var(--text2); border-radius:10px; padding:8px 12px; font-size:13px; }
    .transcript{ display:none; margin-top:8px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px; font-size:13px; line-height:1.5; max-height:300px; overflow:auto; }
    .transcript .a{ margin:3px 0; } .transcript .a b{ color:var(--acc); }
    /* Kredit přiřazený telefonnímu číslu */
    .chip.credit{ background:rgba(250,204,21,0.18); color:#facc15; border:1px solid rgba(250,204,21,0.4); }
    .credit-btn{ background:var(--card2); border:1px solid rgba(250,204,21,0.45); color:#facc15; border-radius:10px; padding:9px 14px; font-size:14px; font-weight:700; }
    /* Banner „právě volá" — hovor běží teď, operátor u něj vidí kredit */
    .live{ background:linear-gradient(135deg, rgba(34,197,94,0.18), rgba(34,211,238,0.08)); border:1px solid rgba(34,197,94,0.55); border-radius:14px; padding:12px 14px; margin-bottom:12px; }
    .live .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ok); font-weight:700; margin-bottom:4px; }
    .live .lnum{ font-size:20px; font-weight:800; color:var(--text); }
    .live .lcredit{ margin-top:8px; font-size:20px; font-weight:800; color:#facc15; }
    .live .lnote{ margin-top:4px; font-size:13px; color:var(--text2); }
    .live .lnone{ margin-top:6px; font-size:13px; color:var(--text2); }
    /* Dialog pro zadání kreditu */
    .modal{ position:fixed; inset:0; background:rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center; padding:18px; z-index:50; }
    .modal .box{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; width:100%; max-width:380px; }
    .modal h3{ margin:0 0 4px; font-size:16px; }
    .modal .who{ font-size:13px; color:var(--text2); margin-bottom:12px; }
    .modal label{ display:block; font-size:12px; color:var(--text2); margin:10px 0 4px; }
    .modal input{ width:100%; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:11px; color:var(--text); font-size:16px; }
    .modal .btns{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
    .modal button{ border:none; border-radius:10px; padding:11px 14px; font-size:14px; font-weight:700; }
    .modal .save{ background:var(--acc); color:#04222b; flex:1; }
    .modal .cancel{ background:var(--card2); color:var(--text2); border:1px solid var(--border); }
    .modal .del{ background:rgba(239,68,68,0.15); color:var(--err); border:1px solid rgba(239,68,68,0.45); }
    .modal .err{ color:var(--err); font-size:13px; margin-top:8px; min-height:16px; }
    .screen{ text-align:center; padding:56px 20px; }
    .screen .big{ font-size:42px; margin-bottom:10px; }
    .screen h2{ font-size:19px; margin:0 0 8px; }
    .screen p{ color:var(--text2); font-size:14px; line-height:1.6; max-width:340px; margin:0 auto 18px; }
    .screen a.btn{ background:var(--acc); color:#04222b; text-decoration:none; border-radius:12px; padding:14px 22px; font-weight:800; display:inline-block; }
    .hidden{ display:none !important; }
    .empty{ text-align:center; color:var(--text2); padding:40px 10px; }
  </style>
</head>
<body>
  <div id="loading" class="screen"><div class="big">⏳</div><p>Načítám…</p></div>

  <div id="gate" class="screen hidden">
    <div class="big">🔒</div>
    <h2>Nutné přihlášení</h2>
    <p>Tuhle stránku vidí jen přihlášení lidé z Best Series. Přihlas se do HolyOS a otevři odkaz znovu.</p>
    <a class="btn" id="gate-login" href="/">Přihlásit se do HolyOS</a>
  </div>

  <div id="app" class="wrap hidden">
    <div class="top">
      <div class="logo">📞</div>
      <div>
        <h1>Infolinka — hovory</h1>
        <div class="sub">Kdo volal, co chtěl, kam byl přepojen</div>
      </div>
      <button class="refresh" onclick="loadCalls()">↻</button>
    </div>
    <div id="live"></div>
    <div id="list"><div class="empty">Načítám…</div></div>
  </div>

  <script>
  (function(){
    function $(id){ return document.getElementById(id); }
    function show(id){ ['loading','gate','app'].forEach(function(s){ $(s).classList.toggle('hidden', s!==id); });
      // Po přihlášení se vrať zpět na tuhle stránku (ne na výchozí HolyOS).
      if(id==='gate'){ var g=$('gate-login'); if(g){ g.href='/login.html?redirect='+encodeURIComponent(location.pathname+location.search); } }
    }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
    function api(p){ return fetch(p,{credentials:'include'}); }
    function fmtDate(iso){ if(!iso) return ''; var d=new Date(iso); return d.toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}); }
    function fmtDur(s){ s=Number(s)||0; var m=Math.floor(s/60), ss=s%60; return m+':'+(ss<10?'0':'')+ss; }
    function digits(s){ return String(s||'').replace(/[^\d+]/g,''); }

    function fmtDate2(iso){ if(!iso) return ''; var d=new Date(iso); return d.toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}); }
    // Odznaky „technik volal zpět" z callback_log.
    function cbBadges(log){
      log = Array.isArray(log) ? log : [];
      if(!log.length) return '';
      return log.map(function(e){ return '<span class="chip cb">📞 voláno zpět: '+esc(e.name||'?')+' · '+esc(fmtDate2(e.at))+'</span>'; }).join(' ');
    }
    window.markCallback = function(id){
      fetch('/api/voice/calls/'+id+'/callback',{method:'POST',credentials:'include'})
        .then(function(r){ return r.ok?r.json():null; })
        .then(function(j){ if(j&&j.callback_log){ var box=document.getElementById('cb-'+id); if(box) box.innerHTML=cbBadges(j.callback_log); } })
        .catch(function(){});
    };
    // Naformátuje celý přepis (řádky „AI:/Zákazník:/Technik:") na barevný dialog.
    function fmtFull(text){
      var lines=String(text||'').split(/\r?\n/).filter(function(l){return l.trim();});
      if(!lines.length) return '<div style="color:var(--text2);">(prázdné)</div>';
      return lines.map(function(l){
        var m=l.match(/^\s*(AI|Z[aá]kazn[ií]k|Technik|Volaj[ií]c[ií])\s*:\s*(.*)$/i);
        if(m){
          var who=m[1].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''), rest=m[2], label, col;
          if(who.indexOf('ai')===0){ label='🤖 AI'; col='#22d3ee'; }
          else if(who.indexOf('technik')===0){ label='🔧 Technik'; col='#eab308'; }
          else { label='🧑 Zákazník'; col='#22c55e'; }
          return '<div class="a"><b style="color:'+col+';">'+label+':</b> '+esc(rest)+'</div>';
        }
        return '<div class="a">'+esc(l)+'</div>';
      }).join('');
    }
    // Přepis: jen kompletní (Whisper+Claude). Když ještě není, ukáže se tlačítko na jeho vytvoření.
    function transcriptBlock(c){
      // Přepis na mobilní stránce operátorů NEDĚLÁME (šetříme AI náklady) — jen pokud
      // už kompletní přepis existuje (vytvořený v HolyOS na kliknutí), jde si ho zobrazit.
      var full=(c.full_transcript||'').trim();
      if(!full) return '';
      var trBtn='<button class="tr-toggle" onclick="var d=document.getElementById(\'tr-'+c.id+'\');d.style.display=d.style.display===\'block\'?\'none\':\'block\'">📄 Celý přepis</button>';
      return trBtn+'<div class="transcript" id="tr-'+c.id+'">'+fmtFull(full)+'</div>';
    }
    window.transcribeCall = function(id, btn, force){
      if(btn){ btn.disabled=true; btn.textContent='Přepisuji… (chvíli to trvá)'; }
      fetch('/api/voice/calls/'+id+'/transcribe'+(force?'?force=1':''),{method:'POST',credentials:'include'})
        .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
        .then(function(res){
          var d=document.getElementById('tr-'+id);
          if(res.ok && res.j && res.j.full_transcript!=null){ if(d){ d.innerHTML=fmtFull(res.j.full_transcript||''); d.style.display='block'; } if(btn){ btn.textContent='✅ Přepsáno'; } }
          else { if(btn){ btn.disabled=false; btn.textContent='📝 Přepsat celý hovor'; } alert('Přepis se nepovedl: '+((res.j&&res.j.error)||'chyba')); }
        })
        .catch(function(e){ if(btn){ btn.disabled=false; btn.textContent='📝 Přepsat celý hovor'; } alert('Chyba: '+e.message); });
    };

    // ── SMS s odkazem z telefonu technika (ne přes GoSMS) ──
    var smsFormText='', smsFormLink='';
    function loadFormCfg(){
      return api('/api/voice/config?line=infolinka').then(function(r){ return r.ok?r.json():null; }).then(function(c){
        if(c){ smsFormText=c.sms_form_text||''; smsFormLink=c.sms_form_link||''; }
      }).catch(function(){});
    }
    function smsBody(){
      var t=smsFormText||'', link=smsFormLink||'';
      if(t){ return t.indexOf('{odkaz}')>=0 ? t.replace(/\{odkaz\}/g, link) : (t+(link?(' '+link):'')); }
      return link || 'Dobrý den, zde je odkaz na formulář.';
    }
    function smsBadges(log){
      log = Array.isArray(log) ? log : [];
      if(!log.length) return '';
      return log.map(function(e){ return '<span class="chip cb" style="background:rgba(139,92,246,0.18);color:#a78bfa;">✉️ SMS odeslána: '+esc(e.name||'?')+' · '+esc(fmtDate2(e.at))+'</span>'; }).join(' ');
    }
    window.markSms = function(id){
      fetch('/api/voice/calls/'+id+'/manual-sms',{method:'POST',credentials:'include'})
        .then(function(r){ return r.ok?r.json():null; })
        .then(function(j){ if(j&&j.manual_sms_log){ var box=document.getElementById('sms-'+id); if(box) box.innerHTML=smsBadges(j.manual_sms_log); } })
        .catch(function(){});
    };

    // ── Kredit přiřazený telefonnímu číslu ──────────────────────────────────
    // Kredit se ukazuje JEN u čísel, která ho mají přiřazený. Zadání, změnu
    // i smazání dělá operátor tady v seznamu volajících čísel.
    var _credits = {};       // { tail: {amount, currency, note} }
    function tailOf(p){ var d=String(p||'').replace(/\D/g,''); return d.length>=6 ? d.slice(-9) : ''; }
    function fmtMoney(a, cur){
      var n=Number(a);
      if(!isFinite(n)) return '';
      return n.toLocaleString('cs-CZ',{minimumFractionDigits:(n%1?2:0),maximumFractionDigits:2})+' '+(cur||'CZK');
    }
    function creditChip(tail){
      var c=_credits[tail];
      if(!c) return '';
      return '<span class="chip credit" title="'+esc(c.note||'')+'">💰 Kredit '+esc(fmtMoney(c.amount,c.currency))+'</span>';
    }
    function creditNoteLine(tail){
      var c=_credits[tail];
      return (c && c.note) ? '<div style="font-size:12px;color:var(--text2);margin-top:4px;">📝 '+esc(c.note)+'</div>' : '';
    }
    // Dialog: zadání / změna / smazání kreditu u čísla.
    window.editCredit = function(phone){
      var tail=tailOf(phone);
      if(!tail){ return; }
      var cur=_credits[tail]||null;
      var wrap=document.createElement('div');
      wrap.className='modal';
      wrap.innerHTML='<div class="box">'
        +'<h3>💰 Kredit k číslu</h3>'
        +'<div class="who">'+esc(phone||'')+'</div>'
        +'<label>Výše kreditu (Kč)</label>'
        +'<input id="cr-amount" type="number" inputmode="decimal" step="0.01" value="'+(cur?esc(String(cur.amount)):'')+'" placeholder="např. 200">'
        +'<label>Poznámka (nepovinné)</label>'
        +'<input id="cr-note" type="text" value="'+(cur&&cur.note?esc(cur.note):'')+'" placeholder="za co kredit je">'
        +'<div class="err" id="cr-err"></div>'
        +'<div class="btns">'
          +'<button class="save" id="cr-save">Uložit</button>'
          +'<button class="cancel" id="cr-cancel">Zrušit</button>'
          +(cur?'<button class="del" id="cr-del">🗑 Smazat kredit</button>':'')
        +'</div></div>';
      document.body.appendChild(wrap);
      function close(){ try{ document.body.removeChild(wrap); }catch(_){} }
      wrap.addEventListener('click', function(e){ if(e.target===wrap) close(); });
      wrap.querySelector('#cr-cancel').onclick=close;
      var errBox=wrap.querySelector('#cr-err');
      wrap.querySelector('#cr-save').onclick=function(){
        var v=wrap.querySelector('#cr-amount').value;
        var note=wrap.querySelector('#cr-note').value;
        if(v===''||isNaN(Number(v))){ errBox.textContent='Zadej výši kreditu.'; return; }
        errBox.textContent='Ukládám…';
        fetch('/api/voice/phone-credits',{method:'PUT',credentials:'include',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({phone:phone,amount:Number(v),note:note})})
          .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
          .then(function(res){
            if(!res.ok){ errBox.textContent=(res.j&&res.j.error)||'Uložení se nepovedlo.'; return; }
            _credits[tail]=res.j.credit; close(); loadCalls(); loadLive();
          })
          .catch(function(e){ errBox.textContent='Chyba: '+e.message; });
      };
      var delBtn=wrap.querySelector('#cr-del');
      if(delBtn) delBtn.onclick=function(){
        errBox.textContent='Mažu…';
        fetch('/api/voice/phone-credits/'+encodeURIComponent(tail),{method:'DELETE',credentials:'include'})
          .then(function(r){ return r.ok?r.json():null; })
          .then(function(j){
            if(!j){ errBox.textContent='Smazání se nepovedlo.'; return; }
            delete _credits[tail]; close(); loadCalls(); loadLive();
          })
          .catch(function(e){ errBox.textContent='Chyba: '+e.message; });
      };
    };

    // ── Banner „právě volá" ─────────────────────────────────────────────────
    // Hovor se do záznamů uloží až po zavěšení, takže kredit během hovoru
    // ukazujeme z živého stavu AI recepční (/api/voice/active).
    var _liveCount=0;
    window.loadLive = async function(){
      var box=$('live'); if(!box) return;
      try{
        var r=await api('/api/voice/active?line=infolinka');
        if(!r.ok) return;
        var rows=await r.json();
        rows=Array.isArray(rows)?rows:[];
        // Když hovor právě skončil, dotáhni seznam — nový záznam je hned nahoře.
        if(_liveCount>0 && !rows.length){ _liveCount=0; box.innerHTML=''; loadCalls(); return; }
        _liveCount=rows.length;
        if(!rows.length){ box.innerHTML=''; return; }
        box.innerHTML=rows.map(function(c){
          var num=c.from_number||'neznámé';
          var tail=tailOf(num);
          if(c.credit) _credits[tail]=c.credit;
          var cr=c.credit
            ? '<div class="lcredit">💰 Kredit '+esc(fmtMoney(c.credit.amount,c.credit.currency))+'</div>'
              +(c.credit.note?'<div class="lnote">📝 '+esc(c.credit.note)+'</div>':'')
            : '<div class="lnone">Bez přiřazeného kreditu</div>';
          return '<div class="live">'
            +'<div class="lbl">🔴 Právě volá</div>'
            +'<div class="lnum">📞 '+esc(num)+'</div>'
            +cr
            +'<div class="actions"><button class="credit-btn" onclick="editCredit(\''+esc(num)+'\')">💰 '+(c.credit?'Změnit kredit':'Přiřadit kredit')+'</button></div>'
          +'</div>';
        }).join('');
      }catch(e){ /* tiše — banner je jen doplněk */ }
    };

    // Odvodí „přesměrováno na koho" z transfer_log.
    function transferInfo(c){
      var log = Array.isArray(c.transfer_log) ? c.transfer_log : [];
      if(!log.length) return c.handoff ? {cls:'warn', txt:'⇢ přepojení chtěno, nedovoláno'} : null;
      var ans = log.filter(function(e){ var s=String(e.status||'').toLowerCase(); return s==='completed'||s==='answered'; });
      if(ans.length){ var e=ans[ans.length-1]; return {cls:'ok', txt:'✅ přepojeno: '+(e.name||e.number||'kolega')}; }
      return {cls:'warn', txt:'⛔ nedovoláno ('+log.length+'×)'};
    }

    // 1) Ověř přihlášení
    api('/api/auth/me').then(function(r){
      if(r.status===401||r.status===403){ show('gate'); return null; }
      if(!r.ok) throw new Error('me '+r.status);
      return r.json();
    }).then(function(j){
      if(!j) return;
      show('app');
      loadFormCfg().then(loadCalls);
      // Živý stav (kdo právě volá + jeho kredit) — obnovuje se sám každých 8 s.
      loadLive(); setInterval(loadLive, 8000);
    }).catch(function(){ show('gate'); });

    window.loadCalls = async function(){
      var box=$('list'); box.innerHTML='<div class="empty">Načítám…</div>';
      try{
        var r=await api('/api/voice/calls?line=infolinka&limit=100');
        if(!r.ok) throw new Error('HTTP '+r.status);
        var rows=await r.json();
        if(!rows.length){ box.innerHTML='<div class="empty">Zatím žádné hovory.</div>'; return; }
        // Spočítej, kolikrát každé číslo volalo na Infolinku (z načtené historie).
        var counts={};
        rows.forEach(function(c){ var k=digits(c.from_number); if(k) counts[k]=(counts[k]||0)+1; });
        // Kredity přiřazené volajícím číslům (server je posílá u hovoru).
        rows.forEach(function(c){ var t=tailOf(c.from_number); if(t && c.credit) _credits[t]=c.credit; });
        box.innerHTML=rows.map(function(c){
          var num=c.from_number||''; var tel=digits(num);
          var cnt=(tel&&counts[tel])||1; var repeat=cnt>1;
          var cntTxt=' ('+cnt+'×)';
          var numStyle=repeat?' style="color:#eab308;"':'';
          var want=c.caller_intent||c.summary||'';
          var ti=transferInfo(c);
          var chip = ti ? '<span class="chip '+ti.cls+'">'+esc(ti.txt)+'</span>' : '<span class="chip none">bez přepojení</span>';
          var repChip = repeat ? '<span class="chip" style="background:rgba(234,179,8,0.18);color:#eab308;">🔁 opakovaný volající · '+cnt+'×</span>' : '';
          var creditTail = tailOf(num);
          var rec = c.audio_url ? '<audio controls preload="none" src="/api/voice/recording/'+c.id+'"></audio>' : '';
          return '<div class="card"'+(repeat?' style="border-color:rgba(234,179,8,0.5);"':'')+'>'
            +'<div class="row1">'
              +(tel? '<a class="num" href="tel:'+esc(tel)+'"'+numStyle+'>📞 '+esc(num)+cntTxt+'</a>' : '<span class="num"'+numStyle+'>📞 '+esc(num||'neznámé')+cntTxt+'</span>')
              +'<span class="time">'+esc(fmtDate(c.started_at))+'</span>'
            +'</div>'
            +'<div class="want'+(want?'':' empty')+'">'+(want?esc(want):'(bez shrnutí)')+'</div>'
            +'<div class="meta">'+creditChip(creditTail)+repChip+chip+'<span class="chip len">⏱ '+fmtDur(c.duration_sec)+'</span>'+(c.caller_name?'<span class="chip none">👤 '+esc(c.caller_name)+'</span>':'')+'</div>'
            +creditNoteLine(creditTail)
            +'<div class="actions">'
              +(tel? '<a class="call-btn" href="tel:'+esc(tel)+'" onclick="markCallback(\''+c.id+'\')">Zavolat zpět</a>' : '')
              +(num? '<button class="credit-btn" onclick="editCredit(\''+esc(num)+'\')">💰 '+(_credits[creditTail]?'Změnit kredit':'Přiřadit kredit')+'</button>' : '')
              +(tel? '<a class="call-btn" style="background:#8b5cf6;color:#fff;" href="sms:'+esc(tel)+'?&body='+encodeURIComponent(smsBody())+'" onclick="markSms(\''+c.id+'\')">✉️ SMS - Doklad/reklamace</a>' : '')
              +(c.service_request_id
                  ? '<a class="call-btn" style="background:#0e3a2a;color:#22c55e;border:1px solid #22c55e;" href="/modules/servis/index.html#request='+esc(c.service_request_id)+'">✅ Požadavek #'+esc(c.service_request_id)+'</a>'
                  : '<a class="call-btn" style="background:#22d3ee;color:#04222b;" href="/modules/servis/pozadavek.html?call='+encodeURIComponent(c.id)+'&phone='+encodeURIComponent(num||'')+'&desc='+encodeURIComponent(want||'')+'">🔧 Servisní požadavek</a>')
              +(rec||'')
              +transcriptBlock(c)
            +'</div>'
            +'<div class="cbwrap" id="cb-'+c.id+'">'+cbBadges(c.callback_log)+'</div>'
            +'<div class="cbwrap" id="sms-'+c.id+'">'+smsBadges(c.manual_sms_log)+'</div>'
          +'</div>';
        }).join('');
      }catch(e){ box.innerHTML='<div class="empty" style="color:#ef4444;">Chyba: '+esc(e.message)+'</div>'; }
    };
  })();
  </script>
  <script src="/js/version-watcher.js"></script>
  <!-- Globální vyhledávání (CTRL+PAUSE) — stránka nemá sidebar.js, který ho jinak načítá -->
  <script src="/js/global-search.js"></script>
</body>

<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Obchod | HOLYOS</title>
  <link rel="icon" type="image/svg+xml" href="../../logo-holyos-icon.svg">
  <base href="../../">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .main-wrapper { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; display: flex; flex-direction: column; }
    .page-header {
      display:flex; align-items:center; gap:12px; padding:20px 24px;
      border-bottom:1px solid var(--border); flex-wrap:wrap;
    }
    .page-header h1 { font-size:18px; font-weight:700; margin:0; }
    .page-header .count { font-size:13px; color:var(--text2); margin-left:4px; }
    .search-box {
      margin-left:auto; padding:8px 14px; background:var(--surface2); color:var(--text);
      border:1px solid var(--border); border-radius:8px; font-size:13px; width:240px;
    }
    .search-box:focus { border-color:#ec4899; outline:none; }

    .content { padding:0 24px 24px; }
    .toolbar { display:flex; gap:12px; margin:16px 0; align-items:center; flex-wrap:wrap; }

    .btn { padding:8px 18px; border-radius:8px; border:1px solid var(--border); font-size:13px; font-weight:500; cursor:pointer; transition:all 0.15s; display:inline-flex; align-items:center; gap:6px; background:transparent; color:var(--text); }
    .btn-primary { background:#ec4899; color:#fff; border-color:#ec4899; }
    .btn-primary:hover { background:#db2777; }
    .btn-secondary { background:var(--surface2); color:var(--text); }
    .btn-secondary:hover { background:var(--border); }
    .btn-danger { background:rgba(239,68,68,0.15); color:#ef4444; border-color:rgba(239,68,68,0.3); }
    .btn-danger:hover { background:rgba(239,68,68,0.25); }
    .btn-success { background:rgba(34,197,94,0.18); color:#22c55e; border-color:rgba(34,197,94,0.35); }
    .btn-success:hover { background:rgba(34,197,94,0.28); }
    .btn-sm { padding:5px 12px; font-size:12px; }

    .stats-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:12px; margin-bottom:16px; }
    .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; cursor:pointer; transition:transform 0.1s, border-color 0.1s; }
    .stat-card:hover { transform:translateY(-1px); border-color:#ec4899; }
    .stat-card .stat-label { font-size:11px; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
    .stat-card .stat-value { font-size:22px; font-weight:700; }
    .stat-card.hot { border-color:rgba(239,68,68,0.3); background:rgba(239,68,68,0.06); }
    .stat-card.hot .stat-value { color:#ef4444; }
    .stat-card.high { border-color:rgba(245,158,11,0.3); background:rgba(245,158,11,0.06); }
    .stat-card.high .stat-value { color:#f59e0b; }
    .stat-card.won { border-color:rgba(34,197,94,0.3); background:rgba(34,197,94,0.06); }
    .stat-card.won .stat-value { color:#22c55e; }
    .stat-card.active { outline:2px solid #ec4899; outline-offset:-2px; }

    .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .filter-select { padding:6px 10px; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:7px; font-size:12px; }

    /* Hlavní tab přepínač (Seznam / Kalendář / Pipeline) */
    .view-tabs { display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:16px; }
    .view-tab { padding:10px 18px; background:transparent; border:none; color:var(--text2); font-size:13px; font-weight:500; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
    .view-tab:hover { color:var(--text); }
    .view-tab.active { color:#ec4899; border-bottom-color:#ec4899; }
    .view-panel { display:none; }
    .view-panel.active { display:block; }

    .data-table { width:100%; border-collapse:separate; border-spacing:0; }
    .data-table thead { position:sticky; top:0; z-index:1; }
    .data-table th { background:var(--surface2); padding:10px 12px; text-align:left; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:var(--text2); border-bottom:1px solid var(--border); }
    .data-table td { padding:10px 12px; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:middle; }
    .data-table tr:hover td { background:rgba(236,72,153,0.06); cursor:pointer; }

    .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:500; white-space:nowrap; }
    .badge-status-new        { background:rgba(148,163,184,0.15); color:#94a3b8; }
    .badge-status-contacted  { background:rgba(14,165,233,0.15); color:#0ea5e9; }
    .badge-status-qualified  { background:rgba(168,139,250,0.18); color:#a78bfa; }
    .badge-status-meeting    { background:rgba(99,102,241,0.18); color:#6366f1; }
    .badge-status-proposal   { background:rgba(245,158,11,0.18); color:#f59e0b; }
    .badge-status-won        { background:rgba(34,197,94,0.18); color:#22c55e; }
    .badge-status-lost       { background:rgba(239,68,68,0.18); color:#ef4444; }

    .badge-pot-low    { background:rgba(148,163,184,0.15); color:#94a3b8; }
    .badge-pot-medium { background:rgba(14,165,233,0.18); color:#0ea5e9; }
    .badge-pot-high   { background:rgba(245,158,11,0.18); color:#f59e0b; }
    .badge-pot-hot    { background:rgba(239,68,68,0.22); color:#ef4444; font-weight:600; }

    .badge-source { background:rgba(168,139,250,0.15); color:#a78bfa; }

    .converted-pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; background:rgba(34,197,94,0.12); color:#22c55e; border-radius:10px; font-size:11px; font-weight:500; }

    /* Modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; }
    .modal { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:24px 28px; width:780px; max-width:100%; max-height:90vh; overflow-y:auto; }
    .modal h2 { font-size:18px; margin:0 0 20px; }
    .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; padding-top:16px; border-top:1px solid var(--border); flex-wrap:wrap; }

    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .form-group { display:flex; flex-direction:column; gap:4px; }
    .form-group.full { grid-column:1 / -1; }
    .form-group label { font-size:12px; font-weight:500; color:var(--text2); }
    .form-group input, .form-group select, .form-group textarea {
      background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:9px 11px;
      color:var(--text); font-size:13px; font-family:inherit;
    }
    .form-group textarea { min-height:80px; resize:vertical; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:#ec4899; outline:none; }
    .form-section-title { font-size:13px; font-weight:600; color:var(--text); margin:14px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--border); }

    /* Detail modal — tabs uvnitř */
    .det-tabs { display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:16px; flex-wrap:wrap; }
    .det-tab { padding:10px 16px; background:transparent; border:none; color:var(--text2); font-size:13px; font-weight:500; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
    .det-tab:hover { color:var(--text); }
    .det-tab.active { color:#ec4899; border-bottom-color:#ec4899; }
    .det-panel { display:none; }
    .det-panel.active { display:block; }

    /* Timeline */
    .timeline { display:flex; flex-direction:column; gap:8px; max-height:420px; overflow-y:auto; padding-right:4px; }
    .timeline-item { padding:10px 14px; background:var(--bg); border:1px solid var(--border); border-radius:8px; }
    .timeline-item header { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:4px; font-size:11px; color:var(--text2); }
    .timeline-item .kind-pill { padding:2px 8px; border-radius:10px; font-size:10px; font-weight:600; text-transform:uppercase; }
    .timeline-item .kind-pill.note      { background:rgba(148,163,184,0.15); color:#94a3b8; }
    .timeline-item .kind-pill.call      { background:rgba(14,165,233,0.18); color:#0ea5e9; }
    .timeline-item .kind-pill.email     { background:rgba(168,139,250,0.18); color:#a78bfa; }
    .timeline-item .kind-pill.meeting   { background:rgba(99,102,241,0.18); color:#6366f1; }
    .timeline-item .kind-pill.sms       { background:rgba(34,197,94,0.18); color:#22c55e; }
    .timeline-item .kind-pill.system    { background:rgba(148,163,184,0.1); color:#94a3b8; font-style:italic; }
    .timeline-item .kind-pill.status_change { background:rgba(245,158,11,0.18); color:#f59e0b; }
    .timeline-item .body { font-size:13px; color:var(--text); white-space:pre-wrap; word-wrap:break-word; }
    .timeline-item .del { float:right; cursor:pointer; color:var(--text2); font-size:11px; padding:1px 6px; border-radius:4px; }
    .timeline-item .del:hover { background:rgba(239,68,68,0.15); color:#ef4444; }

    .note-form { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:10px; }
    .note-form select, .note-form textarea { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:8px 10px; color:var(--text); font-size:13px; font-family:inherit; }
    .note-form textarea { min-height:60px; resize:vertical; }
    .note-form .row { display:flex; gap:8px; align-items:center; }

    /* Kalendář */
    .cal-header { display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
    .cal-title { font-size:16px; font-weight:600; min-width:200px; }
    .cal-grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; }
    .cal-cell-h { padding:8px; text-align:center; font-size:11px; font-weight:600; color:var(--text2); text-transform:uppercase; }
    .cal-cell { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px; min-height:90px; display:flex; flex-direction:column; gap:3px; }
    .cal-cell.other { opacity:0.4; }
    .cal-cell.today { border-color:#ec4899; box-shadow:inset 0 0 0 1px #ec4899; }
    .cal-cell .day { font-size:11px; font-weight:600; color:var(--text2); }
    .cal-cell .ev { background:rgba(236,72,153,0.18); color:#ec4899; font-size:10px; padding:2px 6px; border-radius:4px; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .cal-cell .ev:hover { background:#ec4899; color:#fff; }
    .cal-cell .ev.call { background:rgba(14,165,233,0.18); color:#0ea5e9; }
    .cal-cell .ev.call:hover { background:#0ea5e9; color:#fff; }
    .cal-cell .ev.demo { background:rgba(168,139,250,0.18); color:#a78bfa; }
    .cal-cell .ev.demo:hover { background:#a78bfa; color:#fff; }
    .cal-cell .ev.followup { background:rgba(245,158,11,0.18); color:#f59e0b; }
    .cal-cell .ev.task { background:rgba(148,163,184,0.18); color:#94a3b8; }
    .cal-cell .ev.done { opacity:0.5; text-decoration:line-through; }

    /* Pipeline (Kanban) */
    .pipeline { display:grid; grid-template-columns:repeat(7, minmax(180px, 1fr)); gap:10px; overflow-x:auto; padding-bottom:8px; }
    .pipe-col { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px; min-height:200px; }
    .pipe-col header { display:flex; align-items:center; justify-content:space-between; padding-bottom:8px; border-bottom:1px solid var(--border); margin-bottom:4px; }
    .pipe-col header h4 { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:var(--text); margin:0; }
    .pipe-col header .cnt { font-size:11px; color:var(--text2); }
    .pipe-card { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px 10px; cursor:pointer; transition:border-color 0.1s; }
    .pipe-card:hover { border-color:#ec4899; }
    .pipe-card .nm { font-size:13px; font-weight:600; color:var(--text); }
    .pipe-card .cmp { font-size:11px; color:var(--text2); margin-top:2px; }
    .pipe-card .row { display:flex; align-items:center; gap:6px; margin-top:6px; flex-wrap:wrap; }

    .empty-state { text-align:center; padding:60px 20px; color:var(--text2); }
    .empty-state .empty-icon { font-size:48px; margin-bottom:12px; }
    .empty-state h3 { font-size:16px; color:var(--text); margin-bottom:6px; }

    @media (max-width:768px) {
      .main-wrapper { margin-left:0; }
      .form-grid { grid-template-columns:1fr; }
      .pipeline { grid-template-columns:repeat(7, 260px); }
    }
  </style>
</head>
<body>
  <div id="sidebar"></div>
  <div class="main-wrapper">
    <div class="page-header">
      <span style="font-size:28px;">💼</span>
      <div>
        <h1>Obchod <span class="count" id="hdr-count"></span></h1>
      </div>
      <input type="text" class="search-box" id="search" placeholder="Hledat jméno, firmu, e-mail..." oninput="onSearch()">
      <button class="btn btn-secondary" onclick="openEventModal()">📅 + Událost</button>
      <button class="btn btn-primary" onclick="openContactModal()">+ Nový kontakt</button>
    </div>

    <div class="content">
      <!-- Statistiky -->
      <div class="stats-row" id="stats-row"></div>

      <!-- Filtry -->
      <div class="toolbar">
        <div class="filters">
          <select class="filter-select" id="f-status" onchange="reload()">
            <option value="">Všechny stavy</option>
            <option value="new">Nový</option>
            <option value="contacted">Kontaktován</option>
            <option value="qualified">Kvalifikován</option>
            <option value="meeting">Schůzka</option>
            <option value="proposal">Nabídka</option>
            <option value="won">Vyhráno</option>
            <option value="lost">Ztraceno</option>
          </select>
          <select class="filter-select" id="f-potential" onchange="reload()">
            <option value="">Všechny potenciály</option>
            <option value="hot">🔥 Horký (zajímavý obchod)</option>
            <option value="high">Vysoký</option>
            <option value="medium">Střední</option>
            <option value="low">Nízký</option>
          </select>
          <select class="filter-select" id="f-source" onchange="reload()">
            <option value="">Všechny zdroje</option>
            <option value="manual">Manuálně</option>
            <option value="facebook">Facebook</option>
            <option value="instagram">Instagram</option>
            <option value="linkedin">LinkedIn</option>
            <option value="web">Web</option>
            <option value="referral">Doporučení</option>
            <option value="other">Jiný</option>
          </select>
          <select class="filter-select" id="f-converted" onchange="reload()">
            <option value="">Vše (převedené i ne)</option>
            <option value="no">Nepřevedené</option>
            <option value="yes">Převedené na firmu</option>
          </select>
        </div>
      </div>

      <!-- Hlavní záložky -->
      <div class="view-tabs">
        <button class="view-tab active" data-view="list"     onclick="switchView('list')">📋 Seznam</button>
        <button class="view-tab"        data-view="pipeline" onclick="switchView('pipeline')">📊 Pipeline</button>
        <button class="view-tab"        data-view="calendar" onclick="switchView('calendar')">📅 Kalendář</button>
      </div>

      <!-- Seznam -->
      <div class="view-panel active" data-view="list">
        <div id="contacts-table"></div>
      </div>

      <!-- Pipeline (kanban) -->
      <div class="view-panel" data-view="pipeline">
        <div id="pipeline-board" class="pipeline"></div>
      </div>

      <!-- Kalendář -->
      <div class="view-panel" data-view="calendar">
        <div class="cal-header">
          <button class="btn btn-sm btn-secondary" onclick="calPrev()">← Předchozí</button>
          <div class="cal-title" id="cal-title">—</div>
          <button class="btn btn-sm btn-secondary" onclick="calNext()">Další →</button>
          <button class="btn btn-sm btn-secondary" onclick="calToday()">Dnes</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>

  <script>
    var s = document.createElement('script');
    s.src = 'js/sidebar.js?v=' + Date.now();
    s.onload = function() { renderSidebar('obchod'); };
    document.head.appendChild(s);
  </script>

  <script src="modules/obchod/app.js?v=20260512"></script>
</body>
</html>

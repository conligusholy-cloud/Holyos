# Railway / Nixpacks build config pro HolyOS
#
# Přidává `git` do system dependencies, aby ho mohl child_process spawn najít.
# Bez něj selže AI Vývojář (services/ai-developer/git.js) s "spawn git ENOENT"
# při klonování cílového repa.
#
# Syntax `'...'` říká Nixpacksu „rozšiř default sadu nodejs/npm balíčků"
# místo aby je nahradila — udržíme tím Railwayský default Node provider.

[phases.setup]
nixPkgs = ['...', 'git']
aptPkgs = ['git', 'ca-certificates']

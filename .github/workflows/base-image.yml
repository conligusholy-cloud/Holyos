name: Build base image

# Staví HolyOS base image (OS + Chromium + node_modules) a ukládá do GHCR.
# Běží jen při změně závislostí nebo base Dockerfilu — jinak Railway používá
# poslední hotový base a deploy je rychlý.

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile.base'
      - '.github/workflows/base-image.yml'
  workflow_dispatch: {}   # umožní spustit ručně z GitHubu (Actions → Run workflow)

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ghcr.io/conligusholy-cloud/holyos-base:latest
